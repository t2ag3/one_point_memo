生産コスト低減"}},{"id":"04-21-i1","memo_id":"04-21","genre_id":"04","level":"intermediate","question":"メモの区画整理の図で、小区画と大区画における農機のターン回数の組み合わせとして正しいものはどれか。","choices":["小区画12回、大区画7回","小区画7回、大区画12回","小区画12回、大区画5回","小区画10回、大区画7回"],"answer":0,"explanation":"図では小区画がターン12回、大区画がターン7回と示されています。大区画のほうが回数が少なく、数字を入れ替えた選択肢や他の数値は誤りです。","evidence":["小区画：ターン12回","大区画：ターン７回"],"source":{"memo_id":"04-21","page":21,"print_page":69,"title":"農地の大区画化による省力化と生産コスト低減"}},{"id":"04-21-a1","memo_id":"04-21","genre_id":"04","level":"advanced","question":"メモの自動走行農機等の活用を可能にする区画整理について、誤っているものはどれか。","choices":["長辺をより長くした大区画ほ場でターン回数を減らす","区画整理は自動走行農機等の活用を可能にする","大区画ほ場で自動走行農機を効率的に運用する","大区画ほ場ではターンを自動、直線を手動で走行する"],"answer":3,"explanation":"図の凡例では直線が自動、ターンが手動とされており、自動と手動を逆にした選択肢が誤りです。他の3つは区画整理の見出しと説明文に書かれた内容です。","evidence":["直 線（自動）","ターン（手動）"],"source":{"memo_id":"04-21","page":21,"print_page":69,"title":"農地の大区画化による省力化と生産コスト低減"}},{"id":"04-22-b1","memo_id":"04-22","genre_id":"04","level":"beginner","question":"令和7年度に、担い手への農地集積面積は前年度から何増加したか。","choices":["0.7万ha","1.3万ha","4.1万ha","25.9万ha"],"answer":0,"explanation":"要点に、令和7年度は0.7万ha増加したと書かれています。25.9万haは農地バンクによる集積面積で、1.3haと4.1haは朝倉市の事例の数値です。","evidence":["積面積は増加。令和７年度は0.7万ha増加し、そのシェアは62.1%となった。"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-22-b2","memo_id":"04-22","genre_id":"04","level":"beginner","question":"農地バンクによる集積面積（約25.9万ha）は、新規集積面積全体の約何割か。","choices":["約3割","約4割","約6割","約7割"],"answer":2,"explanation":"要点に、農地バンクによる集積面積は新規集積面積全体の約6割とあります。約7割は2030年度の集積率の目標で、別の数値です。","evidence":["農地バンクによる集積面積は、約25.9万haと新規集積面積全体の約６割。"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-22-i1","memo_id":"04-22","genre_id":"04","level":"intermediate","question":"「担い手への農地集積面積とシェア」のグラフで、平成25年度末から令和7年度末までの担い手への農地集積面積の増加はどれだけか。","choices":["約0.7万ha","約25.9万ha","約42.6万ha","約62.1万ha"],"answer":2,"explanation":"グラフには約42.6万haの増加と示されています。約25.9万haはそのうちの農地バンクの分で、0.7万haは令和7年度1年間の増加です。","evidence":["約42.6万haの増加","うち農地バンク"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-22-i2","memo_id":"04-22","genre_id":"04","level":"intermediate","question":"福岡県朝倉市の地区の取組の効果で、地域内の団地面積はどう変わったか。","choices":["1.2haから5.3haへ","1.3haから5.3haへ","1.2haから4.1haへ","4.1haから5.3haへ"],"answer":0,"explanation":"取組の効果に、地域内の団地面積は1.2haから5.3haとあります。4.1haは増加した面積で、1.3haは農地を貸し付けた面積です。","evidence":["○地域内の団地面積 ： 1.2ha → 5.3ha"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-22-a1","memo_id":"04-22","genre_id":"04","level":"advanced","question":"全国の担い手への農地集積率について、2030年度の目標（7割）と令和7年度のシェアとの差は何ポイントか。","choices":["約5.4ポイント","約7.9ポイント","約8.5ポイント","約9.6ポイント"],"answer":1,"explanation":"令和7年度のシェアは62.1%なので、目標70%との差は約7.9ポイントです。約8.5は令和6年度の61.5%、約5.4は朝倉市の地区の64.6%と比べた差で、対象が違います。","evidence":["積面積は増加。令和７年度は0.7万ha増加し、そのシェアは62.1%となった。","2030年度に７割"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-22-a2","memo_id":"04-22","genre_id":"04","level":"advanced","question":"この資料の農地バンクの説明として、誤っているものはどれか。","choices":["農地バンクは平成30年度に創設された","朝倉市の地区で農地を1.3ha貸し付けた","朝倉市の地区で集積率が64.6%になった","福岡県農地バンクは農業委員と連携した"],"answer":0,"explanation":"農地バンクが創設されたのは平成26年度で、平成30年度ではありません。1.3haの貸し付け、集積率58.9%から64.6%、農業委員・地域リーダーとの連携は、いずれも朝倉市の事例に書かれています。","evidence":["農地バンク（農地中間管理機構）が創設された平成26年度以降、担い手への農地集"],"source":{"memo_id":"04-22","page":22,"print_page":70,"title":"担い手への農地集積と農地バンクの取組"}},{"id":"04-23-b1","memo_id":"04-23","genre_id":"04","level":"beginner","question":"農業振興地域制度で、農業上の利用を確保すべき土地を農用地区域として指定するのはどこですか。","choices":["市町村","都道府県","農林水産大臣","農業協同組合"],"answer":0,"explanation":"要点に「市町村が農業上の利用を確保すべき土地を農用地区域として指定」とあります。都道府県が指定するのは、その外側の農業振興地域です。","evidence":["市町村が農業上の利用を確保すべき土地を農用地区域"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-23-b2","memo_id":"04-23","genre_id":"04","level":"beginner","question":"農地転用許可制度では、農地の転用をどのような農地に誘導するとされていますか。","choices":["農業上の支障が少ない農地","生産性の高い優良農地","土地改良事業の対象農地","集団的にまとまった農地"],"answer":0,"explanation":"要点に「転用を農業上の支障が少ない農地に誘導」とあります。優良農地、土地改良事業の対象農地、集団農地は、原則不許可の第1種農地などにあたり、転用を誘導する先ではありません。","evidence":["転用を農業上の支障が少ない農地に誘導。"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-23-i1","memo_id":"04-23","genre_id":"04","level":"intermediate","question":"農地転用許可制度で、都道府県知事や指定市町村の長が転用を許可する際、農林水産大臣に協議が必要になる面積の基準はどれですか。","choices":["4ha超","2ha超","10ha超","1ha超"],"answer":0,"explanation":"許可権者の欄に「４ha超は農林水産大臣に協議」とあります。2ha、10ha、1haという基準は資料に書かれていません。","evidence":["（４ha超は農林水産大臣に協議）"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-23-i2","memo_id":"04-23","genre_id":"04","level":"intermediate","question":"農地転用許可制度の図で、第2種農地の転用の扱いとして示されているものはどれですか。","choices":["Ⅲに立地困難な場合に許可","原則として許可する","原則として許可しない","届け出れば転用できる"],"answer":0,"explanation":"図では、第2種農地はⅡ「Ⅲに立地困難な場合に許可」とされています。「原則許可」は第3種農地、「原則不許可」は第1種農地、「届出制」は市街化区域の扱いです。","evidence":["Ⅱ Ⅲに立地困難な場合に許可","［第２種農地］"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-23-a1","memo_id":"04-23","genre_id":"04","level":"advanced","question":"農業振興地域制度と農地転用許可制度について、資料の内容として誤っているものはどれですか。","choices":["農業振興地域は都道府県が指定する","農用地区域は市町村の整備計画で設定する","第1種農地の転用は原則として許可する","市街化区域の農地転用は届出制である"],"answer":2,"explanation":"第1種農地（集団農地・土地改良事業対象農地等）は「原則不許可」です。「原則許可」とされているのは第3種農地です。ほかの3つは、図の記載どおりで正しい内容です。","evidence":["Ⅰ 原則不許可","［第１種農地］"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-23-a2","memo_id":"04-23","genre_id":"04","level":"advanced","question":"農地転用許可制度について、根拠となる法律と制度の性格の組合せとして正しいものはどれですか。","choices":["農地法・個別転用を規制","農振法・個別転用を規制","農地法・土地利用のゾーニング","農振法・土地利用のゾーニング"],"answer":0,"explanation":"農地転用許可制度は、農地法に基づき個別の転用を規制する制度です。農振法に基づく「農業上の土地利用のゾーニング」は、農業振興地域制度の性格なので、ほかの組合せは誤りです。","evidence":["〈個別転用を規制〉","農地法","〈農業上の土地利用のゾーニング〉"],"source":{"memo_id":"04-23","page":23,"print_page":71,"title":"農業振興地域制度と農地転用許可制度"}},{"id":"04-24-b1","memo_id":"04-24","genre_id":"04","level":"beginner","question":"一口メモによると、現在稼働している共同利用施設のうち、30年以上前に設置された施設の割合はどれか。","choices":["約３割","約５割","約７割","約９割"],"answer":2,"explanation":"稼働している共同利用施設のうち約7割が30年以上前に設置された施設とされています。約3割や約5割では老朽化の広がりを過小に捉えることになり、約9割は過大です。","evidence":["稼働している共同利用施設のうち、約７割※が30年以上前に設置された施設となっている。"],"source":{"memo_id":"04-24","page":24,"print_page":72,"title":"共同利用施設の老朽化と再編集約・合理化"}},{"id":"04-24-b2","memo_id":"04-24","genre_id":"04","level":"beginner","question":"一口メモによると、農畜産物の調整保管や加工、流通を支える共同利用施設の耐用年数は、一般的にどの程度とされているか。","choices":["約10～20年","約20～30年","約30～50年","約50～70年"],"answer":2,"explanation":"共同利用施設の耐用年数は一般的に約30～50年とされています。約20～30年は短すぎ、約50～70年は長すぎるため誤りです。","evidence":["共同利用施設の耐用年数は、一般的に約30～50年で"],"source":{"memo_id":"04-24","page":24,"print_page":72,"title":"共同利用施設の老朽化と再編集約・合理化"}},{"id":"04-24-i1","memo_id":"04-24","genre_id":"04","level":"intermediate","question":"「共同利用施設の設置年度別施設数と耐用年数を迎える施設数」のグラフで、設置年度別施設数が多い時期から耐用年数を迎える施設数が多い時期までに、どれだけの経過が示されているか。","choices":["約10～20年経過","約20～30年経過","約30～40年経過","約50～60年経過"],"answer":2,"explanation":"グラフでは、昭和60年度（1985）前後の設置数の山から、耐用年数を迎える施設数の山まで「約30～40年経過」と矢印で示されています。約50～60年は耐用年数の上限（約50年）より長く、図の表示とも合いません。","evidence":["約30～40年経過"],"source":{"memo_id":"04-24","page":24,"print_page":72,"title":"共同利用施設の老朽化と再編集約・合理化"}},{"id":"04-24-a1","memo_id":"04-24","genre_id":"04","level":"advanced","question":"一口メモに示された共同利用施設の現状と対策について、誤っているものはどれか。","choices":["農業者の減少に伴う施設利用者の減少で施設稼働率が低下している","経年劣化や旧式化に伴い施設・設備の稼働経費の負担が拡大している","経年劣化や旧式化に伴い施設利用者の負担が軽減してきている","支援事業では老朽化した穀類乾燥貯蔵施設等の再編集約を支援する"],"answer":2,"explanation":"メモでは経年劣化・旧式化に伴い「利用者の負担の増加」が発生しているとされており、負担が軽減しているとする選択肢が誤りです。稼働率の低下、稼働経費の負担拡大、支援事業による穀類乾燥貯蔵施設等の再編集約・合理化の支援は、いずれもメモに書かれています。","evidence":["施設・設備の稼働経費の負担拡大及び利用者の負担の増加が発生しており"],"source":{"memo_id":"04-24","page":24,"print_page":72,"title":"共同利用施設の老朽化と再編集約・合理化"}},{"id":"04-25-b1","memo_id":"04-25","genre_id":"04","level":"beginner","question":"一口メモによると、土地改良事業が確保し、その有効利用を図るものはどれか。","choices":["農地及び農業用水","農業機械及び燃料","種苗及び肥料","労働力及び資金"],"answer":0,"explanation":"土地改良事業は、良好な営農条件を備えた農地及び農業用水を確保し、これらの有効利用を図るものとされています。農業機械や種苗、労働力などはメモでは土地改良事業が確保するものとして書かれていません。","evidence":["良好な営農条件を備えた農地及び農業用水を確保し、これらの有効利用を図ることに"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-25-b2","memo_id":"04-25","genre_id":"04","level":"beginner","question":"一口メモによると、土地改良事業が振興に役割を果たしている農村は、何が発揮される場所とされているか。","choices":["多面的機能","価格形成機能","輸出促進機能","金融仲介機能"],"answer":0,"explanation":"農村は、多様な地域住民が生活する場であり、多面的機能が発揮される場所とされています。価格形成・輸出促進・金融仲介の機能はメモでは農村の説明に使われていません。","evidence":["多面的機能が発揮される場所である農村の振"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-25-i1","memo_id":"04-25","genre_id":"04","level":"intermediate","question":"土地改良長期計画（令和7～11年度）の全体概要で、政策課題3として示されているものはどれか。","choices":["増大する災害リスクに対応するための農業・農村の強靱化","生産性向上等に向けた生産基盤の強化","農業用水の安定供給及び良好な排水条件の確保","農村の価値や魅力の創出"],"answer":0,"explanation":"政策課題3は、増大する災害リスクに対応するための農業・農村の強靱化です。生産基盤の強化は政策課題1、農業用水の安定供給は政策課題2、農村の価値や魅力の創出は政策課題4です。","evidence":["政策課題３：増大する災害リスクに対応するための農業・農村の強靱化"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-25-i2","memo_id":"04-25","genre_id":"04","level":"intermediate","question":"土地改良長期計画（令和7～11年度）で、「農業水利施設の戦略的な保全管理による持続的な機能確保」は政策目標の何番か。","choices":["政策目標1","政策目標3","政策目標4","政策目標5"],"answer":1,"explanation":"農業水利施設の戦略的な保全管理による持続的な機能確保は政策目標3で、政策課題2に位置づけられています。政策目標1は生産コストの低減、政策目標4は防災・減災対策、政策目標5は農村における所得向上などです。","evidence":["農業水利施設の戦略的な保全管理による持続的な機能確保【政策目標３】"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-25-a1","memo_id":"04-25","genre_id":"04","level":"advanced","question":"土地改良長期計画（令和7～11年度）で、政策課題1「生産性向上等に向けた生産基盤の強化」に位置づけられた政策目標の組合せはどれか。","choices":["政策目標1と政策目標2","政策目標1と政策目標3","政策目標2と政策目標4","政策目標3と政策目標5"],"answer":0,"explanation":"政策課題1の枠には、生産コストの低減（政策目標1）と国内の需要等を踏まえた生産の拡大（政策目標2）が置かれています。政策目標3は政策課題2、政策目標4は政策課題3、政策目標5は政策課題4に属します。","evidence":["生産性向上等に向けた生産基盤の強化","基盤整備による生産コストの低減【政策目標１】","国内の需要等を踏まえた生産の拡大【政策目標２】"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-25-a2","memo_id":"04-25","genre_id":"04","level":"advanced","question":"土地改良長期計画（令和7～11年度）の「計画の円滑かつ効果的な実施に当たって必要な事項」として、誤っているものはどれか。","choices":["土地改良区の運営体制の強化","技術開発の促進と普及、人材の育成","関連施策や関係団体との連携強化","東日本大震災からの復旧・復興"],"answer":3,"explanation":"東日本大震災からの復旧・復興は「大規模自然災害への対応」の項目であり、必要な事項には含まれません。土地改良区の運営体制の強化、技術開発の促進と普及・人材の育成、関連施策や関係団体との連携強化は必要な事項に挙げられています。","evidence":["計画の円滑かつ効果的な実施に当たって必要な事項","東日本大震災からの復旧・復興"],"source":{"memo_id":"04-25","page":25,"print_page":73,"title":"土地改良事業と土地改良長期計画の概要"}},{"id":"04-26-b1","memo_id":"04-26","genre_id":"04","level":"beginner","question":"令和6年3月末時点で、全国の区画が整備された水田の面積はどれか。","choices":["112万ha","129万ha","161万ha","232万ha"],"answer":2,"explanation":"区画が整備された水田は161万ha（69.3%）です。129万haは区画が整備された畑、112万haは汎用化が行われた水田、232万haは水田面積全体です。","evidence":["区画が整備された水田は161万ha（69.3%）、畑は129万ha（66.1%）（R６年３月末時点）"],"source":{"memo_id":"04-26","page":26,"print_page":74,"title":"農業生産基盤の整備と水利施設の老朽化"}},{"id":"04-26-b2","memo_id":"04-26","genre_id":"04","level":"beginner","question":"全国の土地改良区について、合併等による変化として正しいものはどれか。","choices":["地区数が減少し、1地区当たりの受益面積が増加","地区数が減少し、1地区当たりの受益面積も減少","地区数が増加し、1地区当たりの受益面積が減少","地区数が増加し、1地区当たりの受益面積も増加"],"answer":0,"explanation":"土地改良区は合併等により地区数が減少し、1地区当たりの受益面積が増加しています。地区数が増えた、または1地区当たりの受益面積が減ったとする選択肢は要点と逆です。","evidence":["農業用用排水施設の維持管理を担う土地改良区は、合併等により、地区数が減少し１地区当たりの受益"],"source":{"memo_id":"04-26","page":26,"print_page":74,"title":"農業生産基盤の整備と水利施設の老朽化"}},{"id":"04-26-a1","memo_id":"04-26","genre_id":"04","level":"advanced","question":"基幹的水利施設と畑の整備状況（2024年時点）について、誤っているものはどれか。","choices":["基幹的施設数の標準耐用年数超過割合は59%","基幹的水路延長の標準耐用年数超過割合は50%","貯水池の標準耐用年数超過割合は59%である","区画が整備された畑の面積は129万haである"],"answer":2,"explanation":"2024年の貯水池の標準耐用年数超過割合は11%で、59%は基幹的施設全体の割合です。基幹的水路の50%、畑の129万haはいずれもメモのとおりです。","evidence":["標準耐用年数を超過した基幹的施設数の割合は、2007年から2024年にかけて42%から59％へと増加"],"source":{"memo_id":"04-26","page":26,"print_page":74,"title":"農業生産基盤の整備と水利施設の老朽化"}},{"id":"04-26-a2","memo_id":"04-26","genre_id":"04","level":"advanced","question":"令和6年3月末時点の全国の水田で、30a程度以上の整備済み面積のうち、汎用化が行われていない面積はどれか。","choices":["37万ha","49万ha","71万ha","120万ha"],"answer":1,"explanation":"汎用化が行われた面積112万haは30a程度以上の整備済み面積161万haの内数なので、差は49万haです。71万haは水田面積232万haと161万haの差、120万haは232万haと112万haの差です。","evidence":["「汎用化が行われた面積」は、「30a程度以上の整備済み面積」のうち、暗渠排","161万ha(69.3％)","112万ha(48.2％)"],"source":{"memo_id":"04-26","page":26,"print_page":74,"title":"農業生産基盤の整備と水利施設の老朽化"}},{"id":"04-27-b1","memo_id":"04-27","genre_id":"04","level":"beginner","question":"スマート農業実証プロジェクトは、いつから開始されたか。","choices":["平成30年度","令和元年度","令和２年度","令和３年度"],"answer":1,"explanation":"メモには、プロジェクトを令和元年度から開始したと書かれています。平成30年度は補正予算の年（H30補正）で、開始年度ではありません。","evidence":["プロジェクトを令和元年度から開始し、全国217地区で実証"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-27-b2","memo_id":"04-27","genre_id":"04","level":"beginner","question":"スマート農業実証プロジェクトを通じて判明した効果として、メモに書かれているものはどれか。","choices":["労働時間の削減","農地価格の上昇","農業用水の節約","輸入飼料の削減"],"answer":0,"explanation":"判明した効果として、危険・重労働からの解放や収量・品質の向上とともに、労働時間の削減が挙げられています。ほかの3つは、効果としてメモに書かれていません。","evidence":["農産物の収量や品質の向上、労働時間の削","減等の効果が判明"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-27-i1","memo_id":"04-27","genre_id":"04","level":"intermediate","question":"スマート農業実証プロジェクトで、令和３年度に実証した地区の数はいくつか。","choices":["23地区","34地区","55地区","69地区"],"answer":1,"explanation":"令和３年度の実証は34地区です。23地区は令和４年度、55地区は令和２年度、69地区は令和元年度の数です。","evidence":["令和３年度 34地区"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-27-i2","memo_id":"04-27","genre_id":"04","level":"intermediate","question":"スマート農業実証プロジェクトで、実証地区の数が最も少ない年度はどれか。","choices":["令和元年度","令和２年度","令和４年度","令和５年度"],"answer":3,"explanation":"令和５年度は12地区で、メモに出ている年度の中で最も少ない数です。令和４年度は23地区で、令和５年度より多くなっています。","evidence":["令和５年度 12地区","令和４年度 23地区"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-27-a1","memo_id":"04-27","genre_id":"04","level":"advanced","question":"令和２年度のスマート農業実証プロジェクトについて、通常分と緊急経済対策分を合わせた実証地区の数はいくつか。","choices":["24地区","55地区","69地区","79地区"],"answer":3,"explanation":"令和２年度は通常分が55地区、緊急経済対策分が24地区で、合わせると79地区になります。55地区と24地区は片方だけの数です。69地区は令和元年度の数です。","evidence":["令和２年度 55地区","令和２年度 24地区","緊急経済対策（R２一次補正：10.5億）"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-27-a2","memo_id":"04-27","genre_id":"04","level":"advanced","question":"スマート農業技術の活用を進めるうえでの課題について、メモの内容として誤っているものはどれか。","choices":["衛星データで農機を直進制御する技術は一部で実用化している","野菜や果樹の収穫ロボットは一部の農機等で実用化している","収穫ロボット等の技術開発は難易度が非常に高いとされている","ほ場の畝間拡大など、生産方式の転換が重要だとされている"],"answer":1,"explanation":"メモでは、ニーズの高い野菜や果樹の収穫ロボットは実用化に至っていないとされています。そのため2番目の選択肢が誤りです。一部で実用化が始まっているのは、衛星データを活用して農機を直進制御する技術などです。","evidence":["ニーズの高い野菜や果樹の収穫ロボット","実用化に至らず"],"source":{"memo_id":"04-27","page":27,"print_page":75,"title":"スマート農業実証プロジェクトの展開と課題"}},{"id":"04-28-b1","memo_id":"04-28","genre_id":"04","level":"beginner","question":"今後約20年間で、全国の基幹的農業従事者は現在の約何分の1にまで減少すると見込まれているか。","choices":["約1/2","約1/3","約1/4","約1/5"],"answer":2,"explanation":"メモには、基幹的農業従事者が現在の約1/4（116万人→30万人）にまで減少する見込みと書かれています。約1/2や約1/3では減少幅が小さすぎ、約1/5は大きすぎます。","evidence":["今後約20年間で、基幹的農業従事者は現在の約１/４（116万人→30万人）にまで減少すること等が"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-28-b2","memo_id":"04-28","genre_id":"04","level":"beginner","question":"スマート農業技術活用促進法は、計画認定者を集中的かつ効果的に支援して、何を図るとしているか。","choices":["農業の生産性の向上","農産物の輸出額の拡大","農地の集積・集約化","農産物の価格の安定"],"answer":0,"explanation":"メモには、計画認定者を支援して「農業の生産性の向上を図る」と書かれています。輸出拡大、農地の集積・集約、価格の安定は、このページでは法の目的として書かれていません。","evidence":["や各種支援事業の優遇措置等により集中的かつ効果的に支援を行い、農業の生産性の向上を図る。"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-28-i1","memo_id":"04-28","genre_id":"04","level":"intermediate","question":"スマート農業技術活用促進法の制定にあわせて、令和12年度までにスマート農業技術の活用割合を何％以上にするとしているか。","choices":["30％以上","40％以上","50％以上","60％以上"],"answer":2,"explanation":"メモには、令和12年度までに活用割合を50％以上に上げると書かれています。30％、40％、60％はどれもメモの目標値と違います。","evidence":["＜令和12年度までにスマート農業技術の活用割合を50％以上に向上＞"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-28-i2","memo_id":"04-28","genre_id":"04","level":"intermediate","question":"スマート農業技術活用促進法（令和6年法律第63号）の公布と施行の時期として正しいものはどれか。","choices":["令和5年6月公布・同10月施行","令和6年4月公布・同6月施行","令和6年6月公布・同10月施行","令和6年10月公布・令和7年4月施行"],"answer":2,"explanation":"メモには、令和6年6月に公布され、同年10月に施行されたと書かれています。令和5年は年が違い、6月施行や10月公布は公布と施行の月を取り違えています。","evidence":["スマート農業技術活用促進法の制定 （令和６年６月公布、同10月施行）"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-28-a1","memo_id":"04-28","genre_id":"04","level":"advanced","question":"スマート農業技術活用促進法の2つの計画（生産方式革新実施計画・開発供給実施計画）について、誤っているものはどれか。","choices":["生産方式革新実施計画の支援措置に、日本政策金融公庫の長期低利融資がある","生産方式革新実施計画の支援措置に、農研機構の研究開発設備等の供用がある","開発供給実施計画の申請者には、農機メーカーやサービス事業者などがある","開発供給実施計画の支援措置に、ドローン等の行政手続の簡素化がある"],"answer":1,"explanation":"農研機構の研究開発設備等の供用は、開発供給実施計画の支援措置であり、生産方式革新実施計画の支援措置ではありません。長期低利融資は両方の計画にあり、申請者と行政手続の簡素化の記述は開発供給実施計画の内容と合っています。","evidence":["・農研機構の研究開発設備等の供用等"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-28-a2","memo_id":"04-28","genre_id":"04","level":"advanced","question":"「スマート農業技術活用促進集中支援プログラム」は、どの予算で創設されるとされているか。","choices":["令和6年度当初予算・令和5年度補正予算","令和7年度当初予算・令和6年度補正予算","令和8年度当初予算・令和7年度補正予算","令和8年度当初予算・令和8年度補正予算"],"answer":2,"explanation":"メモには、令和8年度当初予算と令和7年度補正予算で創設すると書かれています。ほかの選択肢は、年度が1年ずつずれているか、補正予算の年度が違います。","evidence":["「スマート農業技術活用促進集中支援プログラム」を創設（令和８年度当初予算・令和７年度補正予算）し、"],"source":{"memo_id":"04-28","page":28,"print_page":76,"title":"スマート農業技術活用促進法の概要"}},{"id":"04-29-b1","memo_id":"04-29","genre_id":"04","level":"beginner","question":"中山間地域の生産性向上に向けて進める取組のうち、②として掲げられているものはどれか。","choices":["導入コストを抑えつつ省力化が可能な共同利用やサービス事業の活用","大規模な担い手への農地の集積・集約による経営規模の拡大","平坦で大区画のほ場に限定したスマート農業技術の普及","中山間地域の農地を林地へ転換する取組への支援の強化"],"answer":0,"explanation":"メモの上部の要点では、②として共同利用やサービス事業の活用が掲げられています。①は狭小・傾斜ほ場にも適用可能な技術の開発、③は導入への支援であり、農地の集積や林地転換、平坦地限定の普及は書かれていません。","evidence":["②導入コストを抑えつつ省力化が可能な共同利用やサービス事業の活用"],"source":{"memo_id":"04-29","page":29,"print_page":77,"title":"中山間地域でのスマート農業の推進"}},{"id":"04-29-i1","memo_id":"04-29","genre_id":"04","level":"intermediate","question":"令和7年度に新設されたスマート農業加算は、どの交付金の中に設けられたものか。","choices":["中山間地域等直接支払交付金","多面的機能支払交付金","環境保全型農業直接支払交付金","畑作物の直接支払交付金"],"answer":0,"explanation":"メモでは、中山間地域等直接支払交付金において、スマート農業加算を令和7年度に新設したとしています。ほかの交付金の名前はこのページに出てこず、加算の場所として誤りです。","evidence":["中山間地域等直接支払交付金※2\nにおいて、スマート農業技術の\n導入による作業の省力化・効率化"],"source":{"memo_id":"04-29","page":29,"print_page":77,"title":"中山間地域でのスマート農業の推進"}},{"id":"04-29-i2","memo_id":"04-29","genre_id":"04","level":"intermediate","question":"中山間地域等の生産現場の即戦力となる技術の開発・実用化を推進するため、研究開発の支援の基とされている現場ニーズとして挙げられているものはどれか。","choices":["「低コスト」や「小型化」","「大型化」や「高速化」","「高付加価値」や「輸出対応」","「有機栽培」や「無農薬化」"],"answer":0,"explanation":"メモでは「低コスト」や「小型化」等の現場ニーズに基づく研究開発を支援すると書かれています。大型化や輸出対応などは、このページの現場ニーズとして挙げられていません。","evidence":["「低コスト」や「小型化」等\nの現場ニーズに基づく研究開発を支援"],"source":{"memo_id":"04-29","page":29,"print_page":77,"title":"中山間地域でのスマート農業の推進"}},{"id":"04-29-a1","memo_id":"04-29","genre_id":"04","level":"advanced","question":"中山間地域におけるスマート農業の推進について、メモの内容として誤っているものはどれか。","choices":["スマート農業技術を「所有」でなく「利用」で活用し、機械コストを抑制する","傾斜地にも対応できるリモコン式草刈機やドローンによる農薬散布等が実用化","スマート農業技術等を活用する農業支援サービス事業者の育成・活動の促進を支援","スマート農業加算は、令和6年度に中山間地域等直接支払交付金に新設された"],"answer":3,"explanation":"スマート農業加算が新設されたのは令和7年度であり、令和6年度ではありません。令和6年度補正予算はリモコン式草刈機などの研究開発支援の注記に出てくるもので、加算の新設年度と取り違えないよう注意が必要です。","evidence":["加算※3を令和７年度に新設。"],"source":{"memo_id":"04-29","page":29,"print_page":77,"title":"中山間地域でのスマート農業の推進"}},{"id":"04-29-a2","memo_id":"04-29","genre_id":"04","level":"advanced","question":"スマート農業加算（令和7年度新設）の単価と年間の上限額から計算すると、1年間で上限額に達するのは何ha分の面積か（10a＝0.1haとする）。","choices":["4ha","20ha","40ha","400ha"],"answer":2,"explanation":"上限額200万円を単価5,000円/10aで割ると400、つまり10aの400倍で4,000a＝40haになります。4haや400haは10aとhaの換算の桁を取り違えた値です。","evidence":["※3 単価：5,000円/10a、上限額：200万円/年"],"source":{"memo_id":"04-29","page":29,"print_page":77,"title":"中山間地域でのスマート農業の推進"}},{"id":"04-30-b1","memo_id":"04-30","genre_id":"04","level":"beginner","question":"農業データ連携基盤（WAGRI）の運営主体はどこですか。","choices":["農研機構","農機メーカー","ICTベンダー","農業者団体"],"answer":0,"explanation":"WAGRIは2019年4月から農研機構を運営主体として運用を開始しています。農機メーカーやICTベンダーはWAGRIを通じてデータを取得しサービスを開発する側です。","evidence":["2019年４月から農研機構を運営主体として運用を開始し"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-30-b2","memo_id":"04-30","genre_id":"04","level":"beginner","question":"農研機構が開発した農業用基本AIモデルを、地域データで追加学習させて地域特化型AIを開発する手法として、メモに書かれているものはどれですか。","choices":["ファインチューニング","ファンクションコーリング","API連携","データ集約・統合"],"answer":0,"explanation":"基本AIモデルを地域特有のデータを用いて地域毎にファインチューニングすることで地域特化型AIを開発します。ファンクションコーリングは生成AIが外部の機能を呼び出す仕組みで、追加学習ではありません。","evidence":["②基本AIモデルを地域特有のデータを用いて地域毎にファインチューニングすること","※1 事前学習済みのモデルを、目的とするタスクに特化した学習データにより追加で学習させること。"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-30-i1","memo_id":"04-30","genre_id":"04","level":"intermediate","question":"WAGRIの概要図（B to B to Cの仕組み）で、WAGRIを通じてデータ・システムを取得し、新たな農業関連サービスを開発する主体として示されているものはどれですか。","choices":["農機メーカーやICTベンダー","農業者等","農研機構","市況データや気象データ"],"answer":0,"explanation":"図では農機メーカーA・BやICTベンダーC・DがWAGRIを通じてデータ・システムを取得し、アプリ等を開発しています。農業者等はそのサービスを選択・活用する側で、気象データ等はWAGRIに集約されるデータです。","evidence":["WAGRIを通じてデータ・システムを取得し、新たな農業関連サービス（アプリ等）を開発","農業者等が、それぞれの経営形態等に応じて農業関連サービスを選択・活用"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-30-i2","memo_id":"04-30","genre_id":"04","level":"intermediate","question":"WAGRIの運用が開始されたのはいつですか。","choices":["2019年4月","2016年4月","2022年4月","2026年3月"],"answer":0,"explanation":"WAGRIは2019年4月から農研機構を運営主体として運用を開始しました。2026年3月は会員数やAPI数の集計時点であり、運用開始の時期ではありません。","evidence":["2019年４月から農研機構を運営主体として運用を開始し"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-30-a1","memo_id":"04-30","genre_id":"04","level":"advanced","question":"2026年3月末現在のWAGRIについて、会員登録している民間事業者等の数と、利用可能なAPIの数の組合せとして正しいものはどれですか。","choices":["事業者等126、API223","事業者等223、API126","事業者等126、API162","事業者等112、API223"],"answer":0,"explanation":"2026年3月末現在、126の民間事業者等が会員登録し、223のAPIが利用可能です。2つの数値を入れ替えた選択肢や、近い数値に変えた選択肢は誤りです。","evidence":["３月末現在、126の民間事業者等が活用（会員登録）し","※223のAPIが利用可能（2026年３月末）"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-30-a2","memo_id":"04-30","genre_id":"04","level":"advanced","question":"WAGRIとAIの活用について、メモの内容として誤っているものはどれですか。","choices":["FarmChatのAI機能は2026年10月頃実装予定","地域版AIの開発・実証は2026年度から加速化","ファンクションコーリングはモデルを追加学習させる仕組み","WAGRIではAPIとしてデータ・システムを提供"],"answer":2,"explanation":"ファンクションコーリングは生成AIが外部のシステムやプログラムの機能を呼び出して処理を実行する仕組みで、追加学習はファインチューニングの説明です。他の3つはメモに書かれたとおりです。","evidence":["※2 生成AI（大規模言語モデル）が外部のシステムやプログラムの機能を呼び出して処理を実行する仕組み。"],"source":{"memo_id":"04-30","page":30,"print_page":78,"title":"農業データ連携基盤WAGRIとAIの活用"}},{"id":"04-31-b1","memo_id":"04-31","genre_id":"04","level":"beginner","question":"このページで、新たな技術・サービスで農林漁業・食品産業をサポートする事業者が、必要なサポートを十分受けられていない理由として挙げられているものはどれか。","choices":["その事業リスク等があること","農地の集積が遅れていること","輸出先の規制が厳しいこと","担い手の高齢化が進むこと"],"answer":0,"explanation":"メモの要点には、事業者が「その事業リスク等により」必要なサポートを十分受けられていないと書かれています。農地の集積、輸出規制、高齢化は、このページでは理由として挙げられていません。","evidence":["その事業リスク等により、発想・構想段階から研究開発、事業拡"],"source":{"memo_id":"04-31","page":31,"print_page":79,"title":"農林漁業を支える新たな技術・サービスへの支援"}},{"id":"04-31-b2","memo_id":"04-31","genre_id":"04","level":"beginner","question":"このページで、スタートアップや中小企業などへの多角的な支援の枠組みに加えて、支援の根拠とされている法律はどれか。","choices":["スマート農業技術活用促進法","食料・農業・農村基本法","みどりの食料システム法","農業経営基盤強化促進法"],"answer":0,"explanation":"要点には「スマート農業技術活用促進法に基づき支援」と書かれています。ほかの3つの法律は、このページでは支援の根拠として出てきません。","evidence":["また、スマート農業"],"source":{"memo_id":"04-31","page":31,"print_page":79,"title":"農林漁業を支える新たな技術・サービスへの支援"}},{"id":"04-31-a1","memo_id":"04-31","genre_id":"04","level":"advanced","question":"このページで、事業化段階を対象とする支援のうち、スタートアップ育成５か年計画を具現化するために大規模技術実証を支援するものはどれか。","choices":["SBIRフェーズ３基金","大規模技術実証支援事業","日本政策金融公庫の融資制度","農業支援サービス事業の育成対策"],"answer":0,"explanation":"農林水産省中小企業イノベーション創出推進事業（SBIRフェーズ３基金）は、スタートアップ育成５か年計画を具現化するため大規模技術実証を支援します。スタートアップ大規模技術実証支援事業も事業化段階を対象としますが、目的は現場課題の解決に直結する技術の事業化で、５か年計画には触れていません。","evidence":["農林水産省中小企業イノベーション創出推進事業（SBIRフェーズ３基金）","スタートアップ育成５か年計画を具現化するため、スタートアップ等の有する先端技術を活用した、"],"source":{"memo_id":"04-31","page":31,"print_page":79,"title":"農林漁業を支える新たな技術・サービスへの支援"}},{"id":"04-31-a2","memo_id":"04-31","genre_id":"04","level":"advanced","question":"このページのスマート農業技術活用促進法に基づく支援について、誤っているものはどれか。","choices":["生産方式革新実施計画の認定を受けた農業者が支援の対象","開発供給実施計画の認定を受けた事業者が支援の対象","農研機構の施設供用や税制特例措置を受けることが可能","林業・漁業の事業者も本法律の支援の対象に含まれる"],"answer":3,"explanation":"メモには「※林業・漁業は本法律の対象外」と明記されているため、林業・漁業を対象に含めるのは誤りです。生産方式革新実施計画や開発供給実施計画の認定を受けた農業者・事業者は、農研機構の施設供用や税制特例措置などを受けられます。","evidence":["※林業・漁業は本法律の対象外"],"source":{"memo_id":"04-31","page":31,"print_page":79,"title":"農林漁業を支える新たな技術・サービスへの支援"}},{"id":"04-32-b1","memo_id":"04-32","genre_id":"04","level":"beginner","question":"食料・農業・農村基本計画（令和7年4月11日閣議決定）のもとでの品種開発で、気候変動等に起因する課題として挙げられているものはどれか。","choices":["作物の高温障害や病害虫による品質・収量の低下","輸入農産物の価格上昇による国産需要の減少","農業用水の不足による作付面積の減少","農業者の高齢化による担い手の急な減少"],"answer":0,"explanation":"メモには、気候変動等に起因する作物の高温障害や病害虫による品質や収量の低下等の課題に対応した品種開発を進めると書かれています。輸入価格、用水不足、高齢化は、このページの課題として挙げられていません。","evidence":["気候変動等に起因する作物の高温障害や病害虫による品質や収量の低下等の課題に対応した品種開発"],"source":{"memo_id":"04-32","page":32,"print_page":80,"title":"農研機構・国際農研が近年開発した品種"}},{"id":"04-32-i1","memo_id":"04-32","genre_id":"04","level":"intermediate","question":"高温耐性品種の水稲「にじのきらめき」の、令和7年（R7）の作付面積はどれか。","choices":["約700ha","約940ha","約1.5万ha","約2.6万ha"],"answer":3,"explanation":"にじのきらめきは、東北以南で約2.6万ha（R7）作付けされています。約700haは「とよめき」、940haは「そらシリーズ」、約1.5万haは「里のほほえみ」（R6）の数値です。","evidence":["・東北以南において約2.6万ha （R7）で作付け。"],"source":{"memo_id":"04-32","page":32,"print_page":80,"title":"農研機構・国際農研が近年開発した品種"}},{"id":"04-32-i2","memo_id":"04-32","genre_id":"04","level":"intermediate","question":"グラフ「そらシリーズと既存品種の収量の差」で、そらシリーズの既存品種に対する収量の増加率のうち、最も大きいものはどれか。","choices":["21％UP","38％UP","54％UP","67％UP"],"answer":3,"explanation":"グラフに示された増加率は21％、67％、54％、38％で、最も大きいのは67％UPです。54％UPはグラフで目立つ位置にありますが、2番目の大きさです。","evidence":["21％UP","67％UP","54％UP"],"source":{"memo_id":"04-32","page":32,"print_page":80,"title":"農研機構・国際農研が近年開発した品種"}},{"id":"04-32-a1","memo_id":"04-32","genre_id":"04","level":"advanced","question":"近年、農研機構・国際農研で開発された品種の説明として、誤っているものはどれか。","choices":["りんご「紅つるぎ」は樹姿を壁状に仕立てやすい","いちご「恋みのり」は果実硬度が高く日持ち性に優れる","なす「あのみのりパワー」は青枯病抵抗性が「強」である","かんしょ「コガネタイガン」は北関東を中心に普及予定"],"answer":3,"explanation":"コガネタイガンは、南九州で普及予定とされています。北関東を中心に普及予定なのは、なす「あのみのりパワー」です。","evidence":["・南九州において普及予定。","・北関東を中心に普及予定。"],"source":{"memo_id":"04-32","page":32,"print_page":80,"title":"農研機構・国際農研が近年開発した品種"}},{"id":"04-32-a2","memo_id":"04-32","genre_id":"04","level":"advanced","question":"このページで「既存品種より2割以上多収」とされている品種の組合せはどれか。","choices":["大豆「そらシリーズ」と水稲「とよめき」","水稲「にじのきらめき」と水稲「とよめき」","大豆「里のほほえみ」と大豆「そらシリーズ」","茶「せいめい」といちご「恋みのり」"],"answer":0,"explanation":"多収性品種として、そらシリーズととよめきの両方に「既存品種より2割以上多収」とあります。にじのきらめきは高温耐性、里のほほえみは難裂莢性による収穫ロスの少なさが特長で、多収とは書かれていません。","evidence":["・既存品種より２割以上多収で","・既存品種より2割以上多収で、"],"source":{"memo_id":"04-32","page":32,"print_page":80,"title":"農研機構・国際農研が近年開発した品種"}},{"id":"04-33-b1","memo_id":"04-33","genre_id":"04","level":"beginner","question":"気候変動等対応品種法の概要でいう「重要品種」の説明として正しいものはどれか。","choices":["重要な形質を有し、広域で利用可能な品種","特定の一地域だけで栽培される在来の品種","海外から導入して試験中である新しい品種","品種登録の期限が切れて自由に使える品種"],"answer":0,"explanation":"重要品種は、多収性や高温耐性等の重要な形質を有し、広域で利用可能な品種とされています。一地域限定や海外導入、登録期限切れといった説明はメモにありません。","evidence":["多収性や高温耐性等の重要な形質を有し、広域で利用可能な品種（重"],"source":{"memo_id":"04-33","page":33,"print_page":81,"title":"気候変動等対応品種法の概要"}},{"id":"04-33-b2","memo_id":"04-33","genre_id":"04","level":"beginner","question":"気候変動等対応品種法の新たな法制度で創設されるものはどれか。","choices":["国の主導で重要品種の育成等を振興する計画制度","農業者に品種ごとの作付面積を割り当てる制度","都道府県だけで品種を育成する独自の認証制度","民間企業の品種育成を禁止して国が行う制度"],"answer":0,"explanation":"メモでは、国の主導の下、重要品種の育成と種苗生産を振興する計画制度を創設するとしています。育成計画は農研機構、都道府県、民間企業等が作成するので、都道府県だけや民間禁止とする選択肢は誤りです。","evidence":["国の主導の下、重要品種の育成と種苗生産を振興する計画制度を創設。"],"source":{"memo_id":"04-33","page":33,"print_page":81,"title":"気候変動等対応品種法の概要"}},{"id":"04-33-i1","memo_id":"04-33","genre_id":"04","level":"intermediate","question":"気候変動等対応品種法の重要品種育成事業計画に記載する事項として示されているものはどれか。","choices":["目標普及面積","種苗の生産量","種苗生産の実施区域","区域内の農地の集団化"],"answer":0,"explanation":"重要品種育成事業計画の記載事項には、育成する新品種の性質、栽培予定地域、目標普及面積などが挙げられています。生産量と農地の集団化は種苗生産事業活動計画、種苗生産の実施区域は都道府県基本計画の事項です。","evidence":["・ 目標普及面積","・生産区域の規模、区域内の農地の集団化","・種苗生産の実施区域"],"source":{"memo_id":"04-33","page":33,"print_page":81,"title":"気候変動等対応品種法の概要"}},{"id":"04-33-a1","memo_id":"04-33","genre_id":"04","level":"advanced","question":"気候変動等対応品種法で示された措置の説明として誤っているものはどれか。","choices":["品種登録出願の義務化","品種登録出願料等の減免","農研機構の研究施設・設備の供用等が可","種苗生産者に栽培管理協定の作成を義務付け"],"answer":3,"explanation":"栽培管理協定は種苗生産者が任意で作成するものであり、義務付けではありません。品種登録出願の義務化、出願料等の減免、農研機構の施設・設備の供用はメモに示された措置です。","evidence":["※種苗生産者は、栽培管理協定を任意で作成"],"source":{"memo_id":"04-33","page":33,"print_page":81,"title":"気候変動等対応品種法の概要"}},{"id":"04-33-a2","memo_id":"04-33","genre_id":"04","level":"advanced","question":"気候変動等対応品種法で、重要品種の育成の振興と種苗生産の振興をつなぐ情報提供の内容として正しいものはどれか。","choices":["国が都道府県に育成された新品種の情報を提供","都道府県が国に種苗の生産量の情報を提供","種苗生産者が農研機構に農地の情報を提供","民間企業が種苗生産者に出願時期を提供"],"answer":0,"explanation":"メモでは、育成された新品種の情報を国が都道府県に提供するとされています。情報の向きは国から都道府県であり、ほかの主体間の情報提供は示されていません。","evidence":["※育成された\n新品種の\n情報を国が\n都道府県に\n提供"],"source":{"memo_id":"04-33","page":33,"print_page":81,"title":"気候変動等対応品種法の概要"}},{"id":"04-34-b1","memo_id":"04-34","genre_id":"04","level":"beginner","question":"重要品種種苗生産事業活動で、重要品種の種苗生産区域などを盛り込んだ「都道府県基本計画」を策定するのは誰か。","choices":["都道府県","市町村","農研機構","民間企業"],"answer":0,"explanation":"要点に、都道府県が地域の状況に応じて都道府県基本計画を策定すると書かれています。市町村は栽培管理協定の認可、農研機構や民間企業は品種育成の連携先として示されており、計画の策定者ではありません。","evidence":["都道府県が、地域の状況に応じて、重要品種の種苗生産区域や広域への種苗の","普及の方針等を盛り込んだ都道府県基本計画を策定。"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-34-b2","memo_id":"04-34","genre_id":"04","level":"beginner","question":"重要品種育成事業で、品種育成の効率化と加速化を実現するために活用するとされているものはどれか。","choices":["ゲノム情報やAI","外国品種の輸入","種苗価格の補助","農地の規模拡大"],"answer":0,"explanation":"要点に、ゲノム情報やAIの活用を通じて品種育成の効率化と加速化を実現すると書かれています。外国品種の輸入や種苗価格の補助、農地の規模拡大はこのメモに手段として書かれていません。","evidence":["ゲノム情報やAIの活用を通じた品種育成の効率化と加速化を実現。"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-34-i1","memo_id":"04-34","genre_id":"04","level":"intermediate","question":"「重要品種育成事業のイメージ」の図で、実需の役割として示されているものはどれか。","choices":["品種候補の加工実証評価","品種候補の現地栽培実証","先導的品種候補群の育成","計画的な原原種・原種生産"],"answer":0,"explanation":"図では実需の役割は品種候補の加工実証評価です。現地栽培実証は生産者・団体、先導的品種候補群の育成は農研機構、計画的な原原種・原種生産は公設試験場と民間企業の役割です。","evidence":["実需\n・品種候補の\n加工実証評価"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-34-i2","memo_id":"04-34","genre_id":"04","level":"intermediate","question":"「重要品種種苗生産事業活動のイメージ」の効率的な栽培管理の方法で、交雑防止のための方法として示されているものはどれか。","choices":["緩衝地帯の設置","人工気象室の設置","防鳥ネットの設置","種子の輸入検査"],"answer":0,"explanation":"図には「交雑防止のための緩衝地帯の設置」と示されています。人工気象室は品種育成の研究開発設備として出てくるもので、防鳥ネットや種子の輸入検査はメモに書かれていません。","evidence":["・交雑防止のための\n緩衝地帯の設置"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-34-a1","memo_id":"04-34","genre_id":"04","level":"advanced","question":"重要品種種苗生産事業活動のイメージについて、誤っているものはどれか。","choices":["種苗生産の集団化を地域計画に位置付けて推進する","栽培管理協定は都道府県の認可で継承者に効力が続く","種苗生産者は農地の集団化やゾーニング等に取り組む","病害発生時には罹患株の抜き取りを行う"],"answer":1,"explanation":"栽培管理協定は市町村の認可を受けることで、その効力が農地の継承者に継続するとされており、都道府県の認可ではありません。ほかの3つは図や要点にそのまま示されています。","evidence":["栽培管理協定を締結し、\n市町村の認可を受けることで\nその効力が農地の継承者に継続"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-34-a2","memo_id":"04-34","genre_id":"04","level":"advanced","question":"「重要品種育成事業のイメージ」で、品種登録に関して示されている措置の組合せとして正しいものはどれか。","choices":["出願の義務化と出願料の免除","出願の任意化と出願料の免除","出願の義務化と出願料の増額","出願の任意化と出願料の減額"],"answer":0,"explanation":"図には品種登録出願の義務化と出願料の免除の2つが並んで示されています。出願を任意とする、出願料を増額・減額するといった記載はありません。","evidence":["品種登録出願の\n義務化\n出願料の免除"],"source":{"memo_id":"04-34","page":34,"print_page":82,"title":"法律に基づく重要品種の育成・種苗生産の取組"}},{"id":"04-35-b1","memo_id":"04-35","genre_id":"04","level":"beginner","question":"このメモで、品種改良加速技術（ゲノム編集技術・欠失型）はどのような技術と説明されているか。","choices":["標的の遺伝子を切断し突然変異を効率的に起こす技術","他の生物の遺伝子を取り出して作物に組み込む技術","ガンマ線照射や薬剤浸漬で突然変異を誘発する技術","異なる品種の交配と選抜を繰り返して改良する技術"],"answer":0,"explanation":"ゲノム編集技術は、ターゲットとする遺伝子を切断して自然界でも起こり得る突然変異を効率的に起こす技術とされています。他の生物の遺伝子を組み込むのは遺伝子組換え、ガンマ線照射は突然変異育種、交配と選抜は交雑育種法の説明です。","evidence":["ターゲットとする遺伝子を切断することで、自然界でも起こり","得る突然変異を効率的に起こす技術（欠失型※※）"],"source":{"memo_id":"04-35","page":35,"print_page":83,"title":"品種改良加速技術（ゲノム編集技術）"}},{"id":"04-35-b2","memo_id":"04-35","genre_id":"04","level":"beginner","question":"令和8年7月時点で、ゲノム編集技術による農林水産物は国内で何種類の届出等がなされているか。","choices":["5種類","8種類","14種類","20種類"],"answer":2,"explanation":"令和8年7月時点では、GABAの含有量の多いトマト等14種類の農林水産物の届出等がなされています。5はトマトのGABA等高蓄積の例数であり、種類数ではありません。","evidence":["令和８年７月時点では、GABAの含有量の多いトマト等14種類の農林水産物の届出等がなされている。"],"source":{"memo_id":"04-35","page":35,"print_page":83,"title":"品種改良加速技術（ゲノム編集技術）"}},{"id":"04-35-i1","memo_id":"04-35","genre_id":"04","level":"intermediate","question":"国内で届出等されたゲノム編集トマトのうち、「GABA等を高蓄積」とされたものは何例か。","choices":["1例","3例","5例","14例"],"answer":2,"explanation":"トマトはGABA等を高蓄積したものが5例、果実糖度が上昇したものが1例と示されています。1例は糖度上昇の例数、14は届出等された農林水産物全体の種類数です。","evidence":["（GABA等を高蓄積［５例］、果実糖度が上昇［１例］）"],"source":{"memo_id":"04-35","page":35,"print_page":83,"title":"品種改良加速技術（ゲノム編集技術）"}},{"id":"04-35-i2","memo_id":"04-35","genre_id":"04","level":"intermediate","question":"国内で届出等されたゲノム編集の農林水産物のうち、「果実の褐変化が低減」とされているものはどれか。","choices":["バナナ","トマト","ジャガイモ","トルコギキョウ"],"answer":0,"explanation":"果実の褐変化が低減とされているのはバナナです。トマトはGABA等の高蓄積や糖度上昇、ジャガイモは小型のいもの数の増加、トルコギキョウは花弁が淡黄色に変化とされています。","evidence":["（果実の褐変化が低減）","トルコギキョウ（花弁が淡黄色に変化）"],"source":{"memo_id":"04-35","page":35,"print_page":83,"title":"品種改良加速技術（ゲノム編集技術）"}},{"id":"04-35-a1","memo_id":"04-35","genre_id":"04","level":"advanced","question":"届出等されたゲノム編集の魚のうち、マダイ・ティラピアとトラフグ・ヒラメの両方で改善されたと示されている点はどれか。","choices":["飼料利用効率","成長率","可食部の量","果実糖度"],"answer":0,"explanation":"マダイ・ティラピアは可食部の増量と飼料利用効率の改善、トラフグ・ヒラメは飼料利用効率と成長率の改善とされ、共通するのは飼料利用効率です。成長率はトラフグ・ヒラメのみ、可食部の量はマダイ・ティラピアのみの記載です。","evidence":["マダイ、ティラピア （可食部が増量し飼料利用効率が改善）","（飼料利用効率、成長率が改善）"],"source":{"memo_id":"04-35","page":35,"print_page":83,"title":"品種改良加速技術（ゲノム編集技術）"}},{"id":"04-36-b1","memo_id":"04-36","genre_id":"04","level":"beginner","question":"地理的表示（GI）保護制度で、知的財産として保護されるものはどれか。","choices":["産品の名称","産品の製造機械","産品の栽培農地","産品の包装容器"],"answer":0,"explanation":"GI保護制度は、地域ならではの特性を持つ産品の名称を知的財産として保護する制度です。製造機械・農地・包装容器を保護するとはメモに書かれていません。","evidence":["産品の名称を、知的財産として保護する制度。"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-36-b2","memo_id":"04-36","genre_id":"04","level":"beginner","question":"地理的表示（GI）保護制度の運用が始まった時期はどれか。","choices":["平成25年6月","平成27年6月","平成29年6月","令和元年6月"],"answer":1,"explanation":"メモには平成27年6月から運用開始と書かれています。ほかの年月はメモに出てきません。","evidence":["（平成27年6月から運用開始）"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-36-i1","memo_id":"04-36","genre_id":"04","level":"intermediate","question":"図の「市田柿」の例で、生産地の条件ではなく産品の「特性」として挙げられているものはどれか。","choices":["昼夜の寒暖差が大きいこと","もっちりとした食感","晩秋から初冬の川霧の発生","しっかりとした揉み込み"],"answer":1,"explanation":"「もっちりとした食感」は特性の欄に挙げられています。寒暖差・川霧・揉み込みは、特性を育んだ生産地の条件として生産地の欄に書かれています。","evidence":["・もっちりとした食感","・昼夜の寒暖差が大きいため、高糖度の原料柿ができる"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-36-i2","memo_id":"04-36","genre_id":"04","level":"intermediate","question":"地理的表示の構成員が行う生産が明細書に合うよう指導・検査を行う「生産行程管理業務」は、誰が行うか。","choices":["登録を受けた生産者団体","農林水産大臣","外国・地域の政府","産品を購入する需要者"],"answer":0,"explanation":"生産行程管理業務は、登録を受けた生産者団体が構成員の生産について行います。農林水産大臣は、相互保護で外国のGI産品を指定する役割としてメモに出てきます。","evidence":["登録を受けた生産者団体は、構成員が行う「生産」が、明細書に適合して行われるよう、必要な指導・"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-36-a1","memo_id":"04-36","genre_id":"04","level":"advanced","question":"地理的表示（GI）の登録の効果について、メモの内容として誤っているものはどれか。","choices":["登録産品のみがGIマークを独占的に使用できる","生産者団体が訴訟を提起して取締りを行う必要がある","産品の品質や製法、評判などの魅力が見える化する","需要者にとって原料調達が安定するなどの利点がある"],"answer":1,"explanation":"メモでは、生産者団体が訴訟の提起等をしなくても国による取締りが行われるとされているため、2番目が誤りです。ほかの3つは「登録の効果」にそのまま書かれています。","evidence":["生産者団体が訴訟の提起等をしなくても、国による取締りが行われる。"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-36-a2","memo_id":"04-36","genre_id":"04","level":"advanced","question":"GIの相互保護の制度について、外国のGI産品を保護する仕組みとその効果の組み合わせとして正しいものはどれか。","choices":["同等水準の国とリスト交換し大臣が指定／模倣品の排除","同等水準の国とリスト交換し大臣が指定／輸出関税の撤廃","全ての国の産品を自動で保護する／模倣品の排除","全ての国の産品を自動で保護する／輸出関税の撤廃"],"answer":0,"explanation":"相互保護は、同等水準のGI制度を持つ外国・地域とGIリストを交換し、所要の手続の後に農林水産大臣が指定する仕組みです。効果は模倣品の排除によるブランド価値の保護などで、自動保護や関税撤廃はメモにありません。","evidence":["我が国と同等水準と認められるＧＩ制度を有する外国・地域と","所要の手続を行った上で、農林水産大臣が指定","⇒ 模倣品の排除によるブランド価値の保護、"],"source":{"memo_id":"04-36","page":36,"print_page":84,"title":"地理的表示（GI）保護制度の仕組みと効果"}},{"id":"04-37-b1","memo_id":"04-37","genre_id":"04","level":"beginner","question":"令和8年7月末時点で、GIとして登録されている産品は計何産品ですか。","choices":["107産品","150産品","170産品","121産品"],"answer":2,"explanation":"メモの要点に、令和8年7月末時点で計170産品がGIとして登録と書かれています。107産品は日EU・EPAでの日本側、121産品はEU側の相互保護の数で、GI登録数ではありません。","evidence":["令和８年７月末時点において計170産品がGIとして登録。"],"source":{"memo_id":"04-37","page":37,"print_page":85,"title":"GI登録産品とEPAによる相互保護"}},{"id":"04-37-i1","memo_id":"04-37","genre_id":"04","level":"intermediate","question":"令和8年7月末時点で、日英・EPAの発効により相互保護されている英国側の産品は何産品ですか。","choices":["108産品","59産品","121産品","95産品"],"answer":1,"explanation":"日英・EPAでは英国側59産品が相互保護されています。108産品は同じ日英・EPAの日本側の数、121産品は日EU・EPAのEU側の数なので誤りです。","evidence":["り日本側108産品、英国側59産品が相互保護されている。（令和８年７月末時点）"],"source":{"memo_id":"04-37","page":37,"print_page":85,"title":"GI登録産品とEPAによる相互保護"}},{"id":"04-37-a1","memo_id":"04-37","genre_id":"04","level":"advanced","question":"令和8年7月末時点のEPAによる産品の相互保護について、誤っているものはどれですか。","choices":["日EU・EPAで保護される日本側の産品は107産品","日EU・EPAで保護されるEU側の産品は121産品","日英・EPAで保護される日本側の産品は108産品","日EU・EPAでは日本側の産品数がEU側より多い"],"answer":3,"explanation":"日EU・EPAでは日本側107産品、EU側121産品で、EU側の方が多いため、日本側が多いという記述は誤りです。日本側107産品・EU側121産品・日英の日本側108産品はいずれもメモのとおりです。","evidence":["日EU・EPAの発効により日本側107産品、EU側121産品が"],"source":{"memo_id":"04-37","page":37,"print_page":85,"title":"GI登録産品とEPAによる相互保護"}},{"id":"04-38-b1","memo_id":"04-38","genre_id":"04","level":"beginner","question":"新たに植物品種を育成した者が、国に品種登録することで取得する知的財産権の名称はどれか。","choices":["育成者権","栽培者権","利用者権","販売者権"],"answer":0,"explanation":"品種登録により取得するのは知的財産権のひとつである「育成者権」です。ほかの3つはメモに出てこない名称で、登録品種の利用者は許諾を受けて使う立場です。","evidence":["つである「育成者権」を取得。登録品種の種苗、収穫物、加工品の販売等を独占できる。"],"source":{"memo_id":"04-38","page":38,"print_page":86,"title":"種苗法に基づく品種登録制度と育成者権"}},{"id":"04-38-b2","memo_id":"04-38","genre_id":"04","level":"beginner","question":"品種登録制度により育成者権を取得する根拠となっている法律はどれか。","choices":["農地法","種苗法","植物防疫法","食品衛生法"],"answer":1,"explanation":"メモでは、新たに植物品種を育成した者は種苗法に基づき品種登録すると書かれています。農地法や植物防疫法などは品種登録の根拠としてメモに書かれていません。","evidence":["種苗法に基づき、新たに植物品種を育成した者は、国に品種登録することにより"],"source":{"memo_id":"04-38","page":38,"print_page":86,"title":"種苗法に基づく品種登録制度と育成者権"}},{"id":"04-38-i1","memo_id":"04-38","genre_id":"04","level":"intermediate","question":"育成者権の存続期間について、果樹等木本の植物の最長期間は何年か。","choices":["25年","30年","35年","40年"],"answer":3,"explanation":"果樹等木本の植物の存続期間は最長40年です。35年は果樹等木本以外の植物の最長期間なので、取り違えに注意が必要です。","evidence":["（果樹等木本の植物は最長40年※）","・権利の存続期間：最長35年※"],"source":{"memo_id":"04-38","page":38,"print_page":86,"title":"種苗法に基づく品種登録制度と育成者権"}},{"id":"04-38-i2","memo_id":"04-38","genre_id":"04","level":"intermediate","question":"国際条約により、樹木及びぶどうを海外で品種登録できるのは、国内流通から何年以内に限定されているか。","choices":["4年","6年","8年","10年"],"answer":1,"explanation":"樹木及びぶどうは国内流通から6年以内に限定されています。4年は樹木及びぶどう以外の植物の期限です。","evidence":["国際条約により海外で品種登録できるのは国内流通から４年(樹木及びぶどう","は６年)以内に限定。"],"source":{"memo_id":"04-38","page":38,"print_page":86,"title":"種苗法に基づく品種登録制度と育成者権"}},{"id":"04-38-a1","memo_id":"04-38","genre_id":"04","level":"advanced","question":"品種登録制度と育成者権について、このメモの内容として誤っているものはどれか。","choices":["登録品種の増殖には、自家増殖を含めて許諾が必要","届出により、登録品種の海外持出しを制限できる","海外では一国で登録すれば各国でも保護される","種苗を譲渡する際は、登録品種である旨の表示義務"],"answer":2,"explanation":"海外での品種保護には各国ごとに品種登録が必要なので、一国の登録で各国でも保護されるという記述は誤りです。自家増殖を含む増殖への許諾、海外持出し制限、登録品種である旨の表示義務はいずれもメモに書かれています。","evidence":["各国ごとに品種登録が必要。"],"source":{"memo_id":"04-38","page":38,"print_page":86,"title":"種苗法に基づく品種登録制度と育成者権"}},{"id":"04-39-b1","memo_id":"04-39","genre_id":"04","level":"beginner","question":"食品衛生法において、食品安全の基礎となるHACCPが制度化されたのはいつからか。","choices":["令和元年6月","令和3年6月","令和5年6月","平成30年6月"],"answer":1,"explanation":"メモの要点に、HACCPは食品衛生法において令和3年6月から制度化されたと書かれています。令和元年や令和5年など、ほかの時点は記載されていません。","evidence":["食品安全の基礎となるHACCPは、食品衛生法において令和3年6月から制度化。"],"source":{"memo_id":"04-39","page":39,"print_page":87,"title":"食品安全マネジメントとHACCP"}},{"id":"04-39-b2","memo_id":"04-39","genre_id":"04","level":"beginner","question":"食品安全マネジメントを、国際機関等の他に規格化している民間主体の団体はどれか。","choices":["ISO","CODEX","GFSI","JFS"],"answer":2,"explanation":"民間主体の団体として食品安全マネジメントを規格化しているのはGFSIです。ISOやCODEXは国際機関として挙げられており、JFSはGFSIで承認された日本発の規格の名前です。","evidence":["食品安全マネジメントは、国際機関等の他に民間主体の団体（GFSI）により規格化。","ISOやCODEXのような国際機関"],"source":{"memo_id":"04-39","page":39,"print_page":87,"title":"食品安全マネジメントとHACCP"}},{"id":"04-39-i1","memo_id":"04-39","genre_id":"04","level":"intermediate","question":"食品安全管理規格の承認等を行う民間団体GFSI（世界食品安全イニシアティブ）は何年に設立されたか。","choices":["1990年","2000年","2010年","2021年"],"answer":1,"explanation":"GFSIは2000年設立の民間団体と書かれています。2021年はHACCP制度化の令和3年に近い年ですが、GFSIの設立年ではありません。","evidence":["協働して食品安全管理規格の承認等を行う民間団体 （2000年設立）"],"source":{"memo_id":"04-39","page":39,"print_page":87,"title":"食品安全マネジメントとHACCP"}},{"id":"04-39-i2","memo_id":"04-39","genre_id":"04","level":"intermediate","question":"HACCPにおいて「CCP」として継続的に監視・記録されるものはどれか。","choices":["微生物による汚染などの危害要因","危害の防止につながる特に重要な工程","問題のある最終製品の抜取検査","食品の安全を維持するための運営管理"],"answer":1,"explanation":"CCPは、危害の防止につながる特に重要な工程を指し、これを継続的に監視・記録します。微生物による汚染などは危害要因（HA）であり、CCPとは別のものです。","evidence":["危害の防止につながる","特に重要な工程（CCP）を継続的に監視・記録する"],"source":{"memo_id":"04-39","page":39,"print_page":87,"title":"食品安全マネジメントとHACCP"}},{"id":"04-39-a1","memo_id":"04-39","genre_id":"04","level":"advanced","question":"食品安全マネジメントとHACCPについての説明として、誤っているものはどれか。","choices":["食品安全マネジメントは食品の安全を維持する運営管理を指す","HACCPは最終製品の抜取検査を中心とする品質管理の手法である","食品安全マネジメント規格にはISOやCODEXによるものもある","HACCPでは原材料の受入れから最終製品まで工程ごとに分析する"],"answer":1,"explanation":"最終製品の抜取検査は「これまでの品質管理の手法」であり、HACCPはそれに比べてより効果的に問題のある製品の出荷を防ぐ工程管理システムです。ほかの3つはメモの記載どおりです。","evidence":["これまでの品質管理の手法である最終製品の抜取","検査に比べ、より効果的に問題のある製品の出荷を"],"source":{"memo_id":"04-39","page":39,"print_page":87,"title":"食品安全マネジメントとHACCP"}},{"id":"04-40-b1","memo_id":"04-40","genre_id":"04","level":"beginner","question":"このメモで「GAP」の日本語での呼び方として示されているものはどれか。","choices":["農業生産工程管理","農産物品質認証","農場衛生基準","農業経営改善計画"],"answer":0,"explanation":"メモではGAP（Good Agricultural Practices）を「農業生産工程管理」と示しています。品質認証や衛生基準、経営改善計画といった呼び方はメモに書かれていません。","evidence":["ＧＡＰ（Ｇｏｏｄ Ａｇｒｉｃｕｌｔｕｒａｌ Ｐｒａｃｔｉｃｅs：農業生産工程管理）"],"source":{"memo_id":"04-40","page":40,"print_page":88,"title":"GAP（農業生産工程管理）と国際水準GAP"}},{"id":"04-40-b2","memo_id":"04-40","genre_id":"04","level":"beginner","question":"農林水産省が国際水準GAPに含めるとしている5分野の一つはどれか。","choices":["人権保護","輸出促進","価格安定","品種開発"],"answer":0,"explanation":"国際水準GAPの5分野は食品安全・環境保全・労働安全・人権保護・農場経営管理です。輸出促進・価格安定・品種開発は5分野に含まれていません。","evidence":["「食品安全」、「環境保全」、「労働安全」、「人権保護」、「農場経営管"],"source":{"memo_id":"04-40","page":40,"print_page":88,"title":"GAP（農業生産工程管理）と国際水準GAP"}},{"id":"04-40-i2","memo_id":"04-40","genre_id":"04","level":"intermediate","question":"日本での主なGAP認証の表で、ASIAGAPのGFSI承認の対象として示されているものはどれか。","choices":["青果物、穀物、茶","青果物・水産養殖の一部","青果物のみ","穀物と茶のみ"],"answer":0,"explanation":"表ではASIAGAPのGFSI承認は「青果物、穀物、茶」です。「青果物・水産養殖の一部」はGLOBALG.A.P.の欄で、JGAPは「ー」となっています。","evidence":["青果物、穀物、茶","青果物・水産養殖の一部※３"],"source":{"memo_id":"04-40","page":40,"print_page":88,"title":"GAP（農業生産工程管理）と国際水準GAP"}},{"id":"04-40-a2","memo_id":"04-40","genre_id":"04","level":"advanced","question":"注記によると、GLOBALG.A.P.の穀物と茶についてGFSI規格との同等性確認が行われていない理由はどれか。","choices":["市場からの要請が少ないため","国内の認証取得者がいないため","2028年に規格が終了するため","運営主体がドイツにあるため"],"answer":0,"explanation":"注記では、穀物と茶は市場からの要請が少ないため同等性確認が行われていないとしています。2028年に終了するのはASIAGAPで、運営主体がドイツであることは理由として書かれていません。","evidence":["穀物と茶については、市場からの要請が","少ないため同等性確認は行われていない。"],"source":{"memo_id":"04-40","page":40,"print_page":88,"title":"GAP（農業生産工程管理）と国際水準GAP"}},{"id":"04-41-b1","memo_id":"04-41","genre_id":"04","level":"beginner","question":"平成30年8月にアジアで初めてアフリカ豚熱が発生した国はどこですか。","choices":["中国","日本","韓国","ベトナム"],"answer":0,"explanation":"アフリカ豚熱は平成30年8月に中国でアジア初の発生があり、その後アジアで感染が拡大しました。日本は東アジアで唯一の未発生国とされており、誤りです。","evidence":["アフリカ豚熱については、平成30年８月、中国での発生以降、アジアでも感染が拡大。"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-41-b2","memo_id":"04-41","genre_id":"04","level":"beginner","question":"九州で豚熱の感染が拡大しているとされているのは、何での感染ですか。","choices":["野生イノシシ","飼養豚","野生のシカ","飼養牛"],"answer":0,"explanation":"メモでは、九州では野生イノシシでの感染が拡大しているとされています。飼養豚の令和8年の発生は群馬県・静岡県・宮崎県での事例として別に記載されており、九州での拡大の対象は野生イノシシです。","evidence":["九州では、野生イノシシでの感染が拡大。"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-41-i1","memo_id":"04-41","genre_id":"04","level":"intermediate","question":"飼養豚での豚熱は、平成30年9月の発生以来、令和8年6月までに何都県・何事例の発生が確認されていますか。","choices":["26都県・105事例","46都府県・105事例","26都県・30事例","30都県・26事例"],"answer":0,"explanation":"令和8年6月までに26都県・105事例の発生が確認されています。46都府県はワクチン接種を開始した地域の数で、発生した都県の数ではありません。","evidence":["でに26都県・105事例の発生を確認。"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-41-i2","memo_id":"04-41","genre_id":"04","level":"intermediate","question":"令和元年10月に豚熱ワクチン接種を開始した際、接種の対象から除かれた都道府県はどこですか。","choices":["北海道","沖縄県","鹿児島県","宮崎県"],"answer":0,"explanation":"豚熱ワクチン接種は北海道を除く46都府県で開始されました。鹿児島県や宮崎県は豚熱の発生事例として記載されている県で、接種対象から除かれた地域ではありません。","evidence":["○令和元年10月に豚熱ワクチン接種を開始（北海道を除く46都府"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-41-a1","memo_id":"04-41","genre_id":"04","level":"advanced","question":"豚熱とアフリカ豚熱の特徴について、誤っているものはどれですか。","choices":["豚熱には有効なワクチンが存在する","アフリカ豚熱はダニによっても媒介される","アフリカ豚熱には有効なワクチンが存在する","豚熱は豚・イノシシが宿主で人に感染しない"],"answer":2,"explanation":"アフリカ豚熱には有効なワクチンは存在しないとされており、この選択肢が誤りです。有効なワクチンが存在するのは豚熱の方で、両者を取り違えないことが大切です。","evidence":["（有効なワクチンは存在しない）","（有効なワクチンが存在）"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-41-a2","memo_id":"04-41","genre_id":"04","level":"advanced","question":"令和8年（5月末時点）の飼養豚での豚熱の発生は、群馬県・静岡県・宮崎県を合わせて何例ですか。","choices":["3例","4例","5例","6例"],"answer":2,"explanation":"群馬県で1例、静岡県で3例、宮崎県で1例のため、合計は5例です。3例は静岡県1県だけの数であり、合計ではありません。","evidence":["令和８年は、群馬県で１例、静岡県","で3例、宮崎県で1例発生（５月末時"],"source":{"memo_id":"04-41","page":41,"print_page":89,"title":"豚熱・アフリカ豚熱の発生状況と対策"}},{"id":"04-42-b1","memo_id":"04-42","genre_id":"04","level":"beginner","question":"令和7年シーズンに、全国の家きんで高病原性鳥インフルエンザが発生した道県数と事例数はどれか。","choices":["16道県24例","26道県84例","24道県16例","16道県84例"],"answer":0,"explanation":"令和7年シーズンは家きんで16道県24例の発生でした。26道県84事例は過去最多だった令和4年シーズンの数字です。","evidence":["令和７年シーズンは家きんにおいて16道県24"],"source":{"memo_id":"04-42","page":42,"print_page":90,"title":"高病原性鳥インフルエンザの発生状況と対策"}},{"id":"04-42-b2","memo_id":"04-42","genre_id":"04","level":"beginner","question":"高病原性鳥インフルエンザについて、農場等における更なる発生予防対策は何に基づいて行うとされているか。","choices":["疫学調査等で得られた知見","海外の輸出入統計の分析","生産者の意向調査の結果","飼料価格の動向の分析"],"answer":0,"explanation":"メモでは、疫学調査等で得られた知見に基づき更なる発生予防対策を行うとしています。統計分析や意向調査、飼料価格に基づくとの記述はありません。","evidence":["疫学調査等で得られた知見に基づき、農場等における更なる発生予防対策"],"source":{"memo_id":"04-42","page":42,"print_page":90,"title":"高病原性鳥インフルエンザの発生状況と対策"}},{"id":"04-42-i1","memo_id":"04-42","genre_id":"04","level":"intermediate","question":"高病原性鳥インフルエンザが国内へ持ち込まれる主な経路と、発生しやすい時期の組合せとして正しいものはどれか。","choices":["渡り鳥により持ち込まれ、冬季に発生","渡り鳥により持ち込まれ、夏季に発生","輸入家きんにより持ち込まれ、冬季に発生","輸入飼料により持ち込まれ、夏季に発生"],"answer":0,"explanation":"メモでは、渡り鳥により国内へ持ち込まれることが多く、冬季に発生しやすいとされています。夏季や輸入家きん・輸入飼料による持ち込みとは書かれていません。","evidence":["渡り鳥により国内へ持ち込まれることが多く、冬季に発生しやすい。"],"source":{"memo_id":"04-42","page":42,"print_page":90,"title":"高病原性鳥インフルエンザの発生状況と対策"}},{"id":"04-42-i2","memo_id":"04-42","genre_id":"04","level":"intermediate","question":"高病原性鳥インフルエンザ対策で推進する「分割管理」の説明として正しいものはどれか。","choices":["動線を見直し複数の衛生管理区域を設定して農場を分ける取組","養鶏集中地域を指定し地域ぐるみで野鳥対策を行う取組","大規模農家で塵埃対策を行い防疫措置の時間を短くする取組","防疫措置に民間事業者を活用し事業者をリスト化する取組"],"answer":0,"explanation":"分割管理は、人や車両等の動線を見直し、複数の衛生管理区域を設定して農場を分ける取組です。他の選択肢は飼養衛生管理の強化や防疫措置の見直しとして記載された別の対策です。","evidence":["分割管理：人や車両等の動線を見直し、複数の衛生管理"],"source":{"memo_id":"04-42","page":42,"print_page":90,"title":"高病原性鳥インフルエンザの発生状況と対策"}},{"id":"04-42-a2","memo_id":"04-42","genre_id":"04","level":"advanced","question":"全国の家きんにおける高病原性鳥インフルエンザの殺処分対象羽数について、令和7年シーズンは過去最多の令和4年シーズンより約何万羽少ないか。","choices":["約1,195万羽","約1,771万羽","約576万羽","約2,347万羽"],"answer":0,"explanation":"令和4年シーズンは1,771万羽、令和7年シーズンは約576万羽なので、差は約1,195万羽です。1,771万羽と576万羽は各シーズンの羽数そのもの、約2,347万羽は両者の合計です。","evidence":["約576万羽が殺処分対象となった","1,771万羽が殺処分対象となった"],"source":{"memo_id":"04-42","page":42,"print_page":90,"title":"高病原性鳥インフルエンザの発生状況と対策"}},{"id":"04-43-b1","memo_id":"04-43","genre_id":"04","level":"beginner","question":"口蹄疫について、日本が清浄国（ワクチン非接種）に復帰したのはいつですか。","choices":["平成23年２月","平成25年５月","平成22年７月","令和８年７月"],"answer":0,"explanation":"口蹄疫は平成23年2月に清浄国（ワクチン非接種）に復帰しました。平成25年5月はBSEの「無視できるBSEリスク」認定、令和8年7月は高病原性鳥インフルエンザの自己清浄化宣言の時期です。","evidence":["口蹄疫については平成23年２月に清浄国（ワクチン非接種）に復帰。"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-43-b2","memo_id":"04-43","genre_id":"04","level":"beginner","question":"このメモで推進するとされる「農場HACCP」の説明として正しいものはどれですか。","choices":["農場段階で危害要因をコントロールする手法","食品工場の出荷段階で製品を検査する手法","小売店の段階で食品の表示を点検する手法","輸入時の港湾段階で病原体を検疫する手法"],"answer":0,"explanation":"農場HACCPは、畜産農場の衛生管理を向上させるため、農場にHACCPの考え方を取り入れ、農場段階で危害要因をコントロールする手法です。工場・小売・港湾の段階ではなく、農場段階である点がポイントです。","evidence":["※農場HACCPとは、畜産農場における衛生管理を向上させるため、農場にHACCPの考え方を取り入れ、農場段階で危害要因を"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-43-i1","memo_id":"04-43","genre_id":"04","level":"intermediate","question":"H22年4～7月に宮崎県で発生した口蹄疫の事例数はいくつですか。","choices":["292事例","4事例","105事例","52事例"],"answer":0,"explanation":"H22年4～7月の宮崎県の口蹄疫は292事例（牛・豚等297,808頭）でした。4事例はH12年の口蹄疫、105事例は豚熱、52事例はR2年～R3年の鳥インフルエンザの事例数です。","evidence":["H22年４～７月 宮崎県（292事例、牛・豚等 297,808頭）"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-43-i2","memo_id":"04-43","genre_id":"04","level":"intermediate","question":"H30年9月以降の豚熱の発生事例数は、R7年7月22日時点でいくつですか。","choices":["26都県105事例","18県52事例","26県84事例","14道県51事例"],"answer":0,"explanation":"豚熱はR7年7月22日時点で26都県105事例、約44.9万頭です。26県84事例はR4年～R5年、18県52事例はR2年～R3年、14道県51事例はR6年～R7年の鳥インフルエンザの数値です。","evidence":["H30年９月～（R７年７月22日時点、26都県105事例、約44.9万"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-43-a1","memo_id":"04-43","genre_id":"04","level":"advanced","question":"BSEについてこのメモの記述として誤っているものはどれですか。","choices":["H13年９月～H21年１月に36頭が発生した","H14年２月以降に日本で生まれた牛での発生はない","認定条件に過去５年以内に自国内で生まれた牛で発生なしがある","認定条件に８年以上の有効な飼料規制がある"],"answer":2,"explanation":"「無視できるBSEリスク」の国の条件は「過去11年以内に自国内で生まれた牛で発生なし」であり、5年以内ではありません。36頭の発生、H14年2月以降生まれの牛での発生なし、8年以上の有効な飼料規制はいずれもメモの記載どおりです。","evidence":["②過去11年以内に自国内で生まれた牛で発生なし"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-43-a2","memo_id":"04-43","genre_id":"04","level":"advanced","question":"R6年10月～R7年2月に発生した高病原性鳥インフルエンザの殺処分羽数（関連農場を含む）はどれですか。","choices":["約932万羽","約987万羽","約576万羽","約183万羽"],"answer":0,"explanation":"R6年10月～R7年2月はH5N1高病原性、14道県51事例、約932万羽です。約987万羽はR2年～R3年、約576万羽はR7年～R8年、約183万羽はH22年～H23年の数値です。","evidence":["H5N1高病原性、14道県51事例、約932万羽"],"source":{"memo_id":"04-43","page":43,"print_page":91,"title":"家畜伝染病の発生状況と清浄性・農場HACCP"}},{"id":"04-44-b1","memo_id":"04-44","genre_id":"04","level":"beginner","question":"令和6年11月に我が国で初めて発生し、今回の改正で家畜伝染病へ格上げされた疾病はどれか。","choices":["ランピースキン病","豚熱","高病原性鳥インフルエンザ","口蹄疫"],"answer":0,"explanation":"要点に、令和6年11月に我が国初となるランピースキン病が発生し、家畜伝染病へ格上げしたとあります。豚熱は殺処分方法の見直しやワクチン接種者確保の対象であり、格上げの対象ではありません。","evidence":["令和６年11月、我が国初となるランピースキン病が発生。同病を家畜伝染病へ格上げ。"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-44-b2","memo_id":"04-44","genre_id":"04","level":"beginner","question":"今回の家畜伝染病予防法改正で、豚熱発生農場での殺処分はどのように見直されたか。","choices":["全頭殺処分から選択的殺処分へ","選択的殺処分から全頭殺処分へ","殺処分を廃止し移動制限のみへ","殺処分を廃止し予防検査のみへ"],"answer":0,"explanation":"リアルタイムPCRで得た知見を踏まえ、全頭殺処分から選択的殺処分に見直されました。逆方向の見直しや殺処分の廃止ではなく、子豚や症状があり検査陽性となった豚を殺処分とする方法です。","evidence":["全頭殺処分から選択的殺処分に","子豚や症状があり検査陽性となった豚を殺処分とする方法に変更"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-44-i1","memo_id":"04-44","genre_id":"04","level":"intermediate","question":"改正法で、豚熱ワクチン接種後の確認検査を都道府県から大学や民間検査機関に委託した場合、国が負担する委託費の割合はどれか。","choices":["委託費の1/4","委託費の1/3","委託費の1/2","委託費の全額"],"answer":2,"explanation":"確認検査を大学や民間検査機関に委託した場合、委託費の1/2を国が負担するとされています。1/4・1/3や全額という記載はありません。","evidence":["大学や民間検査機関に委託した場合、委託費の1/2を国が負担"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-44-i2","memo_id":"04-44","genre_id":"04","level":"intermediate","question":"今回改正された家畜伝染病予防法の、原則としての施行期日はいつか。","choices":["令和8年5月19日","令和8年7月1日","令和9年5月1日","令和6年11月1日"],"answer":1,"explanation":"施行期日は原則として令和8年7月1日です。令和8年5月19日は公布日で一部規定の施行日、令和9年5月1日はワクチン接種特例の施行日であり、原則の施行期日ではありません。","evidence":["令和８年7月１日","※ただし、２（１）、（２）②は改正法の公布の日（令和８年５月19日）。"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-44-a1","memo_id":"04-44","genre_id":"04","level":"advanced","question":"令和8年公布の家畜伝染病予防法改正の内容として、誤っているものはどれか。","choices":["ランピースキン病を届出伝染病から家畜伝染病へ格上げした","家畜防疫官に外国食材店等への立入検査の権限等を付与した","研修を受けた飼養衛生管理者も豚熱ワクチン接種を可能にした","届出伝染病のままでも殺処分や移動制限を義務付けていた"],"answer":3,"explanation":"届出伝染病については予防検査のみ可能と注記されており、殺処分や移動制限の義務付けは家畜伝染病へ格上げしたことで可能になったものです。他の3つはメモの記載どおりです。","evidence":["（注：届出伝染病については予防検査のみ","届出伝染病から家畜伝染病へ格上げし、緊急"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-44-a2","memo_id":"04-44","genre_id":"04","level":"advanced","question":"改正法のうち、豚熱の選択的殺処分（2(1)）と、飼養衛生管理者による豚熱ワクチン接種の特例（2(2)①）の施行日の組み合わせとして正しいものはどれか。","choices":["殺処分：令和8年5月19日／特例：令和9年5月1日","殺処分：令和8年7月1日／特例：令和9年5月1日","殺処分：令和8年5月19日／特例：令和8年7月1日","殺処分：令和9年5月1日／特例：令和8年5月19日"],"answer":0,"explanation":"2(1)の選択的殺処分は公布の日（令和8年5月19日）から、2(2)①のワクチン接種特例は令和9年5月1日から施行されます。令和8年7月1日は原則の施行期日で、どちらにも当たりません。","evidence":["※ただし、２（１）、（２）②は改正法の公布の日（令和８年５月19日）。","２（２）①は令和９年５月１日。"],"source":{"memo_id":"04-44","page":44,"print_page":92,"title":"家畜伝染病予防法の改正（令和8年）"}},{"id":"04-45-b1","memo_id":"04-45","genre_id":"04","level":"beginner","question":"改正食料・農業・農村基本法で、国内生産では需要を満たすことができない農産物として例示されている品目はどれか。","choices":["小麦・大豆・とうもろこし","米・小麦・大豆","野菜・果実・牛乳","米・とうもろこし・砂糖"],"answer":0,"explanation":"メモの要点では、国内生産では需要を満たせない農産物として小麦・大豆・とうもろこしが例示されています。米や野菜・果実などはこの例示に含まれていません。","evidence":["国内生産では需要を満たすことができない農産物（小麦・大豆・とうもろこし）等"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"04-45-b2","memo_id":"04-45","genre_id":"04","level":"beginner","question":"改正基本法の規定に基づき、調達先の多様化を図りつつ推進する施策として、メモに挙げられているものはどれか。","choices":["輸入相手国との政府間対話の枠組みの整備","輸入農産物にかかる関税の一律引下げ","国内に新たな穀物備蓄倉庫を建設","輸入品目を国内生産に全て切替え"],"answer":0,"explanation":"メモでは①調達網への投資の促進、②政府間対話の枠組みの整備、③官民の情報共有の強化の3つを推進するとしています。関税引下げや備蓄倉庫の建設、国内生産への切替えは挙げられていません。","evidence":["②輸入相手国との政府間対話の枠組みの整備、③国内における官民の情報共有の強化、を推進していく。"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"04-45-i1","memo_id":"04-45","genre_id":"04","level":"intermediate","question":"日本貿易会会員企業と農林水産省の間で「食料の安定的な輸入の確保に関する協議会合」を初開催した時期はいつか。","choices":["2024年6月","2024年10月","2025年6月","2025年9月"],"answer":0,"explanation":"協議会合の初開催は2024年6月です。2024年10月（令和6年10月）は「連絡会」の立上げ、2025年6月はサンタ・カタリーナ州との署名、2025年9月は南アフリカとのバイ会談の時期です。","evidence":["2024年６月、（一社）日本貿易会会員企業と当省との間で、「食料の安定的な輸入の確保に関する協議会合」を初開催。"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"04-45-i2","memo_id":"04-45","genre_id":"04","level":"intermediate","question":"2025年9月、G20農業大臣会合にあわせてバイ会談を開催し、農業分野の協力における意向表明書に署名した相手はどれか。","choices":["南アフリカ共和国","サンタ・カタリーナ州","（一社）日本貿易会","日本貿易会会員各社"],"answer":0,"explanation":"G20農業大臣会合にあわせたバイ会談と意向表明書の署名は南アフリカ共和国が相手です。サンタ・カタリーナ州（ブラジル）との署名は2025年6月で、日本貿易会は国内の官民の情報共有の相手です。","evidence":["2025年９月、G20農業大臣会合にあわせて、バイ会談を開催。","南アフリカ共和国"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"04-45-a1","memo_id":"04-45","genre_id":"04","level":"advanced","question":"輸入相手国における調達網への投資促進の取組の説明として、誤っているものはどれか。","choices":["投資案件の形成では、事業性判断の調査を予算で支援する","投資の促進では、JBICの出融資やNEXIの融資保険等を活用する","現地インフラの整備では、港湾や鉄道・道路等を対象とする","現地インフラの整備は、民間金融機関の融資だけで支援する"],"answer":3,"explanation":"現地インフラの整備は「我が国のODA等の活用による支援」とされており、民間金融機関の融資だけで支援するという記述は誤りです。民間金融機関からの融資は②投資の促進の資金供給の一つとして挙げられています。","evidence":["我が国のODA等の活用による支援","輸入相手国の公共輸送インフラ"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"04-45-a2","memo_id":"04-45","genre_id":"04","level":"advanced","question":"国内における官民の情報共有の強化のうち、「連絡会」の説明として正しいものはどれか。","choices":["協議会合を実務的にフォローアップするため令和6年10月に立上げた","協議会合に先立つ準備の場として2024年6月に立上げた","南アフリカ共和国との政府間対話の場として立上げた","サンタ・カタリーナ州との署名を受けて2025年6月に立上げた"],"answer":0,"explanation":"「連絡会」は協議会合を実務的にフォローアップするため、令和6年10月に日本貿易会会員各社との間で立ち上げられました。2024年6月は協議会合の初開催の時期で、南アフリカやサンタ・カタリーナ州は政府間対話の相手です。","evidence":["「食料の安定的な輸入の確保に関する協議会合」を実務的にフォローアップするため","令和６年10月に、日本貿易会会員各社との間の「連絡会」を立上げ、継続的に開催。"],"source":{"memo_id":"04-45","page":45,"print_page":93,"title":"主要穀物等の安定的な輸入の確保に向けた取組"}},{"id":"05-01-b1","memo_id":"05-01","genre_id":"05","level":"beginner","question":"このメモで、輸出拡大・海外展開・インバウンドの相乗効果を通じて強化するとされている力はどれか。","choices":["「海外から稼ぐ力」","「地域で支える力」","「国内で売る力」","「価格を決める力」"],"answer":0,"explanation":"要点に、相乗効果を通じて農林水産業・食品産業の「海外から稼ぐ力」を強化すると書かれています。ほかの選択肢はメモに出てこない言葉です。","evidence":["これらの相乗効果を通じて、農林水産業・食品産業の「海外から稼ぐ力」を強化。"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-01-b2","memo_id":"05-01","genre_id":"05","level":"beginner","question":"このメモで、農林水産物・食品の輸出拡大と連携して推進するとされている取組の組合せはどれか。","choices":["食品産業の海外展開とインバウンドによる食関連消費の拡大","食品産業の国内回帰と輸入農産物の消費拡大","農地の集積・集約と担い手の確保","スマート農業の推進と環境負荷の低減"],"answer":0,"explanation":"要点では、輸出拡大を加速すると共に、食品産業の海外展開とインバウンドによる食関連消費の拡大を連携して推進するとしています。ほかの組合せはこのメモには書かれていません。","evidence":["農林水産物・食品の輸出拡大を加速すると共に、食品産業の海外展開、インバウンドに","よる食関連消費の拡大を連携して推進。"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-01-i1","memo_id":"05-01","genre_id":"05","level":"intermediate","question":"このメモで、食品産業の海外展開による収益額の2030年の目標はいくらか。","choices":["3兆円","5兆円","4.5兆円","1.7兆円"],"answer":0,"explanation":"食品産業の海外展開による収益額の目標は2030年に3兆円です。5兆円は輸出額の目標、4.5兆円はインバウンドによる食関連消費額の目標、1.7兆円は収益額の現状（2023年）です。","evidence":["食品産業の海外展開による収益額","→【目標】３兆円（2030年）"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-01-i2","memo_id":"05-01","genre_id":"05","level":"intermediate","question":"このメモで、2025年の現状として示されているインバウンドによる食関連消費額はいくらか。","choices":["2.7兆円","1.7兆円","4.5兆円","3.3兆円"],"answer":0,"explanation":"インバウンドによる食関連消費額の現状は2.7兆円（2025年）です。4.5兆円は2030年の目標、1.7兆円は輸出額や海外展開の収益額の現状の値です。","evidence":["インバウンドによる食関連消費額","【現状】2.7兆円（2025年）"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-01-a1","memo_id":"05-01","genre_id":"05","level":"advanced","question":"このメモで、農林水産物・食品の輸出額について、2030年の目標と2025年の現状の差はいくらか。","choices":["3.3兆円","1.8兆円","1.3兆円","2.7兆円"],"answer":0,"explanation":"輸出額は現状1.7兆円（2025年）、目標5兆円（2030年）なので、差は3.3兆円です。1.8兆円はインバウンドによる食関連消費額の差、1.3兆円は海外展開による収益額の差です。","evidence":["農林水産物・食品の輸出額","【現状】1.7兆円（2025年）→【目標】５兆円（2030年）"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-01-a2","memo_id":"05-01","genre_id":"05","level":"advanced","question":"このメモの内容について、誤っているものはどれか。","choices":["インバウンドによる食関連消費額の2030年目標は4.5兆円である","食品産業の海外展開による収益額の現状は2025年の値である","現地の日本食レストラン等での食体験が訪日意欲を喚起する","ECサイト・現地スーパー等での食体験が訪日意欲を喚起する"],"answer":1,"explanation":"食品産業の海外展開による収益額の現状1.7兆円は2023年の値で、2025年ではありません。2025年が現状の年となっているのは、輸出額とインバウンドによる食関連消費額です。","evidence":["【現状】1.7兆円（2023年）"],"source":{"memo_id":"05-01","page":1,"print_page":94,"title":"輸出・海外展開・インバウンドの連携推進"}},{"id":"05-02-b1","memo_id":"05-02","genre_id":"05","level":"beginner","question":"農林水産物・食品の輸出額について、2030年に目指している目標額はいくらか。","choices":["3兆円","5兆円","1兆7,005億円","10兆円"],"answer":1,"explanation":"メモでは輸出額を2030年に5兆円とすることを目指すとしています。1兆7,005億円は2025年の実績であり、目標額ではありません。","evidence":["農林水産物・食品の輸出額を2030年に５兆円とすることを目指す。"],"source":{"memo_id":"05-02","page":2,"print_page":95,"title":"農林水産物・食品の輸出額と輸出先（2025年）"}},{"id":"05-02-b2","memo_id":"05-02","genre_id":"05","level":"beginner","question":"2025年の米国向け農林水産物・食品の輸出額が増加した要因として、メモに挙げられているものはどれか。","choices":["緑茶や牛肉の需要増加","ホタテや真珠の需要増加","日本酒や米の需要増加","りんごや木材の需要増加"],"answer":0,"explanation":"米国向けは緑茶や牛肉の需要増加により対前年比13.7％増加したとされています。ほかの品目の組合せは米国向け増加の要因としてメモに書かれていません。","evidence":["米国向けについては、緑茶や牛肉の需","要増加により対前年比13.7％の増加を記録。"],"source":{"memo_id":"05-02","page":2,"print_page":95,"title":"農林水産物・食品の輸出額と輸出先（2025年）"}},{"id":"05-02-i1","memo_id":"05-02","genre_id":"05","level":"intermediate","question":"2025年（1-12月累計）の輸出先上位10か国・地域のうち、輸出額の前年比の伸び率が最も大きいのはどこか。","choices":["韓国","タイ","ロシア","オーストラリア"],"answer":2,"explanation":"ロシアは前年比+439.3％で、上位10か国・地域の中で最も大きい伸び率です。韓国は+20.0％、タイは+17.1％、オーストラリアは+16.6％にとどまります。","evidence":["ロシア 414 2.6 +439.3","+20.0"],"source":{"memo_id":"05-02","page":2,"print_page":95,"title":"農林水産物・食品の輸出額と輸出先（2025年）"}},{"id":"05-02-a1","memo_id":"05-02","genre_id":"05","level":"advanced","question":"2025年（1-12月累計）の輸出額上位4か国・地域（米国・香港・台湾・中国）のうち、輸出額の前年比の伸び率が最も高いのはどこか。","choices":["米国","香港","台湾","中国"],"answer":0,"explanation":"上位4か国・地域の前年比は米国+13.7％、香港+0.8％、台湾+6.4％、中国+7.0％で、米国が最も高くなっています。輸出額2位の香港は伸び率では最も低い点に注意が必要です。","evidence":["+13.7 1,847","+0.8 1,354","+7.0 1,387"],"source":{"memo_id":"05-02","page":2,"print_page":95,"title":"農林水産物・食品の輸出額と輸出先（2025年）"}},{"id":"05-03-b1","memo_id":"05-03","genre_id":"05","level":"beginner","question":"2025年の輸出実績で、過去最高を記録した輸出重点品目等に含まれるものはどれか。","choices":["りんご","ぶどう","錦鯉","もも"],"answer":2,"explanation":"要点で過去最高を記録した13品目等の一つとして錦鯉が挙げられています。りんご・ぶどう・ももは要点に含まれず、表でも前年比が減少しています。","evidence":["錦鯉の13の輸出重点品目等で過去最高を記","品目別では、牛肉、豚肉、いちご、米・パックご飯等、茶、清涼飲料水、菓子、ソース混"],"source":{"memo_id":"05-03","page":3,"print_page":96,"title":"2025年の主な品目の輸出実績"}},{"id":"05-03-i1","memo_id":"05-03","genre_id":"05","level":"intermediate","question":"2025年の水産物（調製品を除く）の輸出額（百万円）で、次のうち最も大きい品目はどれか。","choices":["ぶり","ホタテ貝","真珠（天然・養殖）","かつお・まぐろ類"],"answer":1,"explanation":"ホタテ貝は90,587百万円で、ぶり52,775百万円、真珠41,167百万円、かつお・まぐろ類21,537百万円を上回ります。ぶりは前年比の伸びが大きいものの、金額ではホタテ貝に及びません。","evidence":["ぶり たい ホタテ貝 牡蠣 真珠（天然・養殖）","52,775 8,024 90,587 4,242 41,167"],"source":{"memo_id":"05-03","page":3,"print_page":96,"title":"2025年の主な品目の輸出実績"}},{"id":"05-03-i2","memo_id":"05-03","genre_id":"05","level":"intermediate","question":"2025年の輸出額が前年比で減少した品目は、次のうちどれか。","choices":["牛肉","緑茶","ぶり","りんご"],"answer":3,"explanation":"りんごは前年比▲28.6%で減少しました。牛肉は+12.8%、緑茶は+98.2%、ぶりは+27.4%といずれも増加しています。","evidence":["▲ 2.9 ▲ 28.6 ▲ 21.3","+9.2 +12.8 +25.3"],"source":{"memo_id":"05-03","page":3,"print_page":96,"title":"2025年の主な品目の輸出実績"}},{"id":"05-03-a1","memo_id":"05-03","genre_id":"05","level":"advanced","question":"2025年の主な品目の輸出実績について、誤っているものはどれか。","choices":["牛肉の輸出額は73,105百万円で前年比+12.8%","緑茶の輸出額は72,094百万円で前年比+98.2%","たまねぎの輸出額は前年比▲62.3%と減少した","ホタテ貝加工品の輸出額は前年比+33.2%と増加"],"answer":3,"explanation":"ホタテ貝加工品は前年比▲33.2%で、増加ではなく減少です。牛肉・緑茶・たまねぎの記述は表の数値どおりです。","evidence":["▲ 24.8 +4.4 ▲ 33.2 ▲ 8.9"],"source":{"memo_id":"05-03","page":3,"print_page":96,"title":"2025年の主な品目の輸出実績"}},{"id":"05-03-a2","memo_id":"05-03","genre_id":"05","level":"advanced","question":"2025年の農林水産物・食品全体の輸出額の前年比（％）はどれか。","choices":["+12.1%","+17.2%","+13.4%","+10.1%"],"answer":2,"explanation":"農林水産物・食品全体は前年比+13.4%です。+12.1%は農産物計、+17.2%は水産物計、+10.1%は林産物計の値です。","evidence":["+17.2 +13.4","+12.1 +10.1 +38.4"],"source":{"memo_id":"05-03","page":3,"print_page":96,"title":"2025年の主な品目の輸出実績"}},{"id":"05-04-b1","memo_id":"05-04","genre_id":"05","level":"beginner","question":"一口メモによると、輸出重点品目に選定されている品目数はいくつですか。","choices":["21品目","27品目","31品目","35品目"],"answer":2,"explanation":"要点に、31品目を輸出重点品目に選定したと書かれています。21・27・35品目という記載はありません。","evidence":["輸出促進活動が効果的な31品目を輸出重点品目に選定。"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-04-b2","memo_id":"05-04","genre_id":"05","level":"beginner","question":"一口メモの要点で、輸出重点品目を選定するときの考え方として挙げられているものはどれですか。","choices":["輸出拡大余地が大きいこと","国内の生産量が最も多いこと","輸入額が年々増えていること","国内の価格が安定していること"],"answer":0,"explanation":"要点は、日本の強みを持つこと、輸出拡大余地が大きいこと、関係者一体の輸出促進活動が効果的なことを挙げています。国内の生産量、輸入額、国内の価格は選定の考え方として書かれていません。","evidence":["海外で評価される日本の強みを有し、輸出拡大余地が大きく、関係者が一体となった"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-04-i1","memo_id":"05-04","genre_id":"05","level":"intermediate","question":"一口メモの表で、「水産物では輸出額ナンバーワン」と書かれている輸出重点品目はどれですか。","choices":["ぶり","たい","ホタテ貝・ホタテ貝加工品","牡蠣・牡蠣加工品"],"answer":2,"explanation":"ホタテ貝の欄に、世界で高く評価され、水産物では輸出額ナンバーワンとあります。ぶりは米国等への輸出額の増加、牡蠣は欧米などへの販路拡大への期待が書かれた品目です。","evidence":["高品質な日本産ホタテ貝は世界で高く評価。","水産物では輸出額ナンバーワン"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-04-i2","memo_id":"05-04","genre_id":"05","level":"intermediate","question":"一口メモの表で、牛乳乳製品の品質が高く評価されている地域として書かれているのはどこですか。","choices":["米国や欧州","香港や台湾","中東や豪州","中国や韓国"],"answer":1,"explanation":"牛乳乳製品の欄には、香港や台湾で品質が高評価とあります。米国や欧州などの地域は、牛乳乳製品の欄には書かれていません。","evidence":["香港や台湾で品質が高評価。アジアを中心に輸出に期待。"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-04-a1","memo_id":"05-04","genre_id":"05","level":"advanced","question":"一口メモの表に書かれた、輸出重点品目の「海外で評価される日本の強み」について、誤っているものはどれですか。","choices":["真珠は、養殖が日本発祥で技術が国際的に高評価","切り花は、外国にはない品種に強みがある","ウイスキーは、原料の特徴を残す蒸留酒として評価","錦鯉は、アジア、欧州を中心に海外で人気"],"answer":2,"explanation":"原料の特徴を残すユニークな蒸留酒として評価されているのは、本格焼酎・泡盛です。ウイスキーの強みは、日本産品の品質が世界中でブランドとして定着していることです。","evidence":["原料の特徴を残すユニークな蒸留酒としての評価があり、今後の輸出拡大","日本産品の品質が世界中でブランドとして定着。"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-04-a2","memo_id":"05-04","genre_id":"05","level":"advanced","question":"一口メモの表で、日本式木造建築とあわせて今後の輸出の伸びが期待されている品目の組み合わせはどれですか。","choices":["製材と合板","製材と真珠","合板と錦鯉","茶と切り花"],"answer":0,"explanation":"製材の欄にはスギやヒノキが日本式木造建築だけでなく香りでも人気とあり、合板の欄にも日本式木造建築とともに輸出の伸びに期待とあります。真珠・錦鯉・茶・切り花の欄には、日本式木造建築の記載はありません。","evidence":["スギやヒノキは、日本式木造建築だけでなく香りの癒しの効果も人気で、今","合板の加工・利用技術は、日本の得意分野。日本式木造建築とともに、"],"source":{"memo_id":"05-04","page":4,"print_page":97,"title":"輸出重点品目（31品目）と日本の強み"}},{"id":"05-05-b1","memo_id":"05-05","genre_id":"05","level":"beginner","question":"メモで、輸出産地の支援に関して示されている「GFP」の正式な名称はどれか。","choices":["農林水産物・食品輸出プロジェクト","農林水産物・食品輸出プラットフォーム","グローバル・フード・パートナーシップ","農林水産物・食品輸出促進協議会"],"answer":0,"explanation":"メモではGFPを「農林水産物・食品輸出プロジェクト」と示しています。「プラットフォーム」は海外拠点の輸出支援プラットフォームの名称で、GFPとは別の取組です。","evidence":["GFP（農林水産物・食品輸出プロジェクト）登録者数は"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-05-b2","memo_id":"05-05","genre_id":"05","level":"beginner","question":"メモで、オールジャパンによる輸出促進を展開する際に「中核」とされているものはどれか。","choices":["品目団体","輸出支援プラットフォーム","フラッグシップ輸出産地","GFPコミュニティサイト"],"answer":0,"explanation":"メモでは品目団体を中核としてオールジャパンの輸出促進を展開するとしています。輸出支援プラットフォームは海外で輸出事業者等を支援する仕組みで、中核とは書かれていません。","evidence":["・品目団体を中核とし、オールジャパンによる輸出促進を展開。"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-05-i1","memo_id":"05-05","genre_id":"05","level":"intermediate","question":"R8年5月までに認定された品目団体の品目数と団体数として正しいものはどれか。","choices":["29品目16団体","16品目29団体","29品目10団体","16品目10団体"],"answer":0,"explanation":"メモではR8年5月までに29品目16団体を認定したとしています。10という数字は輸出支援プラットフォームの設置国・地域数で、品目団体の数ではありません。","evidence":["・R８年５月までに29品目16団体を認定。"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-05-i2","memo_id":"05-05","genre_id":"05","level":"intermediate","question":"R7年度末時点のGFP（農林水産物・食品輸出プロジェクト）の登録者数として正しいものはどれか。","choices":["11,000以上","1,100以上","10,800以上","16,000以上"],"answer":0,"explanation":"メモではGFP登録者数はR7年度末時点で11,000以上としています。1,100や10,800、16,000はメモに示された登録者数と一致しません。","evidence":["11,000以上。（R7年度末時点）"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-05-a1","memo_id":"05-05","genre_id":"05","level":"advanced","question":"R8年8月時点で原発事故に伴う輸入規制が残る5か国・地域のうち、ALPS処理水の海洋放出に伴い更に日本産水産物等を停止したとメモに書かれている組合せはどれか。","choices":["ロシア・香港・マカオ","中国・香港・韓国","韓国・ロシア・マカオ","中国・韓国・ロシア"],"answer":0,"explanation":"メモでは規制が残る5か国・地域は中国、香港、マカオ、韓国、ロシアで、そのうちロシア、香港、マカオが更に水産物等を停止したとしています。中国や韓国を含む組合せは、メモの記述と一致しません。","evidence":["地域の数は、事故後の55から現在５（中国、香港、マカ","ロシア、香港、マカオについては、ALPS処理水の海洋放出"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-05-a2","memo_id":"05-05","genre_id":"05","level":"advanced","question":"メモに示された輸出促進の取組について、誤っているものはどれか。","choices":["輸出支援プラットフォームはR8年5月までに16か国・地域で立ち上げた","輸入規制を措置した国・地域の数は事故後の55から5に減少した","フラッグシップ輸出産地はR7年12月末時点で108産地を認定した","日本ほたて貝輸出振興協会はホタテ貝を対象とする認定団体である"],"answer":0,"explanation":"輸出支援プラットフォームは10か国・地域（16拠点）での立ち上げで、16は拠点の数です。ほかの3つはメモの記述どおりです。","evidence":["・R８年５月までに10か国・地域（16拠点）で立ち上げ。"],"source":{"memo_id":"05-05","page":5,"print_page":98,"title":"輸出促進法等に基づく政府一体の輸出取組"}},{"id":"05-06-b1","memo_id":"05-06","genre_id":"05","level":"beginner","question":"食品産業の海外展開支援で、農林水産物・食品の輸出に寄与するとして重点的に支援する業種はどれか。","choices":["食品製造業・外食産業","卸売業・小売業","物流業・倉庫業","木材製品製造業・林業"],"answer":0,"explanation":"要点に、輸出に寄与する食品製造業・外食産業を重点的に支援すると書かれています。卸売業・小売業や木材製品製造業は注記で収益額の集計対象として出てくるだけで、重点支援の対象ではありません。","evidence":["農林水産物・食品の輸出に寄与する食品製造業・外食産業を重点的に支援。"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-06-b2","memo_id":"05-06","genre_id":"05","level":"beginner","question":"食品事業者の海外展開支援を目的に、情報提供・ビジネスマッチングなどを行う官民の枠組みの名称はどれか。","choices":["グローバル・フードバリューチェーン推進官民協議会","輸出支援プラットフォーム推進官民協議会","官民ビジネス・ミッション推進協議会","食品産業海外展開投資可能性調査協議会"],"answer":0,"explanation":"要点に、グローバル・フードバリューチェーン推進官民協議会の枠組みの下で支援を行うと書かれています。輸出支援プラットフォームや官民ビジネス・ミッションは協議会の中の取組の名前で、枠組みの名称ではありません。","evidence":["「グローバル・フードバリューチェーン推進官民協議会」の枠組みの下で"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-06-i1","memo_id":"05-06","genre_id":"05","level":"intermediate","question":"2023年の食品産業の海外展開による収益額は、対前年比で何％増加したか。","choices":["8.7％","1.7％","7.8％","3.0％"],"answer":0,"explanation":"2023年の収益額は対前年比8.7％増加の1.7兆円です。1.7は収益額（兆円）の数字で、伸び率ではありません。","evidence":["8.7％増加の1.7兆円と過去最高。"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-06-i2","memo_id":"05-06","genre_id":"05","level":"intermediate","question":"2026年7月時点で、GFVC推進官民協議会に参加している民間企業の数はどれか。","choices":["921社","175社","1,096社","746社"],"answer":0,"explanation":"2026年7月時点で民間企業921社が参加しています。175社は関係機関・団体等の数で、民間企業の数ではありません。","evidence":["企業(921社)及び関係機関・団体等175社)が参加。"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-06-a1","memo_id":"05-06","genre_id":"05","level":"advanced","question":"食品産業の海外展開による収益額について、2030年目標と2023年実績の差はおよそいくらか。","choices":["約1.3兆円","約1.7兆円","約3.0兆円","約0.7兆円"],"answer":0,"explanation":"2030年目標は3兆円、2023年実績は1.7兆円なので、差は約1.3兆円です。1.7兆円は2023年の実績、3.0兆円は目標そのものです。","evidence":["2030年目標として食品産業の海外展開による収益額３兆円を設定。","8.7％増加の1.7兆円と過去最高。"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-06-a2","memo_id":"05-06","genre_id":"05","level":"advanced","question":"食品産業の海外展開支援と事例について、このメモの内容として誤っているものはどれか。","choices":["GFVC推進官民協議会は2014年6月に発足した","大戸屋ごはん処は2005年1月にタイへ進出した","FS支援事業は現地の物流・商流拠点づくりの調査を支援する","大戸屋ごはん処は海外店舗で現地産の米や魚を使っている"],"answer":3,"explanation":"大戸屋ごはん処は、海外の店舗でも日本と同じ味・品質を目指して日本産の米や魚、調味料を使っています。現地産ではないため、この選択肢が誤りです。協議会の発足時期、タイへの進出時期、FS支援事業の内容はメモのとおりです。","evidence":["日本産の米や魚、"],"source":{"memo_id":"05-06","page":6,"print_page":99,"title":"食品産業の海外展開支援と収益額の推移"}},{"id":"05-07-b1","memo_id":"05-07","genre_id":"05","level":"beginner","question":"新たな食料・農業・農村基本計画で設定された、2030年のインバウンド食関連消費額の目標はどれか。","choices":["2.7兆円","3.5兆円","4.5兆円","5.0兆円"],"answer":2,"explanation":"基本計画では2030年目標としてインバウンド食関連消費額4.5兆円が設定されています。2.7兆円は令和7年の実績（2兆7,367億円）に近い値で、目標ではありません。","evidence":["2030年目標としてインバウンド食関連消費額4.5兆円を設定。"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"05-07-b2","memo_id":"05-07","genre_id":"05","level":"beginner","question":"インバウンドによる食関連消費の拡大は、海外の日本食ファンを増やすことを通じて、何との相乗効果を発揮するとされているか。","choices":["輸出拡大","米の生産調整","農地の集積","飼料の自給"],"answer":0,"explanation":"メモでは、インバウンドの食関連消費の拡大により海外の日本食ファンを増やし、輸出拡大との相乗効果を発揮するとしています。ほかの選択肢はこのページに書かれていません。","evidence":["海外の日本食ファンを増やすことを通じて、輸出拡大との相乗効果を"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"05-07-i1","memo_id":"05-07","genre_id":"05","level":"intermediate","question":"2025年の訪日外国人（一般客）1人当たり旅行支出は、いくらと推計されているか。","choices":["8.4万円","15.9万円","22.9万円","27.4万円"],"answer":2,"explanation":"2025年の訪日外国人（一般客）1人当たり旅行支出は22.9万円と推計されています。8.4万円はそのうちの宿泊費の額で、旅行支出全体ではありません。","evidence":["旅行支出は22.9万円と推計される。"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"05-07-i2","memo_id":"05-07","genre_id":"05","level":"intermediate","question":"2025年の訪日外国人（一般客）1人当たり旅行支出を費目別にみたとき、宿泊費に次いで2番目に高い費目はどれか。","choices":["飲食費","買物代","交通費","娯楽等サービス費"],"answer":1,"explanation":"費目別では宿泊費8.4万円が最も高く、次いで買物代6.1万円、飲食費5.0万円の順です。飲食費は3番目なので、2番目ではありません。","evidence":["宿泊費が8.4万円と最も高く,","次いで買物代6.1万円、飲食費5.0万円の順で"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"05-07-a1","memo_id":"05-07","genre_id":"05","level":"advanced","question":"2030年のインバウンド食関連消費額の目標と、令和7年の実績との差は、およそいくらか。","choices":["約1.2兆円","約1.8兆円","約2.3兆円","約2.7兆円"],"answer":1,"explanation":"目標4.5兆円から令和7年の実績2兆7,367億円を引くと1兆7,633億円で、約1.8兆円です。約2.7兆円は実績そのものの額で、差ではありません。","evidence":["2030年目標としてインバウンド食関連消費額4.5兆円を設定。","２兆7,367億円で過去最高。"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"05-07-a2","memo_id":"05-07","genre_id":"05","level":"advanced","question":"令和7年（2025年）のインバウンドについての記述のうち、誤っているものはどれか。","choices":["食関連消費額は過去最高を記録した","訪日外国人旅行者数は過去最高に届かなかった","1人当たりの飲食費は5.0万円であった","1人当たりの宿泊費は8.4万円であった"],"answer":1,"explanation":"訪日外国人旅行者数は4,268万人で過去最高を記録しているため、「過去最高に届かなかった」は誤りです。食関連消費額の過去最高、飲食費5.0万円、宿泊費8.4万円はいずれもメモの記述と一致します。","evidence":["（訪日外国人旅行者数は4,268万人と過去最高を記録）"],"source":{"memo_id":"05-07","page":7,"print_page":100,"title":"インバウンドによる食関連消費額の推移"}},{"id":"06-01-b1","memo_id":"06-01","genre_id":"06","level":"beginner","question":"国際的な「食料安全保障」の考え方で、供給総量確保や不測時対応にとどまらず位置付けることが主流とされているものはどれか。","choices":["国民一人一人が健全な食生活を享受できること","食料輸入先を特定の国に集中させること","国内の農地面積を毎年拡大し続けること","食品の価格を全国で同一に固定すること"],"answer":0,"explanation":"メモでは、国際的には「国民一人一人が健全な食生活を享受できること」を位置付けることが主流とされています。輸入先の集中、農地の拡大、価格の固定はメモに書かれていません。","evidence":["○「食料安全保障」について、国際的には、食料の供給総量確保や不測時対応にとどまらず、「国民一","人一人が健全な食生活を享受できること」を位置付けることが主流。"],"source":{"memo_id":"06-01","page":1,"print_page":101,"title":"平時の食料安全保障と食品アクセス"}},{"id":"06-01-b2","memo_id":"06-01","genre_id":"06","level":"beginner","question":"2024年に改正された食料・農業・農村基本法で、国が物理的・経済的要因にかかわらず確保を図るとされたものはどれか。","choices":["円滑な食品アクセス","農産物の最低価格","全国一律の配送料","食品の長期備蓄量"],"answer":0,"explanation":"改正基本法では、物理的・経済的要因にかかわらず「円滑な食品アクセスの確保」が図られるよう、国が環境整備等を講ずると規定されています。最低価格や配送料、備蓄量はこの規定の対象として書かれていません。","evidence":["し、物理的・経済的要因にかかわらず、円滑な食品アクセスの確保が図られるよう、食料を円滑に提"],"source":{"memo_id":"06-01","page":1,"print_page":101,"title":"平時の食料安全保障と食品アクセス"}},{"id":"06-01-i1","memo_id":"06-01","genre_id":"06","level":"intermediate","question":"メモの注で、アクセス困難人口の条件とされている「スーパーマーケット等の食料品店舗までの距離」はどれか。","choices":["300m以上","500m以上","1km以上","2km以上"],"answer":1,"explanation":"注では、アクセス困難人口は食料品店舗まで500m以上かつ自動車利用が困難な65歳以上の高齢者とされています。300m・1km・2kmはメモの定義と異なります。","evidence":["注：アクセス困難人口とは、スーパーマーケット等の食料品店舗まで500m以上","かつ自動車利用が困難な65歳以上の高齢者を指す。"],"source":{"memo_id":"06-01","page":1,"print_page":101,"title":"平時の食料安全保障と食品アクセス"}},{"id":"06-01-a1","memo_id":"06-01","genre_id":"06","level":"advanced","question":"メモに示されたアクセス困難人口（参考）のうち、2015年の値はどれか。","choices":["678.8万人","733.2万人","824.6万人","904.3万人"],"answer":2,"explanation":"2015年のアクセス困難人口は824.6万人です。678.8万人は2005年、733.2万人は2010年、904.3万人は2020年の値です。","evidence":["2015年 824.6万人"],"source":{"memo_id":"06-01","page":1,"print_page":101,"title":"平時の食料安全保障と食品アクセス"}},{"id":"06-01-a2","memo_id":"06-01","genre_id":"06","level":"advanced","question":"メモの物理的アクセス・経済的アクセスの記述について、誤っているものはどれか。","choices":["買物困難者は過疎地域だけでなく都市部でも増えている","アクセス困難人口の2015年までと2020年は連続しない","アクセス困難人口は2005年から2015年にかけ減少した","低所得者等の割合が増加する中で記述が示されている"],"answer":2,"explanation":"アクセス困難人口は2005年の678.8万人から2015年の824.6万人へ増えており、減少は誤りです。都市部でも買物困難者が増えていること、算出方法の違いで2020年と連続しないこと、低所得者等の割合の増加はメモに記載があります。","evidence":["2005年 678.8万人","2015年 824.6万人"],"source":{"memo_id":"06-01","page":1,"print_page":101,"title":"平時の食料安全保障と食品アクセス"}},{"id":"06-02-b1","memo_id":"06-02","genre_id":"06","level":"beginner","question":"このメモで、食品アクセス問題への対応として重要とされていることはどれか。","choices":["関係省庁が連携し、実態把握をしつつ地域の取組を支える体制づくり","全国一律の基準を定め、地域の実状によらず同じ対策を行う仕組み","各地域が他の関係者と連携せず、単独で対策を進める仕組み","実態把握を行わずに、国が直接すべての食料を配布する仕組み"],"answer":0,"explanation":"メモは、関係省庁が連携して実態把握をしつつ、地域の取組を支えていく体制づくりが重要としています。問題は地域によって様々で実状に応じた取組が必要とされているため、全国一律や単独での対応は誤りです。","evidence":["と密接に関係することから、関係省庁が連携して、食品アクセス問題に係る実態把握をしつつ、地域","○具体的な食品アクセスの問題については、地域によって様々であり、その地域の実状に応じて取り"],"source":{"memo_id":"06-02","page":2,"print_page":102,"title":"食品アクセス問題への対応と支援策の例"}},{"id":"06-02-b2","memo_id":"06-02","genre_id":"06","level":"beginner","question":"このメモで、「買物困難者」に関する問題と密接に関係する分野として挙げられているものはどれか。","choices":["ラストワンマイル物流","社会保障制度","児童福祉やこども支援","食品ロス削減"],"answer":0,"explanation":"買物困難者に関しては、地域・農村活性化、ラストワンマイル物流、地域交通などが挙げられています。社会保障制度、児童福祉やこども支援、食品ロス削減は、経済的理由により十分な食料を入手できない方々に関する分野です。","evidence":["①買物困難者に関しては、地域・農村活性化、ラストワンマイル物流、地域交通、中心市街地・商店街活性化、","②経済的理由により十分な食料を入手できない方々に関しては、社会保障制度、児童福祉やこども支援、食"],"source":{"memo_id":"06-02","page":2,"print_page":102,"title":"食品アクセス問題への対応と支援策の例"}},{"id":"06-02-i1","memo_id":"06-02","genre_id":"06","level":"intermediate","question":"このメモの「経済的アクセス関係支援策の例」で、食品保管庫の拡大などの機能強化等の支援の対象として示されているのはどれか。","choices":["フードバンクやこども食堂等","卸売事業者や小売事業者等","産地や生産者等","ドローン配送の事業者等"],"answer":0,"explanation":"経済的アクセス関係支援策の例では、フードバンクやこども食堂等に対し、食品保管庫の拡大などの機能強化等の支援を行うとされています。卸売事業者・小売事業者・産地は、物理的アクセス関係支援策の協議会の構成員として示されているものです。","evidence":["食品取扱量の増加を目指して、フードバン","クやこども食堂等に対し、食品保管庫の拡"],"source":{"memo_id":"06-02","page":2,"print_page":102,"title":"食品アクセス問題への対応と支援策の例"}},{"id":"06-02-i2","memo_id":"06-02","genre_id":"06","level":"intermediate","question":"このメモの「地域の関係者が連携して取り組む体制づくり」で、関係者が集まる中心として示されているのはどれか。","choices":["市町村等","卸売事業者等","フードバンク等","物流事業者等"],"answer":0,"explanation":"体制づくりの支援は、市町村等を中心に地域の関係者が集まり、地域の課題に応じた取組を進めるものとされています。フードバンクや物流事業者は地域協議会の参加者の一つとして図に示されていますが、中心とはされていません。","evidence":["市町村等を中心に地域の関係者が集まり、","地域の課題に応じた取組を進める体制づ"],"source":{"memo_id":"06-02","page":2,"print_page":102,"title":"食品アクセス問題への対応と支援策の例"}},{"id":"06-02-a1","memo_id":"06-02","genre_id":"06","level":"advanced","question":"このメモの「物理的アクセス関係支援策の例」で、地域の関係者で構成される協議会等における取組の支援として誤っているものはどれか。","choices":["移動販売車の導入の支援","ドローン配送の実証の支援","無人型店舗の設置の支援","食品保管庫の拡大の支援"],"answer":3,"explanation":"物理的アクセス関係支援策の例は、協議会等における移動販売車の導入、ドローン配送の実証、無人型店舗の設置等の支援です。食品保管庫の拡大は、フードバンクやこども食堂等に対する経済的アクセス関係支援策の例なので誤りです。","evidence":["地域の関係者で構成される協議会等にお","ける移動販売車の導入、ドローン配送の実","クやこども食堂等に対し、食品保管庫の拡"],"source":{"memo_id":"06-02","page":2,"print_page":102,"title":"食品アクセス問題への対応と支援策の例"}},{"id":"06-03-b1","memo_id":"06-03","genre_id":"06","level":"beginner","question":"一口メモによると、農水産物・食品の輸送のうちトラック輸送が占める割合はどれか。","choices":["96.5%","58.4%","44.0%","25.0%"],"answer":0,"explanation":"農水産物・食
