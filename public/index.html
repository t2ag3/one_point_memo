<!doctype html>
<html lang="ja">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一口メモ道場</title>

  <style>/* 一口メモ道場：生成り（きなり）の地に、墨と朱 */
:root {
  --paper: #f7f3ea;
  --card: #fffdf8;
  --ink: #2b2622;
  --muted: #6f665d;
  --line: #ddd3c4;
  --shu: #c0392b;       /* 朱 */
  --shu-dark: #962d22;
  --matcha: #4f7a3a;    /* 正解 */
  --hell: #1d1416;
  --hell-glow: #e4572e;
  --radius: 10px;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", sans-serif;
  line-height: 1.7;
}
main { max-width: 860px; margin: 0 auto; padding: 16px 20px 64px; }
.top {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; border-bottom: 3px solid var(--ink); background: var(--card);
}
.logo { font-size: 1.4rem; margin: 0; letter-spacing: .12em; }
.logo-mark {
  display: inline-block; width: 1.8em; height: 1.8em; line-height: 1.8em; margin-right: .4em;
  text-align: center; color: #fff; background: var(--shu); border-radius: 50%; letter-spacing: 0;
}
.demo-badge { background: var(--ink); color: #fff; padding: 2px 10px; border-radius: 99px; font-size: .8rem; }
.lead { font-size: 1.05rem; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }

/* レベル選択 */
.levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin: 16px 0; }
.level-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
  padding: 18px; border: 2px solid var(--ink); border-radius: var(--radius); background: var(--card);
  font: inherit; color: inherit; text-align: left; cursor: pointer; transition: transform .1s, box-shadow .1s;
}
.level-card:hover, .level-card:focus-visible { transform: translateY(-2px); box-shadow: 4px 4px 0 var(--ink); outline: none; }
.level-name { font-size: 1.5rem; font-weight: 700; letter-spacing: .2em; }
.level-desc { font-size: .9rem; color: var(--muted); }
.level-best { font-size: .8rem; margin-top: 6px; color: var(--shu-dark); }
.level-card.hell-card { background: var(--hell); color: #fbe9e4; border-color: var(--hell-glow); animation: glow 2.4s ease-in-out infinite; }
.level-card.hell-card .level-desc, .level-card.hell-card .level-best { color: #f3b8a8; }
.level-card.appear { animation: appear 1.2s ease-out, glow 2.4s ease-in-out 1.2s infinite; }
@keyframes glow { 50% { box-shadow: 0 0 18px var(--hell-glow); } }
@keyframes appear { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }

/* 詳細設定 */
.link-button { background: none; border: none; color: var(--shu-dark); text-decoration: underline; font: inherit; cursor: pointer; padding: 4px 0; }
.settings { margin-top: 8px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
fieldset { border: none; border-top: 1px solid var(--line); margin: 0 0 12px; padding: 10px 0 0; }
legend { font-weight: 700; padding-right: 8px; }
.genre-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 4px 16px; }
.check { display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
.genre-count { color: var(--muted); font-size: .8rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--ink); background: var(--card); border-radius: 99px; padding: 2px 14px; font: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.setting-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.row-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.small-button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 2px 10px; font: inherit; font-size: .85rem; cursor: pointer; }

/* 4 択 */
.quiz-head { display: flex; align-items: center; gap: 12px; }
.quiz-head .quit { margin-left: auto; }
.badge { display: inline-block; background: var(--ink); color: #fff; border-radius: 6px; padding: 0 10px; font-weight: 700; letter-spacing: .1em; }
.hell-badge { background: var(--hell); color: var(--hell-glow); }
.progress-bar { height: 6px; background: var(--line); border-radius: 3px; margin: 10px 0 16px; overflow: hidden; }
.progress-bar div { height: 100%; width: 0; background: var(--shu); transition: width .3s; }
.notice { background: #fff4d6; border-left: 4px solid #e0a800; padding: 6px 12px; }
.question { font-size: 1.2rem; line-height: 1.6; margin: 8px 0 16px; }
.choices { display: grid; gap: 10px; }
.choice {
  display: flex; gap: 12px; align-items: baseline; text-align: left; padding: 12px 14px;
  border: 2px solid var(--line); border-radius: var(--radius); background: var(--card); font: inherit; color: inherit; cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--ink); }
.choice-key { font-weight: 700; color: var(--shu); min-width: 1.4em; }
.choice.correct { border-color: var(--matcha); background: #eef5e8; }
.choice.wrong { border-color: var(--shu); background: #fbeae7; }
.choice:disabled { cursor: default; }
.feedback { margin-top: 18px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
.verdict { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }
.verdict.ok { color: var(--matcha); }
.verdict.ng { color: var(--shu); }
.evidence { margin: 8px 0; padding: 6px 12px; border-left: 4px solid var(--line); color: var(--muted); font-size: .9rem; white-space: pre-line; }
.source { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; }
.source img { width: 180px; border: 1px solid var(--line); border-radius: 4px; }
.primary, .secondary { font: inherit; font-weight: 700; border-radius: var(--radius); padding: 8px 22px; cursor: pointer; }
.primary { background: var(--shu); color: #fff; border: 2px solid var(--shu); }
.primary:hover { background: var(--shu-dark); }
.primary:disabled { opacity: .5; cursor: default; }
.secondary { background: var(--card); color: var(--ink); border: 2px solid var(--ink); }

/* 結果 */
.score { font-size: 2.4rem; font-weight: 700; margin: 6px 0; }
.review { padding-left: 1.4em; }
.review li { margin-bottom: 10px; }
.review .mark-ok { color: var(--matcha); font-weight: 700; }
.review .mark-ng { color: var(--shu); font-weight: 700; }
.unlock-banner { background: var(--hell); color: #fbe9e4; padding: 18px; border-radius: var(--radius); text-align: center; animation: appear 1s ease-out; }
.unlock-title { font-size: 1.6rem; font-weight: 700; color: var(--hell-glow); letter-spacing: .3em; margin: 0; }

/* 地獄級 */
.persona { display: flex; gap: 12px; align-items: center; margin: 14px 0; padding: 12px; background: var(--hell); color: #fbe9e4; border-radius: var(--radius); }
.persona-icon { font-size: 2rem; }
.persona-role { font-weight: 700; }
.persona-profile { font-size: .85rem; color: #f3b8a8; }
.dialogue { display: grid; gap: 10px; }
.bubble { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
.bubble.from-consultant { background: var(--card); border: 1px solid var(--line); border-top-left-radius: 2px; }
.bubble.from-staff { justify-self: end; background: #e9f0e3; border-top-right-radius: 2px; }
.bubble-who { display: block; font-size: .75rem; color: var(--muted); }
.waiting { display: flex; gap: 10px; align-items: center; margin: 12px 0; color: var(--muted); }
.spinner { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--shu); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.answer-form { margin-top: 14px; }
.answer-form textarea { width: 100%; font: inherit; padding: 10px; border: 2px solid var(--line); border-radius: var(--radius); background: #fff; }
.answer-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.answer-tools .primary { margin-left: auto; }
.mic { font: inherit; border: 2px solid var(--ink); background: #fff; border-radius: 99px; padding: 4px 14px; cursor: pointer; }
.mic.recording { background: var(--shu); color: #fff; border-color: var(--shu); animation: glow 1.2s infinite; }
.mic:disabled { opacity: .5; cursor: default; }

/* 講評 */
.review-title { font-size: 1.3rem; font-weight: 700; color: var(--shu-dark); }
.grade { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin: 14px 0; }
.grade h3 { margin: 0 0 6px; }
.grade-total { font-size: 1.6rem; font-weight: 700; }
.grade-parts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; }
.grade ul { margin: 4px 0; padding-left: 1.4em; }
.grade details { margin-top: 6px; }
.grade .model-answer { background: #f2efe6; padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; }
.grade-error { color: var(--shu); }

@media (max-width: 520px) {
  .source { flex-direction: column; }
  .source img { width: 100%; }
}
</style>

</head>
<body>
<header class="top">
  <h1 class="logo"><span class="logo-mark">道</span>一口メモ道場</h1>
  <span id="demo-badge" class="demo-badge" hidden>デモ</span>
</header>

<main>
  <!-- レベル選択（トップ） -->
  <section id="home" class="screen">
    <p class="lead">レベルを選ぶと、すぐに始まります。</p>
    <div id="levels" class="levels"></div>
    <p id="bank-note" class="muted small"></p>
    <button id="open-settings" class="link-button" aria-expanded="false" aria-controls="settings">詳細設定</button>
    <div id="settings" class="settings" hidden>
      <fieldset>
        <legend>出題範囲（ジャンル）</legend>
        <div class="row-buttons">
          <button type="button" class="small-button" data-genres="all">すべて選ぶ</button>
          <button type="button" class="small-button" data-genres="none">すべて外す</button>
        </div>
        <div id="genre-list" class="genre-list"></div>
      </fieldset>
      <fieldset>
        <legend>問題数（初級・中級・上級）</legend>
        <div id="count-list" class="chips"></div>
      </fieldset>
      <fieldset id="hell-settings">
        <legend>地獄級</legend>
        <div class="setting-row"><span>相談者の人数</span><div id="consultant-list" class="chips"></div></div>
        <div class="setting-row"><span>相談者の区分</span><div id="group-list" class="chips"></div></div>
        <label class="check"><input type="checkbox" id="use-voice"> 音声入力を使う</label>
      </fieldset>
      <fieldset id="unlock-settings">
        <legend>地獄級の解放</legend>
        <p class="muted small">上級で 5 問以上解いて 8 割以上正解すると、地獄級が現れます。</p>
        <div class="row-buttons">
          <button type="button" class="small-button" id="unlock-hell">解放する</button>
          <button type="button" class="small-button" id="lock-hell">ロックに戻す</button>
        </div>
      </fieldset>
    </div>
  </section>

  <!-- 4 択 -->
  <section id="quiz" class="screen" hidden>
    <div class="quiz-head">
      <span id="quiz-level" class="badge"></span>
      <span id="quiz-progress" class="muted"></span>
      <button type="button" class="link-button quit">やめる</button>
    </div>
    <div class="progress-bar"><div id="quiz-bar"></div></div>
    <p id="quiz-notice" class="notice" hidden></p>
    <h2 id="quiz-question" class="question"></h2>
    <div id="quiz-choices" class="choices"></div>
    <div id="quiz-feedback" class="feedback" hidden>
      <p id="quiz-verdict" class="verdict"></p>
      <p id="quiz-explanation"></p>
      <blockquote id="quiz-evidence" class="evidence"></blockquote>
      <div class="source">
        <a id="quiz-source-image-link" target="_blank" rel="noopener"><img id="quiz-source-image" alt="出典のスライド"></a>
        <div>
          <p id="quiz-source-text" class="small"></p>
          <a id="quiz-source-pdf" class="small" target="_blank" rel="noopener">PDF の該当ページを開く</a>
        </div>
      </div>
      <button type="button" id="quiz-next" class="primary">次へ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen" hidden>
    <div id="unlock-banner" class="unlock-banner" hidden>
      <p class="unlock-title">地獄の門が開いた</p>
      <p id="unlock-text">上級を突破しました。レベル選択に「地獄級」が現れます。</p>
    </div>
    <p id="result-level" class="badge"></p>
    <p id="result-score" class="score"></p>
    <p id="result-message"></p>
    <div class="row-buttons">
      <button type="button" id="result-again" class="primary">もう一度</button>
      <button type="button" class="secondary to-home">レベル選択へ</button>
    </div>
    <h3>ふり返り</h3>
    <ol id="result-review" class="review"></ol>
  </section>

  <!-- 地獄級 -->
  <section id="hell" class="screen hell" hidden>
    <div class="quiz-head">
      <span class="badge hell-badge">地獄級</span>
      <span id="hell-progress" class="muted"></span>
      <button type="button" class="link-button quit">やめる</button>
    </div>
    <div id="hell-persona" class="persona"></div>
    <div id="hell-dialogue" class="dialogue" aria-live="polite"></div>
    <div id="hell-waiting" class="waiting" hidden>
      <span class="spinner" aria-hidden="true"></span><span id="hell-waiting-text"></span>
      <button type="button" id="hell-retry" class="small-button" hidden>やり直す</button>
    </div>
    <div id="turnstile-box" class="turnstile" hidden></div>
    <p id="hell-notice" class="notice small" hidden></p>
    <form id="hell-form" class="answer-form" hidden>
      <textarea id="hell-answer" rows="5" placeholder="職員として回答してください（音声でも入力できます）"></textarea>
      <div class="answer-tools">
        <button type="button" id="mic" class="mic" hidden>🎤 話して入力</button>
        <label id="audio-file-label" class="small-button" hidden>音声ファイルを選ぶ<input type="file" id="audio-file" accept="audio/*,video/mp4" hidden></label>
        <span id="mic-status" class="muted small"></span>
        <button type="submit" class="primary" id="hell-send">回答する</button>
      </div>
    </form>
  </section>

  <!-- 地獄級の講評 -->
  <section id="review" class="screen" hidden>
    <p class="badge hell-badge">地獄級の講評</p>
    <p id="review-score" class="score"></p>
    <p id="review-title" class="review-title"></p>
    <p class="muted small">点数は AI による目安です。根拠の引用と出典で、必ず確かめてください。</p>
    <div id="review-list"></div>
    <div class="row-buttons">
      <button type="button" id="review-again" class="primary">もう一度挑む</button>
      <button type="button" class="secondary to-home">レベル選択へ</button>
    </div>
  </section>
</main>

農業総産出額です。生産農業所得は物的経費を差し引いたもの、農業総生産は資材費等を差し引いた付加価値額であり、農業生産額は中間生産物等を加えた額です。","evidence":["農業生産活動による最終生産物の品目ごとの生産量に、品目ごとの農家庭先販売価格を乗じた額を合計したもの"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-01-b2","memo_id":"01-01","genre_id":"01","level":"beginner","question":"このメモで、GDP（国内総生産）のうち農業が生み出した付加価値額を他産業や外国と比較するときに使う用語はどれか。","choices":["農業総産出額","生産農業所得","農業総生産","経常補助金"],"answer":2,"explanation":"他産業や外国との比較に使うのは国民経済計算による農業総生産です。農業総産出額は売上げ相当額の総額、生産農業所得は物的経費を引いた付加価値額を知りたいときに使います。","evidence":["GDP（国内総生産）のうち、農業が生み出した付加価値額を、他産業や外国と比較するとき"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-01-i1","memo_id":"01-01","genre_id":"01","level":"intermediate","question":"令和6年の全国の生産農業所得はいくらか。","choices":["10.8兆円","5.0兆円","4.0兆円","6.8兆円"],"answer":2,"explanation":"令和6年の生産農業所得は4.0兆円です。10.8兆円は農業総産出額、5.0兆円は農業総生産の値であり、6.8兆円はメモに示された統計値ではありません。","evidence":["4.0兆円（令和6年）","・生産農業所得 4.0兆円"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-01-i2","memo_id":"01-01","genre_id":"01","level":"intermediate","question":"このメモの定義と図で、生産農業所得を求めるときに、農業総産出額から物的経費を差し引いたものに加算されるものはどれか。","choices":["間接税","経常補助金","減価償却費","中間生産物"],"answer":1,"explanation":"生産農業所得は物的経費を差し引いたものに経常補助金を加算して求めます。間接税と減価償却費は差し引かれる物的経費に含まれ、中間生産物は農業生産額の算出で加えられる項目です。","evidence":["物的経費（減価償却費及び間接税を含む。）を差し引いたものに経常補助金を加算したもの"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-01-a1","memo_id":"01-01","genre_id":"01","level":"advanced","question":"このメモの生産額・所得に関する統計用語の説明として、誤っているものはどれか。","choices":["物的経費には減価償却費及び間接税が含まれる","中間生産物の例として種子、飼料作物等が示されている","農業サービスの例として選果場等が示されている","農業総生産は農業総産出額から資材費等を差し引いたもの"],"answer":3,"explanation":"農業総生産は、農業総産出額ではなく、中間生産物と農業サービスを加えた農業生産額から資材費等を差し引いたものです。ほかの3つはメモの定義や図の記載どおりです。","evidence":["農業生産額（≒農業総産出額に中間生産物及び農業サービスの産出額を加えたもの）から資材費等を差し引いたもの"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-01-a2","memo_id":"01-01","genre_id":"01","level":"advanced","question":"令和6年の全国の農業総産出額と生産農業所得の差は何兆円か。","choices":["5.8兆円","6.8兆円","1.0兆円","5.0兆円"],"answer":1,"explanation":"農業総産出額10.8兆円から生産農業所得4.0兆円を引くと6.8兆円です。5.8兆円は農業総産出額と農業総生産（5.0兆円）の差、1.0兆円は農業総生産と生産農業所得の差です。","evidence":["・農業総産出額 10.8兆円","・生産農業所得 4.0兆円"],"source":{"memo_id":"01-01","page":1,"print_page":1,"title":"統計用語の整理（生産額・所得）"}},{"id":"01-02-b1","memo_id":"01-02","genre_id":"01","level":"beginner","question":"農業における被雇用者のうち「常雇い」は、あらかじめ年間何か月以上の契約で雇った人をいうか。","choices":["3か月以上","5か月以上","7か月以上","10か月以上"],"answer":2,"explanation":"常雇いは、あらかじめ年間7か月以上の契約で主に農業経営のために雇った人と定義されています。これに該当しない日雇い・季節雇いなどは臨時雇いに区分されます。","evidence":["あらかじめ、年間７か月以上の契約で主に農業経営のために雇った"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-02-b2","memo_id":"01-02","genre_id":"01","level":"beginner","question":"個人経営体の世帯員のうち「基幹的農業従事者」の定義として正しいものはどれか。","choices":["自営農業を主な仕事としている者","調査期日前1年間に自営農業に従事した者","年間7か月以上の契約で雇われた者","農業経営のため一時的に雇われた者"],"answer":0,"explanation":"基幹的農業従事者は自営農業を主な仕事としている者で、家事や育児が主体の主婦や学生等は含みません。調査期日前1年間に自営農業に従事した者は、より広い「農業従事者」の定義です。","evidence":["自営農業を主な仕事としている者をいう。"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-02-i1","memo_id":"01-02","genre_id":"01","level":"intermediate","question":"農業構造動態調査による令和8年の個人経営体の数はどれか。","choices":["4万経営体","18万経営体","76万経営体","80万経営体"],"answer":2,"explanation":"令和8年の個人経営体は76万経営体です。80万経営体は農業経営体全体、18万経営体は主業経営体、4万経営体は団体経営体の数です。","evidence":["76万経営体（令和8年）"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-02-i2","memo_id":"01-02","genre_id":"01","level":"intermediate","question":"主業経営体の定義で、65歳未満の世帯員が調査期日前1年間に自営農業に何日以上従事していることが条件とされているか。","choices":["30日以上","60日以上","100日以上","150日以上"],"answer":1,"explanation":"主業経営体は、農業所得が主で、調査期日前1年間に自営農業に60日以上従事している65歳未満の世帯員がいる個人経営体です。他の日数は定義にありません。","evidence":["年間に自営農業に60日以上従事している65歳未満の世帯員がいる"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-02-a1","memo_id":"01-02","genre_id":"01","level":"advanced","question":"このページに示された統計値について、誤っているものはどれか。","choices":["令和8年の農業経営体は80万経営体","令和8年の常雇いは25万人","令和7年の農業従事者は175万人","令和8年の農業従事者は99万人"],"answer":3,"explanation":"99万人（令和8年）は基幹的農業従事者の数で、農業従事者は175万人（令和7年、農林業センサス）です。ほかの3つはページの統計値と一致します。","evidence":["99万人（令和8年）","175万人（令和7年）"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-02-a2","memo_id":"01-02","genre_id":"01","level":"advanced","question":"令和8年の個人経営体のうち、主業経営体に当たらない経営体はおよそ何万経営体か（ページの統計値から計算）。","choices":["4万経営体","58万経営体","62万経営体","72万経営体"],"answer":1,"explanation":"令和8年の個人経営体76万経営体から主業経営体18万経営体を引くと58万経営体です。62万は農業経営体80万から、72万は個人経営体から団体経営体4万を引いた誤った計算です。","evidence":["76万経営体（令和8年）","18万経営体（令和8年）"],"source":{"memo_id":"01-02","page":2,"print_page":2,"title":"統計用語の整理②（経営体・従事者・雇用）"}},{"id":"01-03-b1","memo_id":"01-03","genre_id":"01","level":"beginner","question":"昭和35年と比べて、全国の農業就業者数はおよそどの程度まで減少したか。","choices":["約8分の1","約4分の1","約2分の1","約3分の2"],"answer":0,"explanation":"要点に、昭和35年に比べ農業就業者数は約8分の1に減少したと書かれています。「4分の3以下」は農地面積についての記述であり、就業者数の減少はそれより大きいです。","evidence":["昭和35年に比べ、農業就業者数は約８分の１に"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-03-b2","memo_id":"01-03","genre_id":"01","level":"beginner","question":"全国の農業経営体数が100万経営体を下回ったのはどの年か。","choices":["令和4年","令和2年","令和6年","平成27年"],"answer":0,"explanation":"要点に、農業経営体数は令和4年に100万経営体を下回ったと書かれています。令和2年は108万経営体で、まだ100万を上回っていました。","evidence":["農業経営体数は、令和４年に100万経営体を下回った。"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-03-i1","memo_id":"01-03","genre_id":"01","level":"intermediate","question":"令和2年から令和7年にかけて、全国の農業経営体数に占める団体経営体数の割合はどのように推移したか。","choices":["毎年上昇し続けた","毎年低下し続けた","ほぼ横ばいで推移した","上昇した後に低下した"],"answer":0,"explanation":"団体経営体数の割合は令和2年3.6％から3.8％、4.1％、4.4％、4.6％と続き、令和7年は4.8％で毎年上昇しています。低下した年はないため、他の選択肢は誤りです。","evidence":["３．６％","４．６％","４．８％"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-03-i2","memo_id":"01-03","genre_id":"01","level":"intermediate","question":"令和7年の全国の全産業就業者数に占める農業就業者数の割合はどれか。","choices":["2.4％","3.6％","9.2％","28.7％"],"answer":0,"explanation":"表の令和7年の欄では、全産業就業者数に占める農業就業者数の割合は2.4％です。28.7％は昭和35年、9.2％は昭和55年、3.6％は平成22年の値です。","evidence":["２．４％"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-03-a1","memo_id":"01-03","genre_id":"01","level":"advanced","question":"令和6年の全国の農業総生産はどれか。","choices":["4兆9,705億円","3兆8,302億円","4兆5,825億円","6兆3,252億円"],"answer":0,"explanation":"表の令和6年の農業総生産は4兆9,705億円です。3兆8,302億円は令和5年、4兆5,825億円は令和2年、6兆3,252億円は平成12年の値です。","evidence":["４兆9,705"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-03-a2","memo_id":"01-03","genre_id":"01","level":"advanced","question":"農業生産活動指標の推移について、誤っているものはどれか。","choices":["昭和35年と比べ農地面積は4分の3以下に減少","令和5年の農業総生産の対GDP比は0.8％","令和7年の農家戸数は139万戸","令和7年の農業経営体数は84万経営体"],"answer":1,"explanation":"令和5年の農業総生産の対GDP比は0.6％であり、0.8％は令和6年などの値なので誤りです。農地面積の減少、令和7年の農家戸数139万戸、農業経営体数84万経営体はいずれも表や要点と一致します。","evidence":["０．６％"],"source":{"memo_id":"01-03","page":3,"print_page":3,"title":"農業生産活動指標の推移"}},{"id":"01-04-b1","memo_id":"01-04","genre_id":"01","level":"beginner","question":"令和6年における全国の農業・食料関連産業の国内生産額と前年からの変化として正しいものはどれか。","choices":["120.7兆円で、前年から4.1%増加","120.7兆円で、前年から4.1%減少","101.5兆円で、前年から4.1%増加","101.5兆円で、前年から8.2%増加"],"answer":0,"explanation":"令和6年の農業・食料関連産業の国内生産額は120.7兆円で、前年から4.1%増加しました。101.5兆円は内訳の食品産業の値、8.2%はその全経済活動に占める割合であり、全体の値ではありません。","evidence":["令和６年における農業・食料関連産業の国内生産額は120.7兆円で、前年から4.1％増加。"],"source":{"memo_id":"01-04","page":4,"print_page":4,"title":"農業・食料関連産業の国内生産額（令和6年）"}},{"id":"01-04-b2","memo_id":"01-04","genre_id":"01","level":"beginner","question":"令和6年に全国の農業・食料関連産業の国内生産額が前年から増加した主な要因として、メモに書かれているものはどれか。","choices":["米や野菜の価格が上昇したこと","肉類や魚介類の価格が上昇したこと","外食産業の店舗数が増加したこと","資材供給産業の投資が増えたこと"],"answer":0,"explanation":"メモでは、増加の主な要因は米や野菜の価格の上昇とされています。肉類・魚介類の価格、外食の店舗数、資材供給産業の投資は主な要因として挙げられていません。","evidence":["これは、米や野菜の価格が上昇したことが主な要因。"],"source":{"memo_id":"01-04","page":4,"print_page":4,"title":"農業・食料関連産業の国内生産額（令和6年）"}},{"id":"01-04-i1","memo_id":"01-04","genre_id":"01","level":"intermediate","question":"令和6年の農業・食料関連産業の国内生産額の内訳のうち、国内生産額が最も大きい部門はどれか。","choices":["農林漁業","食品製造業","関連流通業","外食産業"],"answer":1,"explanation":"内訳は食品製造業43.7兆円、関連流通業38.7兆円、外食産業19.1兆円、農林漁業13.9兆円で、食品製造業が最大です。関連流通業も大きいですが、食品製造業には及びません。","evidence":["○農業・食料関連産業の国内生産額（令和６年）"],"source":{"memo_id":"01-04","page":4,"print_page":4,"title":"農業・食料関連産業の国内生産額（令和6年）"}},{"id":"01-04-a1","memo_id":"01-04","genre_id":"01","level":"advanced","question":"令和6年の農業・食料関連産業の国内生産額の内訳について、誤っているものはどれか。","choices":["食品産業の国内生産額は101.5兆円","外食産業の国内生産額は19.1兆円","資材供給産業等の国内生産額は5.3兆円","関連流通業の国内生産額は43.7兆円"],"answer":3,"explanation":"関連流通業の国内生産額は38.7兆円で、43.7兆円は食品製造業の値です。食品産業101.5兆円、外食産業19.1兆円、資材供給産業等5.3兆円はいずれもメモのとおりです。","evidence":["○農業・食料関連産業の国内生産額（令和６年）"],"source":{"memo_id":"01-04","page":4,"print_page":4,"title":"農業・食料関連産業の国内生産額（令和6年）"}},{"id":"01-04-a2","memo_id":"01-04","genre_id":"01","level":"advanced","question":"令和6年の市場規模比較の表で、食品産業をほかの産業と比べた記述として正しいものはどれか。","choices":["国内生産額は不動産業より大きく、就業者数も不動産業より多い","国内生産額は不動産業より小さいが、就業者数は不動産業より多い","国内生産額は卸売・小売業より大きく、就業者数も卸売・小売業より多い","国内生産額は製造業より大きいが、就業者数は製造業より少ない"],"answer":0,"explanation":"食品産業は国内生産額1,014,840億円・就業者数790万人で、不動産業（1,008,272億円・112万人）をどちらも上回ります。卸売・小売業（1,280,533億円・1,045万人）や製造業（3,800,206億円）は国内生産額で食品産業より大きいため、他の選択肢は誤りです。","evidence":["○農林漁業、食品産業の市場規模比較（国内生産額ベース、令和６年）"],"source":{"memo_id":"01-04","page":4,"print_page":4,"title":"農業・食料関連産業の国内生産額（令和6年）"}},{"id":"01-05-i1","memo_id":"01-05","genre_id":"01","level":"intermediate","question":"メモの参考に示された、生産農業所得の求め方として正しいものはどれか。","choices":["農業総産出額－物的経費＋経常補助金","農業総産出額＋物的経費－経常補助金","農業総産出額－物的経費－経常補助金","農業総産出額－経常補助金＋物的経費"],"answer":0,"explanation":"生産農業所得は、農業総産出額から物的経費（肥料、農薬、光熱動力費等）を引き、経常補助金を足したものです。経常補助金は引くのではなく足す点に注意します。","evidence":["生産農業所得＝農業総産出額－物的経費（肥料、農薬、光熱動力費等）＋経常補助金"],"source":{"memo_id":"01-05","page":5,"print_page":5,"title":"農業総産出額と生産農業所得の推移"}},{"id":"01-05-i2","memo_id":"01-05","genre_id":"01","level":"intermediate","question":"令和6年の全国の農業総産出額のうち畜産の内訳で、産出額がそれぞれ0.8兆円である品目の組み合わせはどれか。","choices":["肉用牛と豚","乳用牛と鶏","肉用牛と鶏","乳用牛と豚"],"answer":0,"explanation":"令和6年の畜産の内訳は肉用牛0.8、乳用牛1.0、豚0.8、鶏1.0兆円です。乳用牛と鶏は1.0兆円なので、0.8兆円の組み合わせは肉用牛と豚です。","evidence":["肉用牛 0.8\n乳用牛 1.0"],"source":{"memo_id":"01-05","page":5,"print_page":5,"title":"農業総産出額と生産農業所得の推移"}},{"id":"01-05-a1","memo_id":"01-05","genre_id":"01","level":"advanced","question":"全国の農業総産出額と生産農業所得について、メモの内容として誤っているものはどれか。","choices":["農業総産出額は平成27年以降、9兆円前後で推移した","令和6年の農業総産出額は10.8兆円に増加した","農業総産出額が10兆円台となるのは平成27年以来である","生産農業所得は平成27年以降、3兆円台で推移した"],"answer":2,"explanation":"メモでは、令和6年に10兆円台となったのは平成8年以来とされており、平成27年以来ではありません。平成27年は、総産出額が9兆円前後、所得が3兆円台で推移し始めた起点の年です。","evidence":["10.8兆円に増加（10兆円台は平成８年以来）。"],"source":{"memo_id":"01-05","page":5,"print_page":5,"title":"農業総産出額と生産農業所得の推移"}},{"id":"01-06-b1","memo_id":"01-06","genre_id":"01","level":"beginner","question":"近年の全農業経営体と主業経営体の1経営体当たりの農業粗収益・農業経営費の推移として、メモの内容に合うものはどれか。","choices":["経営規模の拡大に伴い、ともに増加傾向","経営規模の縮小に伴い、ともに減少傾向","経営規模の拡大に伴い、粗収益のみ増加","経営規模の縮小に伴い、経営費のみ増加"],"answer":0,"explanation":"メモの要点は、経営規模の拡大に伴い農業粗収益と農業経営費がともに増加傾向で推移したとしています。どちらか一方のみの増加や、規模の縮小・減少傾向とする選択肢は誤りです。","evidence":["近年、経営規模の拡大に伴い全農業経営体及び主業経営体の１経営体当たりの農業","粗収益、農業経営費はともに増加傾向で推移。"],"source":{"memo_id":"01-06","page":6,"print_page":6,"title":"農業経営体の1経営体当たり農業所得等の推移"}},{"id":"01-06-i2","memo_id":"01-06","genre_id":"01","level":"intermediate","question":"令和6年の主業経営体（全営農類型平均・全国）の1経営体当たりの農業所得はいくらか。","choices":["168.6万円","362.9万円","404.2万円","494.2万円"],"answer":3,"explanation":"主業経営体のグラフで令和6年の農業所得は494.2万円です。404.2万円は令和5年、362.9万円は令和4年の値で、168.6万円は全農業経営体の令和6年の農業所得です。","evidence":["○主業経営体の農業所得等の推移","494.2\n404.2\n\n362.9"],"source":{"memo_id":"01-06","page":6,"print_page":6,"title":"農業経営体の1経営体当たり農業所得等の推移"}},{"id":"01-06-a1","memo_id":"01-06","genre_id":"01","level":"advanced","question":"全農業経営体（全営農類型平均・全国）の1経営体当たり農業所得は、令和4年から令和6年にかけて何万円増えたか。","choices":["16.0万円","54.4万円","70.4万円","131.4万円"],"answer":2,"explanation":"令和4年98.2万円から令和6年168.6万円へ増えたので、差は70.4万円です。16.0万円は令和4年→5年、54.4万円は令和5年→6年の増加分、131.4万円は主業経営体の令和4年→6年の増加分です。","evidence":["（1,165.6）\n98.2","（1,247.9）\n114.2\n\n168.6"],"source":{"memo_id":"01-06","page":6,"print_page":6,"title":"農業経営体の1経営体当たり農業所得等の推移"}},{"id":"01-07-b1","memo_id":"01-07","genre_id":"01","level":"beginner","question":"全国の農林漁業就業者数は、昭和35年と比べて令和7年にはどの程度まで減少したとされているか。","choices":["約2分の1","約4分の1","約7分の1","約10分の1"],"answer":2,"explanation":"要点に、昭和35年に比べ約7分の1に減少し、令和7年で187万人とあります。約2分の1や約4分の1では減少幅が小さすぎ、約10分の1は記載と異なります。","evidence":["農林漁業就業者数は昭和35年に比べ、約７分の１に減少し、令和７年で187万人。"],"source":{"memo_id":"01-07","page":7,"print_page":7,"title":"農林漁業就業者数の推移と主要国比較"}},{"id":"01-07-b2","memo_id":"01-07","genre_id":"01","level":"beginner","question":"主要国における、農林漁業就業者数が全産業就業者数に占める割合は、全体としてどのような動きとされているか。","choices":["おおむね低下している","おおむね上昇している","ほぼ横ばいで推移している","日本だけが上昇している"],"answer":0,"explanation":"要点に「主要国でもこの割合はおおむね低下」とあります。上昇や横ばいとする選択肢は記載と逆の内容です。","evidence":["全産業就業者数に占める割合は2.9%｡主要国でもこの割合はおおむね低下｡"],"source":{"memo_id":"01-07","page":7,"print_page":7,"title":"農林漁業就業者数の推移と主要国比較"}},{"id":"01-08-b1","memo_id":"01-08","genre_id":"01","level":"beginner","question":"令和8年における全国の基幹的農業従事者の平均年齢はどれか。","choices":["67.7歳","65.0歳","70.2歳","56.5歳"],"answer":0,"explanation":"要点に令和8年の平均年齢は67.7歳と書かれています。70.2や56.5はグラフ中の割合（％）の数値で、年齢ではありません。","evidence":["平均年齢：67.7歳"],"source":{"memo_id":"01-08","page":8,"print_page":8,"title":"基幹的農業従事者の年齢構成と各国比較"}},{"id":"01-08-b2","memo_id":"01-08","genre_id":"01","level":"beginner","question":"このメモの用語の解説で、「基幹的農業従事者」はどのような者と説明されているか。","choices":["自営農業を主な仕事としている者","農業に少しでも従事した世帯員全員","家事や育児が主体の主婦も含めた者","学生を含め自営農業を手伝った者"],"answer":0,"explanation":"基幹的農業従事者は自営農業を主な仕事としている者と定義されています。家事や育児が主体の主婦や学生等は含まないと明記されているため、それらを含む選択肢は誤りです。","evidence":["基幹的農業従事者：自営農業を主な仕事としている者。","(家事や育児が主体の主婦や学生等は含まない。)"],"source":{"memo_id":"01-08","page":8,"print_page":8,"title":"基幹的農業従事者の年齢構成と各国比較"}},{"id":"01-08-i2","memo_id":"01-08","genre_id":"01","level":"intermediate","question":"各国の農業従事者の年齢構成のグラフで、65歳以上が占める割合が日本に次いで2番目に高い国はどれか。","choices":["米国","オランダ","ドイツ","フランス"],"answer":0,"explanation":"65歳以上の割合は日本70.2%に次いで米国が38.4%で2番目です。オランダは11.9%、ドイツは11.5%、フランスは5.8%と米国より低くなっています。","evidence":["○各国の農業従事者の年齢構成","米は、米国農務省「2022年農業センサス」"],"source":{"memo_id":"01-08","page":8,"print_page":8,"title":"基幹的農業従事者の年齢構成と各国比較"}},{"id":"01-08-a2","memo_id":"01-08","genre_id":"01","level":"advanced","question":"各国の農業従事者の年齢構成のグラフで、日本の65歳以上の割合は米国の65歳以上の割合より何ポイント高いか。","choices":["31.8ポイント","21.8ポイント","58.7ポイント","64.4ポイント"],"answer":0,"explanation":"日本は70.2%、米国は38.4%なので差は31.8ポイントです。58.7ポイントはドイツ（11.5%）との差、64.4ポイントはフランス（5.8%）との差です。","evidence":["○各国の農業従事者の年齢構成","米は、米国農務省「2022年農業センサス」"],"source":{"memo_id":"01-08","page":8,"print_page":8,"title":"基幹的農業従事者の年齢構成と各国比較"}},{"id":"01-09-b1","memo_id":"01-09","genre_id":"01","level":"beginner","question":"令和7年の全国の農業経営体における常雇いの人数はどれか。","choices":["24万2千人","89万8千人","15万7千人","22万0千人"],"answer":0,"explanation":"令和7年の常雇いは24万2千人です。89万8千人は令和7年の臨時雇い、15万7千人は令和2年、22万0千人は平成27年の常雇いの人数です。","evidence":["令和７年の農業経営体の常雇いは24万２千人"],"source":{"memo_id":"01-09","page":9,"print_page":9,"title":"農業経営体における雇用労働の推移"}},{"id":"01-09-b2","memo_id":"01-09","genre_id":"01","level":"beginner","question":"令和7年までの全国の農業経営体における臨時雇いの人数の動きとして正しいものはどれか。","choices":["減少が続いている","増加が続いている","ほぼ横ばいである","令和7年に増加に転じた"],"answer":0,"explanation":"メモには臨時雇いは89万8千人で減少が続くと書かれています。増加や横ばい、令和7年の増加転換はいずれも記述と合いません。","evidence":["臨時雇いは89万８千人で減少が続く。"],"source":{"memo_id":"01-09","page":9,"print_page":9,"title":"農業経営体における雇用労働の推移"}},{"id":"01-09-i2","memo_id":"01-09","genre_id":"01","level":"intermediate","question":"表の調査年のうち、全国の農業経営体の常雇いが前回の調査年より減少したのはどの年か。","choices":["平成22年","平成27年","令和2年","令和7年"],"answer":2,"explanation":"常雇いは平成27年の22.0万人から令和2年の15.7万人に減少しました。平成22年（15.4）、平成27年（22.0）、令和7年（24.2）はいずれも前回より増えています。","evidence":["常雇い\n\n12.9\n\n15.4\n\n22.0\n\n15.7\n\n24.2"],"source":{"memo_id":"01-09","page":9,"print_page":9,"title":"農業経営体における雇用労働の推移"}},{"id":"01-09-a1","memo_id":"01-09","genre_id":"01","level":"advanced","question":"令和7年の全国の農業経営体の常雇いのうち、65歳未満の人数はおよそ何万人か。","choices":["約5万人","約12万人","約19万人","約22万人"],"answer":2,"explanation":"常雇い24万2千人のうち65歳未満が約8割なので、約19万人になります。約5万人は65歳以上側の規模に近く、約22万人は常雇い全体に近すぎます。","evidence":["令和７年の農業経営体の常雇いは24万２千人","65歳未満で約８割を占めている"],"source":{"memo_id":"01-09","page":9,"print_page":9,"title":"農業経営体における雇用労働の推移"}},{"id":"01-10-b1","memo_id":"01-10","genre_id":"01","level":"beginner","question":"このメモの農業経営体数の推移（平成17年〜令和8年）で、個人経営体と団体経営体の増減の方向として正しいものはどれか。","choices":["個人経営体は減少、団体経営体は増加","個人経営体は増加、団体経営体は減少","個人経営体も団体経営体も減少","個人経営体も団体経営体も増加"],"answer":0,"explanation":"メモの要点に、個人経営体は減少している一方、団体経営体は増加と書かれています。両方が同じ方向に動いているわけではなく、逆の動きになっています。","evidence":["農業経営体のうち個人経営体は減少している一方、団体経営体は増加。"],"source":{"memo_id":"01-10","page":10,"print_page":10,"title":"農業経営体数の推移"}},{"id":"01-10-i2","memo_id":"01-10","genre_id":"01","level":"intermediate","question":"令和8年の全国の経営体数が最も多いものは、次のうちどれか。","choices":["副業的経営体","主業経営体","準主業経営体","団体経営体"],"answer":0,"explanation":"令和8年は副業的経営体が49.9万で最も多く、主業経営体18.2万、準主業経営体7.8万、団体経営体4.1万を上回ります。主業経営体は2番目にとどまります。","evidence":["副業的経営体\n\n109.1\n\n88.3\n\n79.0\n\n66.4\n\n51.9\n\n49.9","主業経営体\n\n42.9\n\n36.0\n\n29.2\n\n23.1\n\n19.0\n\n18.2"],"source":{"memo_id":"01-10","page":10,"print_page":10,"title":"農業経営体数の推移"}},{"id":"01-11-b1","memo_id":"01-11","genre_id":"01","level":"beginner","question":"一口メモによると、北海道を除いた都府県の1経営体当たり平均経営耕地面積（令和7年）はどれか。","choices":["1.1ha","2.6ha","3.6ha","33.7ha"],"answer":1,"explanation":"要点に、都府県では1経営体当たり平均2.6haで小規模経営が多数と書かれています。3.6haは全国、33.7haは北海道の令和7年の値、1.1haは都府県の平成2年の値です。","evidence":["都府県では1経営体当たり平均2.6hａで","あり小規模経営が多数。"],"source":{"memo_id":"01-11","page":11,"print_page":11,"title":"1経営体当たりの平均経営規模の推移"}},{"id":"01-11-b2","memo_id":"01-11","genre_id":"01","level":"beginner","question":"一口メモによると、部門別にみて規模拡大のテンポが緩やかとされているのはどれか。","choices":["稲作等の土地利用型農業","養豚などの畜産","採卵鶏などの畜産","乳用牛などの畜産"],"answer":0,"explanation":"要点では、畜産などで規模拡大が進展した一方、稲作等の土地利用型農業は拡大のテンポが緩やかとされています。養豚・採卵鶏・乳用牛はいずれも畜産で、規模拡大が進展した側です。","evidence":["部門別では、畜産などで規模拡大が進展したが、稲作等の土地利用","型農業においては拡大のテンポが緩やか。"],"source":{"memo_id":"01-11","page":11,"print_page":11,"title":"1経営体当たりの平均経営規模の推移"}},{"id":"01-12-b1","memo_id":"01-12","genre_id":"01","level":"beginner","question":"都府県における2000年以降の経営耕地5ha未満の経営体数は、どのように推移したか。","choices":["一貫して減少した","一貫して増加した","ほぼ横ばいで推移した","増加した後に減少した"],"answer":0,"explanation":"メモの要点に、都府県の5ha未満の経営体数は2000年以降一貫して減少したと書かれています。増加・横ばい・途中まで増加という動きではありません。","evidence":["5ha未満の経営体数は一貫して減"],"source":{"memo_id":"01-12","page":12,"print_page":12,"title":"都府県の経営耕地規模別経営体数の推移"}},{"id":"01-13-b1","memo_id":"01-13","genre_id":"01","level":"beginner","question":"メモの要点で、2005年から2025年にかけて全国の農業経営体数が増加したとされている層はどれか。","choices":["販売額3000万円以上の層","販売額3000万円未満の層","販売額50万円未満の層","農産物の販売なしの層"],"answer":0,"explanation":"要点には、販売額3000万円以上の層で経営体数が増加したと書かれています。3000万円未満の層、50万円未満の層、販売なしの層は、いずれも増加した層として書かれていません。","evidence":["2005年から2025年にかけて、農業経営体数は販売額3000万円以上の層で増加しており"],"source":{"memo_id":"01-13","page":13,"print_page":13,"title":"販売金額規模別の農業経営体数と法人割合"}},{"id":"01-13-b2","memo_id":"01-13","genre_id":"01","level":"beginner","question":"2025年の全国で、販売額1～5億円の農業経営体のうち、法人が占める割合はどれか。","choices":["6割強","9割強","4割弱","2割強"],"answer":0,"explanation":"要点には、2025年の1～5億円の経営体の6割強を法人が占めると書かれています。9割強は、5億円以上の経営体での法人の割合なので誤りです。","evidence":["2025年における１～５億円の経営体の６割強"],"source":{"memo_id":"01-13","page":13,"print_page":13,"title":"販売金額規模別の農業経営体数と法人割合"}},{"id":"01-13-a2","memo_id":"01-13","genre_id":"01","level":"advanced","question":"2005年から2025年にかけての、販売額5億円以上の農業経営体についての記述で、正しいものはどれか。","choices":["数は2倍以上に拡大し、2025年は9割強が法人","数は2倍以上に拡大し、2025年は6割強が法人","数は減少し、2025年は9割強が法人である","数は減少し、2025年は6割強が法人である"],"answer":0,"explanation":"5億円以上の層は2倍以上に拡大し、2025年はその9割強を法人が占めています。6割強は1～5億円の層での法人の割合です。また、この層の数は減少していません。","evidence":["の層は２倍以上に拡大している。","円以上の経営体の９割強は法人が占めている。"],"source":{"memo_id":"01-13","page":13,"print_page":13,"title":"販売金額規模別の農業経営体数と法人割合"}},{"id":"01-14-b1","memo_id":"01-14","genre_id":"01","level":"beginner","question":"昭和36年と比べて全国の農地面積が減少した主な要因として、メモに挙げられているものはどれか。","choices":["宅地等への転用や荒廃農地の発生等","農産物輸入の増加や米価の下落等","農業者の高齢化や後継者不足等","気候変動による干ばつや塩害等"],"answer":0,"explanation":"メモの要点には、農地面積は主に宅地等への転用や荒廃農地の発生等により減少したと書かれています。輸入・高齢化・気候変動はこのページでは減少要因として挙げられていません。","evidence":["農地面積は、主に宅地等への転用や荒廃農地の発生等により、昭和36年に比べて、約185万ha"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-14-b2","memo_id":"01-14","genre_id":"01","level":"beginner","question":"全国のかい廃面積が、減少傾向から増加に転じたのはいつからか。","choices":["平成11年から","平成25年から","平成29年から","令和元年から"],"answer":1,"explanation":"かい廃面積は基本法制定以降減少傾向にあったものの、平成25年から増加に転じました。平成11年は基本法制定の年、平成29年は3万ha以上で推移し始めた年であり、増加に転じた年ではありません。","evidence":["基本法制定以降減少傾向にあったものの、平成25年","から増加に転じ、平成29年以降は３万ha以上で推移。"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-14-i1","memo_id":"01-14","genre_id":"01","level":"intermediate","question":"全国の農地（耕地）面積が最大値だった昭和36年の面積（田畑計）はどれか。","choices":["608.6万ha","486.6万ha","423.9万ha","338.8万ha"],"answer":0,"explanation":"グラフでは昭和36年の608.6万ha（計）が最大値とされています。486.6万haは平成11年、423.9万haは令和7年の計、338.8万haは昭和36年の田の面積です。","evidence":["(計) (S36年：最大値)"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-14-i2","memo_id":"01-14","genre_id":"01","level":"intermediate","question":"農地（耕地）面積の推移のグラフで、令和7年の全国の田の面積はどれか。","choices":["193.9万ha","230.0万ha","265.9万ha","338.8万ha"],"answer":1,"explanation":"令和7年の田の面積は230.0万haです。193.9万haは令和7年の畑、265.9万haは平成11年の田、338.8万haは昭和36年の田の面積です。","evidence":["230.0万ha"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-14-a1","memo_id":"01-14","genre_id":"01","level":"advanced","question":"食料・農業・農村基本計画（令和7年4月閣議決定）で、令和12年時点の確保目標の農地面積は、令和6年現在の農地面積より何万ha少ないか。","choices":["約12万ha","約15万ha","約25万ha","約185万ha"],"answer":1,"explanation":"令和6年現在の農地面積は427万ha、令和12年時点の確保目標は412万haなので、差は約15万haです。約185万haは昭和36年からの減少幅であり、目標との差ではありません。","evidence":["令和６年現在の農地面積","令和12年時点で確保目標としている農地面積"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-14-a2","memo_id":"01-14","genre_id":"01","level":"advanced","question":"全国の農地面積とかい廃について、メモの内容として誤っているものはどれか。","choices":["令和7年の農地面積（田畑計）は423.9万haである","平成11年の農地面積（田畑計）は486.6万haである","かい廃とは田又は畑が他の地目に転換し栽培困難になった状態","昭和36年の田の面積は269.7万haである"],"answer":3,"explanation":"昭和36年の田の面積は338.8万haで、269.7万haは同年の畑の面積です。令和7年の計423.9万ha、平成11年の計486.6万ha、かい廃の定義はいずれもメモのとおりです。","evidence":["338.8万ha","269.7万ha"],"source":{"memo_id":"01-14","page":14,"print_page":14,"title":"農地面積とかい廃面積の推移"}},{"id":"01-15-b1","memo_id":"01-15","genre_id":"01","level":"beginner","question":"用語の定義で、「再生利用が可能な荒廃農地（A分類）」はどの区分に当たるとされているか。","choices":["1号遊休農地","2号遊休農地","耕作放棄地","再生困難な荒廃農地"],"answer":0,"explanation":"A分類の定義の末尾に「（１号遊休農地）」と書かれています。2号遊休農地は周辺に比べ利用の程度が著しく劣る農地で、別の区分です。","evidence":["作が可能となると見込まれるもの（１号遊休農地）"],"source":{"memo_id":"01-15","page":15,"print_page":15,"title":"荒廃農地等の状況"}},{"id":"01-15-b2","memo_id":"01-15","genre_id":"01","level":"beginner","question":"用語の定義で、農林業センサスの「耕作放棄地」は、以前耕作していた土地のうち、どのくらいの期間作付けしていない土地とされているか。","choices":["過去1年以上","過去3年以上","過去5年以上","過去10年以上"],"answer":0,"explanation":"耕作放棄地は「過去１年以上作付けせず、この数年の間に再び作付けする意思のない土地」と定義されています。3年・5年・10年という期間はメモにありません。","evidence":["以前耕作していた土地で、過去１年以上作付けせず、この数年の間に再び作付けする意思のない土"],"source":{"memo_id":"01-15","page":15,"print_page":15,"title":"荒廃農地等の状況"}},{"id":"01-15-i1","memo_id":"01-15","genre_id":"01","level":"intermediate","question":"令和6年度データの概念図で、全国の荒廃農地の面積はいくらか。","choices":["25.7万ha","10.5万ha","15.9万ha","9.8万ha"],"answer":0,"explanation":"概念図で荒廃農地は25.7万haです。10.5万haは遊休農地、15.9万haは再生困難な荒廃農地、9.8万haは再生可能な荒廃農地の面積です。","evidence":["荒廃農地 25.7万ha"],"source":{"memo_id":"01-15","page":15,"print_page":15,"title":"荒廃農地等の状況"}},{"id":"01-15-a1","memo_id":"01-15","genre_id":"01","level":"advanced","question":"令和6年度データの概念図について、誤っているものはどれか。","choices":["耕地の面積は427.2万haである","遊休農地の面積は10.5万haである","再生可能な荒廃農地は9.8万haである","2号遊休農地の面積は9.8万haである"],"answer":3,"explanation":"2号遊休農地は0.7万haで、9.8万haは1号遊休農地（再生可能な荒廃農地）の面積です。遊休農地10.5万haは1号と2号を合わせた面積です。","evidence":["遊休農地 10.5万ha","荒廃農地（再生可能） 9.8万ha"],"source":{"memo_id":"01-15","page":15,"print_page":15,"title":"荒廃農地等の状況"}},{"id":"01-15-a2","memo_id":"01-15","genre_id":"01","level":"advanced","question":"農林業センサスによる耕作放棄地面積の推移で、平成27年の全国の耕作放棄地面積はいくらか。","choices":["42.3万ha","39.6万ha","38.6万ha","34.3万ha"],"answer":0,"explanation":"表の平成27年の値は42.3万haです。39.6万haは平成22年、38.6万haは平成17年、34.3万haは平成12年の値です。","evidence":["・耕作放棄地面積の推移（農林業センサス）"],"source":{"memo_id":"01-15","page":15,"print_page":15,"title":"荒廃農地等の状況"}},{"id":"01-16-b1","memo_id":"01-16","genre_id":"01","level":"beginner","question":"全国の令和6年の耕地利用率は何％ですか。","choices":["90.4％","91.0％","94.5％","104.5％"],"answer":0,"explanation":"要点に令和6年の耕地利用率は90.4％と書かれています。91.0％は令和5年、94.5％は平成12年、104.5％は昭和55年の値です。","evidence":["万ha、耕地利用率は90.4％。"],"source":{"memo_id":"01-16","page":16,"print_page":16,"title":"農作物作付延べ面積と耕地利用率の推移"}},{"id":"01-16-b2","memo_id":"01-16","genre_id":"01","level":"beginner","question":"全国の農作物作付（栽培）延べ面積の動向として、このメモの要点に書かれているものはどれですか。","choices":["減少が続いている","増加が続いている","横ばいで推移している","近年は増加に転じている"],"answer":0,"explanation":"要点に延べ面積は減少が続いていると書かれています。表でも令和2年399.1万haから令和6年386.1万haまで毎年減っており、増加や横ばいではありません。","evidence":["農作物作付（栽培）延べ面積は減少が続いており"],"source":{"memo_id":"01-16","page":16,"print_page":16,"title":"農作物作付延べ面積と耕地利用率の推移"}},{"id":"01-16-i1","memo_id":"01-16","genre_id":"01","level":"intermediate","question":"全国の作付面積で、令和5年から令和6年にかけて増加した品目はどれですか。","choices":["水稲（子実用）","大豆（乾燥子実）","飼肥料作物","野菜"],"answer":0,"explanation":"水稲（子実用）は令和5年134.4万haから令和6年135.9万haに増えました。大豆は15.5→15.4万ha、飼肥料作物は101.8→97.6万ha、野菜は43.0→42.3万haといずれも減少しています。","evidence":["391.2\n134.4\n\n386.1\n135.9","29.6\n15.5\n6.7\n\n29.7\n15.4\n6.9","0.2\n204.8\n101.8\n43.0\n19.4\n91.0"],"source":{"memo_id":"01-16","page":16,"print_page":16,"title":"農作物作付延べ面積と耕地利用率の推移"}},{"id":"01-16-i2","memo_id":"01-16","genre_id":"01","level":"intermediate","question":"全国の令和6年の作付面積が、次の4品目の中で最も大きいものはどれですか。","choices":["飼肥料作物","野菜","麦類（4麦・子実用）","大豆（乾燥子実）"],"answer":0,"explanation":"令和6年は飼肥料作物が97.6万haで、4品目の中で最大です。野菜は42.3万ha、麦類は29.7万ha、大豆は15.4万haにとどまります。","evidence":["0.2\n198.0\n97.6\n42.3\n19.0\n90.4","29.6\n15.5\n6.7\n\n29.7\n15.4\n6.9"],"source":{"memo_id":"01-16","page":16,"print_page":16,"title":"農作物作付延べ面積と耕地利用率の推移"}},{"id":"01-16-a2","memo_id":"01-16","genre_id":"01","level":"advanced","question":"耕地利用率の定義（耕地面積を100とした延べ面積の割合）に照らすと、次の年のうち全国の作付延べ面積が耕地面積を上回っていた年はどれですか。","choices":["昭和55年","平成12年","平成22年","令和2年"],"answer":0,"explanation":"耕地利用率が100％を超えると延べ面積が耕地面積を上回ることになり、昭和55年は104.5％です。平成12年94.5％、平成22年92.2％、令和2年91.3％はいずれも100％未満です。","evidence":["耕地利用率は、耕地面積を「100」とした場合の作付（栽培）延べ面積の割合である。","0.2\n287.4\n103.4\n55.9\n42.2\n104.5"],"source":{"memo_id":"01-16","page":16,"print_page":16,"title":"農作物作付延べ面積と耕地利用率の推移"}},{"id":"01-17-b1","memo_id":"01-17","genre_id":"01","level":"beginner","question":"令和6年の田の耕地利用率は何％か。","choices":["92.7％","87.7％","90.4％","95.2％"],"answer":0,"explanation":"令和6年の田の耕地利用率は92.7％です。87.7％は畑の耕地利用率、90.4％は田畑を合わせた全体の耕地利用率です。","evidence":["令和６年の田耕地面積は231.9万ha、農作物作付（栽培）延べ面積は215.0万ha、耕地利用率は92.7％。"],"source":{"memo_id":"01-17","page":17,"print_page":17,"title":"令和6年の耕地面積の利用状況（田畑別）"}},{"id":"01-17-b2","memo_id":"01-17","genre_id":"01","level":"beginner","question":"令和6年の畑の農作物作付（栽培）延べ面積はどれか。","choices":["171.1万ha","195.2万ha","215.0万ha","386.1万ha"],"answer":0,"explanation":"令和6年の畑の作付延べ面積は171.1万haです。195.2万haは畑耕地面積、215.0万haは田の作付延べ面積、386.1万haは全体の作付延べ面積です。","evidence":["畑耕地面積は195.2万ha、農作物作付（栽培）延べ面積は171.1万ha、耕地利用率は87.7％。"],"source":{"memo_id":"01-17","page":17,"print_page":17,"title":"令和6年の耕地面積の利用状況（田畑別）"}},{"id":"01-17-i1","memo_id":"01-17","genre_id":"01","level":"intermediate","question":"令和6年の畑耕地面積の内訳（普通畑・樹園地・牧草地）で、面積が最も大きいものとその面積はどれか。","choices":["普通畑（111.8万ha）","牧草地（58.6万ha）","樹園地（24.9万ha）","牧草地（111.8万ha）"],"answer":0,"explanation":"畑の内訳は普通畑111.8万ha、牧草地58.6万ha、樹園地24.9万haで、普通畑が最も大きいです。111.8万haは牧草地ではなく普通畑の面積です。","evidence":["【普通畑面積：１１１.８万㌶】","【牧草地面積：５８.６万㌶】","【樹園地面積：２４.９万㌶】"],"source":{"memo_id":"01-17","page":17,"print_page":17,"title":"令和6年の耕地面積の利用状況（田畑別）"}},{"id":"01-17-i2","memo_id":"01-17","genre_id":"01","level":"intermediate","question":"令和6年の全国のかい廃面積3.5万haのうち、荒廃農地の面積はどれか。","choices":["1.4万ha","3.5万ha","2.4万ha","5.6万ha"],"answer":0,"explanation":"かい廃面積3.5万haのうち荒廃農地は1.4万haです。3.5万haはかい廃面積全体の値で、荒廃農地の値ではありません。","evidence":["かい廃面積：３.５万㌶ うち、荒廃農地：１.４万㌶"],"source":{"memo_id":"01-17","page":17,"print_page":17,"title":"令和6年の耕地面積の利用状況（田畑別）"}},{"id":"01-17-a1","memo_id":"01-17","genre_id":"01","level":"advanced","question":"令和6年の全国の作物別作付面積と、そのうち田での作付面積の組み合わせとして誤っているものはどれか。","choices":["麦類29.7万haのうち田は19.1万ha","大豆15.4万haのうち田は11.9万ha","そば6.9万haのうち田は4.0万ha","飼料作物97.6万haのうち田は72.4万ha"],"answer":3,"explanation":"田の飼料作物は25.2万haで、72.4万haは普通畑・牧草地の飼料作物（重複計上）の値です。麦類・大豆・そばの組み合わせはメモの全体値と田の値に一致します。","evidence":["うち、飼料作物：２５.２万㌶","・飼 料 作 物：７２.４万㌶"],"source":{"memo_id":"01-17","page":17,"print_page":17,"title":"令和6年の耕地面積の利用状況（田畑別）"}},{"id":"01-18-b1","memo_id":"01-18","genre_id":"01","level":"beginner","question":"メモによると、我が国の国土のうち森林が占める割合はどれくらいか。","choices":["約4分の1","約3分の1","約2分の1","約3分の2"],"answer":3,"explanation":"メモの要点に、我が国は国土の3分の2を森林が占める世界有数の森林国とあります。グラフでも森林は66％で、2分の1や3分の1より大きい割合です。","evidence":["我が国は国土の３分の２を森林が占める世界有数の森林国。"],"source":{"memo_id":"01-18","page":18,"print_page":18,"title":"国土・森林面積と排他的経済水域"}},{"id":"01-18-b2","memo_id":"01-18","genre_id":"01","level":"beginner","question":"メモによると、日本の排他的経済水域等（領海＋排他的経済水域）の面積は国土面積の約何倍か。","choices":["約3倍","約6倍","約12倍","約20倍"],"answer":2,"explanation":"要点に、日本の排他的経済水域等は国土面積の約12倍の約447万km²とあります。国土面積約37.8万km²の約12倍にあたり、3倍・6倍・20倍ではありません。","evidence":["日本の排他的経済水域等は、国土面積の約12倍の約447万k㎡。"],"source":{"memo_id":"01-18","page":18,"print_page":18,"title":"国土・森林面積と排他的経済水域"}},{"id":"01-18-i1","memo_id":"01-18","genre_id":"01","level":"intermediate","question":"「国土面積と森林面積の内訳」のグラフで、令和2年の国土面積（3,780万ha）のうち農地の面積はどれか。","choices":["197万ha","437万ha","643万ha","2,503万ha"],"answer":1,"explanation":"グラフでは農地は437万ha（12％）です。197万haは宅地、643万haはその他、2,503万haは森林の面積です。","evidence":["農地 437","（12％）"],"source":{"memo_id":"01-18","page":18,"print_page":18,"title":"国土・森林面積と排他的経済水域"}},{"id":"01-18-a1","memo_id":"01-18","genre_id":"01","level":"advanced","question":"「国別排他的経済水域等面積」の表で、カナダの排他的経済水域等（領海＋排他的経済水域）の面積はどれか。","choices":["447万km²","470万km²","483万km²","541万km²"],"answer":1,"explanation":"表ではカナダは470万km²です。447万km²は日本、483万km²はニュージーランド、541万km²はインドネシアの数値です。","evidence":["カナダ","470万k㎡"],"source":{"memo_id":"01-18","page":18,"print_page":18,"title":"国土・森林面積と排他的経済水域"}},{"id":"01-18-a2","memo_id":"01-18","genre_id":"01","level":"advanced","question":"このメモの国土・森林・排他的経済水域に関する記述のうち、誤っているものはどれか。","choices":["日本の国土面積は約37.8万km²である","表で最大の国は米国で762万km²である","森林面積のうち公有林は301万haである","令和2年の国土のうちその他は27％である"],"answer":3,"explanation":"国土面積の内訳グラフで「その他」は643万haで17％であり、27％は誤りです。国土面積約37.8万km²、米国762万km²、公有林301万ha（12％）はいずれもメモの記載どおりです。","evidence":["その他","（17％）"],"source":{"memo_id":"01-18","page":18,"print_page":18,"title":"国土・森林面積と排他的経済水域"}},{"id":"01-19-b1","memo_id":"01-19","genre_id":"01","level":"beginner","question":"令和8年度の農林水産関係当初予算の額はいくらか。","choices":["2兆2,956億円","3兆7,010億円","1兆7,843億円","2兆3,109億円"],"answer":0,"explanation":"令和8年度の農林水産関係当初予算は2兆2,956億円です。3兆7,010億円は昭和57年度のピーク時の額で、1兆7,843億円は令和8年度の農業関係予算だけの額です。","evidence":["令和８年度の農林水産関係当初予算は、２兆２，９５６億円（国の一般歳出の３．３％）。"],"source":{"memo_id":"01-19","page":19,"print_page":19,"title":"農林水産関係予算の推移（令和8年度当初）"}},{"id":"01-19-b2","memo_id":"01-19","genre_id":"01","level":"beginner","question":"令和8年度の農林水産関係当初予算は、ピーク時（昭和57年度）の予算額の何%にあたるか。","choices":["62%","78%","33%","14%"],"answer":0,"explanation":"令和8年度の予算は、ピーク時（昭和57年度、3兆7,010億円）の62%です。78%と14%は、令和8年度の予算のうち農業関係と林野関係が占める割合です。","evidence":["ピーク時（３兆７，０１０億円（昭和５７年度））の６２％。"],"source":{"memo_id":"01-19","page":19,"print_page":19,"title":"農林水産関係予算の推移（令和8年度当初）"}},{"id":"01-19-i1","memo_id":"01-19","genre_id":"01","level":"intermediate","question":"令和8年度の農林水産関係予算のうち、農業関係予算が占める割合は何%か。","choices":["78%","62%","14%","8%"],"answer":0,"explanation":"令和8年度の農業関係予算は1兆7,843億円で、全体の78%を占めます。14%は林野関係、8%は水産関係の割合で、62%はピーク時と比べた割合です。","evidence":["農業関係予算 １兆７，８４３億円（78％）"],"source":{"memo_id":"01-19","page":19,"print_page":19,"title":"農林水産関係予算の推移（令和8年度当初）"}},{"id":"01-19-a1","memo_id":"01-19","genre_id":"01","level":"advanced","question":"令和8年度の農林水産関係当初予算は、ピーク時（昭和57年度）の予算額と比べていくら少ないか。","choices":["1兆4,054億円","1兆3,017億円","1兆5,167億円","1兆2,054億円"],"answer":0,"explanation":"ピーク時の3兆7,010億円から令和8年度の2兆2,956億円を引くと、1兆4,054億円になります。ほかの選択肢は、この2つの額の差と一致しません。","evidence":["令和８年度の農林水産関係当初予算は、２兆２，９５６億円（国の一般歳出の３．３％）。","ピーク時（３兆７，０１０億円（昭和５７年度））の６２％。"],"source":{"memo_id":"01-19","page":19,"print_page":19,"title":"農林水産関係予算の推移（令和8年度当初）"}},{"id":"01-19-a2","memo_id":"01-19","genre_id":"01","level":"advanced","question":"令和8年度の農林水産関係予算と、このページの用語について述べた文のうち、誤っているものはどれか。","choices":["林野関係予算は3,249億円で、全体の14%である","水産関係予算は1,864億円で、全体の8%である","一般歳出は、一般会計歳出から国債費等を除いたもの","水産関係予算は、林野関係予算より額が大きい"],"answer":3,"explanation":"水産関係予算は1,864億円、林野関係予算は3,249億円なので、林野関係予算のほうが大きく、4つ目の文が誤りです。ほかの3つの文は、参考欄と注3の記載のとおりです。","evidence":["３，２４９億円（14％）","１，８６４億円 （8％）"],"source":{"memo_id":"01-19","page":19,"print_page":19,"title":"農林水産関係予算の推移（令和8年度当初）"}},{"id":"01-20-b1","memo_id":"01-20","genre_id":"01","level":"beginner","question":"令和6年の農業産出額の都道府県別順位で、1位から3位までの並びとして正しいものはどれか。","choices":["北海道、鹿児島、茨城","北海道、茨城、鹿児島","北海道、鹿児島、千葉","鹿児島、北海道、茨城"],"answer":0,"explanation":"令和6年の順位は1位が北海道、次いで鹿児島、茨城です。千葉は4位で、鹿児島と茨城の順を入れ替えたものや北海道を2位とするものも誤りです。","evidence":["令和６年の農業産出額の都道府県別順位は、１位が北海道、次いで鹿児島、茨城。"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-20-b2","memo_id":"01-20","genre_id":"01","level":"beginner","question":"令和6年の農業産出額上位道県のうち、野菜が1位部門とされている県の組合せはどれか。","choices":["茨城及び熊本","北海道及び千葉","鹿児島及び茨城","千葉及び熊本"],"answer":0,"explanation":"野菜が1位部門とされているのは茨城及び熊本です。北海道、鹿児島及び千葉は畜産が1位部門なので、これらを含む組合せは誤りです。","evidence":["上位道県の主要部門は畜産と野菜であり、北海道、鹿児島及び千葉は畜産、茨城及び","熊本は野菜が１位部門。"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-20-i1","memo_id":"01-20","genre_id":"01","level":"intermediate","question":"令和6年の北海道の農業産出額（億円）はどれか。","choices":["14,817億円","13,478億円","15,478億円","12,817億円"],"answer":0,"explanation":"表の令和6年の欄で北海道の産出額は14,817億円です。13,478億円は令和5年の値であり、ほかの2つは表にない数値です。","evidence":["北海道\n\n13,478\n\n北海道\n\n14,817"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-20-i2","memo_id":"01-20","genre_id":"01","level":"intermediate","question":"令和6年の主要部門別の農業産出額構成比で、乳用牛（生乳を含む）に占める北海道の割合はどれか。","choices":["54.4%","15.9%","9.3%","12.2%"],"answer":0,"explanation":"乳用牛の構成比では北海道が54.4%を占めます。15.9%は肉用牛、9.3%は野菜での北海道の割合で、12.2%は果実での青森の割合です。","evidence":["北海道\n54.4\n\n乳用牛","注：乳用牛には生乳、鶏には鶏卵、ブロイラーを含む。"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-20-a1","memo_id":"01-20","genre_id":"01","level":"advanced","question":"農業産出額上位10都道府県の表で、令和5年は7位だったが令和6年は5位となった県はどれか。","choices":["青森県","熊本県","宮崎県","愛知県"],"answer":0,"explanation":"青森県は令和5年の7位（3,466億円）から令和6年は5位（4,119億円）になりました。熊本県は5位から6位、宮崎県は6位から7位に下がり、愛知県は両年とも8位です。","evidence":["5\n\n熊本県\n\n3,757\n\n青森県\n\n4,119","7\n\n青森県\n\n3,466\n\n宮崎県\n\n3,725"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-20-a2","memo_id":"01-20","genre_id":"01","level":"advanced","question":"令和6年の農業産出額上位10都道府県の表について、誤っているものはどれか。","choices":["千葉県は4位で、産出額は4,533億円","熊本県は6位で、産出額は4,116億円","宮崎県は6位で、産出額は3,720億円","栃木県は9位で、産出額は3,448億円"],"answer":2,"explanation":"令和6年の宮崎県は7位で3,725億円であり、6位・3,720億円は令和5年の値です。千葉県、熊本県、栃木県の記述は令和6年の表と一致します。","evidence":["6\n\n宮崎県\n\n3,720\n\n熊本県\n\n4,116","7\n\n青森県\n\n3,466\n\n宮崎県\n\n3,725"],"source":{"memo_id":"01-20","page":20,"print_page":20,"title":"農業産出額の都道府県別順位（令和6年）"}},{"id":"01-21-b1","memo_id":"01-21","genre_id":"01","level":"beginner","question":"25年前（2000年）と比較して、国内生産量が増加した品目はどれか。","choices":["小麦","米","野菜","果実"],"answer":0,"explanation":"要点では小麦・豚肉・鶏肉の国内生産量が増加したとされています。米・野菜・果実はいずれも減少した品目として挙げられています。","evidence":["25年前（2000年）と比較して、小麦、豚肉、鶏肉の国内生産量については増加。"],"source":{"memo_id":"01-21","page":21,"print_page":21,"title":"主要農畜産物の流通状況（2000年比較）"}},{"id":"01-21-i1","memo_id":"01-21","genre_id":"01","level":"intermediate","question":"表に示された牛肉の国内生産量（枝肉ベース）はどれか。","choices":["500千トン","350千トン","726千トン","1,199千トン"],"answer":0,"explanation":"牛肉の国内生産量は500千トン(350千トン)で、枝肉ベースが500千トン、（ ）内の350千トンは部分肉ベースです。726千トンは輸入量、1,199千トンは国内消費量です。","evidence":["500千トン(350千トン)","７：牛肉と豚肉の国内生産量、輸入量及び国内消費量は枝肉ベース。（ ）内は部分肉ベース。"],"source":{"memo_id":"01-21","page":21,"print_page":21,"title":"主要農畜産物の流通状況（2000年比較）"}},{"id":"01-21-i2","memo_id":"01-21","genre_id":"01","level":"intermediate","question":"表に示された鶏卵の飼養羽数はどれか。","choices":["175,256千羽","139,599千羽","157,526千羽","125,256千羽"],"answer":0,"explanation":"表の鶏卵の行では飼養羽数は175,256千羽です。139,599千羽は鶏肉の行の数値で、残りは表にない数値です。","evidence":["175,256千羽※注９","139,599千羽※注８"],"source":{"memo_id":"01-21","page":21,"print_page":21,"title":"主要農畜産物の流通状況（2000年比較）"}},{"id":"01-21-a1","memo_id":"01-21","genre_id":"01","level":"advanced","question":"2000年と比べて国内生産量が増加した品目で、表中の国内生産量が「1,281千トン(897千トン)」と示されている品目はどれか。","choices":["豚肉","牛肉","鶏肉","小麦"],"answer":0,"explanation":"豚肉は2000年比で増加した品目で、国内生産量は1,281千トン(897千トン)です。牛肉は減少した品目で500千トン、鶏肉は1,716千トン、小麦は1,031千トンです。","evidence":["25年前（2000年）と比較して、小麦、豚肉、鶏肉の国内生産量については増加。","1,281千トン(897千トン)"],"source":{"memo_id":"01-21","page":21,"print_page":21,"title":"主要農畜産物の流通状況（2000年比較）"}},{"id":"01-21-a2","memo_id":"01-21","genre_id":"01","level":"advanced","question":"このページの米と子実とうもろこしに関する説明として、誤っているものはどれか。","choices":["米の生産面積は147.1万haである","米の生産面積に飼料用米の面積は含まない","米の国内生産量は備蓄用米や加工用米を含む","子実とうもろこしは2000年比較から除かれる"],"answer":1,"explanation":"注１で米の生産面積は水陸稲（子実用）作付面積と飼料用米の作付面積の合計とされており、飼料用米を含みます。そのほかの選択肢は表・注記・要点の記載どおりです。","evidence":["注１：米の生産面積は、作物統計の水陸稲（子実用）作付面積及び飼料用米の作付面積の合計。"],"source":{"memo_id":"01-21","page":21,"print_page":21,"title":"主要農畜産物の流通状況（2000年比較）"}},{"id":"02-01-b1","memo_id":"02-01","genre_id":"02","level":"beginner","question":"2024年の世界の主要穀物等の需要量の伸び（1970年比）は、総人口の伸び率と比べてどうなっているか。","choices":["総人口の伸び率を上回っている","総人口の伸び率を下回っている","総人口の伸び率とほぼ同じである","総人口の伸び率の半分程度である"],"answer":0,"explanation":"メモでは、小麦・米・とうもろこし・大豆の需要量がいずれも総人口の伸び率2.2を上回って増加したとしています。下回る・同程度とする選択肢は記述と逆です。","evidence":["とうもろこしが4.6倍、大豆が9.0倍とそれぞれ増加しており、総人口の伸び率2.2％を上回って増加。"],"source":{"memo_id":"02-01","page":1,"print_page":22,"title":"世界の穀物等の需給と世界人口の動向"}},{"id":"02-01-b2","memo_id":"02-01","genre_id":"02","level":"beginner","question":"世界の穀物等の生産量と需要量の関係について、近年の状況として正しいものはどれか。","choices":["生産量と需要量がほぼ均衡している","生産量が需要量を大きく上回っている","需要量が生産量を大きく上回っている","生産量が減少し需要量が増加している"],"answer":0,"explanation":"近年は生産量と需要量がほぼ均衡しているとされています。生産量が需要量をやや上回っていたのはCOVID-19パンデミック以前であり、生産量も増加しているため減少とする選択肢も誤りです。","evidence":["パンデミック以前は生産量が需要量をやや上回り、近年は生産量と需要量がほぼ均衡。","需要量の増加に対して、生産量も増加。"],"source":{"memo_id":"02-01","page":1,"print_page":22,"title":"世界の穀物等の需給と世界人口の動向"}},{"id":"02-01-i1","memo_id":"02-01","genre_id":"02","level":"intermediate","question":"「穀物及び大豆の需要の品目別内訳」のグラフで、2024年の世界の需要量が最も多い品目はどれか。","choices":["とうもろこし","小麦","米","大豆"],"answer":0,"explanation":"2024年はとうもろこしが1,251百万トンで最も多く、小麦801百万トン、米527百万トン、大豆414百万トンを上回ります。小麦は1960年や1970年には最大でしたが、2024年は2位です。","evidence":["○ 穀物及び大豆の需要の品目別内訳"],"source":{"memo_id":"02-01","page":1,"print_page":22,"title":"世界の穀物等の需給と世界人口の動向"}},{"id":"02-01-a1","memo_id":"02-01","genre_id":"02","level":"advanced","question":"2024年の世界の需要量を1970年と比べたとき、メモに示された4品目のうち、伸び（倍率）が最も小さい品目はどれか。","choices":["小麦","米","とうもろこし","大豆"],"answer":0,"explanation":"倍率は小麦2.4倍、米2.5倍、とうもろこし4.6倍、大豆9.0倍で、最も小さいのは小麦です。米は2.5倍と小麦に近いですが、わずかに上回ります。","evidence":["2024年における世界の主要穀物等の需要量は、1970年に比べ、小麦が2.4倍、米が2.5倍、","とうもろこしが4.6倍、大豆が9.0倍とそれぞれ増加しており"],"source":{"memo_id":"02-01","page":1,"print_page":22,"title":"世界の穀物等の需給と世界人口の動向"}},{"id":"02-02-b1","memo_id":"02-02","genre_id":"02","level":"beginner","question":"このメモで、日本の対GDP比でみた農林水産業総生産の割合は、他の欧米諸国と比べてどう整理されているか。","choices":["他の欧米諸国と同程度","他の欧米諸国より高い水準","他の欧米諸国より低い水準","他の欧米諸国の約2倍"],"answer":0,"explanation":"要点に、対GDP比でみた農林水産業総生産の割合は他の欧米諸国と同程度と書かれています。低い水準とされているのは農用地面積の割合や平均経営面積であり、混同しないよう注意が必要です。","evidence":["対GDP比でみた農林水産業総生産の割合は、他の欧米諸国と同程度。"],"source":{"memo_id":"02-02","page":2,"print_page":23,"title":"農業の経済的位置付けに関する国際比較"}},{"id":"02-02-b2","memo_id":"02-02","genre_id":"02","level":"beginner","question":"このメモで、日本の国土面積に占める農用地面積の割合は、欧米諸国と比べてどう整理されているか。","choices":["欧米諸国と比べて低い水準","欧米諸国と比べて高い水準","欧米諸国と同程度の水準","欧米諸国を大きく上回る水準"],"answer":0,"explanation":"要点に、国土面積に占める農用地面積の割合や平均経営面積は欧米諸国と比べて低い水準とあります。欧米諸国と同程度とされているのは対GDP比でみた農林水産業総生産の割合です。","evidence":["国土面積に占める農用地面積の割合や平均経営面積は、欧米諸国と比べて低い水準。"],"source":{"memo_id":"02-02","page":2,"print_page":23,"title":"農業の経済的位置付けに関する国際比較"}},{"id":"02-02-i2","memo_id":"02-02","genre_id":"02","level":"intermediate","question":"国際比較の表で、日本の農林漁業就業者数（万人）はいくつか。","choices":["195万人","151万人","266万人","698万人"],"answer":0,"explanation":"表の農林漁業就業者数の行で、日本は195万人です。151万人は韓国、266万人は米国、698万人はEU(27)の値です。","evidence":["農林漁業就業者数\n（万人）\n\n195"],"source":{"memo_id":"02-02","page":2,"print_page":23,"title":"農業の経済的位置付けに関する国際比較"}},{"id":"02-03-b1","memo_id":"02-03","genre_id":"02","level":"beginner","question":"2024年の我が国（日本）の農産物純輸入額はいくらか。","choices":["518億ドル","581億ドル","63億ドル","400億ドル"],"answer":0,"explanation":"2024年の我が国の農産物純輸入額は518億ドルです。581億ドルは日本の輸入額、63億ドルは日本の輸出額、400億ドルは米国の純輸入額です。","evidence":["我が国の農産物純輸入額は2024年で518億ドルであり、世界有数の食料輸入国。"],"source":{"memo_id":"02-03","page":3,"print_page":24,"title":"世界の農産物輸出入と日本の純輸入額"}},{"id":"02-04-b1","memo_id":"02-04","genre_id":"02","level":"beginner","question":"令和7年（2025年）における我が国の農産物輸入額はいくらか。","choices":["9兆8,431億円","8兆9,431億円","6兆1,950億円","5兆9,950億円"],"answer":0,"explanation":"要点に令和7年の農産物輸入額は9兆8,431億円と書かれています。6兆1,950億円や5兆9,950億円は豚肉やとうもろこしの輸入額の桁を変えたもので、農産物全体の額ではありません。","evidence":["令和７年（２０２５年)における我が国の農産物輸入額は、９兆８，４３１億円となっており"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-04-b2","memo_id":"02-04","genre_id":"02","level":"beginner","question":"令和7年（2025年）の要点で、良好な関係にある国からの輸入が大きい主要農産物として挙げられているものはどれか。","choices":["小麦","米","鶏肉","砂糖"],"answer":0,"explanation":"要点では、とうもろこし、大豆、小麦、豚肉、牛肉が主要農産物として挙げられています。米・鶏肉・砂糖はこのページの要点に挙げられていません。","evidence":["とうもろこし、大豆、小麦、豚肉、牛肉などの主要農産物で見ると良好な関係にある国からの輸入が大きい。"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-04-i1","memo_id":"02-04","genre_id":"02","level":"intermediate","question":"2025年の我が国の小麦の国別輸入割合で、最も割合が大きい国はどこか。","choices":["カナダ","米国","豪州","ブラジル"],"answer":0,"explanation":"小麦はカナダが40.2%で最も大きく、米国37.9%、豪州21.7%が続きます。米国は僅差の2位で、ブラジルは小麦のグラフには出てきません。","evidence":["ブラジル 10.1% カナダ 40.2%","メキシコ 10.6% 米国 37.9%"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-04-i2","memo_id":"02-04","genre_id":"02","level":"intermediate","question":"2025年の我が国の牛肉の国別輸入割合で、豪州の割合は何%か。","choices":["49.4%","36.0%","21.7%","40.2%"],"answer":0,"explanation":"牛肉では豪州が49.4%で最も大きい割合です。36.0%は牛肉の米国の割合、21.7%は小麦の豪州の割合、40.2%は小麦のカナダの割合です。","evidence":["米国 20.4% 豪州 49.4%"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-04-a1","memo_id":"02-04","genre_id":"02","level":"advanced","question":"2025年の我が国の主要農産物の国別輸入割合について、誤っているものはどれか。","choices":["とうもろこしは米国からの輸入が97.1%を占める","大豆はカナダ16.4%がブラジル16.1%を上回る","豚肉は米国からの輸入割合が最も大きい","牛肉の輸入額は4,658億円である"],"answer":2,"explanation":"豚肉で最も割合が大きいのはカナダの26.6%で、米国は20.4%なので誤りです。とうもろこしの米国97.1%、大豆のカナダ16.4%とブラジル16.1%、牛肉の輸入額4,658億円はいずれもグラフのとおりです。","evidence":["豪州 21.7% カナダ 26.6%","米国 20.4% 豪州 49.4%"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-04-a2","memo_id":"02-04","genre_id":"02","level":"advanced","question":"2025年の我が国の主要農産物のうち、次の4品目で輸入額が最も大きいものはどれか。","choices":["豚肉","とうもろこし","牛肉","大豆"],"answer":0,"explanation":"輸入額は豚肉6,195億円が最も大きく、とうもろこし5,995億円が僅差で続きます。牛肉は4,658億円、大豆は2,667億円でさらに小さくなります。","evidence":["輸入額 6,195億円 4,658億円","カナダ 16.4% 5,995億円"],"source":{"memo_id":"02-04","page":4,"print_page":25,"title":"主要農産物の国別輸入割合（2025年）"}},{"id":"02-05-b1","memo_id":"02-05","genre_id":"02","level":"beginner","question":"一口メモで、2022年に小麦の価格が史上最高値を更新した要因として挙げられているものはどれか。","choices":["ロシアのウクライナ侵攻","ブラジル等の豊作","世界的な豊作","臨時回廊等による輸出再開"],"answer":0,"explanation":"小麦は2022年、ウクライナ侵攻により史上最高値を更新したとされています。ブラジル等の豊作、世界的な豊作、臨時回廊等による輸出再開は、いずれも価格が下落した要因として書かれています。","evidence":["小麦は、2022年、ウクライナ侵攻により史上最高値を更新も、ウクライナからの臨時回廊等による"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-05-b2","memo_id":"02-05","genre_id":"02","level":"beginner","question":"一口メモで、とうもろこしと大豆がウクライナ侵攻時に高騰した後、侵攻前の水準まで下落した要因として挙げられているものはどれか。","choices":["ブラジル等の豊作","米国の高温乾燥","中国の輸入需要の増加","欧州の熱波"],"answer":0,"explanation":"とうもろこし、大豆は侵攻時に高騰したものの、ブラジル等の豊作から侵攻前の水準まで下落したとされています。米国の高温乾燥、中国の輸入需要の増加、欧州の熱波は、価格を押し上げた要因として書かれています。","evidence":["とうもろこし、大豆は、ウクライナ侵攻時に高騰も、ブラジル等の豊作から侵攻前の水準まで下落。"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-05-i1","memo_id":"02-05","genre_id":"02","level":"intermediate","question":"2026年8月7日現在の大豆の国際価格（1ブッシェル当たり）はいくらか。","choices":["11.6ドル","6.4ドル","4.4ドル","17.7ドル"],"answer":0,"explanation":"2026年8月7日現在の大豆の価格は11.6ドルです。6.4ドルは小麦、4.4ドルはとうもろこしの現在価格で、17.7ドルは大豆の過去最高値です。","evidence":["2026年８月７日\n現在の価格。","大豆\n11.6ドル\n17.7ドル\n(2012.9.4)"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-05-i2","memo_id":"02-05","genre_id":"02","level":"intermediate","question":"小麦の国際価格の過去最高値（1ブッシェル当たり）はいくらか。","choices":["14.3ドル","17.7ドル","8.3ドル","6.4ドル"],"answer":0,"explanation":"小麦の過去最高値は2022年3月7日の14.3ドルです。17.7ドルは大豆、8.3ドルはとうもろこしの過去最高値で、6.4ドルは小麦の2026年8月7日現在の価格です。","evidence":["小麦\n6.4ドル\n14.3ドル\n(2022.3.7)","□内は過去最高値。"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-05-a1","memo_id":"02-05","genre_id":"02","level":"advanced","question":"2026年8月7日現在の大豆の国際価格は、大豆の過去最高値と比べて1ブッシェル当たり何ドル低いか。","choices":["6.1ドル","7.9ドル","3.9ドル","5.3ドル"],"answer":0,"explanation":"大豆は現在11.6ドル、過去最高値は17.7ドルなので、差は6.1ドルです。7.9ドルは小麦（14.3−6.4）、3.9ドルはとうもろこし（8.3−4.4）の差で、5.3ドルは計算に合いません。","evidence":["大豆\n11.6ドル\n17.7ドル\n(2012.9.4)","2026年８月７日\n現在の価格。"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-05-a2","memo_id":"02-05","genre_id":"02","level":"advanced","question":"一口メモの穀物等の国際価格の動向について、誤っているものはどれか。","choices":["とうもろこしと大豆は2012年に史上最高値を記録した","2020年後半から南米の乾燥や中国の輸入需要の増加等で上昇した","直近の小麦は欧州の熱波による作柄懸念等で上昇傾向にある","小麦は輸出再開後も侵攻前の水準を上回ったまま推移している"],"answer":3,"explanation":"小麦はウクライナからの臨時回廊等による輸出再開などもあり、侵攻前の水準まで下落したとされているため、4つ目が誤りです。ほかの3つは要点の記述どおりです。","evidence":["輸出再開などもあり侵攻前の水準まで下落。"],"source":{"memo_id":"02-05","page":5,"print_page":26,"title":"穀物等の国際価格の動向（小麦・大豆等）"}},{"id":"02-06-b1","memo_id":"02-06","genre_id":"02","level":"beginner","question":"令和7年度の我が国のカロリーベース食料自給率はどれか。","choices":["37%","45%","66%","73%"],"answer":0,"explanation":"令和7年度のカロリーベース食料自給率は37%です。45%は摂取熱量ベース、66%は生産額ベースの値です。","evidence":["令和７年度にはカロリーベースで","37％、生産額ベースで66％、摂取熱量ベースで45％。"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-06-b2","memo_id":"02-06","genre_id":"02","level":"beginner","question":"我が国の食料自給率は、長期的にはどのように推移しているか。","choices":["長期的には低下傾向で推移","長期的には上昇傾向で推移","長期的にはほぼ横ばいで推移","長期的には急上昇の後に横ばい"],"answer":0,"explanation":"メモでは、我が国の食料自給率は長期的には低下傾向で推移しているとされています。上昇や横ばいとは書かれていません。","evidence":["我が国の食料自給率は、長期的には低下傾向で推移しており"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-06-i1","memo_id":"02-06","genre_id":"02","level":"intermediate","question":"食料・農業・農村基本計画における生産額ベースの食料自給率の2030年度目標はどれか。","choices":["61%","66%","69%","53%"],"answer":2,"explanation":"生産額ベースの目標は2023年度61%から2030年度69%です。61%は2023年度の値、66%は令和7年度の実績、53%は摂取熱量ベースの目標です。","evidence":["：61% → 69%","食料の国内生産額（11.1兆円）"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-06-i2","memo_id":"02-06","genre_id":"02","level":"intermediate","question":"供給熱量ベースの食料自給率の計算式で、分子に用いる国産供給熱量（1人1日当たり）はどれか。","choices":["841kcal","1,850kcal","2,203kcal","1,111kcal"],"answer":0,"explanation":"分子の国産供給熱量は841kcal/人・日です。2,203kcalは分母の国内消費仕向熱量、1,850kcalは摂取熱量ベースの分母の値です。","evidence":["国産供給熱量（841kcal/人・日)","（2,203kcal/人・日）"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-06-a1","memo_id":"02-06","genre_id":"02","level":"advanced","question":"令和7年度の摂取熱量ベース食料自給率は、基本計画の2030年度目標まであと何ポイント足りないか。","choices":["8ポイント","7ポイント","3ポイント","16ポイント"],"answer":0,"explanation":"令和7年度の摂取熱量ベースは45%、2030年度目標は53%なので差は8ポイントです。3ポイントは生産額ベース（66%と69%）の差と混同した値です。","evidence":["37％、生産額ベースで66％、摂取熱量ベースで45％。","：45% → 53%"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-06-a2","memo_id":"02-06","genre_id":"02","level":"advanced","question":"食料・農業・農村基本計画の食料自給率目標（2023年度→2030年度）の説明として誤っているものはどれか。","choices":["摂取熱量ベースの分母は1,850kcal/人・日","生産額ベースの分子は国内生産額11.1兆円","供給熱量ベースの分母は2,203kcal/人・日","供給熱量ベースの2023年度の値は45%"],"answer":3,"explanation":"供給熱量ベースは2023年度38%で、45%は2030年度の目標です。ほかの3つは計算式に示された数値どおりです。","evidence":["：38% → 45%"],"source":{"memo_id":"02-06","page":6,"print_page":27,"title":"我が国の食料自給率の推移と目標"}},{"id":"02-07-b1","memo_id":"02-07","genre_id":"02","level":"beginner","question":"このメモで、国産化が難しい品目についての今後の対応として重要とされているものはどれか。","choices":["安定的な輸入を行っていくこと","輸入を止め国産へ全面転換すること","その品目の消費を制限していくこと","輸入先を国内の備蓄で代替すること"],"answer":0,"explanation":"メモは、輸入農産物の国産化を推進する一方、国産化が難しい品目は安定的な輸入を行うことが重要としています。すべてを国産で賄うことは不可能とされているため、全面的な国産転換は誤りです。","evidence":["国産化が難しい品目については、安定的な輸入","を行っていくことが重要。"],"source":{"memo_id":"02-07","page":7,"print_page":28,"title":"食料自給率の変化と必要な農地面積"}},{"id":"02-07-b2","memo_id":"02-07","genre_id":"02","level":"beginner","question":"現在の食生活を前提とした場合、国内で消費される食料全てを生産するために必要な農地面積は、国内の農地面積の約何倍に相当するか。","choices":["約1.3倍","約2.1倍","約3.1倍","約4.2倍"],"answer":2,"explanation":"必要な農地面積は国内の農地面積の約3.1倍に相当するとされています。そのため、すべてを国産で賄うことは不可能と述べられています。","evidence":["国内の農地面積の約3.1倍に相当し、すべてを国産で賄うことは不可能。"],"source":{"memo_id":"02-07","page":7,"print_page":28,"title":"食料自給率の変化と必要な農地面積"}},{"id":"02-07-i1","memo_id":"02-07","genre_id":"02","level":"intermediate","question":"カロリーベース食料自給率は、昭和40年度から令和7年度にかけてどう変化したか。","choices":["73％から37％に低下した","37％から73％に上昇した","73％から47％に低下した","47％から37％に低下した"],"answer":0,"explanation":"昭和40年度は73％、令和7年度は37％で、自給率は低下しています。47％は昭和40年度の畜産物の品目別自給率であり、総合のカロリーベース自給率ではありません。","evidence":["（カロリーベース食料自給率 73％）","（カロリーベース食料自給率 37％）"],"source":{"memo_id":"02-07","page":7,"print_page":28,"title":"食料自給率の変化と必要な農地面積"}},{"id":"02-07-i2","memo_id":"02-07","genre_id":"02","level":"intermediate","question":"令和7年度の供給熱量（1人1日当たり、国産分を含む全体）はどれか。","choices":["2,459kcal","2,237kcal","1,799kcal","830kcal"],"answer":1,"explanation":"令和7年度の供給熱量は2,237kcal/人・日です。2,459kcalは昭和40年度の供給熱量、830kcalは令和7年度の国産供給熱量です。","evidence":["供給熱量 2,237kcal / 人・日"],"source":{"memo_id":"02-07","page":7,"print_page":28,"title":"食料自給率の変化と必要な農地面積"}},{"id":"02-07-a1","memo_id":"02-07","genre_id":"02","level":"advanced","question":"令和7年度の国産供給熱量（1人1日当たり）はどれか。","choices":["830kcal","1,799kcal","2,237kcal","1,090kcal"],"answer":0,"explanation":"令和7年度の国産供給熱量は830kcal/人・日です。1,799kcalは昭和40年度の国産供給熱量、2,237kcalは令和7年度の供給熱量全体なので、年や項目を取り違えた数値です。","evidence":["［国産供給熱量 830kcal / 人・日］","［国産供給熱量 1,799kcal / 人・日］"],"source":{"memo_id":"02-07","page":7,"print_page":28,"title":"食料自給率の変化と必要な農地面積"}},{"id":"02-08-b1","memo_id":"02-08","genre_id":"02","level":"beginner","question":"一口メモで公表しているとされる「食料国産率」の説明として正しいものはどれか。","choices":["輸入飼料による畜産物の生産分を除かない率","輸入飼料による畜産物の生産分を除いた率","国産飼料の供給量を飼料供給量で割った率","輸入食料の供給熱量を供給熱量で割った率"],"answer":0,"explanation":"食料国産率は、輸入飼料による畜産物の生産分を除かずに計算する指標です。輸入飼料分を除いて計算するのは飼料自給率を考慮した食料自給率の考え方であり、国産飼料の割合は飼料自給率にあたります。","evidence":["輸入飼料による畜産物の生産分を除かない「食料国産率」を公表"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-08-b2","memo_id":"02-08","genre_id":"02","level":"beginner","question":"一口メモによると、食料国産率を公表するようになったのは何以降か。","choices":["令和２年食料・農業・農村基本計画以降","令和２年食料・農業・農村基本法改正以降","平成２年食料・農業・農村基本計画以降","令和元年食料安全保障強化政策大綱以降"],"answer":0,"explanation":"要点に「令和２年食料・農業・農村基本計画以降」と書かれています。基本法の改正や平成の計画、大綱ではありません。","evidence":["令和２年食料・農業・農村基本計画以降"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-08-i1","memo_id":"02-08","genre_id":"02","level":"intermediate","question":"一口メモに示された、生産額ベースの食料国産率はどれか。","choices":["24％","37％","46％","71％"],"answer":3,"explanation":"生産額ベースの食料国産率は、国内生産額15.4兆円を国内消費仕向額21.8兆円で割った71％です。46％はカロリーベースの食料国産率、24％は飼料自給率、37％は総合のカロリーベース食料自給率です。","evidence":["食料の国内生産額（15.4兆円）","食料の国内消費仕向額（21.8兆円）"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-08-i2","memo_id":"02-08","genre_id":"02","level":"intermediate","question":"一口メモの表で、畜産物の品目（牛肉・豚肉・鶏肉・鶏卵・牛乳・乳製品）のうち、カロリーベースの食料国産率が最も高いものはどれか。","choices":["牛肉","鶏肉","鶏卵","牛乳・乳製品"],"answer":2,"explanation":"鶏卵のカロリーベース食料国産率は97％で、品目の中で最も高くなっています。牛乳・乳製品は66％、鶏肉は65％、牛肉は50％です。","evidence":["鶏卵 11％ 97％ 86ポイント","牛乳・乳製品 30％ 66％ 36ポイント"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-08-a1","memo_id":"02-08","genre_id":"02","level":"advanced","question":"一口メモの表（カロリーベース）について、誤っているものはどれか。","choices":["総合の食料自給率と食料国産率の差は49ポイント","牛肉の食料国産率は50％","鶏肉の食料自給率と食料国産率の差は58ポイント","牛乳・乳製品の食料自給率は30％"],"answer":0,"explanation":"総合の差は37％と46％の差で9ポイントです。49ポイントは畜産物全体の差であり、ほかの3つは表の数値どおりです。","evidence":["総合 37％ 46％ ９ポイント","畜産物 17％ 66％ 49ポイント"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-08-a2","memo_id":"02-08","genre_id":"02","level":"advanced","question":"一口メモの表で、豚肉のカロリーベース食料自給率はどれか。","choices":["５％","７％","13％","17％"],"answer":0,"explanation":"豚肉のカロリーベース食料自給率は5％（食料国産率は49％）です。7％は鶏肉、13％は牛肉、17％は畜産物全体の食料自給率です。","evidence":["豚肉 ５％ 49％ 44ポイント","鶏肉 ７％ 65％ 58ポイント"],"source":{"memo_id":"02-08","page":8,"print_page":29,"title":"食料国産率と飼料自給率"}},{"id":"02-09-b1","memo_id":"02-09","genre_id":"02","level":"beginner","question":"現在、国として備蓄事業を実施している品目の組み合わせはどれか。","choices":["米、食糧用小麦、飼料穀物","米、大豆、飼料穀物","米、食糧用小麦、大豆","食糧用小麦、大豆、飼料穀物"],"answer":0,"explanation":"メモでは、米、食糧用小麦、飼料穀物の3品目について国として備蓄事業を実施しているとしています。大豆を含む組み合わせはメモに記載がなく誤りです。","evidence":["現在、米、食糧用小麦、飼料穀物について国として備蓄事業を実施。"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-09-b2","memo_id":"02-09","genre_id":"02","level":"beginner","question":"多くを輸入に依存している食糧用小麦と飼料穀物の備蓄水準は、基本的にどのような水準として設定されているか。","choices":["国産品をもって国内の不作に対処し得る水準","不測時に代替輸入先からの輸入を確保するまでの期間に対処し得る水準","国内の年間需要量の全量をまかない得る水準","国際価格が高騰した期間の購入を控え得る水準"],"answer":1,"explanation":"輸入依存の食糧用小麦と飼料穀物は、代替輸入先からの輸入を確保するまでの期間に対処し得る水準を基本としています。国内の不作に国産で対処する考え方は、自給している米の水準です。","evidence":["多くを輸入に依存している食糧用小麦と飼料穀物については、「不測時に、代替輸入"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-09-i1","memo_id":"02-09","genre_id":"02","level":"intermediate","question":"米の備蓄水準の考え方で想定されている「10年に1度の不作」は作況いくつか。","choices":["作況90","作況92","作況94","作況96"],"answer":1,"explanation":"10年に1度の不作は作況92とされています。作況94は「通常程度の不作」で、こちらは2年連続した事態を想定しています。","evidence":["10年に１度の不作（作況92）や、通常程度の不作（作況94）が２年連続した"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-09-i2","memo_id":"02-09","genre_id":"02","level":"intermediate","question":"飼料穀物について、過去に備蓄を活用した最大実績（東日本大震災時）はどれだけか。","choices":["50万トン","75万トン","90万トン","100万トン"],"answer":1,"explanation":"過去に備蓄を活用した最大実績は東日本大震災時の75万トンです。100万トンは飼料穀物の備蓄水準や海上輸送中の量、90万トンは食糧用小麦の備蓄水準の数値です。","evidence":["・過去に備蓄を活用した最大実績は75万トン（東日本大震災時）"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-09-a1","memo_id":"02-09","genre_id":"02","level":"advanced","question":"食糧用小麦の備蓄が2.3カ月分程度とされる根拠の計算として、メモの内容に合うものはどれか。","choices":["代替輸入に必要な4.3カ月から海上輸送中の2カ月分を差し引いた","代替輸入に必要な2カ月に海上輸送中の0.3カ月分を加えた","代替輸入に必要な4.3カ月から国内在庫の2カ月分を差し引いた","代替輸入に必要な4.3カ月を船積遅延の回数2回で割った"],"answer":0,"explanation":"代替輸入に4.3カ月程度必要で、すでに契約済みで海上輸送中の小麦が2カ月分程度あるため、差し引き2.3カ月分が必要とされています。差し引く対象は国内在庫ではなく海上輸送中の輸入小麦です。","evidence":["・代替輸入に4.3カ月程度必要","・すでに契約を終了し、海上輸送中の輸入小麦の量は２カ月分程度","・差し引き2.3カ月分程度の備蓄が必要"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-09-a2","memo_id":"02-09","genre_id":"02","level":"advanced","question":"国の備蓄水準に関する記述のうち、誤っているものはどれか。","choices":["米の100万トン程度は2001年当時の需要量をベースに設定されている","2011年に棚上備蓄方式から回転備蓄方式へ変更された","食糧用小麦の備蓄水準は90万トン程度とされている","飼料穀物は海上輸送中の分とあわせて2カ月分程度のストックとなる"],"answer":1,"explanation":"2011年の変更は回転備蓄方式から棚上備蓄方式へのもので、向きが逆になっているため誤りです。ほかの3つは、米の設定根拠、小麦の90万トン程度、飼料穀物の2カ月分程度のストックとしてメモに記載があります。","evidence":["（2011年の回転備蓄方式から棚上備蓄方式への変更時に、引き続き100万トン程度として設定）"],"source":{"memo_id":"02-09","page":9,"print_page":30,"title":"米・食糧用小麦・飼料穀物の備蓄水準"}},{"id":"02-10-b1","memo_id":"02-10","genre_id":"02","level":"beginner","question":"肥料原料の輸入通関価格について、2021年（令和３年）以降の上昇傾向から下落に転じたのは何年か。","choices":["2020年（令和２年）","2022年（令和４年）","2023年（令和５年）","2024年（令和６年）"],"answer":2,"explanation":"メモでは、肥料原料の輸入通関価格は2021年以降に上昇傾向となり、2023年（令和５年）に下落に転じたとされています。2021年は上昇が始まった年で、下落に転じた年ではありません。","evidence":["肥料原料の輸入通関価格は、2021年（令和３年）以降に上昇傾向となり、2023年（令和５年）に下落に転じたも"],"source":{"memo_id":"02-10","page":10,"print_page":31,"title":"肥料原料・燃油・配合飼料の価格推移"}},{"id":"02-10-b2","memo_id":"02-10","genre_id":"02","level":"beginner","question":"配合飼料価格が令和２年以降に上昇した要因として挙げられている、配合飼料の主な原料はどれか。","choices":["とうもろこし","大豆","小麦","大麦"],"answer":0,"explanation":"メモでは、配合飼料の主な原料であるとうもろこしの国際価格の上昇や為替の影響等により、令和２年以降に価格が上昇したとされています。大豆・小麦・大麦はこのページでは主な原料として挙げられていません。","evidence":["主な原料であるとうもろこしの国際価格の上昇や為替の影響等により上昇。"],"source":{"memo_id":"02-10","page":10,"print_page":31,"title":"肥料原料・燃油・配合飼料の価格推移"}},{"id":"02-10-a1","memo_id":"02-10","genre_id":"02","level":"advanced","question":"肥料原料・燃油・配合飼料の価格に関する説明として、誤っているものはどれか。","choices":["配合飼料工場渡価格は令和８年５月に令和４年10月の水準を上回った","燃油価格はロシアのウクライナ侵略等の影響により高い水準で推移している","配合飼料価格は令和８年１月以降、為替が円安に振れたこと等により上昇した","肥料原料の輸入通関価格は直近の中東情勢などの影響で再び高い水準にある"],"answer":0,"explanation":"配合飼料工場渡価格は令和８年５月が99,969円/トンで、令和４年10月の101,196円/トンを下回っているため、誤りです。燃油価格、令和８年１月以降の配合飼料価格の上昇、肥料原料価格の再上昇は、いずれもメモの記述どおりです。","evidence":["(R8.5) 99,969 (R4.10) 101,196"],"source":{"memo_id":"02-10","page":10,"print_page":31,"title":"肥料原料・燃油・配合飼料の価格推移"}},{"id":"02-11-b1","memo_id":"02-11","genre_id":"02","level":"beginner","question":"一口メモによると、化学肥料の原料であるりん安（りん酸アンモニウム）の主な輸入相手国はどこか。","choices":["中国","カナダ","マレーシア","ベトナム"],"answer":0,"explanation":"りん安の主な輸入相手国は中国です。カナダは塩化加里、マレーシアとベトナムは尿素の主な輸入相手国です。","evidence":["尿素はマレーシア及びベトナム、りん安は中国、塩化加里はカナダが主な輸入相手国。"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-11-b2","memo_id":"02-11","genre_id":"02","level":"beginner","question":"一口メモによると、令和3年秋以降に我が国の肥料原料の輸入が停滞した要因として挙げられているものはどれか。","choices":["中国の輸出検査の厳格化","カナダの輸出数量の規制","国内の肥料需要の急増","マレーシアの生産設備の停止"],"answer":0,"explanation":"メモは中国による肥料原料の輸出検査の厳格化とロシアによるウクライナ侵略の影響を挙げています。カナダの規制や国内需要の急増、マレーシアの設備停止は書かれていません。","evidence":["令和３年秋以降、中国による肥料原料の輸出検査の厳格化のほか、ロシアによるウクライナ侵略の影響に"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-11-i1","memo_id":"02-11","genre_id":"02","level":"intermediate","question":"令和6年7月～令和7年6月の塩化加里（K）の全輸入量はいくらか。","choices":["228千トン","256千トン","370千トン","178千トン"],"answer":0,"explanation":"塩化加里の全輸入量は228千トンです。256千トンは尿素、370千トンはりん安の全輸入量で、178千トンは塩化加里のうちカナダからの輸入量です。","evidence":["228千トン"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-11-i2","memo_id":"02-11","genre_id":"02","level":"intermediate","question":"令和6年7月～令和7年6月の尿素（N）の輸入量のうち、マレーシアが占める割合はどれか。","choices":["74%","10%","72%","78%"],"answer":0,"explanation":"尿素のマレーシアからの輸入量は195千トンで74%です。10%は尿素のベトナム、72%はりん安の中国、78%は塩化加里のカナダの割合です。","evidence":["マレーシア","195 (74%)"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-11-a1","memo_id":"02-11","genre_id":"02","level":"advanced","question":"令和6年7月～令和7年6月の化学肥料原料の輸入について、誤っているものはどれか。","choices":["尿素の全輸入量256千トンには国産9千トンが含まれる","尿素はマレーシアに次いでベトナムからの輸入量が多い","塩化加里のカナダからの輸入割合は78%である","りん安の中国からの輸入量は267千トンである"],"answer":0,"explanation":"注記で全輸入量に国産は含まれないとされているため、国産9千トンが含まれるという記述は誤りです。ベトナム27千トン（10%）がマレーシアに次ぐこと、カナダ78%、中国267千トンはいずれもグラフのとおりです。","evidence":["全輸入量には、国産は含まれない。"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-11-a2","memo_id":"02-11","genre_id":"02","level":"advanced","question":"令和6年7月～令和7年6月のりん安（N・P）の輸入量のうち、モロッコからの輸入量はいくらか。","choices":["79千トン","267千トン","15千トン","5千トン"],"answer":0,"explanation":"りん安のモロッコからの輸入量は79千トン（21%）です。267千トンは中国、15千トンはその他、5千トンはオーストラリアからの輸入量です。","evidence":["79 (21%)"],"source":{"memo_id":"02-11","page":11,"print_page":32,"title":"化学肥料原料の輸入相手国と輸入量"}},{"id":"02-12-b1","memo_id":"02-12","genre_id":"02","level":"beginner","question":"このメモで、FAOが定義する食料安全保障の目標を実現するために必要とされていることはどれか。","choices":["４つの要素すべてが同時に満たされること","４つの要素のうち供給面が満たされること","４つの要素のうち２つ以上が満たされること","４つの要素が順番に一つずつ満たされること"],"answer":0,"explanation":"メモでは、食料安全保障の目標の実現には4つの要素すべてが同時に満たされることが必要としています。供給面だけ、2つ以上、順番に満たすといった記載はありません。","evidence":["食料安全保障の目標を実現するためには、４つの要素すべてが同時に満たさ"],"source":{"memo_id":"02-12","page":12,"print_page":33,"title":"FAOが定義する食料安全保障と4つの要素"}},{"id":"02-12-b2","memo_id":"02-12","genre_id":"02","level":"beginner","question":"このメモで、食料安全保障とは十分で安全かつ栄養ある食料にどのようにできることを指すとされているか。","choices":["「誰でも」「どんなときも」「アクセス（入手・購入）」","「国内で」「平常時に」「生産（栽培・飼育）」","「誰でも」「災害時に」「備蓄（保管・貯蔵）」","「農家が」「どんなときも」「出荷（販売・輸送）」"],"answer":0,"explanation":"メモでは、十分で安全かつ栄養ある食料に「誰でも」「どんなときも」「アクセス（入手・購入）」できることを指すとしています。ほかの選択肢の生産・備蓄・出荷といった語はこの説明に含まれていません。","evidence":["食料安全保障とは、十分で安全かつ栄養ある食料に「誰でも」「どんなときも」「アクセス（入手・購入）」"],"source":{"memo_id":"02-12","page":12,"print_page":33,"title":"FAOが定義する食料安全保障と4つの要素"}},{"id":"02-12-i1","memo_id":"02-12","genre_id":"02","level":"intermediate","question":"食料安全保障の4つの要素のうち、栄養ある食料を入手するための合法的、政治的、経済的、社会的な権利を持ちうるかを見る要素はどれか。","choices":["Food Availability（供給面）","Food Access（アクセス面）","Utilization（利用面）","Stability（安定面）"],"answer":1,"explanation":"食料を入手するための権利を持ちうるかを見るのはFood Access（アクセス面）です。供給面は十分な供給、利用面は安全で栄養価の高い食料の摂取、安定面はいつ何時でも入手できる安定性を見る要素です。","evidence":["Food Access（アクセス面） ：栄養ある食料を入手するための合法的、政治的、経済的、","社会的な権利を持ちうるか"],"source":{"memo_id":"02-12","page":12,"print_page":33,"title":"FAOが定義する食料安全保障と4つの要素"}},{"id":"02-12-a1","memo_id":"02-12","genre_id":"02","level":"advanced","question":"FAOの定義の和訳で、十分で安全かつ栄養ある食料が入手可能であるべきとされている3つの側面の組み合わせはどれか。","choices":["合法的、政治的及び経済的","物理的、政治的及び経済的","物理的、社会的及び経済的","合法的、社会的及び経済的"],"answer":2,"explanation":"FAOの定義の和訳では、食料を物理的、社会的及び経済的にも入手可能であるときに食料安全保障が達成されるとしています。合法的・政治的という語は、定義ではなくアクセス面の要素の説明に出てくる語なので紛らわしい点に注意が必要です。","evidence":["十分で安全かつ栄養ある食料を、物理的、社会的及び経済的にも","入手可能であるときに達成される状況。"],"source":{"memo_id":"02-12","page":12,"print_page":33,"title":"FAOが定義する食料安全保障と4つの要素"}},{"id":"02-12-a2","memo_id":"02-12","genre_id":"02","level":"advanced","question":"食料安全保障の4つの要素とその内容の組み合わせとして、誤っているものはどれか。","choices":["Stability（安定面）：いつ何時でも適切な食料を入手できる安定性があるか","Utilization（利用面）：安全で栄養価の高い食料を摂取できるか","Food Access（アクセス面）：いつ何時でも適切な食料を入手できる安定性があるか","Food Availability（供給面）：適切な品質の食料が十分に供給されているか"],"answer":2,"explanation":"いつ何時でも適切な食料を入手できる安定性を見るのはStability（安定面）であり、Food Access（アクセス面）は食料を入手するための権利を持ちうるかを見る要素です。ほかの3つはメモの記載どおりの組み合わせです。","evidence":["Stability（安定面） ：いつ何時でも適切な食料を入手できる安定性があるか","Food Access（アクセス面） ：栄養ある食料を入手するための合法的、政治的、経済的、"],"source":{"memo_id":"02-12","page":12,"print_page":33,"title":"FAOが定義する食料安全保障と4つの要素"}},{"id":"03-01-b1","memo_id":"03-01","genre_id":"03","level":"beginner","question":"年表の「生産調整の見直し」の欄で、米の直接支払は何年産までとされていますか。","choices":["26年産まで","27年産まで","29年産まで","31年産まで"],"answer":2,"explanation":"年表には「米の直接支払は29年産まで」と書かれています。26年・27年・31年はほかの欄の年で、米の直接支払の終わりとしては書かれていません。","evidence":["米の直接\n支払は\n29年産まで"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-01-b2","memo_id":"03-01","genre_id":"03","level":"beginner","question":"年表で、H25年5月に設置されたと示されているものはどれですか。","choices":["農林水産業・地域の活力創造本部","県・農地バンク","農業競争力強化プログラム","みどりの食料システム戦略"],"answer":0,"explanation":"H25年の欄には「農林水産業・地域の活力創造本部の設置（5月）」とあります。県・農地バンクは3月の設立、農業競争力強化プログラムやみどりの食料システム戦略は「決定」として後の年に示されています。","evidence":["地域の活力創造本部の設置 ５(月 )"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-01-i1","memo_id":"03-01","genre_id":"03","level":"intermedia
