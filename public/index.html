te","question":"年表で、H27年とR2年に示されている食料・農業・農村基本計画は、いずれも何月のものですか。","choices":["3月","5月","8月","12月"],"answer":0,"explanation":"食料・農業・農村基本計画はH27年、R2年ともに「（3月）」と示されています。12月は活力創造プラン、5月や8月はほかの法律・戦略の月です。","evidence":["食 料 ・農 業 ・農 村 基 本 計 画"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-01-i2","memo_id":"03-01","genre_id":"03","level":"intermediate","question":"年表で、H29年に農業競争力強化支援法が施行されたのは何月ですか。","choices":["4月","6月","8月","11月"],"answer":2,"explanation":"年表には「農業競争力強化支援法 施行（8月）」とあります。11月は農業競争力強化プログラムの決定月で、4月は農協関係の法施行の月です。","evidence":["農業競争力\n強化支援法\n施行 ８"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-01-a1","memo_id":"03-01","genre_id":"03","level":"advanced","question":"年表の輸出目標で、R12年の輸出目標額はH31年の輸出目標額の何倍ですか。","choices":["2倍","3倍","5倍","10倍"],"answer":2,"explanation":"H31年の輸出目標は1兆円、R12年の輸出目標は5兆円なので、5倍です。2倍・3倍・10倍は二つの目標額の比と合いません。","evidence":["H31年の 11\n輸出目標\n１ 兆 円","R12年の\n輸出目標\n５兆円"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-01-a2","memo_id":"03-01","genre_id":"03","level":"advanced","question":"年表に示された出来事と月の組み合わせとして、誤っているものはどれですか。","choices":["R元年に全中が一般社団法人へ組織変更したのは9月","H27年に改正農協法が成立したのは4月","H30年に森林経営管理法が成立したのは5月","R元年に改正国有林法が成立したのは6月"],"answer":1,"explanation":"改正農協法の成立は8月で、4月は翌年の「法施行」の月です。全中の組織変更9月、森林経営管理法成立5月、改正国有林法成立6月はいずれも年表どおりです。","evidence":["改正農協法\n成立 ８\n(月 )","法施行 ４(月 )"],"source":{"memo_id":"03-01","page":1,"print_page":34,"title":"近年の農林水産政策の全体像①"}},{"id":"03-02-b1","memo_id":"03-02","genre_id":"03","level":"beginner","question":"改正食料・農業・農村基本法の基本理念の関係性の図で、改正基本法の理念として示されているものはどれか。","choices":["多面的機能の十分な発揮","農産物輸出の大幅な拡大","農業所得の倍増の実現","食品ロスの半減の達成"],"answer":0,"explanation":"図の改正基本法の枠内には「多面的機能の十分な発揮」が示されています。輸出の拡大、所得の倍増、食品ロスの半減は、この図には示されていません。","evidence":["多面的機能の\n十分な発揮"],"source":{"memo_id":"03-02","page":2,"print_page":35,"title":"近年の農林水産政策と改正基本法の基本理念"}},{"id":"03-02-i2","memo_id":"03-02","genre_id":"03","level":"intermediate","question":"令和7年に、新たな食料・農業・農村基本計画が閣議決定されたのは何月か。","choices":["4月","5月","6月","12月"],"answer":0,"explanation":"新たな食料・農業・農村基本計画は4月に閣議決定されています。5月は改正基本法の成立、6月は食料システム法などの成立の月なので、取り違えに注意します。","evidence":["新 た な 食 料 ・農 業 ・農 村 基 本 計 画 閣 議 決 定 （４ 月 ）"],"source":{"memo_id":"03-02","page":2,"print_page":35,"title":"近年の農林水産政策と改正基本法の基本理念"}},{"id":"03-02-a1","memo_id":"03-02","genre_id":"03","level":"advanced","question":"近年の農林水産政策の全体像②の年表について、誤っているものはどれか。","choices":["改正食料・農業・農村基本法は5月に成立した","改正CW法は5月に成立した","食料安全保障強化政策大綱が改訂された","スマート農業技術活用促進法は12月に成立した"],"answer":3,"explanation":"スマート農業技術活用促進法の成立は12月ではなく6月です。改正基本法と改正CW法が5月に成立したこと、食料安全保障強化政策大綱が改訂されたことは、年表のとおりです。","evidence":["促進法成立 ６","改 正 食 料 ・農 業 ・農 村 基 本 法 成 立 （５ 月 ）"],"source":{"memo_id":"03-02","page":2,"print_page":35,"title":"近年の農林水産政策と改正基本法の基本理念"}},{"id":"03-03-b1","memo_id":"03-03","genre_id":"03","level":"beginner","question":"基本法制定から約25年間（2000年→2025年）で、全国の農業総産出額はどう変化したとされていますか。","choices":["約20％増加した","約10％減少した","約20％減少した","約10％増加した"],"answer":0,"explanation":"要点に、農業総産出額は約20％増加していると書かれています。約10％減少したのは農地面積であり、取り違えに注意が必要です。","evidence":["②農地面積は約10％減少しているが、農業総産出額は約20％増加している。"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-03-b2","memo_id":"03-03","genre_id":"03","level":"beginner","question":"基本法制定から約25年間（2000年→2025年）で、数が増加したとされているものはどれですか。","choices":["法人その他団体経営の経営体数","個人経営の経営体数","基幹的農業従事者数","全国の農地面積"],"answer":0,"explanation":"要点では、法人その他団体経営の経営体数は増加とされています。個人経営の経営体数と基幹的農業従事者数は大きく減少し、農地面積も約10％減少しています。","evidence":["法人その他団体経営の経営体数は増加。","①個人経営の経営体数・基幹的農業従事者数は大きく減少。"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-03-i1","memo_id":"03-03","genre_id":"03","level":"intermediate","question":"令和7（2025）年の法人その他団体経営体のうち、法人の数はいくつですか。","choices":["3.4万","1.3万","4.0万","2.8万"],"answer":0,"explanation":"令和7年の法人その他団体経営体は4.0万で、そのうち法人は3.4万です。1.3万と2.8万は平成12年の農家以外の農業事業体等の値で、4.0万は法人以外も含む全体の数です。","evidence":["（うち法人3.4万）","法人その他団体経営体"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-03-i2","memo_id":"03-03","genre_id":"03","level":"intermediate","question":"表の令和7（2025）年の欄（令和6年実績）で、全国の農業総産出額のうち耕種の額はいくらですか。","choices":["7.1兆円","6.7兆円","10.8兆円","9.1兆円"],"answer":0,"explanation":"令和7年の欄は10.8兆円（7.1兆円）で、かっこ内の7.1兆円が耕種の額です。6.7兆円は平成12年の耕種、10.8兆円は総額、9.1兆円は平成12年の総額です。","evidence":["10.8兆円（7.1兆円）","農業総産出額（うち耕種）"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-03-a1","memo_id":"03-03","genre_id":"03","level":"advanced","question":"表の値から、全国の農業総産出額は平成12（2000）年から令和7（2025）年の欄（令和6年実績）までに何兆円増えましたか。","choices":["1.7兆円","0.4兆円","1.3兆円","2.1兆円"],"answer":0,"explanation":"総額は9.1兆円から10.8兆円になっており、差は1.7兆円です。0.4兆円は耕種だけの増加分（6.7兆円→7.1兆円）なので誤りです。","evidence":["9.1兆円（6.7兆円）","10.8兆円（7.1兆円）"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-03-a2","memo_id":"03-03","genre_id":"03","level":"advanced","question":"このページの経営体・農家の区分の定義について、誤っているものはどれですか。","choices":["主業経営体は、世帯所得の50％以上が農業所得の個人経営体","準主業経営体は、世帯所得の50％以上が農業所得の個人経営体","副業的経営体は、60日以上従事の65歳未満の世帯員がいない個人経営体","主業農家は、60日以上従事の65歳未満の世帯員がいる農業所得が主の農家"],"answer":1,"explanation":"準主業経営体は農外所得が主で、世帯所得の50％未満が農業所得の個人経営体です。50％以上が農業所得なのは主業経営体の定義なので、取り違えています。","evidence":["準主業経営体：農外所得が主（世帯所得の50％未満が農業所得）"],"source":{"memo_id":"03-03","page":3,"print_page":36,"title":"基本法制定当時と現在の農業構造"}},{"id":"03-04-b1","memo_id":"03-04","genre_id":"03","level":"beginner","question":"改正された基本法の基本理念のうち、第2条に位置付けられているものはどれか。","choices":["食料安全保障の確保","農業の持続的な発展","農村の振興","多面的機能の発揮"],"answer":0,"explanation":"第2条は「食料安全保障の確保」です。農業の持続的な発展は第5条、農村の振興は第6条、多面的機能の発揮は第4条に位置付けられています。","evidence":["食料安全保障の確保（第２条）","農業の持続的な発展（第５条）"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-04-b2","memo_id":"03-04","genre_id":"03","level":"beginner","question":"改正された基本法の農村施策で、「農地等の保全に資する共同活動の促進」の括弧書きに示されている施策名はどれか。","choices":["多面的機能支払","農村RMOの活動促進","農福連携の推進","二地域居住の環境整備"],"answer":0,"explanation":"第44条の共同活動の促進には、括弧書きで「多面的機能支払」と示されています。農村RMOは第47条、農福連携は第46条、二地域居住は第49条にあたる別の施策です。","evidence":["農地等の保全に資する共同活動の促進（多面的機能支払）（第44条）"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-04-i1","memo_id":"03-04","genre_id":"03","level":"intermediate","question":"改正された基本法の食料施策では、食料・農業・農村基本計画で定める目標の進捗を、どのくらいの頻度で公表するとされているか。","choices":["毎年","3年ごと","5年ごと","10年ごと"],"answer":0,"explanation":"第17条で、食料自給率と食料安全保障の確保に関する事項の目標を設定し、「毎年進捗を公表」すると書かれています。3年・5年・10年ごとという記載はありません。","evidence":["食料安全保障の確保に関する事項の目標を設定し、毎年進捗を公表"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-04-i2","memo_id":"03-04","genre_id":"03","level":"intermediate","question":"改正された基本法の農業施策で、家畜伝染病・病害虫の発生予防・まん延防止の対応を定めた条はどれか。","choices":["第41条","第38条","第42条","第29条"],"answer":0,"explanation":"家畜伝染病・病害虫への対応は第41条です。第38条は産学官の連携強化、第42条は生産資材の安定確保、第29条は農業生産基盤の整備・保全を定めた条です。","evidence":["家畜伝染病・病害虫の発生予防・まん延防止の対応（第41条）"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-04-a1","memo_id":"03-04","genre_id":"03","level":"advanced","question":"改正された基本法の食料施策の説明として、誤っているものはどれか。","choices":["農産物・生産資材の安定的な輸入に向け、輸入相手国の多様化を図る","輸出促進に向け、輸出相手国における販路拡大を支援する","不測の事態が実際に発生した後に、初めて措置を実施する","円滑な食料の入手に向け、食料の寄附促進の環境を整備する"],"answer":2,"explanation":"第24条では、不測の事態が「発生するおそれがある段階から」措置を実施するとされています。発生した後に初めて実施するという選択肢は誤りです。ほかの3つは、第21条・第22条・第19条の内容と一致しています。","evidence":["不測の事態が発生するおそれがある段階から、食料安全保障の確保に向けた措置の実施（第24条）"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-04-a2","memo_id":"03-04","genre_id":"03","level":"advanced","question":"改正された基本法の農業施策で、「付加価値の向上」を位置付けた条と、その手段の組み合わせとして正しいものはどれか。","choices":["第31条・6次産業化や高品質の品種の導入","第30条・6次産業化や高品質の品種の導入","第31条・スマート農業技術を活用した方式の導入","第32条・新品種の開発や知的財産の保護"],"answer":0,"explanation":"「付加価値の向上」は第31条で、手段として6次産業化や高品質の品種の導入が挙げられています。第30条は、スマート農業技術の活用や新品種の開発による「生産性の向上」です。第32条は「環境負荷低減」を定めた条です。","evidence":["６次産業化、高品質の品種の導入、知的財産の保護・活用などによる「付加価値の向上」（第31条）","スマート農業技術等を活用した生産・加工・流通の方式の導入促進や新品種の開発などによる「生産性の向上」（第30条）"],"source":{"memo_id":"03-04","page":4,"print_page":37,"title":"基本法改正の基本理念と基本的施策"}},{"id":"03-05-b1","memo_id":"03-05","genre_id":"03","level":"beginner","question":"改正された食料・農業・農村基本法が施行された日はいつか。","choices":["令和6年6月5日","令和5年6月5日","令和7年4月1日","令和9年4月1日"],"answer":0,"explanation":"メモでは基本法を改正し、令和6年6月5日に施行したとしています。令和9年度は水田政策の見直しの開始時期で、施行日ではありません。","evidence":["食料・農業・農村基本法を改正（令和６年６月５日施行）"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-05-b2","memo_id":"03-05","genre_id":"03","level":"beginner","question":"新たな基本計画で、農業の構造転換を集中的に推し進めるとしている「初動」の期間はどれか。","choices":["初動3年間","初動5年間","初動10年間","初動20年間"],"answer":1,"explanation":"平時からの食料安全保障を実現する観点から、初動5年間で構造転換を集中的に進めるとしています。20年程度は課題の整理で見据えた期間で、初動の期間ではありません。","evidence":["初動５年間で農業の構造転換を集中的に推し進める"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-05-i1","memo_id":"03-05","genre_id":"03","level":"intermediate","question":"新たな基本計画で目標とする食料自給率のうち、摂取ベースの目標値はどれか。","choices":["38%","45%","53%","63%"],"answer":2,"explanation":"食料自給率の目標は摂取ベースで53%です。45%は国際基準準拠の目標値なので、摂取ベースではありません。","evidence":["・摂取ベース: 53%","・国際基準準拠 : 45%"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-05-i2","memo_id":"03-05","genre_id":"03","level":"intermediate","question":"生産コスト低減の目標で、15ha以上の経営体の米の生産コストを下げる先の目標値（60kg当たり）はどれか。","choices":["8,500円/60kg","9,500円/60kg","10,500円/60kg","11,350円/60kg"],"answer":1,"explanation":"米の15ha以上の経営体では11,350円/60kgから9,500円/60kgへの低減を目標としています。11,350円は低減前の水準で、目標値ではありません。","evidence":["（米）15ha以上の経営体","11,350円/60kg→9,500円/60kg"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-05-a1","memo_id":"03-05","genre_id":"03","level":"advanced","question":"新たな基本計画の目標について述べた次のうち、誤っているものはどれか。","choices":["農地面積412万haを確保する","49歳以下の担い手数4.8万の水準を維持する","農林水産物・食品の輸出額を5兆円にする","1経営体当たり生産量を2割増やす"],"answer":3,"explanation":"1経営体当たり生産量の目標は1.8倍で、2割増ではありません。「2割」は麦・大豆の生産コストを2割減らす目標の数値です。","evidence":["・１経営体当たり生産量：1.8倍","（麦、大豆）2割減（現状比）"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-05-a2","memo_id":"03-05","genre_id":"03","level":"advanced","question":"新たな基本計画における水田政策の見直しについて、正しい説明はどれか。","choices":["令和9年度から見直し、作物ごとの生産性向上等への支援へ転換","令和9年度から見直し、水田を対象とした支援をさらに拡充","令和7年度から見直し、作物ごとの生産性向上等への支援へ転換","令和6年度から見直し、水田を対象とした支援をさらに拡充"],"answer":0,"explanation":"水田政策は令和9年度から根本的に見直し、水田を対象とする交付金を作物ごとの生産性向上等への支援へ転換するとしています。水田を対象とした支援の拡充ではなく、開始年度も令和9年度です。","evidence":["○水田政策を令和９年度から根本的に見直し、","作物ごとの生産性向上等への支援へと転換"],"source":{"memo_id":"03-05","page":5,"print_page":38,"title":"新たな食料・農業・農村基本計画のポイント"}},{"id":"03-06-b1","memo_id":"03-06","genre_id":"03","level":"beginner","question":"このページで、国民一人一人が食料を入手できるよう確保するとされているアクセスの組み合わせはどれですか。","choices":["物理的・経済的・不測時のアクセス","物理的・情報的・平常時のアクセス","経済的・社会的・国際的なアクセス","心理的・経済的・地域的なアクセス"],"answer":0,"explanation":"「国民一人一人が入手できる」の下に、物理的アクセス＋経済的アクセス＋不測時のアクセスと書かれています。情報的・社会的・心理的などのアクセスは記載されていません。","evidence":["物理的アクセス＋ 経済的アクセス","＋不測時のアクセス"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-06-b2","memo_id":"03-06","genre_id":"03","level":"beginner","question":"このページで、2025年夏を目途に策定するとされているものはどれですか。","choices":["地方みらい共創戦略","みどり加速化GXプラン","農山漁村経済生活計画","中山間地域振興ビジョン"],"answer":0,"explanation":"2025年夏を目途に「地方みらい共創戦略」を策定すると記載されています。「みどり加速化GXプラン」は環境負荷低減の取組を促進する手段として書かれたもので、策定時期の記載はありません。","evidence":["○2025年夏を目途に「地方みらい共創戦略」を策定し、"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-06-i1","memo_id":"03-06","genre_id":"03","level":"intermediate","question":"このページで、環境と調和のとれた食料システムの目標とされている温室効果ガス削減量（2013年度比）はどれですか。","choices":["1,176万t-CO2","1,716万t-CO2","117.6万t-CO2","630万t-CO2"],"answer":0,"explanation":"目標として温室効果ガス削減量（2013年度比）1,176万t-CO2と書かれています。1,716万や117.6万は桁や数字の並びを変えたもので、630は農村関係人口の市町村数の目標です。","evidence":["○温室効果ガス削減量（2013年度比）","削減量: 1,176万t-CO2"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-06-i2","memo_id":"03-06","genre_id":"03","level":"intermediate","question":"このページで、農村の振興の目標とされている「農村関係人口の拡大が見られた市町村数」はどれですか。","choices":["630市町村","360市町村","1,176市町村","2,013市町村"],"answer":0,"explanation":"農村関係人口の拡大が見られた市町村数の目標は630と書かれています。1,176は温室効果ガス削減量、2013は削減量の基準年度の数字です。","evidence":["○農村関係人口の拡大が","市町村数：630"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-06-a1","memo_id":"03-06","genre_id":"03","level":"advanced","question":"このページに書かれた取組とその目的の組み合わせとして、誤っているものはどれですか。","choices":["ラストワンマイル物流の確保は食料安全保障の確保の取組","農村RMOの立上げは中山間地域等の振興のための取組","自家用有償旅客運送は環境負荷低減のための取組","農泊や農福連携は所得向上や雇用創出のための取組"],"answer":2,"explanation":"自家用有償旅客運送等の移動手段の確保は「生活の利便性確保のため」の取組とされており、環境負荷低減の取組ではありません。ほかの3つはメモの記載どおりの組み合わせです。","evidence":["○生活の利便性確保のため、","自家用有償旅客運送等の移動手段の確保等の生活インフラ等を確保"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-06-a2","memo_id":"03-06","genre_id":"03","level":"advanced","question":"このページで、農村地域において創出された付加価値額の目標はどれですか。","choices":["22兆円","2.2兆円","220兆円","11.76兆円"],"answer":0,"explanation":"農村地域において創出された付加価値額の目標は22兆円と書かれています。2.2兆円や220兆円は桁を変えたもので、11.76兆円は温室効果ガス削減量1,176万の数字を流用したひっかけです。","evidence":["創出された付加価値額","付加価値額：22兆円"],"source":{"memo_id":"03-06","page":6,"print_page":39,"title":"関係者の連携による持続的な食料システムの確立"}},{"id":"03-07-b1","memo_id":"03-07","genre_id":"03","level":"beginner","question":"新たな食料・農業・農村基本計画で、2030年を目標年とする農林水産物・食品の輸出額の目標はどれですか。","choices":["1.5兆円","3兆円","5兆円","35兆円"],"answer":2,"explanation":"輸出額の目標は1.5兆円から5兆円への拡大です。1.5兆円は現状の値で、35は米輸出量（35万トン）の数字であり輸出額ではありません。","evidence":["目標 農林水産物・食品の輸出額 1.5兆円→５兆円（米輸出4.6万トン→35万トン）"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-07-b2","memo_id":"03-07","genre_id":"03","level":"beginner","question":"このメモで「49歳以下の担い手数」の目標に用いる「担い手」に含まれるとされているものはどれですか。","choices":["認定農業者と認定新規就農者","農業法人と集落営農組織","サービス事業者と認定農業者","販売農家と自給的農家"],"answer":0,"explanation":"注記で担い手は認定農業者、認定新規就農者（法人等を除く）とされています。法人等は除かれており、サービス事業者は機械の共同利用の担い手として別のKPIで扱われています。","evidence":["担い手:認定農業者、認定新規就農者（法人等を除く）"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-07-i1","memo_id":"03-07","genre_id":"03","level":"intermediate","question":"2030年を目標年とする食料自給率の目標のうち、摂取ベースの目標値はどれですか。","choices":["38%","45%","53%","64%"],"answer":2,"explanation":"摂取ベースの食料自給率は45%から53%に引き上げる目標です。45%は摂取ベースの現状値であり、国際基準準拠の目標値（38%→45%）とも一致するため紛らわしい選択肢です。","evidence":["目標 食料自給率 摂取ベース：45%→53%","国際基準準拠：38%→45%"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-07-i2","memo_id":"03-07","genre_id":"03","level":"intermediate","question":"2030年に向けた単収のKPIのうち、増加率が最も大きいものはどれですか。","choices":["主食用米の単収","新市場開拓用米の単収","小麦の単収","大豆の単収"],"answer":3,"explanation":"大豆の単収は169kg/10aから223kg/10aへ32%増で最大です。新市場開拓用米は15%増、小麦は14%増、主食用米は4%増にとどまります。","evidence":["[KPI 大豆の単収：169kg/10a→223kg/10a（32％増) ]","[KPI 小麦の単収：472kg/10a→537kg/10a（14％増）]","新市場開拓用548kg/10a→628kg/10a (15%増)"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-07-a1","memo_id":"03-07","genre_id":"03","level":"advanced","question":"2030年を目標年とする、15ha以上の経営体の米生産コストの目標値はどれですか。","choices":["9,500円/60kg","11,350円/60kg","13,000円/60kg","15,944円/60kg"],"answer":0,"explanation":"15ha以上の経営体の米生産コストは11,350円/60kgから9,500円/60kgへの低減が目標です。13,000円/60kgは全経営体の目標値、15,944円/60kgは全経営体の現状値です。","evidence":["目標 15ha以上の経営体の米生産コスト※4：11,350円/60kg→9,500円/60kg","[KPI 全経営体の米生産コスト※4：15,944円/60kg→13,000円/60kg]"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-07-a2","memo_id":"03-07","genre_id":"03","level":"advanced","question":"2030年を目標年とする目標・KPIについての記述として、誤っているものはどれですか。","choices":["農地面積は427万haから412万haとする","担い手への農地集積率は60.4%から7割とする","スマート農業技術活用の農地割合は20%から70%とする","サービス事業者数は5,701から7,900経営体とする"],"answer":2,"explanation":"スマート農業技術を活用した農地面積の割合のKPIは20%から50%であり、70%は誤りです。7割は担い手への農地集積率のKPIの値で、ほかの3つはメモの記載どおりです。","evidence":["[KPI スマート農業技術を活用した農地面積の割合：20％→50％]"],"source":{"memo_id":"03-07","page":7,"print_page":40,"title":"新たな基本計画の主な目標・KPI（2030年）"}},{"id":"03-08-b1","memo_id":"03-08","genre_id":"03","level":"beginner","question":"新たな基本法に基づく農業構造転換集中対策期間（初動5年間）はいつか。","choices":["令和5～9年度","令和6～10年度","令和7～11年度","令和8～12年度"],"answer":2,"explanation":"メモでは初動5年間を令和7～11年度としています。ほかの選択肢は5年間という長さは同じですが、始まりの年度がずれています。","evidence":["新たな基本法に基づく初動５年間（令和７～11年度）の農業構造転換集中対策期間"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-08-b2","memo_id":"03-08","genre_id":"03","level":"beginner","question":"令和7～11年度の農業構造転換集中対策で、集中的・計画的に推進するとされている取組はどれか。","choices":["輸出産地の育成","米の生産調整の拡大","戸別所得補償の創設","耕作放棄地への課税"],"answer":0,"explanation":"メモは、農地の大区画化等、共同利用施設の再編集約・合理化、スマート技術の開発と生産方式の転換・実装、輸出産地の育成を推進するとしています。ほかの3つはメモに挙げられていない取組です。","evidence":["スマート技術の開発と生産方式の転換・実装、輸出産地の育成を集中的・計画的に推進"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-08-i1","memo_id":"03-08","genre_id":"03","level":"intermediate","question":"農業構造転換集中対策で、5年間に別枠予算として措置することとしている額はいくらか。","choices":["0.5兆円","1.3兆円","2.6兆円","13兆円"],"answer":1,"explanation":"メモでは5年間で1.3兆円を別枠予算として措置することとしています。13兆円は桁が違い、0.5兆円と2.6兆円はメモにない額です。","evidence":["５年間で1.3兆円を別枠予算として措置することとしている。"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-08-i2","memo_id":"03-08","genre_id":"03","level":"intermediate","question":"輸出産地の育成で達成を目指すとされている、2030年の輸出額目標はいくらか。","choices":["2兆円","3兆円","5兆円","10兆円"],"answer":2,"explanation":"メモには2030年の輸出額5兆円目標の達成に向けて取組を強化すると書かれています。ほかの額はメモに書かれた目標ではありません。","evidence":["輸出額５兆円目標（2030年）の達成に向け"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-08-a1","memo_id":"03-08","genre_id":"03","level":"advanced","question":"農業構造転換集中対策の「農地の大区画化等」「共同利用施設の再編集約・合理化」について、誤っているものはどれか。","choices":["1ha以上の大区画整備を加速化する","中山間地域ではきめ細かな整備を実施する","卸売市場等も再編集約・合理化の支援対象","大区画化で労働時間は全国平均から約4割削減"],"answer":3,"explanation":"メモでは、大区画化により労働時間は全国平均から約6割削減とされており、約4割は誤りです。1ha以上の大区画整備の加速化、中山間地域でのきめ細かな整備、卸売市場等の再編集約・合理化の支援はメモにそのまま書かれています。","evidence":["労働時間は全国平均から"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-08-a2","memo_id":"03-08","genre_id":"03","level":"advanced","question":"農業構造転換集中対策の予算のうち、R7（令和7年度）補正予算の額はいくらか。","choices":["241億円","494億円","2,410億円","4,940億円"],"answer":2,"explanation":"メモではR7補正が2,410億円です。494億円はR8当初の額で、241億円と4,940億円は桁を変えたひっかけです。","evidence":["（R8当初：494億円、R７補正：2,410億円）"],"source":{"memo_id":"03-08","page":8,"print_page":41,"title":"農業構造転換集中対策"}},{"id":"03-09-b1","memo_id":"03-09","genre_id":"03","level":"beginner","question":"食料供給困難事態対策法の成立と施行の時期として正しいものはどれか。","choices":["令和6年6月に成立、令和7年4月に施行","令和5年6月に成立、令和6年4月に施行","令和6年4月に成立、令和7年6月に施行","令和7年4月に成立、令和8年6月に施行"],"answer":0,"explanation":"メモでは、同法は令和6年6月に成立し、令和7年4月に施行されたとされています。成立と施行の月を入れ替えたものや、年をずらしたものは誤りです。","evidence":["「食料供給困難事態対策法」が令和６年６月に成立、令和７年４月"],"source":{"memo_id":"03-09","page":9,"print_page":42,"title":"食料供給困難事態対策法の全体概要"}},{"id":"03-09-b2","memo_id":"03-09","genre_id":"03","level":"beginner","question":"食料供給困難事態対策法で、政府対策本部を設置するのはどの段階からか。","choices":["食料供給が不足する兆候の段階から","国民生活等に実体上の支障が生じた段階から","最低限度必要な食料供給が確保されないおそれの段階から","割当て・配給を実施する段階から"],"answer":0,"explanation":"法律のポイントとして、食料供給が不足する兆候の段階から政府対策本部を設置するとされています。実体上の支障が生じた段階などは、本部設置後に事態の宣言が行われる、より深刻な段階です。","evidence":["❷ 食料供給が不足する兆候の段階から政府対策本部を設置"],"source":{"memo_id":"03-09","page":9,"print_page":42,"title":"食料供給困難事態対策法の全体概要"}},{"id":"03-09-i1","memo_id":"03-09","genre_id":"03","level":"intermediate","question":"食料供給困難事態対策法の政府対策本部の設置と構成として正しいものはどれか。","choices":["農相の報告をもとに総理大臣が設置し、総理と全ての国務大臣で構成","総理の指示をもとに農相が設置し、農相と関係省庁の局長で構成","農相の報告をもとに農相が設置し、農相と全ての国務大臣で構成","総理の指示をもとに総理大臣が設置し、総理と関係閣僚のみで構成"],"answer":0,"explanation":"政府対策本部は農相の報告をもとに総理大臣が設置し、総理と全ての国務大臣により構成されます。農相が設置するものや、一部の閣僚・局長で構成するものは誤りです。","evidence":["・ 農相の報告をもとに、総理大臣が設置","・ 総理と全ての国務大臣により構成"],"source":{"memo_id":"03-09","page":9,"print_page":42,"title":"食料供給困難事態対策法の全体概要"}},{"id":"03-09-i2","memo_id":"03-09","genre_id":"03","level":"intermediate","question":"食料供給困難事態対策法で、特定資材として政令で指定されている品目はどれか。","choices":["種苗","農業機械","燃油","包装資材"],"answer":0,"explanation":"特定資材として政令で指定されているのは肥料、農薬、種苗、飼料、動物用医薬品で、種苗が含まれます。農業機械、燃油、包装資材はこの一覧にありません。","evidence":["特定資材：肥料、農薬、種苗、飼料、動物用医薬品"],"source":{"memo_id":"03-09","page":9,"print_page":42,"title":"食料供給困難事態対策法の全体概要"}},{"id":"03-09-a1","memo_id":"03-09","genre_id":"03","level":"advanced","question":"食料供給困難事態対策法の事態の段階と主な措置の組合せとして、誤っているものはどれか。","choices":["食料供給困難兆候では、供給確保の取組を事業者に要請する","食料供給困難事態では、供給確保の計画の作成・届出を指示する","最低限度の食料供給が確保されないおそれの段階では割当て・配給を実施","平時から事業者に供給確保の計画の作成・届出を指示する"],"answer":3,"explanation":"平時の主な措置は、食料の需給状況、価格動向、民間在庫などの情報収集・分析です。計画の作成・届出の指示は、食料供給困難事態の段階の措置なので誤りです。","evidence":["食料の需給状況、価格動向、","など供給確保の計画の作成・届出を指示"],"source":{"memo_id":"03-09","page":9,"print_page":42,"title":"食料供給困難事態対策法の全体概要"}},{"id":"03-10-b1","memo_id":"03-10","genre_id":"03","level":"beginner","question":"食料供給困難事態対策法に基づく基本方針が閣議決定されたのはいつか。","choices":["令和７年４月１１日","令和６年４月１１日","令和７年１月１１日","令和８年４月１１日"],"answer":0,"explanation":"基本方針は令和7年4月11日に閣議決定されました。年や月が少しずつ違う選択肢は、メモの日付と一致しません。","evidence":["年４月１１日に食料供給困難事態対策法に基づく基本方針を閣議決定。"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-10-b2","memo_id":"03-10","genre_id":"03","level":"beginner","question":"食料供給困難事態対策法に基づく基本方針は、食料供給困難事態の判断基準のほか、何の基本的な方針を定めるものか。","choices":["不測時や不測時に備えた平時の対策","農産物の輸出を拡大するための対策","農地の集積・集約を進めるための対策","米の生産を調整するための需給対策"],"answer":0,"explanation":"基本方針は、判断基準のほか、不測時や不測時に備えた平時の対策の基本的な方針を定めるものです。輸出拡大、農地の集積・集約、米の需給調整はこのメモに書かれた基本方針の目的ではありません。","evidence":["食料供給困難事態の判断基準のほか、不測時や不測時に備えた平時の対策の基本的な方針を定めるもの"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-10-i1","memo_id":"03-10","genre_id":"03","level":"intermediate","question":"基本方針で、食料供給困難事態の判断基準として規定されている特定食料の供給の減少幅（平年比・全国）はどれか。","choices":["１割以上減少","２割以上減少","３割以上減少","５割以上減少"],"answer":1,"explanation":"判断基準は、特定食料の供給が平年比で全国的に2割以上減少等することです。1割・3割・5割はメモの数値と異なります。","evidence":["特定食料の供給が平年比で全国的に２割以上減少等することを規定。"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-10-i2","memo_id":"03-10","genre_id":"03","level":"intermediate","question":"「最低限度必要な食料供給が確保されないおそれのある段階」の判断基準で、供給熱量が下回るおそれがあるとされる値（1人1日当たり）はどれか。","choices":["1,500kcal/人・日","1,850kcal/人・日","2,000kcal/人・日","2,200kcal/人・日"],"answer":1,"explanation":"供給熱量が平時の摂取熱量を下回り、かつ1,850kcal/人・日を下回るおそれがある場合が基準です。ほかの値はメモに記載がありません。","evidence":["供給熱量が平時の摂取熱量を 下回り、かつ、供給熱量が","1,850kcal/人・日"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-10-a1","memo_id":"03-10","genre_id":"03","level":"advanced","question":"基本方針に示された事態の段階ごとの措置について、誤っているものはどれか。","choices":["平時は、官民合わせた備蓄・在庫をトータルで把握する総合的な備蓄を推進する","兆候の段階は、買占め等の抑制のため消費者への情報提供や働きかけを行う","事態の段階は、一定規模以上の輸入業者等に輸入や出荷販売の計画届出を指示する","事態の段階で農業者が作成する計画は、生産量を増やす計画でなければならない"],"answer":3,"explanation":"メモでは、農業者が作成する計画は生産量を増やす計画である必要はないとされています。ほかの3つは平時・兆候・事態の各段階の措置としてメモに書かれています。","evidence":["農業者が作成する計画は、生産量を増や す計画である必要はない"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-10-a2","memo_id":"03-10","genre_id":"03","level":"advanced","question":"食料供給困難兆候の段階で、一定規模以上の農業者を中心に行う措置と、その条件の組み合わせとして正しいものはどれか。","choices":["生産の要請／事態が長期化し、輸入等の要請では解消困難な場合に限る","生産の計画届出の指示／輸入等の計画届出では解消困難な場合に限る","生産の要請／特定食料の供給が平年比で１割以上減少した場合に限る","生産の計画届出の指示／供給熱量が平時の摂取熱量を下回る場合に限る"],"answer":0,"explanation":"兆候の段階では、事態が長期化し、輸入業者等への要請では解消困難と見込まれる場合に限り、農業者を中心に生産を要請します。生産の計画届出の「指示」は、国民生活等に支障が生じた事態の段階の措置です。","evidence":["事態が長期化し、上記要請では事態解消が困難と見込まれる場合に限り、","一定規模以上の農業者を中心に生産を要請"],"source":{"memo_id":"03-10","page":10,"print_page":43,"title":"食料供給困難事態対策法に基づく基本方針"}},{"id":"03-11-b1","memo_id":"03-11","genre_id":"03","level":"beginner","question":"戦後農政の流れのうち、昭和36年に制定され、基本法農政の起点となった法律はどれか。","choices":["農業基本法","食料・農業・農村基本法","農業経営基盤強化促進法","食糧法"],"answer":0,"explanation":"昭和36年（S36）に制定されたのは農業基本法です。食料・農業・農村基本法は平成11年の制定、農業経営基盤強化促進法は平成5年、食糧法は平成6年の制定です。","evidence":["Ｓ36 農業基本法制定"],"source":{"memo_id":"03-11","page":11,"print_page":44,"title":"農政の歩み①　戦後農政の大きな流れ"}},{"id":"03-11-i1","memo_id":"03-11","genre_id":"03","level":"intermediate","question":"米政策で、行政による生産数量目標の配分が廃止されたのはいつか。","choices":["平成16年","平成22年","平成25年","平成30年"],"answer":3,"explanation":"行政による生産数量目標の配分は平成30年（H30）に廃止されました。平成16年は食糧法改正、平成22年は米の需給調整の見直しの開始、平成25年は「制度設計の全体像」の決定の年です。","evidence":["・行政による生産数量目標の配分廃止（H30）"],"source":{"memo_id":"03-11","page":11,"print_page":44,"title":"農政の歩み①　戦後農政の大きな流れ"}},{"id":"03-11-i2","memo_id":"03-11","genre_id":"03","level":"intermediate","question":"平成21年の農地法の改正の内容はどれか。","choices":["リース方式による一般企業参入の全面自由化","借地による農地流動化","農地中間管理機構を都道府県段階に創設","地域農業経営基盤強化促進計画の創設"],"answer":0,"explanation":"平成21年の農地法改正では、リース方式による一般企業の参入が全面自由化されました。借地による農地流動化は昭和45年の改正、農地中間管理機構の創設は平成25年の関連法、地域計画の創設は令和4年の改正の内容です。","evidence":["・農地法の改正（H21）","リース方式による一般企業参入の全面自由化"],"source":{"memo_id":"03-11","page":11,"print_page":44,"title":"農政の歩み①　戦後農政の大きな流れ"}},{"id":"03-11-a1","memo_id":"03-11","genre_id":"03","level":"advanced","question":"平成11年制定時と令和6年改正時の食料・農業・農村基本法の基本的課題を比べたとき、令和6年の改正で新たに加わった課題はどれか。","choices":["環境と調和のとれた食料システムの確立","多面的機能の十分な発揮","農業の持続的な発展","農村の振興"],"answer":0,"explanation":"「環境と調和のとれた食料システムの確立」は令和6年改正の課題にだけ書かれています。多面的機能の十分な発揮、農業の持続的な発展、農村の振興は平成11年制定時の課題にもあります。","evidence":["Ｈ11 食料・農業・農村基本法制定","R６ 食料・農業・農村基本法改正","②環境と調和のとれた食料システムの"],"source":{"memo_id":"03-11","page":11,"print_page":44,"title":"農政の歩み①　戦後農政の大きな流れ"}},{"id":"03-11-a2","memo_id":"03-11","genre_id":"03","level":"advanced","question":"平成4年からの「新政策」の基本的課題として、誤っているものはどれか。","choices":["「農業」に加え「食料」「農村」の視点で施策を構築","効率的、安定的な経営体の育成","米麦中心から需要が拡大する作物への生産転換","市場原理の一層の導入"],"answer":2,"explanation":"米麦中心から需要が拡大する作物への生産転換（選択的拡大）は、昭和36年からの基本法農政の課題です。残りの3つは新政策の課題①〜③にあたります。","evidence":["②米麦中心の生産から、","②効率的、安定的経営体育成"],"source":{"memo_id":"03-11","page":11,"print_page":44,"title":"農政の歩み①　戦後農政の大きな流れ"}},{"id":"03-12-b1","memo_id":"03-12","genre_id":"03","level":"beginner","question":"農業基本法の下で農地の流動化が進まなかった理由として、メモの要点に挙げられているものはどれか。","choices":["機械化による兼業化の進展","農地価格の大幅な下落","農業従事者の急激な増加","米の輸入量の急増"],"answer":0,"explanation":"要点では、機械化による稲作の労働時間の短縮に伴う兼業化の進展と、農地の資産的保有意識の高まりが理由に挙げられています。地価については昭和47年の日本列島改造論で「地価上昇」とあり、下落ではありません。","evidence":["①機械化による稲作の労働時間の短縮に伴う兼業化の進展"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-12-b2","memo_id":"03-12","genre_id":"03","level":"beginner","question":"農地の流動化が進まなかったことを受けて、規模拡大の手法はどのように転換されたか。","choices":["所有権移転による規模拡大に転換","貸借による規模拡大に転換","農地転用による規模拡大に転換","国有化による規模拡大に転換"],"answer":1,"explanation":"要点では、所有権移転による自作農の規模拡大から、貸借による規模拡大に転換したとされています。所有権移転は転換前の手法なので誤りです。","evidence":["このため、貸借による規模拡大に転換する"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-12-i1","memo_id":"03-12","genre_id":"03","level":"intermediate","question":"昭和45年の農地法改正で廃止された権利取得の上限面積制限は、北海道では何haだったか。","choices":["3ha","6ha","12ha","24ha"],"answer":2,"explanation":"昭和45年農地法改正で廃止された上限面積制限は、北海道が12haでした。3haは都府県の上限面積であり、北海道の値ではありません。","evidence":["（都府県：3ha）","（北海道：12ha）"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-12-i2","memo_id":"03-12","genre_id":"03","level":"intermediate","question":"認定農業者制度が創設されたのは、どの法制度によるものか。","choices":["昭和55年 農用地利用増進法制定","平成5年 農業経営基盤強化促進法制定","平成21年 農地法改正","平成25年 農地中間管理機構関連法制定"],"answer":1,"explanation":"平成5年の農業経営基盤強化促進法制定で認定農業者制度が創設されました。昭和55年の農用地利用増進法は、平成5年に農業経営基盤強化促進法へ衣替えされた前身の法律です。","evidence":["認定農業者制度の創設","（農用地利用増進法を農業経営基盤強化促進法に衣替え）"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-12-a1","memo_id":"03-12","genre_id":"03","level":"advanced","question":"一般企業による農地のリースについて、遊休農地の多い地域での全国展開を経て、リース方式による参入が完全自由化されたのはどの法改正か。","choices":["平成15年 構造改革特区法制定","平成17年 農業経営基盤強化促進法改正","平成21年 農地法改正","平成30年 農業経営基盤強化促進法等改正"],"answer":2,"explanation":"平成15年の構造改革特区法で特区に認められ、平成17年改正で遊休農地が相当程度存する地域へ全国展開し、平成21年農地法改正で完全自由化されました。平成17年は地域を限った全国展開で、完全自由化ではありません。","evidence":["平成15年構造改革特区法制定により、構造特区で認められていたものを全国展開","リース方式による一般企業の農業参入を完全自由化"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-12-a2","memo_id":"03-12","genre_id":"03","level":"advanced","question":"農地政策の変遷に関する次の記述のうち、誤っているものはどれか。","choices":["平成21年農地法改正で、所有と利用を分離し制度を再構築した","平成25年関連法で、市町村段階に農地中間管理機構を設立した","平成27年農地法改正で、名称を「農地所有適格法人」に変更した","令和4年改正で、人・農地プランを法定化した"],"answer":1,"explanation":"平成25年の農地中間管理機構関連法では、農地中間管理機構は県段階に設立されたため、市町村段階とする記述が誤りです。他の3つはそれぞれの法改正の主な内容として記載されています。","evidence":["県段階に農地中間管理機構を設立"],"source":{"memo_id":"03-12","page":12,"print_page":45,"title":"農地政策の変遷"}},{"id":"03-13-b1","memo_id":"03-13","genre_id":"03","level":"beginner","question":"平成19年から導入された水田・畑作経営所得安定対策（品目横断的経営安定対策）の対象として、正しいものはどれか。","choices":["担い手に対象を限定","全ての販売農家が対象","全ての農家が対象","新規就農者に限定"],"answer":0,"explanation":"平成19年の水田・畑作経営所得安定対策は、担い手に対象を限定して導入されました。全ての販売農家を対象としたのは平成22年からの米の直接支払交付金です。","evidence":["平成19年から、担い手に対象を限定した水田・畑作経営所得安定対策（品目横断的経"],"source":{"memo_id":"03-13","page":13,"print_page":46,"title":"経営所得安定対策の変遷"}},{"id":"03-13-b2","memo_id":"03-13","genre_id":"03","level":"beginner","question":"経営所得安定対策で「ゲタ対策」と呼ばれる交付金はどれか。","choices":["畑作物の直接支払交付金","米の直接支払交付金","米価変動補填交付金","収入減少影響緩和交付金"],"answer":0,"explanation":"ゲタ対策は畑作物の直接支払交付金のことです。米・畑作物の収入減少影響緩和交付金はナラシ対策と呼ばれ、ゲタ対策とは別のものです。","evidence":["畑作物の直接支払交付金（ゲタ対策）、米・畑作物の収入減少影響"],"source":{"memo_id":"03-13","page":13,"print_page":46,"title":"経営所得安定対策の変遷"}},{"id":"03-13-i1","memo_id":"03-13","genre_id":"03","level":"intermediate","question":"米の直接支払交付金（当初15,000円/10a）は、26年産から単価をいくらに削減されたか。","choices":["7,500円/10a","10,000円/10a","12,500円/10a","5,000円/10a"],"answer":0,"explanation":"米の直接支払交付金は15,000円/10aでしたが、26年産から7,500円/10aに削減されました。ちょうど半額になったことを押さえると覚えやすいです。","evidence":["生産する農家に15,000円/10ａ","7,500円/10aに削減"],"source":{"memo_id":"03-13","page":13,"print_page":46,"title":"経営所得安定対策の変遷"}},{"id":"03-13-i2","memo_id":"03-13","genre_id":"03","level":"intermediate","question":"平成19年導入時のゲタ対策で、北海道以外の認定農業者に課された規模要件はどれか。","choices":["4ha","10ha","15ha","20ha"],"answer":0,"explanation":"認定農業者の規模要件は4ha（北海道は10ha）でした。10haは北海道の認定農業者、20haは集落営農の要件なので誤りです。","evidence":["・認定農業者：４ha","（北海道10ha）","・集落営農：20ha"],"source":{"memo_id":"03-13","page":13,"print_page":46,"title":"経営所得安定対策の変遷"}},{"id":"03-13-a1","memo_id":"03-13","genre_id":"03","level":"advanced","question":"経営所得安定対策の変遷について、誤っているものはどれか。","choices":["米価変動補填交付金は平成26年に廃止された","米の直接支払交付金は平成26年に廃止された","平成27年から認定新規就農者が対象に追加された","平成27年からゲタ・ナラシの規模要件が廃止された"],"answer":1,"explanation":"米の直接支払交付金は平成26年に廃止されたのではなく、26年産から単価を削減され、30年産から廃止されました。平成26年に廃止されたのは米価変動補填交付金です。","evidence":["平成26年から、米の直接支払交付金を削減し、30年産から廃止。"],"source":{"memo_id":"03-13","page":13,"print_page":46,"title":"経営所得安定対策の変遷"}},{"id":"03-14-b1","memo_id":"03-14","genre_id":"03","level":"beginner","question":"メモによると、米の生産調整が本格的に開始されたのはいつですか。","choices":["昭和44年","昭和46年","平成7年","平成16年"],"answer":1,"explanation":"要点に、生産過剰基調や政府米在庫の増大等を受けて昭和46年から生産調整を本格開始したとあります。昭和44年は自主流通米制度の導入、平成7年は食糧法の制定、平成16年は生産数量目標の配分開始の年です。","evidence":["大幅な生産過剰基調や、政府米在庫の増大等を受け、昭和46年から、米の生産調整を本格開始。"],"source":{"memo_id":"03-14","page":14,"print_page":47,"title":"米政策の変遷"}},{"id":"03-14-b2","memo_id":"03-14","genre_id":"03","level":"beginner","question":"平成30年に生産数量目標の配分を廃止した後、推進している「需要に応じた生産・販売」は何によるものとされていますか。","choices":["自らの経営判断","行政による数量の配分","国による米の全量管理","政府米価による下支え"],"answer":0,"explanation":"要点に、自らの経営判断による「需要に応じた生産・販売」を推進とあります。行政による配分、国による全量管理、政府米価による下支えは、それ以前の仕組みです。","evidence":["平成30年に生産数量目標の配分を廃止し、自らの経営判断による「需要に応じた生産・販売」を推進。"],"source":{"memo_id":"03-14","page":14,"print_page":47,"title":"米政策の変遷"}},{"id":"03-14-i1","memo_id":"03-14","genre_id":"03","level":"intermediate","question":"米の直接支払交付金の単価は、26年産から10a当たりいくらとされましたか。","choices":["4,000円/10a","7,500円/10a","10,000円/10a","15,000円/10a"],"answer":1,"explanation":"米の直接支払交付金は、26年産から単価が7,500円/10aとされました。15,000円/10aは平成22年からの当初の単価なので誤りです。","evidence":["26年産から単価を","7,500円/10a"],"source":{"memo_id":"03-14","page":14,"print_page":47,"title":"米政策の変遷"}},{"id":"03-14-i2","memo_id":"03-14","genre_id":"03","level":"intermediate","question":"メモによると、行政が農家に転作面積を配分していた期間はどれですか。","choices":["昭和46年～平成15年","平成16年～平成29年","平成19年～平成25年","平成22年～平成30年"],"answer":0,"explanation":"転作面積の配分は昭和46年～平成15年です。平成16年～平成29年は、行政が生産数量目標（作る米の量）を配分していた期間なので誤りです。","evidence":["・行政が農家に転作面積を配分","（昭和46年～平成15年）"],"source":{"memo_id":"03-14","page":14,"print_page":47,"title":"米政策の変遷"}},{"id":"03-14-a1","memo_id":"03-14","genre_id":"03","level":"advanced","question":"メモに示された米政策の変遷について、誤っているものはどれですか。","choices":["平成7年に食糧管理法が廃止され食糧法が制定された","棚上備蓄は平成23年から導入された","米価変動補填交付金は26年産から廃止された","ナラシ対策は平成22年から開始された"],"answer":3,"explanation":"ナラシ対策は平成19年からの開始で、平成22～25年は米価変動補填交付金で主に対応していました。食糧法の制定（平成7年）、棚上備蓄の導入（平成23年～）、米価変動補填交付金の26年産からの廃止は、いずれもメモのとおりです。","evidence":["・ナラシ対策（平成19年～）","下記の米価変動補填交付金で主に対応"],"source":{"memo_id":"03-14","page":14,"print_page":47,"title":"米政策の変遷"}},{"id":"03-15-b1","memo_id":"03-15","genre_id":"03","level":"beginner","question":"新たな基本計画において、水田政策を根本的に見直すとされたのは何年度からですか。","choices":["令和7年度から","令和8年度から","令和9年度から","令和10年度から"],"answer":2,"explanation":"要点に、水田政策を令和9年度から根本的に見直すことを明記したとあります。令和8年は資料の作成時点の年であり、見直しの開始年度ではありません。","evidence":["新たな基本計画において、水田政策を令和９年度から根本的に見直すことを明記。"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"03-15-b2","memo_id":"03-15","genre_id":"03","level":"beginner","question":"水田政策の見直しで、水田・畑に関わらず「土地生産性の向上」とあわせて双方を進めるとされたものはどれですか。","choices":["労働生産性の向上","資本生産性の向上","エネルギー効率の向上","流通効率の向上"],"answer":0,"explanation":"要点に、土地生産性の向上と労働生産性の向上の双方を進めるとあります。資本生産性やエネルギー効率、流通効率はこのページの要点には書かれていません。","evidence":["水田・畑に関わらず、土地生産性の向上と労働生産性の向上"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"03-15-i1","memo_id":"03-15","genre_id":"03","level":"intermediate","question":"令和6年度の中山間地域等直接支払と多面的機能支払の重複状況で、「多面支払単独」の面積が占める割合はどれですか。","choices":["8%","18%","26%","74%"],"answer":3,"explanation":"重複状況の図で、多面支払単独は187万ha（74%）です。8%は中山間直払単独、18%は重複の割合です。","evidence":["多面支払単独\n187万ha\n（74%）"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"03-15-i2","memo_id":"03-15","genre_id":"03","level":"intermediate","question":"作物ごとの生産性向上の表で、麦、大豆、飼料作物の「現行」の支援はどれですか。","choices":["10a当たり定額の単価で支援","10a当たりの収量に応じた単価で支援","従前どおり支援の対象外","当面、単収向上等の支援を検討"],"answer":0,"explanation":"表では、新市場開拓用米等と麦、大豆、飼料作物の現行は10a当たり定額の単価での支援です。収量に応じた単価は米粉用米等の現行と見直しの方向性であり、単収向上等の支援検討は業務用米の見直しの方向性です。","evidence":["10a当たり定額の単価で支援","生産性向上に向け、10a当たりの\n収量に応じた単価で支援"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"03-15-a1","memo_id":"03-15","genre_id":"03","level":"advanced","question":"水田政策の見直しの方針の説明として、誤っているものはどれですか。","choices":["主食用米のうち業務用以外の米は従前どおり対象外","環境直接支払は計画認定に基づく農業者支援とする","産地交付金では付加価値向上等も支援する","中山間地域等直接支払は対象農用地を縮小する"],"answer":3,"explanation":"中山間地域等直接支払では「対象農用地の拡大」とされており、縮小ではありません。ほかの3つは、業務用以外の米の扱い、環境直接支払の見直し、産地交付金の内容としてメモに書かれています。","evidence":["・ 対象農用地の拡大"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"03-15-a2","memo_id":"03-15","genre_id":"03","level":"advanced","question":"令和6年度の中山間地域等直接支払と多面的機能支払の「重複」の面積と割合の組み合わせはどれですか。","choices":["46万ha（18%）","20万ha（8%）","46万ha（8%）","20万ha（18%）"],"answer":0,"explanation":"図で重複は46万ha（18%）です。20万ha（8%）は中山間直払単独の数値であり、面積と割合を入れ替えた組み合わせも誤りです。","evidence":["重複\n46万ha\n（18%）","中山間直払単独\n20万ha\n（8%）"],"source":{"memo_id":"03-15","page":15,"print_page":48,"title":"水田政策の見直しの概要"}},{"id":"04-01-b1","memo_id":"04-01","genre_id":"04","level":"beginner","question":"このメモで、米の販売価格が高騰したとされている産年の組合せはどれか。","choices":["平成15年産と令和6、7年産","平成5年産と令和6、7年産","平成15年産と令和元、2年産","平成5年産と平成25年産"],"answer":0,"explanation":"要点に、平成15年産（作況指数90）及び令和6、7年産は価格が高騰したと書かれています。平成5年産や令和元、2年産、平成25年産は高騰した年として挙げられていません。","evidence":["平成15年産（作況指数が「90」","及び令和６、７年産は価格が高騰。"],"source":{"memo_id":"04-01","page":1,"print_page":49,"title":"米の販売価格と1人当たり年間消費量の推移"}},{"id":"04-01-b2","memo_id":"04-01","genre_id":"04","level":"beginner","question":"米の1人当たりの年間消費量（精米）がピークだった年とその量はどれか。","choices":["昭和37年の118kg","昭和37年の70kg","平成2年の118kg","平成2年の70kg"],"answer":0,"explanation":"要点に、昭和37年の118kgをピークに一貫して減少傾向と書かれています。平成2年はグラフの起点で、ピークの年ではありません。","evidence":["昭和37年の118kgをピークに一貫して減少傾向。"],"source":{"memo_id":"04-01","page":1,"print_page":49,"title":"米の販売価格と1人当たり年間消費量の推移"}},{"id":"04-01-i2","memo_id":"04-01","genre_id":"04","level":"intermediate","question":"グラフで、平成2年の米の1人当たりの年間消費量（精米）は何kgか。","choices":["70.0kg","58.8kg","53.4kg","50.3kg"],"answer":0,"explanation":"グラフの起点である平成2年の年間消費量は70.0kgです。58.8kgや53.4kg、50.3kgはその後の減少した年の値です。","evidence":["米の１人当たりの年間消費量（精米）","米の１人当たりの年間消費量(精米)は、昭和37年の118kgをピークに一貫して減少傾向。"],"source":{"memo_id":"04-01","page":1,"print_page":49,"title":"米の販売価格と1人当たり年間消費量の推移"}},{"id":"04-02-b1","memo_id":"04-02","genre_id":"04","level":"beginner","question":"令和7年産の全国の主食用米の作付面積（令和7年9月15日時点）はどれか。","choices":["125.9万ha","136.3万ha","136.7万ha","147.5万ha"],"answer":2,"explanation":"令和7年産の主食用米の作付面積は136.7万haとなりました。125.9万haは前年（令和6年産）の実績で、令和7年産の値ではありません。","evidence":["増加し、136.7万haとなった。"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-02-b2","memo_id":"04-02","genre_id":"04","level":"beginner","question":"令和7年産の戦略作物等の作付面積は、品目ごとにどう動いたか。","choices":["いずれの品目も増加した","いずれの品目も減少した","麦と大豆だけが増加した","どの品目も前年並みだった"],"answer":1,"explanation":"メモには、戦略作物等の作付面積は、いずれの品目も減少したと書かれています。増加した品目や前年並みの品目はないため、ほかの選択肢は誤りです。","evidence":["戦略作物等の作付面積は、いずれの品目も減少する"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-02-i1","memo_id":"04-02","genre_id":"04","level":"intermediate","question":"令和7年産の全国の主食用米の作付面積は、前年実績から何万ha増えたか。","choices":["0.4万ha","0.8万ha","10.8万ha","11.2万ha"],"answer":2,"explanation":"前年実績125.9万haから10.8万ha増えて136.7万haとなりました。0.4万haは6月末時点の作付意向との差で、0.8万haは畑地化面積です。","evidence":["前年実績（125.9万ha）から10.8万ha"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-02-i2","memo_id":"04-02","genre_id":"04","level":"intermediate","question":"令和7年産の水田における畑地化面積は何万haか。","choices":["0.4万ha","0.8万ha","3.0万ha","10.8万ha"],"answer":1,"explanation":"畑地化面積は0.8万haと書かれています。0.4万haは主食用米の6月末時点の作付意向との差、10.8万haは主食用米の前年からの増加幅です。","evidence":["畑地化面積については、","0.8万haとなった。"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-02-a1","memo_id":"04-02","genre_id":"04","level":"advanced","question":"令和7年産の全国の主食用米について、6月末時点の作付意向の面積はおよそ何万haだったと計算できるか。","choices":["125.9万ha","136.3万ha","136.7万ha","137.1万ha"],"answer":1,"explanation":"最終の作付面積136.7万haは、6月末時点の作付意向から0.4万ha増えた値なので、意向は136.7−0.4＝136.3万haです。137.1万haは0.4万haを足してしまった誤り、136.7万haは最終の作付面積です。","evidence":["６月末時点の作付意向から0.4万ha","増加し、136.7万haとなった。"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-02-a2","memo_id":"04-02","genre_id":"04","level":"advanced","question":"令和7年産の水田の作付状況の注記について、誤っているものはどれか。","choices":["加工用米等の令和7年産は取組計画の認定面積","備蓄米は令和7年産米の入札を当面中止","畑地化面積は畑地化促進事業で採択された面積","表の数値は単位未満を四捨五入している"],"answer":0,"explanation":"加工用米や新規需要米は、令和6年産以前が取組計画の認定面積で、令和7年産は取組計画の届出面積です。備蓄米の入札中止、畑地化面積の定義、四捨五入の扱いは注記のとおりです。","evidence":["Ｒ６年産以前の実績は、取組計画の認定面積。Ｒ７年産は取組計画の届出面積。"],"source":{"memo_id":"04-02","page":2,"print_page":50,"title":"令和7年産の水田における作付状況"}},{"id":"04-03-b1","memo_id":"04-03","genre_id":"04","level":"beginner","question":"新たな食料・農業・農村基本計画で、2030年度までに15ha以上の経営体の米の生産コスト（円/60kg）をいくらに低減する目標としているか。","choices":["9,500円/60kg","11,350円/60kg","13,000円/60kg","10,807円/60kg"],"answer":0,"explanation":"15ha以上の経営体は2023年の11,350円/60kgから9,500円/60kgに低減する目標です。11,350円は基準値、13,000円は全体のKPI、10,807円は令和6年度の実績です。","evidence":["コストを、15ha以上の経営体については、2023年の11,350円/60kgから9,500円/60kgに低減する目標と、"],"source":{"memo_id":"04-03","page":3,"print_page":51,"title":"米の生産コストと所得（規模別）"}},{"id":"04-03-b2","memo_id":"04-03","genre_id":"04","level":"beginner","question":"全国の米の生産コストは、作付規模が大きくなるにつれてどうなるとされているか。","choices":["規模が大きくなるにつれて低減する","規模が大きくなるにつれて増加する","規模にかかわらずほぼ変わらない","15haを境に増加へ転じる"],"answer":0,"explanation":"要点に、米の生産コストは作付規模が大きくなるにつれて低減すると書かれています。規模拡大につれて増加するのは所得の方であり、コストではありません。","evidence":["米の生産コストは作付規模が大きくなるにつれて低減。"],"source":{"memo_id":"04-03","page":3,"print_page":51,"title":"米の生産コストと所得（規模別）"}},{"id":"04-03-i2","memo_id":"04-03","genre_id":"04","level":"intermediate","question":"グラフ「米の生産コストと所得（全国）」の経営体数で、シェアが最も大きい作付規模区分はどれか。","choices":["0.5ha未満","0.5～1ha","1～3ha","3～5ha"],"answer":0,"explanation":"0.5ha未満が17.2万経営体（33.0％）で最も大きいシェアです。0.5～1haは27.6％、1～3haは26.2％、3～5haは5.8％で、いずれも0.5ha未満より小さくなっています。","evidence":["17.2万\n（33.0％）","14.4万\n（27.6％）","13.7万\n（26.2％）"],"source":{"memo_id":"04-03","page":3,"print_page":51,"title":"米の生産コストと所得（規模別）"}},{"id":"04-03-a1","memo_id":"04-03","genre_id":"04","level":"advanced","question":"個別経営（全体）の米の生産コストについて、令和6年度の実績と令和12年度のKPIとの差（円/60kg）はいくらか。","choices":["2,796円/60kg","2,944円/60kg","1,307円/60kg","1,850円/60kg"],"answer":0,"explanation":"全体は令和6年度15,796円、KPI13,000円なので差は2,796円です。2,944円は基準値15,944円とKPIの差、1,307円と1,850円は15ha以上層の令和6年度・基準値と目標との差です。","evidence":["15,944\n\n15,796\n\n13,000","全体については、2023年の15,944円/60kgから13,000円/60kgに低減するKPIを設定。"],"source":{"memo_id":"04-03","page":3,"print_page":51,"title":"米の生産コストと所得（規模別）"}},{"id":"04-03-a2","memo_id":"04-03","genre_id":"04","level":"advanced","question":"米の生産コスト低減に関する新たな食料・農業・農村基本計画の記述として、誤っているものはどれか。","choices":["基本計画は令和7年4月11日に閣議決定された","全体の生産コストの基準値は11,350円/60kgである","多収性・高温耐性を備えた品種の開発・導入を進める","農地の大区画化等の基盤整備を進める"],"answer":1,"explanation":"全体の基準値は2023年の15,944円/60kgで、11,350円/60kgは15ha以上の経営体の基準値です。閣議決定日、品種の開発・導入、大区画化等の基盤整備はいずれもメモに記載があります。","evidence":["全体については、2023年の15,944円/60kgから13,000円/60kgに低減するKPIを設定。"],"source":{"memo_id":"04-03","page":3,"print_page":51,"title":"米の生産コストと所得（規模別）"}},{"id":"04-04-b1","memo_id":"04-04","genre_id":"04","level":"beginner","question":"日本産米（米・パックご飯・米粉及び米粉製品）の2025年の輸出量は、直近5年間で約何倍に拡大したとされていますか。","choices":["約1.5倍","約2.3倍","約3.5倍","約4.8倍"],"answer":1,"explanation":"メモでは、2025年の輸出量は約4.8万トンとなり、直近5年間で約2.3倍に拡大したとしています。4.8は倍率ではなく2025年の輸出量（万トン）の数値です。","evidence":["2025年の輸出量は約4.8万トンとなり、直","近５年間で約2.3倍に拡大。"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-04-b2","memo_id":"04-04","genre_id":"04","level":"beginner","question":"米の更なる輸出拡大のため、開拓を進める新たな販路の例としてメモに挙げられているものはどれですか。","choices":["現地系のスーパーやレストラン等","在外公館や国際機関の食堂等","空港の免税店や機内食の提供等","国内の訪日客向けの飲食店等"],"answer":0,"explanation":"メモでは、現地系のスーパーやレストラン等の新たな販路の開拓等を進めるとしています。ほかの選択肢はメモに販路として挙げられていません。","evidence":["現地系のスーパーやレストラン等の新たな販路の開拓等を進めていく"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-04-i1","memo_id":"04-04","genre_id":"04","level":"intermediate","question":"表の「①米」の2025年の輸出数量はどれですか。","choices":["45,112トン","46,573トン","48,192トン","70,529トン"],"answer":1,"explanation":"①米の2025年の輸出数量は46,573トンです。45,112トンは2024年の値、48,192トンは米・パックご飯等の合計（①＋②＋③）、70,529トンは米・米加工品全体の値です。","evidence":["19,781トン 22,833トン 28,928トン 37,186トン 45,112トン 46,573トン"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-04-i2","memo_id":"04-04","genre_id":"04","level":"intermediate","question":"表の「⑤日本酒（清酒）」の原料米換算の輸出量について、2021〜2025年のうち前年より減少した年はどれですか。","choices":["2021年","2022年","2023年","2025年"],"answer":2,"explanation":"日本酒の原料米換算は2022年の20,218トンから2023年に16,444トンへ減少しました。2021年・2022年・2025年はいずれも前年より増加しています。","evidence":["12,257トン 18,054トン 20,218トン 16,444トン 17,492トン 18,897トン"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-04-a1","memo_id":"04-04","genre_id":"04","level":"advanced","question":"2030年の輸出目標（米・パックご飯・米粉及び米粉製品）と2025年の輸出量の差は、およそ何万トンですか。","choices":["約25.3万トン","約30.5万トン","約33.0万トン","約40.1万トン"],"answer":1,"explanation":"目標は35.3万トン、2025年の輸出量は約4.8万トンなので、差は約30.5万トンです。40.1万トンは両者を足した値で、差ではありません。","evidence":["2030年に「米・パックご飯・米粉及び米粉製品」","35.3万トンの輸出量の達成を目指すこととしている","2025年の輸出量は約4.8万トンとなり、直"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-04-a2","memo_id":"04-04","genre_id":"04","level":"advanced","question":"表の輸出数量（原料米換算）について、誤っているものはどれですか。","choices":["「米・米加工品」の2025年の数量は70,529トン","「米・パックご飯・加工米飯・米粉及び米粉製品」の2025年は48,192トン","「米・パックご飯・加工米飯・米粉及び米粉製品」は2023年に初めて3万トン超","「米・米加工品」の数量は2023年に前年を下回った"],"answer":3,"explanation":"「米・米加工品」は2022年53,931トンから2023年58,472トンへ増加しており、前年を下回ってはいません。ほかの3つは表の値のとおりで、合計（①＋②＋③）は2022年29,868トンから2023年38,148トンで初めて3万トンを超えました。","evidence":["36,569トン 45,959トン 53,931トン 58,472トン 67,922トン 70,529トン"],"source":{"memo_id":"04-04","page":4,"print_page":52,"title":"日本産米・米加工品の輸出の現状と目標"}},{"id":"04-05-b1","memo_id":"04-05","genre_id":"04","level":"beginner","question":"今回の主要食糧法の改正で、米の需要を拡大し需要に応じた生産を推進するために見直すとされた規定はどれか。","choices":["米の需要の減少を前提とした生産調整に関する規定","米の需要の増加を前提とした増産に関する規定","米の輸入の拡大を前提とした関税に関する規定","米の価格の下落を前提とした補てんに関する規定"],"answer":0,"explanation":"要点に「米の需要の減少を前提とした生産調整に関する規定を見直し」と書かれています。需要の増加を前提とした増産や、輸入・価格補てんの規定を見直すという記述はありません。","evidence":["生産を推進するため、米の需要の減少を前提とした生産調整に関する規定を見直し。"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-05-b2","memo_id":"04-05","genre_id":"04","level":"beginner","question":"今回の主要食糧法の改正で、米の安定供給の確保のために構築が必要とされた備蓄体制はどれか。","choices":["官民を挙げた備蓄体制","政府だけで担う備蓄体制","生産者だけで担う備蓄体制","都道府県ごとに担う備蓄体制"],"answer":0,"explanation":"要点では、官民を挙げた備蓄体制を構築し、備蓄米の機動的放出を可能とする必要があるとしています。政府だけ、生産者だけ、都道府県ごとに担う体制ではありません。","evidence":["を挙げた備蓄体制を構築し、備蓄米の機動的放出を可能とする必要"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-05-i1","memo_id":"04-05","genre_id":"04","level":"intermediate","question":"今回の主要食糧法の改正で、米穀の出荷・販売業者に加えて届出事業者に追加される事業者はどれか。","choices":["加工・中食・外食の事業者","肥料・農薬・資材の事業者","輸送・倉庫・港湾の事業者","種苗・農機・燃料の事業者"],"answer":0,"explanation":"届出事業者の拡大として、加工・中食・外食の事業者を追加すると明記されています。肥料・農薬、輸送・倉庫、種苗・農機の事業者を追加するという記述はありません。","evidence":["米穀の出荷・販売業者に加え、加工・中食・外食の事業者を追加"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-05-i2","memo_id":"04-05","genre_id":"04","level":"intermediate","question":"今回の主要食糧法の改正のうち、民間備蓄制度の創設（2(2)）の施行日として想定されている日はどれか。","choices":["令和10年4月1日","令和9年4月1日","令和8年7月15日","令和8年7月8日"],"answer":0,"explanation":"2(2)は公布の日から2年を超えない範囲で政令で定める日で、令和10年4月1日を想定しています。令和9年4月1日は法律全体の想定施行日、令和8年7月15日は公布日、7月8日は成立日です。","evidence":["2(2)は公布の日から起算して２年を超えない範囲内において政令で定める日（令和10年４月１日を想定）"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-05-a1","memo_id":"04-05","genre_id":"04","level":"advanced","question":"令和8年7月に成立した主要食糧法の一部改正の内容として、誤っているものはどれか。","choices":["備蓄の目的の見直しは、公布の日から施行される","届出事業者に在庫量等の定期報告を義務化する","生産調整方針に関連する規定を廃止する","すべての民間事業者に米穀の保有を義務付ける"],"answer":3,"explanation":"民間備蓄制度で米穀の保有が義務付けられるのは「一定規模以上の民間事業者」で、すべての民間事業者ではありません。目的の見直し（2(1)）は公布の日施行、定期報告の義務化、生産調整方針の規定廃止はいずれもメモのとおりです。","evidence":["政府備蓄に加え、一定規模以上の民間事業者に対して、基準量以上の米穀の保有を義務付け"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-05-a2","memo_id":"04-05","genre_id":"04","level":"advanced","question":"今回の主要食糧法の改正で新設される需要に応じた生産の責務規定について、生産者と政府それぞれの役割の組み合わせとして正しいものはどれか。","choices":["生産者は主体的に努力し、政府は促進する","生産者は促進し、政府は主体的に努力する","生産者は報告し、政府は生産量を配分する","生産者は備蓄し、政府は生産量を配分する"],"answer":0,"explanation":"責務規定では、生産者は需要に応じた生産に主体的に努力し、政府は需要に応じた生産を促進することを明記しています。役割を逆にしたものや、政府が生産量を配分するという記述はありません。","evidence":["生産者は需要に応じた生産に主体的に努力すること、政府は需要に応じた生産を促進すること等を明記"],"source":{"memo_id":"04-05","page":5,"print_page":53,"title":"主要食糧法の一部改正（米の流通・備蓄・生産）"}},{"id":"04-06-b1","memo_id":"04-06","genre_id":"04","level":"beginner","question":"輸入小麦の政府売渡価格は、どのような頻度・時期で改定されるか。","choices":["年2回（4月期、10月期）","年1回（4月期のみ）","年2回（1月期、7月期）","年4回（四半期ごと）"],"answer":0,"explanation":"メモには、直近6か月の平均買付価格を基に年2回（4月期、10月期）改定すると書かれています。年1回や年4回、1月期・7月期の改定ではありません。","evidence":["直近６か月の平均買付価格を基に、年２回（４月期、10月期）改定。"],"source":{"memo_id":"04-06","page":6,"print_page":54,"title":"輸入小麦の政府売渡価格の推移"}},{"id":"04-06-b2","memo_id":"04-06","genre_id":"04","level":"beginner","question":"ウクライナ情勢による高騰を受け、令和4年10月期の輸入小麦の政府売渡価格はどのように扱われたか。","choices":["緊急措置により実質据置きとされた","緊急措置により2割引き下げられた","通常どおり算定して大幅に引き上げた","改定時期を翌年4月期に先送りした"],"answer":0,"explanation":"令和4年10月期は緊急措置により実質据置きとされました。引下げや通常どおりの大幅引上げ、改定の先送りではありません。","evidence":["令和４年10月期においては緊急措置により実質据置き"],"source":{"memo_id":"04-06","page":6,"print_page":54,"title":"輸入小麦の政府売渡価格の推移"}},{"id":"04-06-i1","memo_id":"04-06","genre_id":"04","level":"intermediate","question":"令和5年10月期の輸入小麦の政府売渡価格（円/トン）と対前期比の組み合わせとして正しいものはどれか。","choices":["68,240円/トン、対前期比▲11.1％","68,240円/トン、対前期比+5.8％","76,750円/トン、対前期比▲11.1％","67,810円/トン、対前期比▲0.6％"],"answer":0,"explanation":"令和5年10月期は68,240円/トン（対前期比▲11.1％）です。76,750円・+5.8％はグラフ上の令和5年4月期、67,810円・▲0.6％は令和6年4月期の値です。","evidence":["68,240円/トン（対前期比▲11.1％）としたところ。"],"source":{"memo_id":"04-06","page":6,"print_page":54,"title":"輸入小麦の政府売渡価格の推移"}},{"id":"04-06-i2","memo_id":"04-06","genre_id":"04","level":"intermediate","question":"令和8年4月期の輸入小麦の政府売渡価格（5銘柄加重平均、円/トン）はいくらか。","choices":["62,520円/トン","61,010円/トン","63,570円/トン","61,820円/トン"],"answer":0,"explanation":"令和8年4月期は62,520円/トン（対前期比+2.5％）とされました。61,010円はグラフ上の令和7年10月期、63,570円は令和7年4月期、61,820円は令和3年10月期の値です。","evidence":["62,520円/トン（対前期比+2.5％）とした。"],"source":{"memo_id":"04-06","page":6,"print_page":54,"title":"輸入小麦の政府売渡価格の推移"}},{"id":"04-06-a1","memo_id":"04-06","genre_id":"04","level":"advanced","question":"輸入小麦の政府売渡価格の算定・措置について、メモの内容として誤っているものはどれか。","choices":["令和5年10月期は直近6か月間の平均買付価格をベースに算定した","令和5年10月期の前に、買付価格はウクライナ情勢前の水準に落ち着いた","令和8年4月期は令和7年4月第1週～9月第1週の買付価格で算定した","令和5年4月は激変緩和措置として上昇幅の抑制を行った"],"answer":2,"explanation":"令和8年4月期の算定に用いた買付価格の期間は令和7年9月第2週～令和8年3月第1週であり、令和7年4月～9月ではありません。ほかの3つは、令和5年4月の激変緩和措置と令和5年10月期の算定の経緯としてメモに書かれています。","evidence":["直近６か月間の買付価格（令和７年９月第２週～令和８年３月"],"source":{"memo_id":"04-06","page":6,"print_page":54,"title":"輸入小麦の政府売渡価格の推移"}},{"id":"04-07-b1","memo_id":"04-07","genre_id":"04","level":"beginner","question":"一口メモによると、食の外部化を背景に、国内の野菜の需要はどのようにシフトしているか。","choices":["家計消費用から加工・業務用へ","加工・業務用から家計消費用へ","加工・業務用から輸出用へ","家計消費用から輸出用へ"],"answer":0,"explanation":"要点に、野菜の需要は家計消費用から加工・業務用に徐々にシフトしていると書かれています。逆向きのシフトや輸出用へのシフトは書かれていません。","evidence":["食の外部化を背景に、野菜の需要は家計消費用から加工・業務用に徐"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-07-b2","memo_id":"04-07","genre_id":"04","level":"beginner","question":"野菜・施設園芸支援対策で、省エネルギーと生産性を両立する持続可能な栽培体系への転換を促進するために支援するものはどれか。","choices":["生産者と実需者を繋ぐマッチング","出荷規格の見直し","再生可能エネルギーの賦存量調査や実証","生育予測システムの導入"],"answer":2,"explanation":"要点で、省エネルギーと生産性を両立する栽培体系への転換促進のため、再生可能エネルギーの賦存量調査や実証等を支援するとされています。マッチング、出荷規格の見直し、生育予測システムは、周年安定供給や国産シェア奪還のための支援内容です。","evidence":["省エネルギーと生産性を両立する持続可能な栽培体系","への転換を促進するための再生可能エネルギーの賦存量調査や実証等を支援。"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-07-i1","memo_id":"04-07","genre_id":"04","level":"intermediate","question":"「野菜の国内需要の推移（主要野菜品目）」で、R2の国内需要に占める加工・業務用の割合は何％か。","choices":["44％","49％","51％","56％"],"answer":3,"explanation":"R2の加工・業務用は523万トンで、全体の56％です。44％はR2の家計消費用の割合、51％と49％はH2の加工・業務用と家計消費用の割合です。","evidence":["523万トン （56％）"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-07-i2","memo_id":"04-07","genre_id":"04","level":"intermediate","question":"「野菜の国内需要の推移（主要野菜品目）」で、H2の国内需要（加工・業務用と家計消費用）の合計は何万トンか。","choices":["939万トン","1,082万トン","1,048万トン","1,147万トン"],"answer":1,"explanation":"H2の合計は1,082万トンと示されています。939万トンはR2の合計で、1,048万トンと1,147万トンは別のグラフの国内生産量の数値です。","evidence":["合計1,082万トン"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-07-a1","memo_id":"04-07","genre_id":"04","level":"advanced","question":"「野菜の国内需要の推移（主要野菜品目）」について、誤っているものはどれか。","choices":["R2の国内需要の合計は939万トンである","R2の家計消費用のうち国産は402万トンである","H2の加工・業務用は552万トンである","R2の家計消費用は530万トンである"],"answer":3,"explanation":"R2の家計消費用は416万トンで、530万トンはH2の家計消費用の数値なので誤りです。ほかの3つはグラフの数値と一致します。","evidence":["416万トン （44％）","530万トン （49％）"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-07-a2","memo_id":"04-07","genre_id":"04","level":"advanced","question":"「野菜の国内需要の推移（主要野菜品目）」で、H2からR2にかけての加工・業務用の国産と輸入の変化として正しいものはどれか。","choices":["国産も輸入も増えた","国産が減り、輸入が増えた","国産が増え、輸入が減った","国産も輸入も減った"],"answer":1,"explanation":"加工・業務用の国産はH2の486万トンからR2の357万トンに減り、輸入は66万トンから166万トンに増えています。国産と輸入が同じ向きに動いたとする選択肢は数値と合いません。","evidence":["（国産486万トン、輸入66万トン）","（国産357万トン、輸入166万トン）"],"source":{"memo_id":"04-07","page":7,"print_page":55,"title":"野菜の需給動向と野菜・施設園芸支援対策"}},{"id":"04-08-b1","memo_id":"04-08","genre_id":"04","level":"beginner","question":"このメモで、果樹生産の特徴として挙げられているものはどれか。","choices":["機械化が困難で季節的な労働ピークがある","機械化が進み労働時間が年間で平準化している","作業が単純で高度な技術をほとんど要しない","労働ピークが冬季の1回だけに集中している"],"answer":0,"explanation":"メモでは、果樹生産は機械化が困難で高度な技術を要する作業が多く、季節的な労働ピークが存在することが特徴とされています。機械化が進んでいる、技術を要しないといった選択肢はメモの記述と逆です。","evidence":["果樹生産は、機械化が困難で高度な技術を要する作業が多く、季節的な労働ピークが存在することが特徴。"],"source":{"memo_id":"04-08","page":8,"print_page":56,"title":"果樹の生産動向と果樹支援対策"}},{"id":"04-08-b2","memo_id":"04-08","genre_id":"04","level":"beginner","question":"このメモで、果樹の国内生産量の近年の動きとその背景として書かれているものはどれか。","choices":["担い手の減少等を背景に減少傾向","輸出の拡大等を背景に増加傾向","担い手の増加等を背景に横ばい傾向","気候の安定等を背景に増加傾向"],"answer":0,"explanation":"果樹の国内生産量は、担い手の減少等を背景に近年減少傾向で推移しているとされています。増加傾向や横ばいとする選択肢は誤りです。","evidence":["果樹の国内生産量は、担い手の減少等を背景に、近年減少傾向で推移。"],"source":{"memo_id":"04-08","page":8,"print_page":56,"title":"果樹の生産動向と果樹支援対策"}},{"id":"04-08-a1","memo_id":"04-08","genre_id":"04","level":"advanced","question":"果樹支援対策（果樹農業生産力増強総合対策）の各事業の内容として、誤っているものはどれか。","choices":["果樹経営支援等対策事業は省力樹形等への改植・新植を優先的に支援","果樹優良苗木・花粉安定確保対策事業は国産花粉の安定生産・供給の取組を支援","果実流通加工対策事業は省力化栽培・出荷技術等の実証等の取組を支援","果樹農業構造転換支援事業は果樹型トレーニングファームの整備を支援"],"answer":3,"explanation":"果樹型トレーニングファームの整備は「果樹型トレーニングファーム等推進条件整備事業」の内容で、果樹農業構造転換支援事業はコンソーシアムによるモデル構築の実証を支援します。ほかの3つはメモの各事業の記述どおりです。","evidence":["新たな担い手の確保・定着に資する果樹型トレーニング","コンソーシアムによる実証の取組を支援。"],"source":{"memo_id":"04-08","page":8,"print_page":56,"title":"果樹の生産動向と果樹支援対策"}},{"id":"04-09-b1","memo_id":"04-09","genre_id":"04","level":"beginner","question":"令和6年の畜産の産出額は、農業総産出額（10兆7,801億円）の約何%を占めているか。","choices":["約21%","約28%","約34%","約47%"],"answer":2,"explanation":"令和6年の畜産の産出額3兆6,654億円は、農業総産出額の約34%を占めます。21%や28%は品目別割合（肉用牛・豚、鶏）の数値で、畜産全体の割合ではありません。","evidence":["○令和６年の畜産の産出額は３兆6,654億円で、農業総産出額（10兆7,801億円）の約34％"],"source":{"memo_id":"04-09","page":9,"print_page":57,"title":"畜産の産出額と飼養規模の動向"}},{"id":"04-09-b2","memo_id":"04-09","genre_id":"04","level":"beginner","question":"このメモで、各畜種の一戸当たりの飼養頭羽数の動きはどう説明されているか。","choices":["いずれの畜種も増加し規模拡大が進展","いずれの畜種も減少し小規模化が進行","牛は増加したが鶏は減少している","畜種によらずほぼ横ばいで推移している"],"answer":0,"explanation":"メモの要点では、いずれの畜種も一戸当たりの飼養頭羽数が増加し、規模拡大が進展しているとされています。畜種によって増減が分かれるとはしておらず、減少や横ばいの記述もありません。","evidence":["○いずれの畜種も一戸当たりの飼養頭羽数は増加しており、規模拡大が進展。"],"source":{"memo_id":"04-09","page":9,"print_page":57,"title":"畜産の産出額と飼養規模の動向"}},{"id":"04-09-i1","memo_id":"04-09","genre_id":"04","level":"intermediate","question":"令和6年の畜産の産出額の品目別割合で、産出額が最も大きい品目はどれか。","choices":["鶏","乳用牛","肉用牛","豚"],"answer":0,"explanation":"令和6年は鶏が10,170億円（28%）で最も大きく、乳用牛の10,035億円（27%）をわずかに上回ります。肉用牛（7,861億円）と豚（7,567億円）はそれより小さい額です。","evidence":["畜産の産出額の品目別割合（令和６年）","鶏, 10,170 億円"],"source":{"memo_id":"04-09","page":9,"print_page":57,"title":"畜産の産出額と飼養規模の動向"}},{"id":"04-09-i2","memo_id":"04-09","genre_id":"04","level":"intermediate","question":"豚の飼養頭数のグラフで、平成29年から令和8年にかけての全国の飼養頭数と一戸当たり飼養頭数の動きとして正しいものはどれか。","choices":["飼養頭数は減少、一戸当たりは増加","飼養頭数は増加、一戸当たりも増加","飼養頭数は増加、一戸当たりは減少","飼養頭数は減少、一戸当たりも減少"],"answer":0,"explanation":"豚の飼養頭数は平成29年の9,346千頭から令和8年の8,756千頭へ減少した一方、一戸当たりは2,001頭から3,040頭へ増加しています。総頭数が減っても一戸当たりは増えており、規模拡大が進んでいることを示します。","evidence":["8,756 4,000 160,000","3,040 3,500 140,000","○いずれの畜種も一戸当たりの飼養頭羽数は増加しており、規模拡大が進展。"],"source":{"memo_id":"04-09","page":9,"print_page":57,"title":"畜産の産出額と飼養規模の動向"}},{"id":"04-09-a1","memo_id":"04-09","genre_id":"04","level":"advanced","question":"令和6年の畜産の産出額の品目別割合について、誤っているものはどれか。","choices":["肉用牛の産出額は7,861億円で21%","豚の産出額は8,756億円で24%","その他畜産物は1,021億円で3%","豚の産出額は7,567億円で21%"],"answer":1,"explanation":"令和6年の豚の産出額は7,567億円（21%）です。8,756は令和8年の豚の飼養頭数（千頭）の数値で、産出額ではありません。","evidence":["7,567 億円 (21%)"],"source":{"memo_id":"04-09","page":9,"print_page":57,"title":"畜産の産出額と飼養規模の動向"}},{"id":"04-10-b1","memo_id":"04-10","genre_id":"04","level":"beginner","question":"持続的な畜産物生産のために推進することが重要とされているものはどれか。","choices":["国産飼料に立脚した畜産への転換","輸入飼料に依存した畜産の拡大","飼養頭数の大幅な削減による調整","配合飼料の海外調達先の集約化"],"answer":0,"explanation":"メモでは、国際情勢に左右されにくい持続的な畜産物生産のために、国産飼料に立脚した畜産への転換を推進することが重要とされています。輸入飼料への依存拡大や海外調達先の集約は、この方向と逆です。","evidence":["国際情勢に左右されにくい持続的な畜産物生産のためには、国産飼料に立脚した畜産への転換を"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-10-b2","memo_id":"04-10","genre_id":"04","level":"beginner","question":"全国の飼料作物作付面積（飼料用米除く）は、近年どのように推移しているか。","choices":["横ばいで推移している","急速に増加している","大きく減少している","年ごとに大きく変動している"],"answer":0,"explanation":"メモでは、全国の飼料作物作付面積（飼料用米除く）は近年横ばいで推移しているとされています。急増や大幅な減少、大きな変動とは書かれていません。","evidence":["全国の飼料作物作付面積（飼料用米除く）は、近年横ばいで推移しており"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-10-i1","memo_id":"04-10","genre_id":"04","level":"intermediate","question":"令和7年度の全国の飼料作物作付面積（飼料用米除く）はどれか。","choices":["85.9万ha","88.0万ha","90.5万ha","101万ha"],"answer":0,"explanation":"令和7年度の飼料作物作付面積（飼料用米除く）は85.9万haです。88万haは令和5年度の基準値、101万haは令和12年度の目標で、いずれも令和7年度の値ではありません。","evidence":["令和７年度は85.9万ha"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-10-i2","memo_id":"04-10","genre_id":"04","level":"intermediate","question":"飼料作物の作付面積の主産地である北海道の割合はどれか。","choices":["64％","76％","36％","27％"],"answer":0,"explanation":"主産地は北海道で、割合は64％です。76％は作物別で牧草が占める割合、27％は令和5年度の飼料自給率で、別の数値です。","evidence":["主産地は、北海道（64％）であり"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-10-a1","memo_id":"04-10","genre_id":"04","level":"advanced","question":"令和7年策定の基本計画の目標で、飼料作物の作付面積を令和5年度の値から令和12年度の目標まで増やすには何万ha必要か。","choices":["13万ha","15.1万ha","11万ha","3万ha"],"answer":0,"explanation":"目標は令和5年度88万haから令和12年度101万haなので、差は13万haです。15.1万haは令和7年度の85.9万haを起点にした差で、問いの基準年とは異なります。","evidence":["【飼料作物の作付面積：88万ha→101万ha】"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-10-a2","memo_id":"04-10","genre_id":"04","level":"advanced","question":"このメモの内容として誤っているものはどれか。","choices":["作物別では牧草の作付が76％を占める","令和5年度の飼料自給率は27％である","基本計画は令和7年に策定されたものである","令和12年度の飼料自給率目標は30％である"],"answer":3,"explanation":"令和12年度の飼料自給率目標は28％で、30％は誤りです。牧草76％、令和5年度の飼料自給率27％、令和7年策定の基本計画はいずれもメモの記載どおりです。","evidence":["【飼料自給率：27％→28％】"],"source":{"memo_id":"04-10","page":10,"print_page":58,"title":"飼料作物の作付面積と自給の目標"}},{"id":"04-11-b1","memo_id":"04-11","genre_id":"04","level":"beginner","question":"このメモで、畜産の収益性や持続性向上のために国が支援するとしているものはどれか。","choices":["必要な施設の整備や機械の導入","飼料の購入費用の全額負担","畜産物の海外の販売先の開拓","家畜1頭ごとの所得の補償"],"answer":0,"explanation":"要点に「必要な施設の整備や機械の導入を支援」と書かれています。飼料費の全額負担や輸出先開拓、頭数ごとの所得補償はこのメモには書かれていません。","evidence":["畜産の収益性や持続性向上のために必要な施設の整備や機械の導入を支援。"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-11-b2","memo_id":"04-11","genre_id":"04","level":"beginner","question":"このメモで、畜産の経営安定・安定供給のための備えとして措置しているとされる制度はどのようなものか。","choices":["畜種ごとの特性に応じた制度","全畜種に共通の一律の制度","都道府県ごとに異なる独自制度","大規模経営だけを対象とした制度"],"answer":0,"explanation":"要点に「畜種ごとの特性に応じた制度を措置」とあり、酪農・肉用牛・養豚・養鶏ごとに制度が分かれています。一律の制度や大規模経営限定の制度とは書かれていません。","evidence":["経営安定・安定供給のための備えとして、畜種ごとの特性に応じた制度を措置。"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-11-i1","memo_id":"04-11","genre_id":"04","level":"intermediate","question":"令和7年度調査で、全国の畜産クラスター協議会の数はいくつか。","choices":["1,083協議会","1,038協議会","1,830協議会","803協議会"],"answer":0,"explanation":"図に「全国 1,083協議会（令和７年度調査）」とあります。ほかの選択肢は数字の並びを入れ替えたもので、メモの数値とは異なります。","evidence":["全国 1,083協議会","（令和７年度調査）"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-11-i2","memo_id":"04-11","genre_id":"04","level":"intermediate","question":"優良繁殖雌牛更新加速化事業で、希少な父牛に由来する繁殖雌牛に更新する場合の奨励金の交付単価はどれか。","choices":["15万円/頭","10万円/頭","5万円/頭","20万円/頭"],"answer":0,"explanation":"交付単価の表では、希少な父牛に由来する繁殖雌牛が15万円/頭です。10万円/頭は優良な繁殖雌牛の単価で、取り違えに注意が必要です。","evidence":["15万円/頭","希少な父牛に由来する"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-11-a1","memo_id":"04-11","genre_id":"04","level":"advanced","question":"このメモにある畜種ごとの経営安定制度の説明として、誤っているものはどれか。","choices":["牛マルキンは販売価格が生産費を下回ると差額の9割を交付","豚マルキンは交付金の4分の1相当額を生産者の積立金から支出","鶏卵の対策は補填金の6分の5相当額を生産者の積立金から支出","肉用子牛補給金は子牛価格が保証基準価格を上回ると交付"],"answer":3,"explanation":"肉用子牛生産者補給金は、子牛価格が保証基準価格を「下回った」場合に交付されるため、「上回ると交付」は誤りです。ほかの3つはメモの記述どおりです。","evidence":["肉用子牛価格が保証基準価格を下回った場合、生産者補給金を交付。"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-11-a2","memo_id":"04-11","genre_id":"04","level":"advanced","question":"令和8年度の加工原料乳生産者補給金の単価はどれか。","choices":["9.11円/kg","2.92円/kg","0.09円/kg","9.21円/kg"],"answer":0,"explanation":"令和8年度の加工原料乳生産者補給金単価は9.11円/kgです。2.92円/kgは集送乳調整金単価、0.09円/kgはそのうち関連対策の額で、補給金単価ではありません。","evidence":["令和８年度加工原料乳生産者補給金単価9.11円/kg","集送乳調整金単価2.92円/kg（"],"source":{"memo_id":"04-11","page":11,"print_page":59,"title":"畜産の収益性向上支援と経営安定対策"}},{"id":"04-12-b2","memo_id":"04-12","genre_id":"04","level":"beginner","question":"水田活用の直接支払交付金が本作化を支援するとされている作物は、何と呼ばれているか。","choices":["戦略作物","高収益作物","転換作物","基幹作物"],"answer":0,"explanation":"麦・大豆・米粉用米等は「戦略作物」とされ、その本作化を支援します。高収益作物は畑地化による定着を支援する対象で、本作化の対象を指す呼び名ではありません。","evidence":["食料自給率・自給力の向上に資する麦、大豆、米粉用米等の戦略作物の本作化"],"source":{"memo_id":"04-12","page":12,"print_page":60,"title":"経営所得安定対策等の概要"}},{"id":"04-12-i1","memo_id":"04-12","genre_id":"04","level":"intermediate","question":"米・畑作物の収入減少影響緩和交付金（ナラシ対策）では、当年産収入額が標準的収入額を下回った場合、差額のどれだけが補塡されるか。","choices":["差額の9割","差額の8割","差額の5割","差額の全額"],"answer":0,"explanation":"ナラシ対策は、当年産収入額が標準的収入額を下回ったときに、差額の9割を補塡します。全額や5割、8割を補塡するという記述はありません。","evidence":["回った場合に、その差額の９割を補塡。"],"source":{"memo_id":"04-12","page":12,"print_page":60,"title":"経営所得安定対策等の概要"}},{"id":"04-12-i2","memo_id":"04-12","genre_id":"04","level":"intermediate","question":"ゲタ対策の面積払（数量払の先払い）について、そば以外の作物の交付単価はいくらか。","choices":["2万円/10a","1.3万円/10a","3.5万円/10a","0.5万円/10a"],"answer":0,"explanation":"面積払の交付単価は2万円/10aです。1.3万円/10aはそばの単価なので、そば以外の作物には当てはまりません。","evidence":["２万円／10ａ（そばについては、1.3万円／10ａ）","[面積払］当年産の作付面積に基づき数量払の先払いとして交付"],"source":{"memo_id":"04-12","page":12,"print_page":60,"title":"経営所得安定対策等の概要"}},{"id":"04-12-a1","memo_id":"04-12","genre_id":"04","level":"advanced","question":"令和8年産から適用されるゲタ対策の数量払で、大豆の課税事業者向けの平均交付単価はいくらか。","choices":["10,340円/60kg","10,910円/60kg","8,330円/60kg","5,590円/60kg"],"answer":0,"explanation":"大豆の課税事業者向けは10,340円/60kgです。10,910円/60kgは大豆の免税事業者向け、8,330円/60kgははだか麦、5,590円/60kgは小麦の課税事業者向けの単価です。","evidence":["10,340円/60㎏ 10,910円/60kg","【交付単価（令和８年産から適用）】"],"source":{"memo_id":"04-12","page":12,"print_page":60,"title":"経営所得安定対策等の概要"}},{"id":"04-12-a2","memo_id":"04-12","genre_id":"04","level":"advanced","question":"水田活用の直接支払交付金等の「畑地化促進助成」の支援内容として、誤っているものはどれか。","choices":["畑地化支援は7万円/10a","定着促進支援は2万円/10a×5年間","子実用とうもろこし支援は2万円/10a","定着促進支援は一括なら10万円/10a"],"answer":2,"explanation":"子実用とうもろこし支援は1万円/10aなので、2万円/10aとする選択肢が誤りです。畑地化支援の7万円/10aと、定着促進支援の2万円/10a×5年間または10万円/10a（一括）は、メモの記載どおりです。","evidence":["④ 子実用とうもろこし支援（１万円/10a）"],"source":{"memo_id":"04-12","page":12,"print_page":60,"title":"経営所得安定対策等の概要"}},{"id":"04-13-b1","memo_id":"04-13","genre_id":"04","level":"beginner","question":"収入保険が始まった時期はどれですか。","choices":["平成30年4月","平成31年1月","令和5年1月","令和8年1月"],"answer":1,"explanation":"メモの要点に、収入保険は平成31年1月からスタートと書かれています。平成30年4月は実施主体の全国農業共済組合連合会が設立された時期で、令和8年1月は加入者数の集計時点です。","evidence":["収入保険は平成31年１月からスタート。"],"source":{"memo_id":"04-13","page":13,"print_page":61,"title":"収入保険の仕組みと加入状況"}},{"id":"04-13-b2","memo_id":"04-13","genre_id":"04","level":"beginner","question":"令和8年1月末時点の加入率29.8％は、どの農業者に対する割合ですか。","choices":["全国の全ての農業経営体","全国の法人経営体","青色申告を行う農業者","農業共済の加入者"],"answer":2,"explanation":"要点では、青色申告を行う農業者（34.7万経営体）のうち29.8％が加入とされています。収入保険の対象者も青色申告を行っている農業者であり、全ての農業経営体や法人だけに対する割合ではありません。","evidence":["青色申告を行う農業者（34.7万経営体）のうち、29.8％が加入。"],"source":{"memo_id":"04-13","page":13,"print_page":61,"title":"収入保険の仕組みと加入状況"}},{"id":"04-13-i2","memo_id":"04-13","genre_id":"04","level":"intermediate","question":"収入保険の基準収入は、基本として農業者ごとの過去何年間の平均収入で設定しますか。","choices":["過去3年間","過去5年間","過去7年間","過去10年間"],"answer":1,"explanation":"基準収入は、農業者ごとの過去5年間の平均収入（5中5）を基本に、保険期間の営農計画も考慮して設定します。3年間はメモにある野菜価格安定制度との同時利用期間の数字で、基準収入の年数ではありません。","evidence":["農業者ごとの過去５年間の平均収入（５中５）を基本とし、保険期間の営農計画も考慮して設定"],"source":{"memo_id":"04-13","page":13,"print_page":61,"title":"収入保険の仕組みと加入状況"}},{"id":"04-13-a2","memo_id":"04-13","genre_id":"04","level":"advanced","question":"収入保険の仕組みについて、メモの内容として誤っているものはどれですか。","choices":["保険料は新規で補償限度80％なら保険金額の1.498％","積立方式の積立金は掛捨てではない","マルキン等のある肉用牛や鶏卵は対象外","農業共済とは同時に加入することができる"],"answer":3,"explanation":"メモでは、収入保険と農業共済、ナラシ対策などの類似制度はどちらかを選択して加入するとされており、同時加入はできません。保険料1.498％、積立金が掛捨てでないこと、肉用牛や鶏卵が対象外であることはメモのとおりです。","evidence":["収入保険と、農業共済、ナラシ対策、野菜価格安定制度などの類似制度は、どちらかを選択して加入"],"source":{"memo_id":"04-13","page":13,"print_page":61,"title":"収入保険の仕組みと加入状況"}},{"id":"04-14-b1","memo_id":"04-14","genre_id":"04","level":"beginner","question":"「認定農業者制度」が創設されたのはいつか。","choices":["平成元年","平成5年","平成10年","平成15年"],"answer":1,"explanation":"要点に、平成5年に「認定農業者制度」を創設したと書かれています。ほかの年はメモに書かれていません。","evidence":["町村が認定する制度として、平成５年に「認定農業者制度」を創設。"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-14-b2","memo_id":"04-14","genre_id":"04","level":"beginner","question":"令和7年3月末現在までの、認定農業者のうち法人の数の動きとして正しいものはどれか。","choices":["年々増加している","年々減少している","ほぼ横ばいで推移している","増減を繰り返している"],"answer":0,"explanation":"要点に、法人は年々増加し3.0万経営体になったと書かれています。減少・横ばい・増減の繰り返しは、この記述と合いません。","evidence":["うち法人は年々増加し3.0万経営体"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-14-i1","memo_id":"04-14","genre_id":"04","level":"intermediate","question":"農業経営改善計画で、農業者自らが目標と取組内容を記載するのは、何年後の目標か。","choices":["1年後の目標","3年後の目標","5年後の目標","10年後の目標"],"answer":2,"explanation":"農業経営改善計画には、農業者自らが5年後の目標とその達成のための取組内容を記載します。1年後・3年後・10年後とは書かれていません。","evidence":["農業者自らが、５年後の目標と","その達成のための取組内容を記載"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-14-i2","memo_id":"04-14","genre_id":"04","level":"intermediate","question":"農業経営改善計画の記載事項のうち、「経営管理の合理化の目標」の例として挙げられているものはどれか。","choices":["複式簿記での記帳","休日制の導入","ほ場連担化","作業受託面積の拡大"],"answer":0,"explanation":"経営管理の合理化の目標の例は、複式簿記での記帳です。休日制の導入は農業従事の様態等の目標、ほ場連担化は生産方式の合理化の目標、作業受託面積は経営規模の拡大の目標の例です。","evidence":["・経営管理の合理化の目標（例：複式簿記での記帳等）","・農業従事の様態等に関する改善の目標（例：休日制の導入等）等"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-14-a1","memo_id":"04-14","genre_id":"04","level":"advanced","question":"令和7年3月末現在の認定農業者数と、そのうちの法人数から計算すると、法人以外の認定農業者はおよそ何万経営体か。","choices":["約3.0万経営体","約15.2万経営体","約18.2万経営体","約24.2万経営体"],"answer":2,"explanation":"認定農業者数21.2万経営体から法人3.0万経営体を引くと、約18.2万経営体になります。約24.2万は2つの数を足した値で、約3.0万は法人の数です。","evidence":["認定農業者数は、21.2万経営体、うち法人は年々増加し3.0万経営体（令和７年３月末現在）。"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-14-a2","memo_id":"04-14","genre_id":"04","level":"advanced","question":"認定農業者に対する主な支援措置について、誤っているものはどれか。","choices":["融資の支援措置として、スーパーＬ資金及び農業近代化資金がある","税制の支援措置として、農業経営基盤強化準備金制度がある","ナラシ対策とは、麦・大豆等のコスト割れを補填するものである","農地転用の支援措置として、手続のワンストップ化がある"],"answer":2,"explanation":"麦・大豆等のコスト割れの補填はゲタ対策で、ナラシ対策は米・麦・大豆等の収入減少に対するセーフティネットです。融資・税制・農地転用の記述は、表のとおり正しいです。","evidence":["ゲタ対策とは麦・大豆等のコスト割れの補填、ナラシ対策とは米・麦・大豆等の収入減少に"],"source":{"memo_id":"04-14","page":14,"print_page":62,"title":"認定農業者制度の概要と認定農業者数"}},{"id":"04-15-b1","memo_id":"04-15","genre_id":"04","level":"beginner","question":"メモによると、将来の担い手として期待される40代以下の就農者は、近年どのくらいで推移しているか。","choices":["約1万6～8千人前後","約2万6～8千人前後","約4万3～5千人前後","約6万5～7千人前後"],"answer":0,"explanation":"要点に、40代以下の就農者は近年1万6～8千人前後で推移と書かれています。4万人台や6万人台はグラフの新規就農者（全体）の水準に近い数値で、40代以下の数ではありません。","evidence":["将来の担い手として期待される40代以下の就農者は、近年は１万６～８千人前後で推移。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-15-b2","memo_id":"04-15","genre_id":"04","level":"beginner","question":"メモによると、雇用の受け皿としても期待される法人経営体の数はどのように推移し、令和7年に何法人となったか。","choices":["増加傾向で推移し、33,819法人","減少傾向で推移し、33,819法人","増加傾向で推移し、30,707法人","横ばいで推移し、27,101法人"],"answer":0,"explanation":"要点に、法人経営体は増加傾向で推移し令和7年に33,819法人と書かれています。30,707や27,101はグラフ上の別の年の値で、令和7年の値ではありません。","evidence":["雇用の受け皿としても期待される法人経営体は増加傾向で推移し、令和７年に33,819法人。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-15-i1","memo_id":"04-15","genre_id":"04","level":"intermediate","question":"独立・自営する認定新規就農者に交付される経営開始資金の交付期間は最長何年間か。","choices":["最長1年間","最長2年間","最長3年間","最長4年間"],"answer":2,"explanation":"経営開始資金は月13.75万円を最長3年間交付します。最長2年間は研修生向けの就農準備資金、最長4年間は農業法人等向けの雇用就農資金の期間です。","evidence":["独立・自営する認定新規\n就農者に対して、13.75万\n円/月（165万円/年）を最\n長３年間交付。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-15-i2","memo_id":"04-15","genre_id":"04","level":"intermediate","question":"経営発展支援事業で、都道府県が認定新規就農者の機械・施設等の導入を支援する場合、国の支援はどうなっているか。","choices":["都道府県支援分の2倍を国が支援、国費上限500万円","都道府県支援分と同額を国が支援、国費上限500万円","都道府県支援分の2倍を国が支援、国費上限600万円","都道府県支援分の3倍を国が支援、国費上限250万円"],"answer":0,"explanation":"経営発展支援事業は都道府県支援分の2倍を国が支援し、国費上限は500万円です。国費上限600万円は世代交代円滑化タイプの上限で、経営発展支援事業のものではありません。","evidence":["都道府県が認定新規就農者に対して機械・施設等の導入を支援する場合、都\n道府県支援分の２倍を国が支援（国費上限500万円）。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-15-a1","memo_id":"04-15","genre_id":"04","level":"advanced","question":"雇用就農資金で、49歳以下の就農希望者を新たに雇用した農業法人等が最長期間まで助成を受けた場合、1人当たりの助成額の合計はいくらになるか。","choices":["120万円","165万円","240万円","330万円"],"answer":2,"explanation":"雇用就農資金は年60万円を最長4年間助成するため、60万円×4年＝240万円です。165万円や330万円は就農準備資金の年額（165万円）とその2年分で、雇用就農資金とは異なります。","evidence":["新たに雇用する農業法人\n等に対して、60万円/年を\n最長４年間助成。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-15-a2","memo_id":"04-15","genre_id":"04","level":"advanced","question":"メモに記載された就農・法人化の支援策について、誤っているものはどれか。","choices":["就農準備資金は研修期間中の研修生に最長2年間交付される","世代交代円滑化タイプは国費上限600万円で取組を支援する","農業経営・就農サポート推進事業は都道府県整備のセンターの取組を支援","集落営農連携促進等事業は組織の法人化を定額50万円で支援する"],"answer":3,"explanation":"集落営農連携促進等事業による法人化の支援は定額25万円であり、50万円ではありません。ほかの3つは、就農準備資金の最長2年間、世代交代円滑化タイプの国費上限600万円、都道府県が整備するセンターへの支援として、メモの記載と一致します。","evidence":["集落営農の連携・合併に向けたビジョンを策定する組織の法人化を支援(定\n額25万円)。"],"source":{"memo_id":"04-15","page":15,"print_page":63,"title":"新規就農者の確保と法人経営体の推移"}},{"id":"04-16-b1","memo_id":"04-16","genre_id":"04","level":"beginner","question":"企業への農地リースが全面自由化されたのは、何年の農地法改正によるものですか。","choices":["平成11年の農地法改正","平成21年の農地法改正","平成27年の農地法改正","令和2年の農地法改正"],"answer":1,"explanation":"要点に、平成21年の農地法改正により企業への農地リースが全面自由化されたと書かれています。グラフにもリース方式による参入の全面自由化が平成21年12月と示されており、ほかの年は誤りです。","evidence":["平成21年の農地法改正により、企業への農地リースが全面自由化さ","参入の全面自由化"],"source":{"memo_id":"04-16","page":16,"print_page":64,"title":"農業法人の経営基盤強化と企業の農業参入"}},{"id":"04-16-b2","memo_id":"04-16","genre_id":"04","level":"beginner","question":"令和7年3月末までに策定された地域計画によって明らかになったこととして、メモに書かれているものはどれですか。","choices":["10年後に有効利用される見込みのない農地が多く存在する","農業法人の数が10年間で半分に減少する見込みである","企業の農業参入が地域で全く進んでいない","農地の大部分が10年後も現在の担い手で維持される"],"answer":0,"explanation":"要点に、地域計画により10年後に有効利用される見込みのない農地が多く存在することが明らかになったと書かれています。その解消のため他地域の農業法人や異業種の企業の参入を促進する必要があるとされ、ほかの選択肢の内容は書かれていません。","evidence":["令和７年３月末までに策定された地域計画により、10年後に有効利用される見込みのない","農地が多く存在することが明らかになり"],"source":{"memo_id":"04-16","page":16,"print_page":64,"title":"農業法人の経営基盤強化と企業の農業参入"}},{"id":"04-16-i2","memo_id":"04-16","genre_id":"04","level":"intermediate","question":"リース法人の農業参入の推移で、参入数が前年より減少したのはどの年ですか（令和3年〜令和6年の中から）。","choices":["令和3年","令和4年","令和5年","令和6年"],"answer":2,"explanation":"令和4年の4,202から令和5年は4,121に減少しています。令和3年は3,867（令和2年3,669から増加）、令和4年は4,202、令和6年は4,544でいずれも前年より増加しています。","evidence":["4,202 4,121","○リース法人の農業参入の推移"],"source":{"memo_id":"04-16","page":16,"print_page":64,"title":"農業法人の経営基盤強化と企業の農業参入"}},{"id":"04-17-b1","memo_id":"04-17","genre_id":"04","level":"beginner","question":"全国の集落営農数がピークとなった年はどれか。","choices":["平成22年","平成28年","平成29年","令和８年"],"answer":2,"explanation":"メモでは集落営農数は平成29年をピークに減少傾向で推移しているとされています。平成28年はピーク直前の年で、平成22年は集計期間の最初の年です。","evidence":["○ 集落営農数は平成29年をピークに減少傾向で推移。一方、集落営農に占める法人の割"],"source":{"memo_id":"04-17","page":17,"print_page":65,"title":"集落営農数と法人割合の推移"}},{"id":"04-17-b2","memo_id":"04-17","genre_id":"04","level":"beginner","question":"令和８年の集落営農に占める法人の割合は、前年と比べてどう変化したか。","choices":["0.6ポイント増加","0.6ポイント減少","1.6ポイント増加","6.0ポイント増加"],"answer":0,"explanation":"法人の割合は増加傾向で推移しており、令和８年は前年から0.6ポイント増加しました。減少ではなく、増加幅も1.6や6.0ではありません。","evidence":["合は増加傾向で推移しており、令和８年は前年から0.6ポイント増加。"],"source":{"memo_id":"04-17","page":17,"print_page":65,"title":"集落営農数と法人割合の推移"}},{"id":"04-17-i2","memo_id":"04-17","genre_id":"04","level":"intermediate","question":"グラフによると、令和５年の集落営農に占める法人の割合（法人率）は何％か。","choices":["38.4％","39.6％","40.4％","41.1％"],"answer":2,"explanation":"グラフで令和５年の法人率は40.4％です。39.6％は令和４年、41.1％は令和６年、38.4％は令和３年の値です。","evidence":["39.6% 40.4%"],"source":{"memo_id":"04-17","page":17,"print_page":65,"title":"集落営農数と法人割合の推移"}},{"id":"04-17-a2","memo_id":"04-17","genre_id":"04","level":"advanced","question":"集落営農をめぐる課題と集落営農連携促進等事業について、メモの内容として誤っているものはどれか。","choices":["構成員の高齢化等の中で経営基盤の強化が必要とされる","事業は人材の確保を支援内容に含んでいる","事業は地域の状況を踏まえて総合的に支援する","事業はビジョンづくりを対象外とし機械導入に限る"],"answer":3,"explanation":"事業は連携・合併に向けた収益力強化等を目指すビジョンづくりとその実現に向けた取組を支援するもので、ビジョンづくりは対象に含まれます。高齢化の中での経営基盤強化の必要性、人材の確保、地域の状況を踏まえた総合的支援はいずれもメモに記載があります。","evidence":["けた収益力強化等を目指す","ためのビジョンづくり及びそ"],"source":{"memo_id":"04-17","page":17,"print_page":65,"title":"集落営農数と法人割合の推移"}},{"id":"04-18-b1","memo_id":"04-18","genre_id":"04","level":"beginner","question":"令和7年12月末時点で、外国人材の受入れ数が最も多い分野はどれか。","choices":["農業","漁業","外食業","飲食料品製造業"],"answer":3,"explanation":"飲食料品製造業は183,186人で、4分野の中で最も多い。農業は67,905人、外食業は49,909人、漁業は7,561人にとどまる。","evidence":["外国人材については、農業(67,905人）、漁業（7,561人）、外食業（49,909人）、飲食料品","製造業（183,186人）の受入れとなっている。"],"source":{"memo_id":"04-18","page":18,"print_page":66,"title":"農業・漁業・食品分野の外国人材受入れ"}},{"id":"04-18-i2","memo_id":"04-18","genre_id":"04","level":"intermediate","question":"令和6年12月から令和7年12月にかけて、在留資格「技能実習」の人数が増えた分野はどれか。","choices":["農業","漁業","外食業","飲食料品製造業"],"answer":2,"explanation":"外食業の技能実習は4,391人から4,984人に増えた。農業は31,635人から28,671人へ、漁業は3,352人から2,950人へ、飲食料品製造業は88,236人から87,542人へ減った。","evidence":["13,312 3,018 4,391 4,984","30,171 31,635 28,671","75,343 88,236 87,542"],"source":{"memo_id":"04-18","page":18,"print_page":66,"title":"農業・漁業・食品分野の外国人材受入れ"}},{"id":"04-19-b1","memo_id":"04-19","genre_id":"04","level":"beginner","question":"農林水産業・食品産業分野の外国人材受入れで、就労目的の特定技能制度が創設された時期はどれか。","choices":["平成31年4月","令和6年3月","令和6年6月","令和9年4月"],"answer":0,"explanation":"要点に「特定技能制度（平成31年４月創設）」とあります。令和6年6月は育成就労制度の関連法案成立、令和9年4月は育成就労制度の施行、令和6年3月は林業の対象分野追加の時期です。","evidence":["就労目的の「特定技能制度（平成31年４月創設）」がある。"],"source":{"memo_id":"04-19","page":19,"print_page":67,"title":"農林水産分野の外国人材受入れの仕組み"}},{"id":"04-19-i1","memo_id":"04-19","genre_id":"04","level":"intermediate","question":"特定技能制度による受入れで、令和7年12月末時点（速報値）の受入れ人数が最も多い分野はどれか。","choices":["飲食料品製造業","外食業","農業","漁業"],"answer":0,"explanation":"飲食料品製造業は93,393人で最も多い分野です。外食業は43,869人、農業は37,952人、漁業は4,590人で、いずれも飲食料品製造業より少なくなっています。","evidence":["93,393人","43,869人","37,952人"],"source":{"memo_id":"04-19","page":19,"print_page":67,"title":"農林水産分野の外国人材受入れの仕組み"}},{"id":"04-19-i2","memo_id":"04-19","genre_id":"04","level":"intermediate","question":"特定技能制度において、「特定技能1号」の在留期間はどれか。","choices":["通算5年","通算3年","上限なし","最長1年"],"answer":0,"explanation":"「特定技能1号」の在留期間は通算5年で、1年を超えない範囲で更新します。「上限なし」は「特定技能2号」の在留期間なので、1号には当てはまりません。","evidence":["「特定技能１号」：通算５年","（１年を超えない範囲の在留期間を更新）"],"source":{"memo_id":"04-19","page":19,"print_page":67,"title":"農林水産分野の外国人材受入れの仕組み"}},{"id":"04-19-a1","memo_id":"04-19","genre_id":"04","level":"advanced","question":"外国人材受入れの制度について、このメモの内容として誤っているものはどれか。","choices":["特定技能2号の在留期間には上限がない","技能実習期間中は原則として帰国が可能である","派遣事業者による受入れは農業・漁業分野のみ","育成就労制度の施行は令和9年4月1日である"],"answer":1,"explanation":"技能実習期間中は原則として帰国できないため、「帰国が可能」は誤りです。在留期間中の帰国ができるのは特定技能制度の方です。そのほかの3つの選択肢は、メモの記載どおりです。","evidence":["（技能実習期間中は原則帰国不可）"],"source":{"memo_id":"04-19","page":19,"print_page":67,"title":"農林水産分野の外国人材受入れの仕組み"}},{"id":"04-19-a2","memo_id":"04-19","genre_id":"04","level":"advanced","question":"特定技能制度の農業分野で、5年間の受入れ上限数と令和7年12月末時点の受入れ人数の差はどれか。","choices":["35,348人","40,107人","10,210人","6,131人"],"answer":0,"explanation":"農業分野の上限数は73,300人、受入れ人数は37,952人なので、差は35,348人です。40,107人は飲食料品製造業、10,210人は漁業、6,131人は外食業の差にあたります。","evidence":["73,300人","37,952人"],"source":{"memo_id":"04-19","page":19,"print_page":67,"title":"農林水産分野の外国人材受入れの仕組み"}},{"id":"04-20-b1","memo_id":"04-20","genre_id":"04","level":"beginner","question":"市町村が地域計画を策定する根拠となった、令和5年に改正された法律はどれか。","choices":["農業経営基盤強化促進法","食料・農業・農村基本法","農地中間管理事業推進法","土地改良法"],"answer":0,"explanation":"メモには「令和５年の改正農業経営基盤強化促進法により」市町村が地域計画を策定したとある。農地中間管理事業は農地バンクが地域計画に基づき実施する事業として出てくるが、根拠法として示されてはいない。","evidence":["令和５年の改正農業経営基盤強化促進法により、市町村は"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-20-b2","memo_id":"04-20","genre_id":"04","level":"beginner","question":"地域計画の今後の扱いについて、メモで重要とされている考え方はどれか。","choices":["一度策定したら原則として変更しない","策定後は随時見直し完成度を高めていく","10年ごとにまとめて全面改定する","策定後は農地バンクに運用を任せる"],"answer":1,"explanation":"メモは地域計画を「一度策定して終わりではなく、随時見直し」完成度を高めることが重要としている。10年は目標地図の見通しの期間であり、改定の周期ではない。","evidence":["地域計画は、一度策定して終わりではなく、随時見直し、完成度を高めていくことが重要。"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-20-i1","memo_id":"04-20","genre_id":"04","level":"intermediate","question":"令和7年4月末までに地域計画が策定された全国の地区数はどれか。","choices":["1,615地区","1,894地区","16,150地区","18,894地区"],"answer":3,"explanation":"令和7年4月末までに全国18,894地区で地域計画が策定された。1,615は地区数ではなく策定した市町村の数である。","evidence":["1,615市町村、18,894地区で地域計画を策定。"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-20-i2","memo_id":"04-20","genre_id":"04","level":"intermediate","question":"地域計画策定の流れの図で、作成される目標地図は何年後を見通したものとされているか。","choices":["5年後","10年後","20年後","30年後"],"answer":1,"explanation":"図では「10年後を見通した目標地図の作成」と示されている。ほかの年数は図に示されていない。","evidence":["10年後を見通した"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-20-a1","memo_id":"04-20","genre_id":"04","level":"advanced","question":"地域計画区域内の農用地等面積と、将来の受け手が位置付けられていない農地の割合の組み合わせとして正しいものはどれか。","choices":["区域内は422万ha、受け手未定は約3割","区域内は422万ha、受け手未定は約1割","区域内は134万ha、受け手未定は約3割","区域内は189万ha、受け手未定は約5割"],"answer":0,"explanation":"区域内の農用地等面積は422万haで、受け手が位置付けられていない農地は134万haと約3割にのぼる。134万haは受け手未定の農地面積であり、区域内の面積ではない。","evidence":["地域計画区域内の農用地等面積は422万haと農地のほとんどをカバーしている","将来の受け手が位置付けられていない農地面積は134万haと約３割にのぼる。"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-20-a2","memo_id":"04-20","genre_id":"04","level":"advanced","question":"地域計画策定の流れの図における各主体の役割として、誤っているものはどれか。","choices":["農業委員会は目標地図の素案を作成する","JA・土地改良区等はビジョンの議論に参加する","農業委員会が地域計画を最終的に策定する","農地バンクは農地中間管理事業を実施する"],"answer":2,"explanation":"地域計画を策定するのは市町村であり、農業委員会は目標地図の素案を作成する役割である。JA・土地改良区等はビジョンの議論への参加、農地バンクは計画に基づく農地中間管理事業の実施を担う。","evidence":["市町村は、農業者・農業委員会・農地","素案の作成"],"source":{"memo_id":"04-20","page":20,"print_page":68,"title":"地域計画の策定状況と策定の流れ"}},{"id":"04-21-b1","memo_id":"04-21","genre_id":"04","level":"beginner","question":"このメモで、区画の拡大等の整備によって減少したとされているものの組み合わせはどれか。","choices":["稲作労働時間と米の生産コスト","稲作労働時間と米の作付面積","米の生産コストと担い手の数","農業機械の台数と米の作付面積"],"answer":0,"explanation":"整備により機械化・省力化が図られ、稲作労働時間と米の生産コストがともに減少したと書かれています。作付面積や担い手の数、機械の台数の減少については記載がありません。","evidence":["稲作労働時間、米の生産コストともに減少。"],"source":{"memo_id":"04-21","page":21,"print_page":69,"title":"農地の大区画化による省力化と生産コスト低減"}},{"id":"04-21-b2","memo_id":"04-21","genre_id":"04","level":"beginner","question":"このメモで、農作業の機械化・省力化をもたらした整備として挙げられているものの組み合わせはどれか。","choices":["区画の拡大、排水改良、用排水路の整備","区画の縮小、暗渠の撤去、ため池の新設","区画の拡大、ため池の新設、農道の廃止","区画の縮小、排水改良、用排水路の撤去"],"answer":0,"explanation":"要点には区画の拡大、排水改良、用排水路の整備等により機械化・省力化が図られたとあります。区画の縮小や施設の撤去・廃止は記載されていません。","evidence":["区画の拡大、排水改良、用排水路の整備等により、農作業の機械化・省力化が図られ、"],"source":{"memo_id":"04-21","page":21,"print_page":69,"title":"農地の大区画化による省力化と
