:["1兆6,563 億円 （2023）","2兆160 億円"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-17-b1","memo_id":"13-17","genre_id":"13","level":"beginner","question":"一口メモによると、我が国周辺水域で外国漁船が操業している根拠は何ですか。","choices":["二国間の漁業協定等","国内の漁業関係法令のみ","外国漁船側の自主的な規則","地方自治体との個別協定"],"answer":0,"explanation":"メモでは、外国漁船は二国間の漁業協定等に基づき操業すると書かれています。漁業関係法令に基づくのは我が国漁船の操業であり、外国漁船の根拠とは区別されています。","evidence":["二国間の漁業協定等に基づき外国漁船が操業。"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-17-b2","memo_id":"13-17","genre_id":"13","level":"beginner","question":"一口メモによると、水産庁が漁船への指導・監督や監視・取締りを行うことで、何に資する規制の実効性を担保していますか。","choices":["漁業者の所得向上と経営の安定","水産物の輸出拡大と販路の開拓","水産資源の保存管理と漁業秩序の維持","漁港の整備と防災機能の強化"],"answer":2,"explanation":"メモでは、取締り等により国内法令や許可条件等を遵守させ、水産資源の保存管理と漁業秩序の維持に資する規制の実効性を担保するとされています。所得向上や輸出拡大、漁港整備はこのページの取締りの目的として書かれていません。","evidence":["国内法令や許可条件等を遵守させ、水産資源の保存管理と漁業秩序の維持に資する"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-17-i1","memo_id":"13-17","genre_id":"13","level":"intermediate","question":"水産庁の漁業取締りの実績で、2021年の日本海大和堆周辺水域における外国漁船に対する退去警告延べ隻数はいくつですか。","choices":["47隻","78隻","114隻","582隻"],"answer":3,"explanation":"表では2021年の退去警告延べ隻数は582隻で、その後の年より大幅に多くなっています。114隻は2021年のうち放水措置の数、78隻は2024年、47隻は2025年の値です。","evidence":["日本海大和堆周辺水域に","おける外国漁船に対する"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-17-i2","memo_id":"13-17","genre_id":"13","level":"intermediate","question":"水産庁の漁業取締りの実績（2021年～2025年）で、外国漁船に対する公海乗船検査の件数が最も多かった年はどれですか。","choices":["2022年","2023年","2024年","2025年"],"answer":2,"explanation":"公海乗船検査は2021年3件、2022年12件、2023年16件、2024年24件、2025年20件で、最多は2024年です。2025年は20件と2024年より減っています。","evidence":["水産庁による漁業取締りの実績（過去５年間）"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-17-a1","memo_id":"13-17","genre_id":"13","level":"advanced","question":"水産庁の漁業取締りに関する一口メモの記載として、誤っているものはどれですか。","choices":["2025年時点で我が国EEZへの入漁許可はロシア漁船のみ","公海乗船検査はNPFC及びWCPFCの規則等に基づき実施","用船は民間船を借り上げ漁業監督官が乗船して取締り","漁具押収件数は我が国漁船が違法に設置した漁具の数"],"answer":3,"explanation":"注記では、押収した漁具は外国漁船が違法に設置したとみられる漁具とされており、我が国漁船ではありません。ほかの3つは注記の記載どおりです。","evidence":["外国漁船が違法に設置したとみられる漁具。"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-17-a2","memo_id":"13-17","genre_id":"13","level":"advanced","question":"水産庁の漁業取締船について、官船と用船の合計隻数を足し合わせると何隻になりますか。","choices":["37隻","41隻","46隻","50隻"],"answer":2,"explanation":"官船の合計隻数は9隻、用船の合計隻数は37隻で、合わせて46隻です。37隻は用船だけの数であり、官船を含めていません。","evidence":["水産庁の漁業取締船の隻数","民間船を民間乗組員付きで借り上げ、漁業監督官が乗船して"],"source":{"memo_id":"13-17","page":17,"print_page":171,"title":"水産庁による漁業取締りの実績と取締船"}},{"id":"13-18-b1","memo_id":"13-18","genre_id":"13","level":"beginner","question":"このページで、スマート水産業によって両立を目指すとされている2つの事項はどれか。","choices":["水産資源の持続的利用と水産業の成長産業化","漁船の大型化と漁業就業者の大幅な増加","水産物の輸入拡大と国内漁獲量の削減","養殖業の縮小と沿岸漁業への生産の集中"],"answer":0,"explanation":"要点に、スマート水産業により水産資源の持続的利用と水産業の成長産業化を両立した次世代の水産業の実現を目指すとあります。ほかの選択肢の組み合わせは、ページに書かれていません。","evidence":["スマート水産業により水産資源の持続的利用と水産業の成長産業化を両立した次世代"],"source":{"memo_id":"13-18","page":18,"print_page":172,"title":"スマート水産業が目指す次世代の水産業"}},{"id":"13-18-i1","memo_id":"13-18","genre_id":"13","level":"intermediate","question":"このページで、電子データに基づく資源評価の対象とされている水産資源は何種程度か。","choices":["50種程度","100種程度","200種程度","500種程度"],"answer":2,"explanation":"電子データに基づく資源評価の対象は、200種程度の水産資源とされています。50種・100種・500種という数値は、ページに書かれていません。","evidence":["200種程度の水産資源を対象に、電子データに基づき資源評価を実施"],"source":{"memo_id":"13-18","page":18,"print_page":172,"title":"スマート水産業が目指す次世代の水産業"}},{"id":"13-18-i2","memo_id":"13-18","genre_id":"13","level":"intermediate","question":"このページで、TAC対象魚種の資源評価は、原則として何に基づいて行うとされているか。","choices":["過去の漁獲量の平均値","MSYベース","漁業者へのアンケート","市場での取引価格"],"answer":1,"explanation":"200種程度の資源評価のうち、TAC対象魚種は原則MSYベースで評価するとされています。漁獲量の平均・アンケート・取引価格による評価は、ページに書かれていません。","evidence":["そのうち、ＴＡＣ対象魚種については、原則ＭＳＹベースで資源評価を実施"],"source":{"memo_id":"13-18","page":18,"print_page":172,"title":"スマート水産業が目指す次世代の水産業"}},{"id":"13-18-a1","memo_id":"13-18","genre_id":"13","level":"advanced","question":"このページのスマート水産業の取組の説明として、誤っているものはどれか。","choices":["養殖業では、赤潮情報や環境データをスマートフォンで速やかに入手する","加工流通では、画像センシング技術を用いて自動選別を行う","高鮮度急速冷凍技術で、刺身品質の水産物を遠方でも消費できるようにする","養殖業では、自動かつお釣り機によって漁労作業を省人・省力化する"],"answer":3,"explanation":"自動かつお釣り機による省人・省力化は、図で〈沖合・遠洋漁業〉の取組として示されており、養殖業の取組ではありません。赤潮情報の入手（養殖業）、画像センシングによる自動選別（加工流通）、高鮮度急速冷凍技術は、いずれもページに書かれています。","evidence":["自動かつお釣り機等により漁労作業を省"],"source":{"memo_id":"13-18","page":18,"print_page":172,"title":"スマート水産業が目指す次世代の水産業"}},{"id":"14-01-b1","memo_id":"14-01","genre_id":"14","level":"beginner","question":"CPTPPへの英国の加入に当たり、一部の締約国にのみ与えている譲許（国別枠等）の扱いはどう合意されたか。","choices":["英国には与えないことで合意した","英国にも同じ内容で与えることで合意した","英国には2倍の枠を与えることで合意した","すべての締約国から廃止することで合意した"],"answer":0,"explanation":"要点に、一部の締約国にのみ与えている国別枠等の譲許は英国に与えないことで合意したとあります。英国にも与える、拡大する、廃止するといった内容は書かれていません。","evidence":["英国の加入に当たり、現行で一部の締約国にのみ与えている譲許（国別枠等）は、","英国に与えないことで合意。"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-01-b2","memo_id":"14-01","genre_id":"14","level":"beginner","question":"CPTPPの農林水産物の輸入について、重要5品目を中心に獲得した措置として正しいものはどれか。","choices":["国家貿易制度や枠外税率の維持","国家貿易制度の廃止と枠外税率の撤廃","関税割当てとセーフガードの全面廃止","短期間での関税の一律撤廃"],"answer":0,"explanation":"要点に、国家貿易制度や枠外税率の維持、関税割当てやセーフガードの創設、長期の関税削減期間の確保を獲得したとあります。廃止や撤廃、短期間での撤廃は要点の内容と逆です。","evidence":["重要５品目を中心に国家貿易制度や枠外税率の維持、","関税割当てやセーフガードの創設、長期の関税削減期間の確保等の有効な措置を獲得。"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-01-i1","memo_id":"14-01","genre_id":"14","level":"intermediate","question":"CPTPPの合意内容で、米について維持するとされた枠外税率はどれか。","choices":["341円/kg","55円/kg","524円/kg","50円/kg"],"answer":0,"explanation":"米は国家貿易制度を維持し、枠外税率341円/kgを維持するとされています。55円/kgは小麦の枠外税率、524円/kgは豚肉の分岐点価格、50円/kgは豚肉の従量税です。","evidence":["現行の国家貿易制度を維持するとともに、枠外税率（341円/kg）を維持。"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-01-i2","memo_id":"14-01","genre_id":"14","level":"intermediate","question":"CPTPPの合意内容で、小麦のマークアップはいつまでにどれだけ削減するとされているか。","choices":["9年目までに45％削減","16年目までに45％削減","9年目までに50％削減","7年目までに45％削減"],"answer":0,"explanation":"小麦のマークアップは9年目までに45％削減するとされています。16年目は牛肉の関税削減期間、7年目は小麦の国別枠の年限であり、削減率も50％ではありません。","evidence":["マークアップを９年目までに45％削減。"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-01-a1","memo_id":"14-01","genre_id":"14","level":"advanced","question":"CPTPPの合意内容で、小麦のSBS方式の国別枠（7年目以降）について、カナダと豪州の枠を合わせるとどれだけか。","choices":["10.3万t","5.3万t","10.6万t","15.3万t"],"answer":0,"explanation":"小麦の国別枠は7年目以降、カナダが5.3万t、豪州が5万tで、合計10.3万tです。5.3万tはカナダ単独の枠で、10.6万tや15.3万tは合計の誤りです。","evidence":["既存のWTO枠に加え、カナダ（5.3万t(７年目以降)）、豪州（5万t(同)）にSBS方式の国別枠を設定。"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-01-a2","memo_id":"14-01","genre_id":"14","level":"advanced","question":"CPTPPの品目別の合意内容（輸入）の説明として、誤っているものはどれか。","choices":["高糖度の精製用原料糖に限り、関税を無税とする","牛肉は16年目に関税を撤廃する","豚肉は11年目までの間、セーフガードを措置する","脱脂粉乳・バターのTPP枠は6年目以降生乳換算7万t"],"answer":1,"explanation":"牛肉は16年目に最終税率を9%とし、関税撤廃を回避したとされているため、撤廃するという記述は誤りです。精製用原料糖の無税化、豚肉のセーフガード、脱脂粉乳・バターのTPP枠はメモのとおりです。","evidence":["16年目に最終税率を９%とし、関税撤廃を回避"],"source":{"memo_id":"14-01","page":1,"print_page":173,"title":"CPTPPにおける農林水産物の輸入の合意内容"}},{"id":"14-02-b1","memo_id":"14-02","genre_id":"14","level":"beginner","question":"2026年7月現在、日本が発効済または署名済としているEPA/FTA等の数はいくつか。","choices":["12","14","22","24"],"answer":2,"explanation":"メモの要点に、アジアを中心にこれまで22のEPA/FTA等が発効済又は署名済と書かれています。12はTPP署名国の数、14はRCEPの参加国数であり、協定の数ではありません。","evidence":["アジアを中心に、これまで２２のＥＰＡ/ＦＴＡ等が発効済又は署名済。"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-02-b2","memo_id":"14-02","genre_id":"14","level":"beginner","question":"2026年7月現在、CPTPPへの加入について、コスタリカの状況として正しいものはどれか。","choices":["加入議定書が発効済","加入について実質合意","加入交渉中","加入議定書に署名済"],"answer":1,"explanation":"要点にコスタリカは加入実質合意と書かれています。加入議定書が発効済なのは英国、加入交渉中なのはウルグアイです。","evidence":["コスタリカは加入実質合意、ウルグアイは加入交渉中。"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-02-i1","memo_id":"14-02","genre_id":"14","level":"intermediate","question":"2026年7月現在、RCEPの参加国のうち、未発効とされているASEANの国はどれか。","choices":["カンボジア","ラオス","ミャンマー","インドネシア"],"answer":2,"explanation":"RCEPの説明に「ミャンマーのみ未発効」と書かれています。カンボジア、ラオス、インドネシアは未発効の国として挙げられていません。","evidence":["ＡＳＥＡＮ9ヶ国（ミャンマーのみ未発効）及び日本、中国、韓国、豪州、ＮＺの14ヶ国"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-02-i2","memo_id":"14-02","genre_id":"14","level":"intermediate","question":"2026年7月現在の資料の注記で、日本とUAEとの協定交渉について示されている内容はどれか。","choices":["2026年3月に交渉妥結","2026年3月に協定が発効","2024年12月に協定が発効","2020年1月1日に協定が発効"],"answer":0,"explanation":"注記※2に、UAEとは2026年3月に交渉妥結と書かれています。2024年12月は英国のCPTPP加入議定書の発効、2020年1月1日は日米貿易協定の発効の時期です。","evidence":["※2 UAEとは、2026年３月に交渉妥結"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-02-a1","memo_id":"14-02","genre_id":"14","level":"advanced","question":"2026年7月現在、資料に示されたCPTPPの構成国は何か国か。","choices":["11か国","12か国","13か国","14か国"],"answer":1,"explanation":"CPTPPは米国を除くTPP署名国11か国に英国を加えた構成なので12か国です。11か国は英国を含めない数、14か国はRCEPの参加国数です。","evidence":["米国を除く上記TPP署名国11か国及び英国（英国の加入議定書は2024年12月に発効）"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-02-a2","memo_id":"14-02","genre_id":"14","level":"advanced","question":"2026年7月現在の日本のEPA/FTA等の状況について、誤っているものはどれか。","choices":["英国のCPTPP加入議定書は2024年12月に発効した","米国とは2020年1月1日に日米貿易協定が発効した","ウルグアイはCPTPPへの加入交渉中である","日トルコEPAは署名を経て発効済である"],"answer":3,"explanation":"日トルコEPAは交渉が継続中とされており、発効済ではありません。英国の加入議定書の発効、日米貿易協定の発効、ウルグアイの加入交渉中は、いずれもメモの記載どおりです。","evidence":["日GCCEPA、日トルコＥＰＡ等の交渉が継続中。"],"source":{"memo_id":"14-02","page":2,"print_page":174,"title":"我が国のEPA/FTA等の状況（2026年7月現在）"}},{"id":"14-03-b1","memo_id":"14-03","genre_id":"14","level":"beginner","question":"この一口メモによると、日本でこれまでに発効済または署名済となったEPA/FTA等はいくつか。","choices":["12","18","22","28"],"answer":2,"explanation":"要点に、アジアを中心に22のEPA/FTA等が発効済又は署名済と書かれています。12・18・28はメモに書かれた数ではありません。","evidence":["アジアを中心に、これまで２２のＥＰＡ/ＦＴＡ等が発効済又は署名済。"],"source":{"memo_id":"14-03","page":3,"print_page":175,"title":"日本のEPA/FTA等の交渉・署名・発効の状況"}},{"id":"14-03-i1","memo_id":"14-03","genre_id":"14","level":"intermediate","question":"このページのEPA/FTA等の年表の図で、「★」の記号は何を表しているか。","choices":["交渉","署名","発効","改正議定書発効"],"answer":2,"explanation":"凡例で★は発効を表します。交渉は◆、署名は☆、改正議定書発効は▲で、白抜きの☆（署名）や黒三角の▲と取り違えやすいので注意が必要です。","evidence":["◆：交渉 ☆：署名 ★：発効 △：改正議定書署名 ▲：改正議定書発効"],"source":{"memo_id":"14-03","page":3,"print_page":175,"title":"日本のEPA/FTA等の交渉・署名・発効の状況"}},{"id":"14-03-a1","memo_id":"14-03","genre_id":"14","level":"advanced","question":"このページのEPA/FTA等の年表の図の凡例について、誤っているものはどれか。","choices":["◆は交渉を表している","☆は署名を表している","△は改正議定書署名を表している","▲は改正議定書署名を表している"],"answer":3,"explanation":"凡例では▲は改正議定書発効で、改正議定書署名は△です。◆＝交渉、☆＝署名、△＝改正議定書署名はいずれも凡例どおりです。","evidence":["△：改正議定書署名 ▲：改正議定書発効"],"source":{"memo_id":"14-03","page":3,"print_page":175,"title":"日本のEPA/FTA等の交渉・署名・発効の状況"}},{"id":"14-04-b1","memo_id":"14-04","genre_id":"14","level":"beginner","question":"CPTPPの農林水産物の輸出について、メモで示されている我が国以外のCPTPP諸国の市場規模はどれか。","choices":["4億人","1億人","6億人","10億人"],"answer":0,"explanation":"メモでは他のCPTPP諸国を4億人の市場としています。1億人・6億人・10億人という数値はメモに記載がありません。","evidence":["他のCPTPP諸国４億人の市場に向けた我が国農林"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-04-b2","memo_id":"14-04","genre_id":"14","level":"beginner","question":"英国のCPTPP加入に当たり、日英EPAでは関税が撤廃されなかった品目としてメモで名指しされ、関税撤廃を獲得したものはどれか。","choices":["精米","緑茶","切り花","なし"],"answer":0,"explanation":"要点では、日英EPAでは関税が撤廃されなかった精米等の関税撤廃を獲得したとしています。緑茶はベトナム向け、切り花となしはカナダ向けとして表に載っている品目です。","evidence":["英国の加入に当たり、日英EPAでは関税が撤廃さ","れなかった精米等の関税撤廃を獲得。"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-04-i1","memo_id":"14-04","genre_id":"14","level":"intermediate","question":"CPTPPの主な品目の合意内容（輸出）で、カナダ向け牛肉の基準税率と合意内容の組み合わせはどれか。","choices":["26.5％・6年目撤廃","20～25％・10年目撤廃","26.5％・即時撤廃","40％・4年目撤廃"],"answer":0,"explanation":"表ではカナダ向け牛肉は基準税率26.5％で、6年目に撤廃されます。20～25％・10年目撤廃はメキシコ向け牛肉、40％・4年目撤廃はベトナム向け緑茶の内容です。","evidence":["26.5％","6年目撤廃"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-04-i2","memo_id":"14-04","genre_id":"14","level":"intermediate","question":"CPTPPの主な品目の合意内容（輸出）で、ベトナム向けの関税が即時撤廃とされている品目はどれか。","choices":["ブリ・サバ・サンマ","緑茶","チョコレート","精米（短・中粒種）"],"answer":0,"explanation":"表ではベトナム向けのブリ・サバ・サンマ（基準税率18％）が即時撤廃です。緑茶は4年目撤廃、チョコレートは5～7年目撤廃で、精米はベトナムではなく英国・マレーシア向けの欄に載っています。","evidence":["ブリ・サバ・サンマ","即時撤廃"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-04-a1","memo_id":"14-04","genre_id":"14","level":"advanced","question":"CPTPPの主な品目の合意内容（輸出）について、誤っているものはどれか。","choices":["マレーシア向け精米は基準税率40%で11年目に撤廃","カナダ向け切り花は基準税率無税～16%で即時撤廃","メキシコ向け牛肉は基準税率20～25％で10年目撤廃","ベトナム向けチョコレートは13～25％で即時撤廃"],"answer":3,"explanation":"ベトナム向けチョコレートは基準税率13～25％で、即時撤廃ではなく5～7年目撤廃です。ほかの3つは表の内容と一致しています。","evidence":["13～25％","5～7年目撤廃"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-04-a2","memo_id":"14-04","genre_id":"14","level":"advanced","question":"CPTPPの主な品目の合意内容（輸出）で、精米（短・中粒種）の関税撤廃が完了する年について、英国向けとマレーシア向けの組み合わせはどれか。","choices":["英国2030年・マレーシア2028年","英国2028年・マレーシア2030年","英国2030年・マレーシア2030年","英国2028年・マレーシア2028年"],"answer":0,"explanation":"英国向けは即時撤廃と8年目（2030年）撤廃、マレーシア向けは11年目（2028年）撤廃です。マレーシアのほうが年数（11年目）は長いものの、完了年は英国より早い2028年なので、年を逆にした選択肢は誤りです。","evidence":["即時撤廃、8年目（2030年）撤廃","11年目（2028年）撤廃"],"source":{"memo_id":"14-04","page":4,"print_page":176,"title":"CPTPPにおける農林水産物の輸出関税の合意"}},{"id":"14-05-b1","memo_id":"14-05","genre_id":"14","level":"beginner","question":"日EU・EPA協定の輸入に関する合意で、米について確保されたものはどれか。","choices":["関税削減・撤廃等からの「除外」","段階的な16年目の関税撤廃","民間貿易による関税割当枠の設定","9年間の長期の関税削減期間"],"answer":0,"explanation":"米については関税削減・撤廃等からの「除外」を確保しました。16年目の撤廃はチーズの一部、民間貿易の関税割当枠は脱脂粉乳・バター等、9年の削減期間は豚肉の内容です。","evidence":["• 関税削減・撤廃等からの「除外」を確保。"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-05-b2","memo_id":"14-05","genre_id":"14","level":"beginner","question":"日EU・EPA協定の輸入に関する合意で、麦・乳製品について維持したとされる制度はどれか。","choices":["国家貿易制度","差額関税制度","糖価調整制度","横断的な関税割当制度"],"answer":0,"explanation":"要点に、麦・乳製品は国家貿易制度等を維持したと書かれています。差額関税制度は豚肉、糖価調整制度は粗糖・精製糖等、横断的な関税割当はソフト系チーズの内容です。","evidence":["麦・乳製品の国家貿易制度等の維持、関税割当てやセーフガード等の有効な措置を獲得。"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-05-i1","memo_id":"14-05","genre_id":"14","level":"intermediate","question":"日EU・EPA協定の豚肉の合意で、確保した長期の関税削減期間は何年か。","choices":["6年","9年","11年","16年"],"answer":1,"explanation":"豚肉は長期の関税削減期間（9年）を確保しました。11年は豚肉のセーフガードを措置する期間、16年は牛肉の関税を9％とする時点で、紛らわしいので注意が必要です。","evidence":["• 長期の関税削減期間（9年）を確保（従量税50円/kg"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-05-i2","memo_id":"14-05","genre_id":"14","level":"intermediate","question":"日EU・EPA協定で、ソフト系チーズの横断的な関税割当の枠数量は16年目に何トンとなるか。","choices":["12,857t","15,000t","20,000t","31,000t"],"answer":3,"explanation":"ソフト系チーズの枠数量は初年度20,000トンから16年目に31,000tとなります。20,000トンは初年度の数量、12,857t・15,000tは脱脂粉乳・バター等の民間貿易枠の数量です。","evidence":["(20,000トン(初年度)→31,000t (16年目))。"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-05-a1","memo_id":"14-05","genre_id":"14","level":"advanced","question":"日EU・EPA協定の輸入に関する合意内容として、誤っているものはどれか。","choices":["ボトルワインは即時に関税撤廃となる","林産物10品目は段階的に8年目に関税撤廃","清酒・焼酎は11年目に関税撤廃となる","牛肉は段階的に16年目に関税撤廃となる"],"answer":3,"explanation":"牛肉は関税撤廃ではなく、関税削減で16年目に9％とし、セーフガードを確保する内容です。ワインの即時撤廃、林産物の8年目撤廃、清酒・焼酎の11年目撤廃はいずれもメモのとおりです。","evidence":["• 関税削減で16年目に９％とし、輸入急増に対する"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-05-a2","memo_id":"14-05","genre_id":"14","level":"advanced","question":"日EU・EPA協定の輸入に関する合意で、段階的に16年目に関税撤廃となる品目はどれか。","choices":["熟成ハード系チーズ（チェダー等）","構造用集成材などの林産物","清酒","パスタ（マカロニ、スパゲッティ）"],"answer":0,"explanation":"熟成ハード系チーズ（チェダー、ゴーダ等）は段階的に16年目に撤廃です。林産物は8年目、清酒とパスタは11年目に撤廃となるため誤りです。","evidence":["主に原材料として使われる熟成ハード系チーズ","撤廃するものの、長期の撤廃期間を確保（段階的","子、キャンディーは11年目、ビスケットは6～11"],"source":{"memo_id":"14-05","page":5,"print_page":177,"title":"日EU・EPA協定 農林水産物の輸入の合意内容"}},{"id":"14-06-b1","memo_id":"14-06","genre_id":"14","level":"beginner","question":"日EU・EPA協定で、我が国農林水産物の輸出促進に向けた環境を整備したEUの市場の人口は、何人とされていますか。","choices":["1.5億人","3.5億人","4.5億人","5.5億人"],"answer":2,"explanation":"要点に「ＥＵ４.５億人の市場」と書かれているため、4.5億人が正解です。ほかの人数はメモに書かれていません。","evidence":["ＥＵ４.５億人の市場に向"],"source":{"memo_id":"14-06","page":6,"print_page":178,"title":"日EU・EPA協定と農林水産物の輸出"}},{"id":"14-06-b2","memo_id":"14-06","genre_id":"14","level":"beginner","question":"日EU・EPA協定で、我が国の農林水産物の輸出について獲得した関税の扱いとして、正しいものはどれですか。","choices":["約半数の品目で関税撤廃（ほとんどが段階的撤廃）","ほぼ全ての品目で関税撤廃（ほとんどが即時撤廃）","ほぼ全ての品目で関税削減（撤廃はごく一部のみ）","牛肉と緑茶の品目に限って関税撤廃（即時撤廃）"],"answer":1,"explanation":"要点に「ほぼ全ての品目で関税撤廃を獲得（ほとんどが即時撤廃）」とあります。約半数や削減のみ、牛肉と緑茶に限るという内容はメモと合いません。","evidence":["ほぼ全ての品目で関税撤廃を獲得（ほとんどが即時撤廃）"],"source":{"memo_id":"14-06","page":6,"print_page":178,"title":"日EU・EPA協定と農林水産物の輸出"}},{"id":"14-06-i1","memo_id":"14-06","genre_id":"14","level":"intermediate","question":"日EU・EPA協定の主な品目の合意内容（輸出）の表で、牛肉の基準税率として示されているものはどれですか。","choices":["12.8％＋141.4～304.1€/100kg","46.7～86.9€/100㎏","16.7～142.3€/100kg","6.4％、18.7～102.4€/100㎏"],"answer":0,"explanation":"表では牛肉の基準税率は「12.8％＋141.4～304.1€/100kg」です。46.7～86.9€/100㎏は豚肉、16.7～142.3€/100kgは鶏卵、6.4％、18.7～102.4€/100㎏は鶏肉の基準税率です。","evidence":["12.8％＋141.4～304.1€/100kg"],"source":{"memo_id":"14-06","page":6,"print_page":178,"title":"日EU・EPA協定と農林水産物の輸出"}},{"id":"14-06-i2","memo_id":"14-06","genre_id":"14","level":"intermediate","question":"日EU・EPA協定の輸出の合意内容で、即時撤廃の例外となり「段階的に8年目に撤廃」とされた品目はどれですか。","choices":["アイスクリーム","ココア粉","ほたて貝","清酒"],"answer":2,"explanation":"合意内容の欄で、即時撤廃の例外として、ほたて貝が「段階的に8年目に撤廃」と示されています。アイスクリームとココア粉は撤廃ではなく段階的な削減です。清酒は例外として挙げられていません。","evidence":["(段階的に8年目に撤廃)"],"source":{"memo_id":"14-06","page":6,"print_page":178,"title":"日EU・EPA協定と農林水産物の輸出"}},{"id":"14-06-a1","memo_id":"14-06","genre_id":"14","level":"advanced","question":"日EU・EPA協定の主な品目の合意内容（輸出）の表について、誤っているものはどれですか。","choices":["ボトルワインの基準税率は0.154€/Lである","スパークリングワインの基準税率は0.32€/Lである","清酒の基準税率は0.077€/Lである","アイスクリームは段階的に8年目までに25%削減"],"answer":3,"explanation":"アイスクリームの合意内容は「段階的に6年目までに70%削減」です。「8年目までに25%削減」はココア粉の内容なので、この選択肢が誤りです。酒類の3つの税率は表のとおりで正しい内容です。","evidence":["(段階的に6年目までに70%削減)","(段階的に8年目までに25%削減)"],"source":{"memo_id":"14-06","page":6,"print_page":178,"title":"日EU・EPA協定と農林水産物の輸出"}},{"id":"14-07-b1","memo_id":"14-07","genre_id":"14","level":"beginner","question":"日米協議（米国時間2025年7月22日合意）で、日本からの輸出のうち本来の関税率が15％未満の品目の税率はどうなったか。","choices":["10％に引き下げ","12.5％に統一","15％に統一","26.4％に統一"],"answer":2,"explanation":"2025年7月22日の合意では、本来の関税率が15％未満の品目は15％とされました。12.5％は2026年8月時点の見直し後の税率で、26.4％は牛肉の枠外税率です。","evidence":["本来の関税率が15％以上の品目は本来の関税率のまま、15％未満のものは15％に。"],"source":{"memo_id":"14-07","page":7,"print_page":179,"title":"日米関税協議の合意と農林水産物の輸出入"}},{"id":"14-07-i1","memo_id":"14-07","genre_id":"14","level":"intermediate","question":"日米協議（2025年7月22日合意）で、ミニマム・アクセス米制度の枠内における米国産コメの調達は何％増加させることとされたか。","choices":["15％増加","26.4％増加","50％増加","75％増加"],"answer":3,"explanation":"MA米制度の枠内で米国産コメの調達を75％増加させることを迅速に実施するとされています。15％は輸出の関税率、26.4％は牛肉の枠外税率で、調達の増加率ではありません。","evidence":["ミニマム・アクセス米制度の枠内における米国産コメの調達の","75％増加を迅速に実施。"],"source":{"memo_id":"14-07","page":7,"print_page":179,"title":"日米関税協議の合意と農林水産物の輸出入"}},{"id":"14-07-i2","memo_id":"14-07","genre_id":"14","level":"intermediate","question":"日米協議（2025年7月22日合意）で、バイオエタノールや大豆、トウモロコシ等の米国産品の追加購入は年間計どの規模で行うとされたか。","choices":["年間計8億ドル規模","年間計15億ドル規模","年間計80億ドル規模","年間計800億ドル規模"],"answer":2,"explanation":"米国の農産品や他の米国の製品の追加購入は年間計80億ドル規模で実施するとされています。8億ドルや800億ドルは桁が違い、15億ドルという記載はありません。","evidence":["米国の製品の追加購入を年間計80億ドル規模で実施。"],"source":{"memo_id":"14-07","page":7,"print_page":179,"title":"日米関税協議の合意と農林水産物の輸出入"}},{"id":"14-07-a1","memo_id":"14-07","genre_id":"14","level":"advanced","question":"日米貿易協定で確保した米国向け牛肉の低関税輸出枠は、2026年からは何トンになったか。","choices":["13,000トン","52,005トン","64,805トン","65,005トン"],"answer":1,"explanation":"当初の輸出枠65,005トンのうち、2026年から13,000トンが英国に割り当てられたため、52,005トンになりました。65,005トンは当初の枠、64,805トンは複数国枠、13,000トンは英国への割当分です。","evidence":["低関税による輸出枠65,005トン（※2）へのアクセス確保","2026年から13,000トンが英国に割り当てられたため、52,005トンとなった。"],"source":{"memo_id":"14-07","page":7,"print_page":179,"title":"日米関税協議の合意と農林水産物の輸出入"}},{"id":"14-07-a2","memo_id":"14-07","genre_id":"14","level":"advanced","question":"2026年8月時点で、日本から米国へ輸出する農林水産物の関税率について、誤っているものはどれか。","choices":["牛肉は本来の税率が維持されている","ホタテ貝は無税のまま据え置かれている","ぶりは12.5％に見直されている","緑茶は追加関税の対象外である"],"answer":1,"explanation":"本来の関税率が12.5％未満の品目は12.5％に見直されたため、本来は無税のホタテ貝も12.5％になっています。牛肉と緑茶は追加関税の対象外で本来の税率のままであり、ぶりは本来3％以下なので12.5％です。","evidence":["本来の関税率が12.5％未満の品目は12.5％に見直され","牛肉・緑茶等は本来の税率のままに。"],"source":{"memo_id":"14-07","page":7,"print_page":179,"title":"日米関税協議の合意と農林水産物の輸出入"}},{"id":"14-08-b1","memo_id":"14-08","genre_id":"14","level":"beginner","question":"RCEPの輸入について、重要5品目（米、麦、牛肉・豚肉、乳製品、甘味資源作物）はどのように扱われましたか。","choices":["関税削減・撤廃からすべて除外","長期の撤廃期間を確保して撤廃","半数の品目のみ関税削減・撤廃","輸入実績ゼロの品目のみ即時撤廃"],"answer":0,"explanation":"要点に、重要5品目は関税削減・撤廃からすべて除外と書かれています。長期の撤廃期間の確保や半数の品目の除外は、野菜・果樹や林産物など別の品目の扱いです。","evidence":["重要５品目（米、麦、牛肉・豚肉、乳製品、甘味資源作物）は、関税削減・撤廃からすべて除外"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-08-b2","memo_id":"14-08","genre_id":"14","level":"beginner","question":"RCEPで、韓国から関税撤廃を獲得した輸出関心品目として要点に挙げられているものはどれですか。","choices":["ほたて貝やぶり","キャンディー・板チョコレート等の菓子","牛肉","パックご飯や米菓"],"answer":1,"explanation":"要点では、韓国からキャンディー・板チョコレート等の菓子の関税撤廃を獲得したとされています。ほたて貝やぶり、パックご飯や米菓は中国、牛肉はインドネシアから獲得したものです。","evidence":["韓国からキャンディー・板チョコレート等の菓子、インドネシアから牛肉等の関税撤廃を獲得"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-08-i1","memo_id":"14-08","genre_id":"14","level":"intermediate","question":"RCEPにおける、日本の農林水産品の対韓国の関税撤廃率は何%ですか。","choices":["49%","56%","61%","82%"],"answer":0,"explanation":"対韓国の関税撤廃率は49%です。56%は対中国、61%は対ASEAN・豪州・NZ、82%はTPPと日EU・EPAの撤廃率です。","evidence":["（対中国56%、韓国49%、ASEAN・"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-08-i2","memo_id":"14-08","genre_id":"14","level":"intermediate","question":"RCEPの輸出の表で、中国の次の4品目のうち、基準税率（2014年1月1日時点）が最も高いものはどれですか。","choices":["パックご飯等","米菓","ソース混合調味料","醤油"],"answer":0,"explanation":"中国の基準税率は、パックご飯等が30%で最も高くなっています。醤油は28%、ソース混合調味料は21%、米菓は20%で、いずれも21年目撤廃です。","evidence":["パックご飯等","（注）基準税率は、RCEP交渉のベースとなった2014年1月1日時点の税率"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-08-a1","memo_id":"14-08","genre_id":"14","level":"advanced","question":"RCEPにおける日本の農林水産品の対中国の関税撤廃率は、TPPの関税撤廃率より何ポイント低いですか。","choices":["21ポイント","26ポイント","33ポイント","38ポイント"],"answer":1,"explanation":"TPPの関税撤廃率は82%、対中国は56%なので、差は26ポイントです。33ポイントは対韓国（49%）、21ポイントは対ASEAN・豪州・NZ（61%）との差です。","evidence":["TPP、日EU・EPA（各82%）よりも大幅に低い水準に抑制。（対中国56%、韓国49%、ASEAN・"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-08-a2","memo_id":"14-08","genre_id":"14","level":"advanced","question":"RCEPの農林水産物の輸出入について、このページの内容として誤っているものはどれですか。","choices":["対ASEAN・豪州・NZの関税撤廃率は61%","韓国の板チョコレートは即時撤廃又は10年目撤廃","インドネシアの牛肉の基準税率は5%","中国の合板（針葉樹）は21年目撤廃"],"answer":3,"explanation":"表では中国の合板（針葉樹）は基準税率4%で11年目撤廃とされており、21年目撤廃は誤りです。21年目撤廃はパックご飯等・米菓・醤油などの扱いです。","evidence":["合板（針葉樹）","11年目撤廃"],"source":{"memo_id":"14-08","page":8,"print_page":180,"title":"RCEP・農林水産物の輸出入"}},{"id":"14-09-b1","memo_id":"14-09","genre_id":"14","level":"beginner","question":"総合的なＴＰＰ等関連政策大綱の対策のうち、「強い農林水産業の構築」と位置付けられている対策はどれか。","choices":["体質強化対策","経営安定対策","輸出促進対策","価格安定対策"],"answer":0,"explanation":"メモでは「体質強化対策（強い農林水産業の構築）」と示されています。経営安定対策は「経営安定・安定供給のための備え」と位置付けられており、強い農林水産業の構築ではありません。","evidence":["体質強化対策（強い農林水産業の構築）","経営安定対策（経営安定・安定供給のための備え）"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"14-09-b2","memo_id":"14-09","genre_id":"14","level":"beginner","question":"「総合的なＴＰＰ等関連政策大綱」が最初に決定された日はいつか。","choices":["平成27年11月25日","平成29年11月24日","令和元年12月５日","令和２年12月８日"],"answer":0,"explanation":"大綱は平成27年11月25日に決定されました。平成29年、令和元年、令和2年の日付は、いずれも改訂日です。","evidence":["総合的なＴＰＰ等関連政策大綱（平成27年11月25日決定、平成29年11月24日・令和元年12月５日・令和２年12月８日改訂）"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"14-09-i1","memo_id":"14-09","genre_id":"14","level":"intermediate","question":"令和7年度補正予算のＴＰＰ等対策予算の額はいくらか。","choices":["2,242億円","2,449億円","2,527億円","2,704億円"],"answer":0,"explanation":"令和7年度補正予算は2,242億円です。2,449億円は令和6年度、2,527億円は令和5年度、2,704億円は令和4年度の額です。","evidence":["令和７年度補正予算 2,242億円"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"14-09-i2","memo_id":"14-09","genre_id":"14","level":"intermediate","question":"平成27年度から令和6年度までの各年度のＴＰＰ等対策の補正予算のうち、最も額が多い年度はどれか。","choices":["平成28年度","令和元年度","平成30年度","平成27年度"],"answer":0,"explanation":"最も多いのは平成28年度の3,453億円です。令和元年度は3,250億円、平成30年度は3,188億円、平成27年度は3,122億円で、いずれも平成28年度より少なくなっています。","evidence":["平成28年度補正予算3,453億円","令和元年度補正予算3,250億円","平成30年度補正予算3,188億円"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"14-09-a1","memo_id":"14-09","genre_id":"14","level":"advanced","question":"総合的なＴＰＰ等関連政策大綱の経営安定対策の内容として、誤っているものはどれか。","choices":["牛・豚マルキンの補塡率を８割から９割に引き上げる","豚マルキンの国庫負担水準を国３:生産者１に引き上げる","国別枠の輸入量に相当する国産米を輸出用に買い入れる","甘味資源作物では加糖調製品を調整金の対象に追加する"],"answer":2,"explanation":"国別枠の輸入量に相当する国産米は、政府が「備蓄米」として買い入れるもので、輸出用ではありません。マルキンの補塡率の引上げ、豚マルキンの国庫負担の引上げ、加糖調製品の追加は、いずれもメモに書かれている内容です。","evidence":["・国別枠の輸入量に相当する国産米を政府が","備蓄米として買入れ"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"14-09-a2","memo_id":"14-09","genre_id":"14","level":"advanced","question":"平成27年度補正予算からのＴＰＰ等対策予算の合計額はいくらか。","choices":["3兆2,525億円","3兆2,252億円","3兆5,225億円","2兆3,525億円"],"answer":0,"explanation":"平成27年度補正予算からの合計額は3兆2,525億円です。ほかの選択肢は数字の並びを入れ替えたもので、メモの額とは異なります。","evidence":["平成27年度補正予算からの合計額","3兆2,525億円"],"source":{"memo_id":"14-09","page":9,"print_page":181,"title":"総合的なＴＰＰ等関連政策大綱に基づく対策"}},{"id":"15-01-b1","memo_id":"15-01","genre_id":"15","level":"beginner","question":"要点で、令和7年に農林水産業の被害が発生した災害として挙げられているものはどれか。","choices":["令和6年から7年までの冬期の大雪","北海道胆振東部地震による被害","熊本地震による被害","令和元年東日本台風等の被害"],"answer":0,"explanation":"要点では、令和7年には令和6年から7年までの冬期の大雪や8月から9月にかけての大雨による被害が発生したとしています。東日本台風は令和元年、熊本地震は平成28年、北海道胆振東部地震は平成30年の災害です。","evidence":["令和７年には、令和６年から７年までの冬期の大雪、令和７"],"source":{"memo_id":"15-01","page":1,"print_page":182,"title":"農林水産関係の自然災害被害額の推移"}},{"id":"15-01-i1","memo_id":"15-01","genre_id":"15","level":"intermediate","question":"グラフの平成28年から令和7年までのうち、農林水産関係の被害額が最も大きかった年はどれか。","choices":["平成30年（2018年）","令和6年（2024年）","平成28年（2016年）","令和元年（2019年）"],"answer":0,"explanation":"平成30年は6,282億円で、グラフの期間で最も大きい値です。令和6年の6,104億円、令和元年の4,999億円、平成28年の4,358億円はいずれもこれより小さくなっています。","evidence":["6,282","北海道胆振東部地震"],"source":{"memo_id":"15-01","page":1,"print_page":182,"title":"農林水産関係の自然災害被害額の推移"}},{"id":"15-01-a1","memo_id":"15-01","genre_id":"15","level":"advanced","question":"表に示された各災害の農林水産関係の被害額について、誤っているものはどれか。","choices":["令和元年東日本台風等の合計は3,446.2億円である","冬期の大雪（R6.11～R7.4）の合計は250.3億円である","能登半島地震等では林野関係が最も大きい区分である","令和7年8～9月の大雨の合計は1,643.9億円である"],"answer":2,"explanation":"能登半島地震及び9月20日からの大雨では、農地・農業用施設が1,866.4億円で最も大きく、林野関係の1,132.3億円を上回るため誤りです。ほかの3つは表の合計額と一致しています。","evidence":["1,866.4億円","1,132.3億円"],"source":{"memo_id":"15-01","page":1,"print_page":182,"title":"農林水産関係の自然災害被害額の推移"}},{"id":"15-01-a2","memo_id":"15-01","genre_id":"15","level":"advanced","question":"令和元年東日本台風等（台風第19号等）による農地・農業用施設の被害額はいくらか。","choices":["2,101.3億円","1,866.4億円","1,062.6億円","806.7億円"],"answer":0,"explanation":"令和元年東日本台風等の農地・農業用施設の被害額は2,101.3億円です。1,866.4億円は能登半島地震等、1,062.6億円は令和7年8～9月の大雨の農地・農業用施設の値で、806.7億円は東日本台風等の林野関係の値です。","evidence":["（台風第19号等）（R元.10.10～26）","2,101.3億円"],"source":{"memo_id":"15-01","page":1,"print_page":182,"title":"農林水産関係の自然災害被害額の推移"}},{"id":"15-02-b1","memo_id":"15-02","genre_id":"15","level":"beginner","question":"このメモによると、農林水産省は災害の支援対策を公表した後、支援対策を加速化するために何を行っているか。","choices":["被害が大きい地域で現地説明会を開催","全国一律で補助率を引き上げる措置","被災地以外の地域で説明会を開催","支援対策の決定時期を半年後に延期"],"answer":0,"explanation":"メモには、支援対策公表後に被害が大きい地域で現地説明会を開催するなど、支援対策を加速化すると書かれています。被災地以外での説明会や決定の延期は書かれておらず、迅速な決定という方針とも合いません。","evidence":["支援対策公表後、被害が大きい地域で現地説明会を開催するなど、支援対策を加速化。"],"source":{"memo_id":"15-02","page":2,"print_page":183,"title":"災害の支援対策決定までの期間と能登支援策"}},{"id":"15-02-i1","memo_id":"15-02","genre_id":"15","level":"intermediate","question":"表に示された5つの災害のうち、発災から支援対策決定までの期間が最も長かったものはどれか。","choices":["令和元年東日本台風(台風第19号)","令和２年～３年の冬期の大雪","令和６年能登半島地震","令和７年８月からの大雨及び台風"],"answer":1,"explanation":"令和２年～３年の冬期の大雪は43日間で、表の中で最も長い期間です。東日本台風と能登半島地震は24日間、令和７年の大雨及び台風は19日間です。","evidence":["令和２年～３年の冬期の大雪","43日間※2"],"source":{"memo_id":"15-02","page":2,"print_page":183,"title":"災害の支援対策決定までの期間と能登支援策"}},{"id":"15-02-i2","memo_id":"15-02","genre_id":"15","level":"intermediate","question":"令和７年８月からの大雨及び台風第12,第15号について、発災から支援対策決定までの期間は何日間か。","choices":["19日間","22日間","24日間","43日間"],"answer":0,"explanation":"令和７年８月からの大雨及び台風第12,第15号は19日間で支援対策が決定されました。22日間は令和２年７月豪雨、24日間は東日本台風と能登半島地震、43日間は冬期の大雪の数値です。","evidence":["令和７年８月からの大雨及び台風第12,第15号","19日間※３"],"source":{"memo_id":"15-02","page":2,"print_page":183,"title":"災害の支援対策決定までの期間と能登支援策"}},{"id":"15-02-a1","memo_id":"15-02","genre_id":"15","level":"advanced","question":"表に示された災害のうち、発災から支援対策決定までの期間がどちらも24日間だった2つの災害の組み合わせはどれか。","choices":["東日本台風と能登半島地震","令和２年７月豪雨と能登半島地震","東日本台風と令和２年７月豪雨","冬期の大雪と令和７年の大雨等"],"answer":0,"explanation":"令和元年東日本台風(台風第19号)と令和６年能登半島地震は、いずれも24日間です。令和２年７月豪雨は22日間、冬期の大雪は43日間、令和７年の大雨等は19日間なので、ほかの組み合わせは当てはまりません。","evidence":["令和元年東日本台風(台風第19号)","令和６年能登半島地震","24日間"],"source":{"memo_id":"15-02","page":2,"print_page":183,"title":"災害の支援対策決定までの期間と能登支援策"}},{"id":"15-02-a2","memo_id":"15-02","genre_id":"15","level":"advanced","question":"令和６年１月25日に決定された能登半島地震に係る支援対策（農林水産関係）の内容として、誤っているものはどれか。","choices":["農業用機械・畜舎等の再建・修繕の国庫補助率は1/2","被災農業者等への貸付は当初10年間を実質無利子化","被災農業法人等の雇用維持の支援は最大120万円/年","漁業者等による漁場の復旧の取組は定額で支援する"],"answer":1,"explanation":"金融支援は「貸付当初５年間の実質無利子化」であり、10年間ではないため誤りです。農業用機械・畜舎等の補助率1/2、雇用維持の最大120万円/年、漁場復旧の定額支援は、いずれもメモの記載どおりです。","evidence":["貸付当初５年間の実質無利子化"],"source":{"memo_id":"15-02","page":2,"print_page":183,"title":"災害の支援対策決定までの期間と能登支援策"}},{"id":"15-03-b1","memo_id":"15-03","genre_id":"15","level":"beginner","question":"令和6年能登半島地震・豪雨の被災地で、営農再開・継続に向けた支援を実施している組織として、メモに書かれているものはどれですか。","choices":["奥能登営農復旧・復興センター","能登半島農地災害復旧事務所","石川県農業再建推進協議会","北陸農林水産災害対策本部"],"answer":0,"explanation":"メモでは、奥能登営農復旧・復興センターにおいて営農再開・継続に向けた支援を実施するとされています。ほかの3つの組織名はメモに出てきません。","evidence":["奥能登営農復旧・復興センターにおける営農再開・継続に向けた支援の実施"],"source":{"memo_id":"15-03","page":3,"print_page":184,"title":"能登半島地震・豪雨からの農林水産業の復旧"}},{"id":"15-03-b2","memo_id":"15-03","genre_id":"15","level":"beginner","question":"令和6年能登半島地震・豪雨で被災した農地・林地・漁港等のうち、大規模な被災箇所の復旧工事はどのように実施されていますか。","choices":["直轄代行等により実施中","被災した市町が単独で実施中","民間の土地所有者が自費で実施中","応急対策のみで復旧工事は未着手"],"answer":0,"explanation":"メモでは、大規模な被災箇所は直轄代行等により復旧工事を実施中とされています。応急対策は地元調整を進めながら実施されており、復旧工事が未着手というのは誤りです。","evidence":["大規模な被災箇所は直轄代行等により復旧工事を実施中"],"source":{"memo_id":"15-03","page":3,"print_page":184,"title":"能登半島地震・豪雨からの農林水産業の復旧"}},{"id":"15-03-i1","memo_id":"15-03","genre_id":"15","level":"intermediate","question":"令和6年能登半島地震・豪雨で被災した農地について、これまでに復旧した面積はどれですか。","choices":["約370ha","約2,200ha","約54ha","約3,700ha"],"answer":0,"explanation":"これまでに復旧した農地は約370haです。約2,200haは令和8年に作付けが見込まれる水田の面積であり、復旧済みの農地面積ではありません。","evidence":["これまでに農地\n約370haを復旧"],"source":{"memo_id":"15-03","page":3,"print_page":184,"title":"能登半島地震・豪雨からの農林水産業の復旧"}},{"id":"15-03-i2","memo_id":"15-03","genre_id":"15","level":"intermediate","question":"令和6年能登半島地震・豪雨の被災地で、営業を再開した製材工場等の施設数はどれですか。","choices":["54施設","37施設","22施設","370施設"],"answer":0,"explanation":"メモでは製材工場等54施設で "}},{"id":"15-04-i2","memo_id":"15-04","genre_id":"15","level":"intermediate","question":"東日本大震災の農林水産関係の被害額のうち、漁港施設（319港）の被害額はいくらですか。","choices":["8,230億円","1,822億円","1,335億円","1,249億円"],"answer":0,"explanation":"漁港施設の被害額は8,230億円で、全体の34％を占めます。1,822億円は被災漁船、1,335億円は養殖施設、1,249億円は市場・加工施設等の被害額です。","evidence":["漁港施設（319港）","8,230億円（34％）"],"source":{"memo_id":"15-04","page":4,"print_page":185,"title":"東日本大震災からの農林水産業の復旧・復興"}},{"id":"15-04-a1","memo_id":"15-04","genre_id":"15","level":"advanced","question":"原子力被災12市町村の営農再開面積について、令和12年の目標と令和7年の現状値の差はおよそ何haですか。","choices":["約1,500ha","約5,500ha","約7,500ha","約2,000ha"],"answer":0,"explanation":"目標の約11,000haから、令和7年の約9,544haを引くと、差は約1,500haです。約5,500haは営農再開可能な面積（約15,000ha）との差、約7,500haは営農休止面積（約17,000ha）との差です。","evidence":["営農再開面積の目標は約11,000ha（R12 ）であり","約9,544ha（営農再開率55.2%）"],"source":{"memo_id":"15-04","page":4,"print_page":185,"title":"東日本大震災からの農林水産業の復旧・復興"}},{"id":"15-04-a2","memo_id":"15-04","genre_id":"15","level":"advanced","question":"東日本大震災からの復旧・復興状況の注記について、誤っているものはどれですか。","choices":["漁港の復旧率は令和8年3月末現在の値","海岸防災林は福島県0.7kmを除き復旧完了","営農再開率は再開面積/休止面積で算出","H22営農休止面積のうち転用は約2,000ha"],"answer":0,"explanation":"漁港の復旧率は令和5年3月末現在の値で、令和8年3月末現在なのは漁港以外の項目です。海岸防災林、営農再開率の計算方法、転用面積の記述は、いずれも注記のとおりです。","evidence":["・漁港は令和５年３月末現在、その他は令和８年３月末現在。"],"source":{"memo_id":"15-04","page":4,"print_page":185,"title":"東日本大震災からの農林水産業の復旧・復興"}}],"pages":185,"unlock_message":"上級を突破しました。レベル選択に「地獄級」が現れます。","backend":"cloudflare","persona_groups":["中山間地域の農業者","大規模農業者","JA","企業・大学","公設試","議員"],"images":true,"notice":"回答は AI の提供元に送られます。個人の情報は書かないでください。","turnstile_site_key":""};

<script>// 一口メモ道場の画面の動き。
// サーバーへの URL はすべて相対（"api/quiz" など）。ページの URL は / で終わる（index.html の先頭で移している）。
"use strict";

const LEVELS = [
  { id: "beginner", name: "初級", desc: "要点に書かれた事実・用語" },
  { id: "intermediate", name: "中級", desc: "数値・割合・グラフの読み取り" },
  { id: "advanced", name: "上級", desc: "組み合わせ・目標との差・ひっかけ" },
];
const HELL = { id: "hell", name: "地獄級", desc: "相談者に、一口メモの知識で答える" };
const LEVEL_NAME = { beginner: "初級", intermediate: "中級", advanced: "上級", hell: "地獄級" };
const UNLOCK = { minQuestions: 5, rate: 0.8 };
const STORE_KEY = "hitokuchi_dojo.v1";
// 問題バンクを埋め込んだ 1 ファイルの版（tools/build_static.py・tools/build_cloudflare.py が作る）
//   配布版：サーバーなし。地獄級は使えない
//   Cloudflare 版（backend: "cloudflare"）：4 択は埋め込みから出し、地獄級だけ Pages Functions を呼ぶ
const STATIC = window.DOJO_STATIC || null;
const CLOUD = Boolean(STATIC && STATIC.backend === "cloudflare");
const CONSULT_OK = !STATIC || CLOUD; // 地獄級を使えるか
const DEMO = CONSULT_OK && new URLSearchParams(location.search).has("demo");

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined) e.append(c);
  return e;
};

// ---- 記録（このブラウザに保存。デモのときは保存しない） ----

const defaultState = () => ({
  hellUnlocked: false,
  best: {},
  settings: { genres: [], count: 10, consultants: 3, groups: [], voice: true },
});

function loadState() {
  let s;
  try { s = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { s = {}; }
  const d = defaultState();
  return { ...d, ...s, best: { ...d.best, ...s.best }, settings: { ...d.settings, ...s.settings } };
}

const state = loadState();
if (DEMO) state.hellUnlocked = true;

function saveState() {
  if (DEMO) {
    // デモでは、ふだんの記録（解放・最高点）は書き換えず、設定だけ残す
    const saved = loadState();
    saved.settings = state.settings;
    localStorage.setItem(STORE_KEY, JSON.stringify(saved));
    return;
  }
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

// ---- サーバーとのやりとり ----

async function api(path, data) {
  if (STATIC && !(CLOUD && path.startsWith("api/hell"))) return staticApi(path, data);
  const opts = data === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data),
  };
  const res = await fetch(path, { credentials: "same-origin", ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `サーバーのエラー（${res.status}）`);
  return body;
}

// ---- 配布版：サーバーの代わりに、埋め込んだ問題バンクから出す（bank.py の draw と同じ考え方） ----

function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

function staticDraw(level, genres, count) {
  const byPage = new Map();
  for (const q of STATIC.questions) {
    if (q.level !== level || !genres.includes(q.genre_id)) continue;
    if (!byPage.has(q.memo_id)) byPage.set(q.memo_id, []);
    byPage.get(q.memo_id).push(q);
  }
  const pages = shuffle([...byPage.values()].map((qs) => shuffle([...qs])));
  const available = pages.reduce((n, qs) => n + qs.length, 0);
  const picked = [];
  // 同じページの問題が続かないよう、ページを順に回して選ぶ
  while (picked.length < count && pages.some((qs) => qs.length)) {
    for (const qs of pages) if (qs.length && picked.length < count) picked.push(qs.pop());
  }
  const questions = shuffle(picked).map((q) => {
    const order = shuffle([0, 1, 2, 3]);
    const g = STATIC.genres.find((x) => x.id === q.genre_id);
    return {
      id: q.id, level: q.level, question: q.question, choices: order.map((i) => q.choices[i]),
      answer: order.indexOf(q.answer), explanation: q.explanation, evidence: q.evidence,
      source: {
        ...q.source, genre_id: g.id, genre: g.name, pdf_url: `pdf/${encodeURIComponent(g.file)}#page=${q.source.page}`,
        image_url: STATIC.images ? `pages/${g.id}/${q.source.page}.png` : "",
      },
    };
  });
  return { questions, requested: count, available };
}

async function staticApi(path, data) {
  if (path === "api/meta") {
    return {
      genres: STATIC.genres, counts: [5, 10, 20], persona_groups: STATIC.persona_groups || [],
      // Cloudflare 版の音声入力は、ブラウザの音声認識（サーバーに音声を送らない）
      voice: CLOUD ? { enabled: true, reason: "", max_seconds: 60 } : { enabled: false, reason: "配布版では使えません。", max_seconds: 60 },
      bank: { total: STATIC.questions.length, pages: STATIC.pages },
    };
  }
  if (path === "api/quiz") return staticDraw(data.level, data.genres, data.count);
  throw new Error("配布版では使えません");
}

// ---- 画面の切り替え（URL のパスは変えない） ----

function show(id) {
  for (const s of document.querySelectorAll(".screen")) s.hidden = s.id !== id;
  window.scrollTo(0, 0);
}

let meta = null;

// ---- レベル選択 ----

function renderLevels(appear = false) {
  const box = $("levels");
  box.replaceChildren();
  const levels = state.hellUnlocked && CONSULT_OK ? [...LEVELS, HELL] : LEVELS;
  for (const lv of levels) {
    const best = state.best[lv.id];
    const bestText = best === undefined ? "まだ挑んでいません"
      : lv.id === "hell" ? `最高 ${best} 点` : `最高 ${best}%`;
    const card = el("button", {
      type: "button", class: "level-card" + (lv.id === "hell" ? " hell-card" : "") + (appear && lv.id === "hell" ? " appear" : ""),
      onclick: () => (lv.id === "hell" ? startHell() : startQuiz(lv.id)),
    },
    el("span", { class: "level-name" }, lv.name),
    el("span", { class: "level-desc" }, lv.desc),
    el("span", { class: "level-best" }, bestText));
    box.append(card);
  }
  $("demo-badge").hidden = !DEMO;
}

// ---- 詳細設定 ----

function selectedGenres() {
  const all = meta.genres.map((g) => g.id);
  const picked = state.settings.genres.filter((g) => all.includes(g));
  return picked.length ? picked : all;
}

function chips(boxId, values, current, label, onPick) {
  const box = $(boxId);
  box.replaceChildren();
  for (const v of values) {
    box.append(el("button", {
      type: "button", class: "chip", "aria-pressed": String(current(v)),
      onclick: () => { onPick(v); saveState(); renderSettings(); },
    }, label(v)));
  }
}

function renderSettings() {
  const genres = new Set(selectedGenres());
  const list = $("genre-list");
  list.replaceChildren();
  for (const g of meta.genres) {
    const c = g.counts;
    const input = el("input", { type: "checkbox", checked: genres.has(g.id) });
    input.addEventListener("change", () => {
      const now = new Set(selectedGenres());
      input.checked ? now.add(g.id) : now.delete(g.id);
      if (now.size === 0) { input.checked = true; return; } // 1 つは残す
      state.settings.genres = now.size === meta.genres.length ? [] : [...now];
      saveState();
    });
    list.append(el("label", { class: "check" }, input,
      el("span", {}, `${g.id} ${g.name}`,
        el("span", { class: "genre-count" }, `（初 ${c.beginner}・中 ${c.intermediate}・上 ${c.advanced}）`))));
  }
  chips("count-list", meta.counts, (v) => v === state.settings.count, (v) => `${v} 問`,
    (v) => { state.settings.count = v; });
  chips("consultant-list", [1, 3, 5], (v) => v === state.settings.consultants, (v) => `${v} 人`,
    (v) => { state.settings.consultants = v; });
  const groups = meta.persona_groups || [];
  chips("group-list", ["おまかせ", ...groups],
    (v) => (v === "おまかせ" ? state.settings.groups.length === 0 : state.settings.groups.includes(v)),
    (v) => v,
    (v) => {
      if (v === "おまかせ") { state.settings.groups = []; return; }
      const s = new Set(state.settings.groups);
      s.has(v) ? s.delete(v) : s.add(v);
      state.settings.groups = [...s];
    });
  $("use-voice").checked = state.settings.voice;
  $("hell-settings").hidden = !state.hellUnlocked || !CONSULT_OK;
  $("unlock-settings").hidden = !CONSULT_OK;
}

function setupSettings() {
  $("open-settings").addEventListener("click", () => {
    const panel = $("settings");
    panel.hidden = !panel.hidden;
    $("open-settings").setAttribute("aria-expanded", String(!panel.hidden));
  });
  for (const b of document.querySelectorAll("[data-genres]")) {
    b.addEventListener("click", () => {
      // 「すべて外す」のあとは、どれか 1 つ選ぶまで最初のジャンルだけ残す
      state.settings.genres = b.dataset.genres === "all" ? [] : [meta.genres[0].id];
      saveState();
      renderSettings();
    });
  }
  $("use-voice").addEventListener("change", (e) => { state.settings.voice = e.target.checked; saveState(); });
  $("unlock-hell").addEventListener("click", () => { state.hellUnlocked = true; saveState(); renderLevels(true); renderSettings(); });
  $("lock-hell").addEventListener("click", () => {
    if (DEMO) { alert("デモでは、地獄級はいつも表示されます。"); return; }
    state.hellUnlocked = false; saveState(); renderLevels(); renderSettings();
  });
}

// ---- 4 択 ----

let quiz = null;

async function startQuiz(level) {
  let data;
  try {
    data = await api("api/quiz", { level, genres: selectedGenres(), count: state.settings.count });
  } catch (e) {
    alert(`問題を読み込めませんでした：${e.message}`);
    return;
  }
  if (!data.questions.length) {
    alert("選んだジャンルには、このレベルの問題がまだありません。詳細設定でジャンルを増やしてください。");
    return;
  }
  quiz = { level, questions: data.questions, index: 0, answers: [] };
  $("quiz-level").textContent = LEVEL_NAME[level];
  const notice = $("quiz-notice");
  notice.hidden = data.available >= data.requested;
  notice.textContent = `選んだジャンルには、このレベルの問題が ${data.available} 問しかないので、${data.questions.length} 問で始めます。`;
  show("quiz");
  renderQuestion();
}

function renderQuestion() {
  const q = quiz.questions[quiz.index];
  $("quiz-progress").textContent = `${quiz.index + 1} / ${quiz.questions.length} 問`;
  $("quiz-bar").style.width = `${(quiz.index / quiz.questions.length) * 100}%`;
  $("quiz-question").textContent = q.question;
  const box = $("quiz-choices");
  box.replaceChildren();
  q.choices.forEach((c, i) => {
    box.append(el("button", { type: "button", class: "choice", onclick: () => answer(i) },
      el("span", { class: "choice-key" }, "ABCD"[i]), el("span", {}, c)));
  });
  $("quiz-feedback").hidden = true;
  if (quiz.index > 0) $("quiz-notice").hidden = true;
}

function answer(i) {
  const q = quiz.questions[quiz.index];
  const ok = i === q.answer;
  quiz.answers.push({ q, picked: i, ok });
  [...$("quiz-choices").children].forEach((b, j) => {
    b.disabled = true;
    if (j === q.answer) b.classList.add("correct");
    else if (j === i) b.classList.add("wrong");
  });
  const verdict = $("quiz-verdict");
  verdict.textContent = ok ? "正解！" : `残念…… 正解は ${"ABCD"[q.answer]}`;
  verdict.className = "verdict " + (ok ? "ok" : "ng");
  $("quiz-explanation").textContent = q.explanation;
  $("quiz-evidence").textContent = q.evidence.map((e) => `「${e}」`).join("\n");
  renderSource(q.source, "quiz-source");
  $("quiz-next").textContent = quiz.index + 1 < quiz.questions.length ? "次へ" : "結果を見る";
  $("quiz-feedback").hidden = false;
  $("quiz-next").focus();
}

function sourceLabel(s) {
  return `${s.genre_id} ${s.genre} p.${s.print_page}` + (s.title ? `「${s.title}」` : "");
}

function renderSource(s, prefix) {
  $(`${prefix}-text`).textContent = `出典：一口メモ ${sourceLabel(s)}`;
  $(`${prefix}-pdf`).href = s.pdf_url;
  // 配布版にはスライドの画像がない（PDF の該当ページを開いて見る）
  $(`${prefix}-image-link`).hidden = !s.image_url;
  if (s.image_url) {
    $(`${prefix}-image`).src = s.image_url;
    $(`${prefix}-image-link`).href = s.image_url;
  }
}

function nextQuestion() {
  quiz.index += 1;
  if (quiz.index < quiz.questions.length) renderQuestion();
  else finishQuiz();
}

function finishQuiz() {
  const total = quiz.answers.length;
  const correct = quiz.answers.filter((a) => a.ok).length;
  const pct = Math.round((correct / total) * 100);
  state.best[quiz.level] = Math.max(state.best[quiz.level] ?? 0, pct);
  const unlockedNow = quiz.level === "advanced" && !state.hellUnlocked
    && total >= UNLOCK.minQuestions && correct / total >= UNLOCK.rate;
  if (unlockedNow) state.hellUnlocked = true;
  saveState();
  $("unlock-banner").hidden = !unlockedNow;
  if (STATIC) $("unlock-text").textContent = STATIC.unlock_message;
  $("result-level").textContent = LEVEL_NAME[quiz.level];
  $("result-score").textContent = `${correct} / ${total} 問正解（${pct}%）`;
  $("result-message").textContent = resultMessage(quiz.level, correct, total);
  const list = $("result-review");
  list.replaceChildren();
  for (const a of quiz.answers) {
    list.append(el("li", {},
      el("span", { class: a.ok ? "mark-ok" : "mark-ng" }, a.ok ? "○ " : "× "),
      a.q.question,
      el("div", { class: "small muted" }, `正解：${a.q.choices[a.q.answer]}` + (a.ok ? "" : `（選んだもの：${a.q.choices[a.picked]}）`)),
      el("div", { class: "small" }, el("a", { href: a.q.source.pdf_url, target: "_blank", rel: "noopener" }, sourceLabel(a.q.source)))));
  }
  show("result");
  renderLevels(unlockedNow);
  if (unlockedNow) renderSettings();
}

function resultMessage(level, correct, total) {
  const rate = correct / total;
  if (level === "advanced" && !state.hellUnlocked) {
    return total < UNLOCK.minQuestions
      ? `地獄級に挑むには、上級を ${UNLOCK.minQuestions} 問以上の設定で 8 割以上正解してください。`
      : `あと少し。上級で 8 割以上正解すると、地獄の門が開きます。`;
  }
  if (rate === 1) return "全問正解。見事です。";
  if (rate >= 0.8) return "よくできました。次のレベルにも挑みましょう。";
  if (rate >= 0.5) return "まずまず。ふり返りで出典を確かめましょう。";
  return "ふり返りで、出典のスライドを読み直してみましょう。";
}

// ---- 地獄級 ----
// 相談者の発言・採点はサーバーの裏で作られる。画面は 1 秒ごとに様子を見に行く。

const HELL_KEY = "hitokuchi_dojo.hell";  // 再読み込みしても続きから戻れるよう、挑戦の ID を残す
const WAITING_STATUS = ["opening", "followup"];
const SLOW_SECONDS = 20;
const VERDICT = { correct: "正しい", wrong_major: "大きな誤り", wrong_minor: "小さな誤り", unsupported: "メモにない断定" };
const TARGET_MARK = { covered: "○", partial: "△", missing: "×" };

let hellRun = null; // {sid, view, current, mode: "talk" | "review", timer}

async function startHell() {
  stopPolling();
  show("hell");
  $("hell-persona").replaceChildren(el("span", { class: "muted" }, "相談者を呼んでいます…"));
  $("hell-dialogue").replaceChildren();
  $("hell-form").hidden = true;
  $("hell-waiting").hidden = true;
  let started;
  try {
    started = await backend.start({
      genres: selectedGenres(), consultants: state.settings.consultants, groups: state.settings.groups,
    });
  } catch (e) {
    alert(`地獄級を始められませんでした：${e.message}`);
    show("home");
    return;
  }
  hellRun = { current: 0, mode: "talk", timer: null, local: {}, grades: {}, ...started };
  if (!hellRun.view) hellRun.view = await backend.refresh();
  backend.save();
  backend.kick();
  renderHell();
}

function stopPolling() {
  if (hellRun && hellRun.timer) clearTimeout(hellRun.timer);
}

function schedulePoll() {
  stopPolling();
  hellRun.timer = setTimeout(async () => {
    try {
      hellRun.view = await backend.refresh();
    } catch (e) {
      $("hell-waiting-text").textContent = `サーバーにつながりません：${e.message}`;
      if (/見つかりません/.test(e.message)) { sessionStorage.removeItem(HELL_KEY); return; }
    }
    renderHell();
  }, 1000);
}

function renderHell() {
  if (hellRun.mode === "review") { renderReview(); return; }
  const cs = hellRun.view.consultants;
  const c = cs[hellRun.current];
  // 2 回目の回答を送ったら、採点を待たずに次の相談者へ
  if (["grading", "graded"].includes(c.status) || (c.status === "error" && c.turns.length >= 4)) {
    if (hellRun.current + 1 < cs.length) { hellRun.current += 1; $("hell-answer").value = ""; renderHell(); }
    else { hellRun.mode = "review"; renderReview(); }
    return;
  }
  $("hell-progress").textContent = `相談者 ${hellRun.current + 1} / ${cs.length} 人`;
  const p = c.persona;
  $("hell-persona").replaceChildren(
    el("span", { class: "persona-icon", "aria-hidden": "true" }, p.icon),
    el("div", {}, el("div", { class: "persona-role" }, `${p.role}（${p.group}）`),
      el("div", { class: "persona-profile" }, p.profile)));
  const dialogue = $("hell-dialogue");
  dialogue.replaceChildren(...c.turns.map((t) => el("div", { class: `bubble from-${t.who === "staff" ? "staff" : "consultant"}` },
    el("span", { class: "bubble-who" }, t.who === "staff" ? "あなた（職員）" : p.role), t.text)));
  const waiting = WAITING_STATUS.includes(c.status);
  $("hell-waiting").hidden = !(waiting || c.status === "error");
  $("hell-retry").hidden = c.status !== "error";
  if (waiting) {
    const slow = c.elapsed >= SLOW_SECONDS ? "（混み合っているようです。もう少しお待ちください）" : "";
    $("hell-waiting-text").textContent = `${p.role}が考えています… ${Math.floor(c.elapsed)} 秒${slow}`;
  } else if (c.status === "error") {
    $("hell-waiting-text").textContent = `相談者の発言を作れませんでした：${c.error}`;
  }
  const answering = c.status === "answer1" || c.status === "answer2";
  const form = $("hell-form");
  const appeared = answering && form.hidden;
  form.hidden = !answering;
  if (appeared) $("hell-answer").focus();
  $("hell-send").textContent = c.status === "answer2" ? "回答して次へ" : "回答する";
  $("hell-send").disabled = mic.busy;
  if (answering) updateMic();
  if (waiting) schedulePoll();
}

async function sendAnswer(ev) {
  ev.preventDefault();
  const text = $("hell-answer").value.trim();
  if (!text && !confirm("回答が空です。このまま送ると 0 点になります。送りますか？")) return;
  $("hell-send").disabled = true;
  try {
    hellRun.view = await backend.answer(hellRun.current, text);
    $("hell-answer").value = "";
  } catch (e) {
    alert(`回答を送れませんでした：${e.message}`);
    $("hell-send").disabled = false;
    return;
  }
  renderHell();
}

async function retryStep(index) {
  try {
    hellRun.view = await backend.retry(index);
  } catch (e) {
    alert(`やり直せませんでした：${e.message}`);
    return;
  }
  renderHell();
}

function renderReview() {
  show("review");
  const v = hellRun.view;
  const list = $("review-list");
  list.replaceChildren(...v.consultants.map(gradeCard));
  if (v.finished) {
    $("review-score").textContent = `平均 ${v.average} 点`;
    $("review-title").textContent = `称号：${v.rank}`;
    if (!hellRun.saved) {
      state.best.hell = Math.max(state.best.hell ?? 0, v.average);
      saveState();
      hellRun.saved = true;
      sessionStorage.removeItem(HELL_KEY);
    }
  } else {
    const done = v.consultants.filter((c) => c.status === "graded").length;
    $("review-score").textContent = `採点中…（${done} / ${v.consultants.length} 人）`;
    $("review-title").textContent = "";
    if (v.consultants.some((c) => c.status === "grading")) schedulePoll();
  }
}

function gradeCard(c) {
  const p = c.persona;
  const head = el("h3", {}, `${p.icon} ${p.role}`);
  if (c.status === "grading") {
    return el("div", { class: "grade" }, head,
      el("div", { class: "waiting" }, el("span", { class: "spinner" }), `採点しています… ${Math.floor(c.elapsed)} 秒`));
  }
  if (c.status === "error") {
    return el("div", { class: "grade" }, head, el("p", { class: "grade-error" }, `採点できませんでした：${c.error}`),
      el("button", { type: "button", class: "small-button", onclick: () => retryStep(c.index) }, "やり直す"));
  }
  if (c.status !== "graded") return el("div", { class: "grade" }, head, el("p", { class: "muted" }, "まだ回答していません。"));
  const g = c.grade;
  const s = c.source;
  return el("div", { class: "grade" },
    head,
    el("div", {}, el("span", { class: "grade-total" }, `${g.total} 点`), "　", g.one_line),
    el("div", { class: "grade-parts" },
      el("span", {}, `正確さ ${g.accuracy} / 40`), el("span", {}, `要点 ${g.coverage} / 30`), el("span", {}, `伝え方 ${g.delivery} / 30`)),
    el("details", { open: true }, el("summary", {}, "伝えたかった事実（○言えた △一部 ×抜け）"),
      el("ul", {}, g.targets.map((t) => el("li", {}, `${TARGET_MARK[t.status]} ${t.fact}`,
        el("div", { class: "small muted" }, `根拠：「${t.evidence}」`))))),
    g.good.length ? el("div", {}, el("strong", {}, "良かった点"), el("ul", {}, g.good.map((x) => el("li", {}, x)))) : null,
    g.missing.length ? el("div", {}, el("strong", {}, "足りない点"), el("ul", {}, g.missing.map((x) => el("li", {}, x)))) : null,
    el("details", { open: true }, el("summary", {}, "模範回答"), el("div", { class: "model-answer" }, g.model_answer),
      g.evidence.length ? el("blockquote", { class: "evidence" }, g.evidence.map((e) => `「${e}」`).join("\n")) : null),
    g.claims.length ? el("details", {}, el("summary", {}, "回答の中の主張の判定"),
      el("ul", {}, g.claims.map((cl) => el("li", {}, `［${VERDICT[cl.verdict] || cl.verdict}］${cl.text}`,
        cl.evidence ? el("div", { class: "small muted" }, `メモでは：「${cl.evidence}」`) : null)))) : null,
    el("details", {}, el("summary", {}, "伝え方の内訳"),
      el("ul", {}, g.delivery_detail.map((d) => el("li", {}, `${d.point}：${"★".repeat(d.value)}${"☆".repeat(3 - d.value)}`)))),
    el("details", {}, el("summary", {}, "やりとり"),
      c.turns.map((t) => el("p", { class: "small" }, `${t.who === "staff" ? "あなた" : p.role}：${t.text}`))),
    s ? el("p", { class: "small" }, `出典：一口メモ ${sourceLabel(s)}　`,
      el("a", { href: s.pdf_url, target: "_blank", rel: "noopener" }, "PDF の該当ページ")) : null);
}

async function resumeHell() {
  // 再読み込みしたときは、途中の挑戦に戻る
  const saved = sessionStorage.getItem(HELL_KEY);
  if (!saved || !state.hellUnlocked || !CONSULT_OK) return false;
  try {
    hellRun = { current: 0, mode: "talk", timer: null, local: {}, grades: {}, ...(await backend.resume(saved)) };
    if (!hellRun.view) hellRun.view = await backend.refresh();
  } catch {
    sessionStorage.removeItem(HELL_KEY);
    hellRun = null;
    return false;
  }
  const view = hellRun.view;
  if (view.finished) { sessionStorage.removeItem(HELL_KEY); return false; }
  const current = view.consultants.findIndex((c) => !["grading", "graded"].includes(c.status) && c.turns.length < 4);
  Object.assign(hellRun, { current: current < 0 ? 0 : current, mode: current < 0 ? "review" : "talk" });
  backend.kick();
  show(current < 0 ? "review" : "hell");
  renderHell();
  return true;
}

function setupConsultScreen() {
  $("hell-form").addEventListener("submit", sendAnswer);
  $("hell-retry").addEventListener("click", () => retryStep(hellRun.current));
  $("review-again").addEventListener("click", startHell);
  $("hell-answer").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("hell-form").requestSubmit();
  });
}

// ---- 地獄級の通信：Flask 版（サーバーが状態を持ち、画面は様子を見に行く） ----

const flaskBackend = {
  async start(body) {
    const view = await api("api/hell", body);
    return { sid: view.session_id, view };
  },
  async resume(saved) { return { sid: saved, view: await api(`api/hell/${saved}`) }; },
  save() { sessionStorage.setItem(HELL_KEY, hellRun.sid); },
  kick() {},
  refresh: () => api(`api/hell/${hellRun.sid}`),
  answer: (index, text) => api(`api/hell/${hellRun.sid}/${index}/answer`, { text }),
  retry: (index) => api(`api/hell/${hellRun.sid}/${index}/retry`, {}),
};

// ---- 地獄級の通信：Cloudflare 版（サーバーは状態を持たない。署名付きのトークンを毎回送り、新しいトークンを受け取る） ----
// トークンは相談者ごと（hellRun.tokens）。始めるときは 1 人目の相談だけを待ち、2 人目からは裏で作る。
// hellRun.server：サーバーが返した画面の形（相談者ごとに差し替える）。hellRun.local：待っている・失敗した相談者（番号ごと）。
// hellRun.grades：採点の結果（番号ごと）。画面に出す形は cloudView() で組み立てる。

function roundHalfEven(x) { // サーバー（Python の round）と同じ丸め
  const r = Math.round(x);
  return Math.abs(x % 1) === 0.5 && r % 2 !== 0 ? r - 1 : r;
}

function rankOf(avg) {
  for (const [border, name] of [[90, "免許皆伝"], [75, "師範代"], [60, "黒帯"], [40, "茶帯"]]) if (avg >= border) return name;
  return "白帯";
}

function cloudView() {
  const now = Date.now();
  const consultants = hellRun.server.consultants.map((c, i) => {
    const out = { ...c, turns: [...c.turns] };
    const g = hellRun.grades[i];
    const local = hellRun.local[i];
    if (g) return { ...out, status: "graded", grade: g.grade, source: g.source };
    if (local) {
      Object.assign(out, { status: local.status, error: local.error || null, elapsed: (now - local.started) / 1000 });
      if (local.pendingTurn) out.turns.push(local.pendingTurn);
    }
    return out;
  });
  const totals = consultants.filter((c) => c.status === "graded").map((c) => c.grade.total);
  const finished = totals.length === consultants.length;
  const average = finished ? roundHalfEven(totals.reduce((a, b) => a + b, 0) / totals.length) : null;
  return { session_id: "cloud", consultants, finished, average, rank: finished ? rankOf(average) : null };
}

function rerender() {
  if (!hellRun) return;
  hellRun.view = cloudView();
  if (hellRun.mode === "review") renderReview();
  else if (!$("hell").hidden) renderHell();
}

// 同じ相談者のトークンを書き換える要求は 1 つずつ順に送る（同時に送ると、片方の変更が消えるため）。
// 別の相談者への要求は、待たずに送る
function withToken(index, fn) {
  const chains = hellRun.chains || (hellRun.chains = {});
  const run = (chains[index] || Promise.resolve()).then(() => fn(hellRun.tokens[index]));
  chains[index] = run.catch(() => {});
  return run.then((res) => {
    hellRun.tokens[index] = res.token;
    hellRun.server.consultants[index] = res.consultant;
    cloudBackend.save();
    return res;
  });
}

async function cloudOpen(index) {
  hellRun.local[index] = { status: "opening", started: Date.now() };
  try {
    await withToken(index, (token) => api("api/hell/answer", { token }));
    delete hellRun.local[index];
  } catch (e) {
    hellRun.local[index] = { status: "error", error: e.message, failed: "open", started: Date.now() };
  }
  rerender();
}

async function cloudGrade(index) {
  hellRun.local[index] = { status: "grading", started: Date.now() };
  try {
    hellRun.grades[index] = await api("api/hell/grade", { token: hellRun.tokens[index] });
    delete hellRun.local[index];
    cloudBackend.save();
  } catch (e) {
    hellRun.local[index] = { status: "error", error: e.message, failed: "grade", started: Date.now() };
  }
  rerender();
}

const cloudBackend = {
  async start(body) {
    const res = await api("api/hell", { ...body, turnstile: await turnstileToken() });
    return { sid: "cloud", tokens: res.tokens, server: res.view };
  },
  async resume(saved) {
    const { tokens, grades } = JSON.parse(saved);
    const res = await api("api/hell/view", { tokens });
    return { sid: "cloud", tokens: res.tokens, server: res.view, grades: grades || {} };
  },
  save() { sessionStorage.setItem(HELL_KEY, JSON.stringify({ tokens: hellRun.tokens, grades: hellRun.grades })); },
  // 最初の相談が作れていない相談者と、採点がまだの相談者を、裏で進める
  kick() {
    hellRun.server.consultants.forEach((c, i) => {
      if (hellRun.grades[i] || hellRun.local[i]) return;
      if (c.status === "opening") cloudOpen(i);
      else if (c.status === "grading") cloudGrade(i);
    });
  },
  refresh: async () => cloudView(),
  async answer(index, text) {
    const first = hellRun.server.consultants[index].turns.length === 1;
    if (first) {
      // 追加の質問を待つ間は、自分の回答を先に表示し、経過秒数を手元で数える
      hellRun.local[index] = { status: "followup", started: Date.now(), pendingTurn: { who: "staff", text } };
      rerender();
    }
    try {
      await withToken(index, (token) => api("api/hell/answer", { token, text }));
      delete hellRun.local[index];
    } catch (e) {
      if (!first) throw e;
      hellRun.local[index] = { ...hellRun.local[index], status: "error", error: e.message, failed: "followup" };
    }
    cloudBackend.kick();
    return cloudView();
  },
  async retry(index) {
    const local = hellRun.local[index];
    if (!local || local.status !== "error") return cloudView();
    if (local.failed === "open") cloudOpen(index);
    else if (local.failed === "grade") cloudGrade(index);
    else {
      delete hellRun.local[index];
      return cloudBackend.answer(index, local.pendingTurn.text);
    }
    return cloudView();
  },
};

const backend = CLOUD ? cloudBackend : flaskBackend;

// Turnstile（ロボット対策）：Cloudflare 版でサイトキーを設定したときだけ使う
async function turnstileToken() {
  const key = STATIC && STATIC.turnstile_site_key;
  if (!key) return "";
  if (!window.turnstile) {
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
      s.onload = resolve;
      s.onerror = () => reject(new Error("ロボット対策の部品を読み込めませんでした"));
      document.head.append(s);
    });
  }
  const box = $("turnstile-box");
  box.hidden = false;
  box.replaceChildren();
  return new Promise((resolve, reject) => {
    const id = window.turnstile.render(box, {
      sitekey: key,
      callback: (token) => { box.hidden = true; window.turnstile.remove(id); resolve(token); },
      "error-callback": () => { box.hidden = true; reject(new Error("ロボット対策の確認に失敗しました")); },
    });
  });
}

// ---- 音声入力 ----
// マイクで録音 → サーバーで文字起こし（1 件ずつ） → 回答欄に書き足す。結果は直してから送れる。
// Cloudflare 版は、ブラウザの音声認識（Web Speech API）で文字にする（サーバーに音声を送らない）。
// マイクが使えるのは https（Code Editor の proxy など）か localhost で開いたときだけ。

const RECORD_TYPES = ["audio/webm;codecs=opus", "audio/ogg;codecs=opus", "audio/mp4"];
const EXT = { "audio/webm": ".webm", "audio/ogg": ".ogg", "audio/mp4": ".mp4" };
const mic = { recorder: null, chunks: [], timer: null, busy: false, speech: null };
const SpeechRec = () => window.SpeechRecognition || window.webkitSpeechRecognition;

function micSupport() {
  if (!meta.voice.enabled) return meta.voice.reason;
  if (CLOUD) {
    return SpeechRec() ? "" : "このブラウザは音声認識に対応していません（Edge・Chrome で使えます）。文字で答えてください。";
  }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    return "この開き方ではマイクを使えません（https の URL か localhost で開くと使えます）。音声ファイルを選ぶか、文字で答えてください。";
  }
  return "";
}

function updateMic() {
  const use = state.settings.voice && meta.voice.enabled;
  const problem = use ? micSupport() : "";
  $("mic").hidden = !use || !!problem;
  $("audio-file-label").hidden = !use || !problem || CLOUD; // Cloudflare 版は音声ファイルを受け取らない
  if (!mic.busy && !mic.recorder && !mic.speech) $("mic-status").textContent = problem;
}

function appendAnswer(text) {
  const box = $("hell-answer");
  box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + text.trim();
}

function micButton(recording) {
  $("mic").classList[recording ? "add" : "remove"]("recording");
  $("mic").textContent = recording ? "■ 止める" : "🎤 話して入力";
}

// Cloudflare 版：ブラウザの音声認識。話している途中の文字を出し、確定した文を回答欄に書き足す
function toggleSpeech() {
  if (mic.speech) { mic.speech.stop(); return; }
  const Rec = SpeechRec();
  const rec = new Rec();
  rec.lang = "ja-JP";
  rec.interimResults = true;
  rec.continuous = true;
  mic.speech = rec;
  let heard = false;
  rec.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) { appendAnswer(r[0].transcript); heard = true; } else interim += r[0].transcript;
    }
    $("mic-status").textContent = interim ? `聞き取り中：${interim}` : "聞き取っています…";
  };
  rec.onerror = (e) => {
    heard = true; // 終わったときの表示で上書きしない
    $("mic-status").textContent = e.error === "not-allowed"
      ? "マイクの使用が許可されませんでした。ブラウザの設定で許可するか、文字で答えてください。"
      : `音声認識が止まりました（${e.error}）。もう一度押すか、文字で答えてください。`;
  };
  rec.onend = () => {
    clearTimeout(mic.timer);
    mic.speech = null;
    micButton(false);
    if (heard && /^(聞き取|話して)/.test($("mic-status").textContent)) {
      $("mic-status").textContent = "文字にしました。直してから「回答する」を押してください。";
    } else if (!heard) {
      $("mic-status").textContent = "聞き取れませんでした。もう一度話してみてください。";
    }
  };
  rec.start();
  micButton(true);
  $("mic-status").textContent = `話してください（もう一度押すか、${meta.voice.max_seconds} 秒で止まります）`;
  mic.timer = setTimeout(() => rec.stop(), meta.voice.max_seconds * 1000);
}

async function toggleRecording() {
  if (CLOUD) { toggleSpeech(); return; }
  if (mic.recorder) { mic.recorder.stop(); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    $("mic-status").textContent = e.name === "NotAllowedError"
      ? "マイクの使用が許可されませんでした。ブラウザの設定で許可するか、文字で答えてください。"
      : `マイクを使えませんでした（${e.message}）`;
    return;
  }
  const type = RECORD_TYPES.find((t) => MediaRecorder.isTypeSupported(t)) || "";
  const recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
  mic.recorder = recorder;
  mic.chunks = [];
  recorder.addEventListener("dataavailable", (e) => { if (e.data.size) mic.chunks.push(e.data); });
  recorder.addEventListener("stop", () => {
    clearTimeout(mic.timer);
    stream.getTracks().forEach((t) => t.stop());
    mic.recorder = null;
    micButton(false);
    const blobType = recorder.mimeType || type || "audio/webm";
    uploadVoice(new Blob(mic.chunks, { type: blobType }), "voice" + (EXT[blobType.split(";")[0]] || ".webm"));
  });
  recorder.start();
  micButton(true);
  $("mic-status").textContent = `録音しています（${meta.voice.max_seconds} 秒で自動で止まります）`;
  mic.timer = setTimeout(() => recorder.state !== "inactive" && recorder.stop(), meta.voice.max_seconds * 1000);
}

async function uploadVoice(blob, filename) {
  const form = new FormData();
  form.append("audio", blob, filename);
  if (hellRun) { form.append("sid", hellRun.sid); form.append("index", String(hellRun.current)); }
  mic.busy = true;
  $("mic").disabled = true;
  $("hell-send").disabled = true;
  $("mic-status").textContent = "文字に起こしています…";
  try {
    const res = await fetch("api/voice", { method: "POST", body: form, credentials: "same-origin" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `サーバーのエラー（${res.status}）`);
    const result = await waitJob(body.job_id);
    const text = result.text.trim();
    if (!text) { $("mic-status").textContent = "聞き取れませんでした。もう一度話してみてください。"; return; }
    appendAnswer(text);
    $("mic-status").textContent = `文字にしました（${result.seconds} 秒の音声）。直してから「回答する」を押してください。`;
    $("hell-answer").focus();
  } catch (e) {
    $("mic-status").textContent = `文字起こしに失敗しました：${e.message}`;
  } finally {
    mic.busy = false;
    $("mic").disabled = false;
    $("hell-send").disabled = false;
  }
}

async function waitJob(jobId) {
  for (;;) {
    await new Promise((r) => setTimeout(r, 1000));
    const job = await api(`api/jobs/${jobId}`);
    if (job.status === "done") return job.result;
    if (job.status === "error") throw new Error(job.error);
    $("mic-status").textContent = job.status === "queued"
      ? `文字起こしの順番を待っています（前に ${job.position} 件）…`
      : `文字に起こしています… ${Math.floor(job.elapsed)} 秒`;
  }
}

function setupMic() {
  $("mic").addEventListener("click", toggleRecording);
  $("audio-file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) uploadVoice(f, f.name);
    e.target.value = "";
  });
}

// ---- 起動 ----

async function boot() {
  setupSettings();
  setupConsultScreen();
  setupMic();
  $("quiz-next").addEventListener("click", nextQuestion);
  $("result-again").addEventListener("click", () => startQuiz(quiz.level));
  for (const b of document.querySelectorAll(".to-home")) b.addEventListener("click", () => { show("home"); renderLevels(); });
  for (const b of document.querySelectorAll(".quit")) {
    b.addEventListener("click", () => {
      if (!confirm("やめてレベル選択に戻りますか？")) return;
      stopPolling();
      sessionStorage.removeItem(HELL_KEY);
      show("home");
      renderLevels();
    });
  }
  try {
    meta = await api("api/meta");
  } catch (e) {
    $("bank-note").textContent = `サーバーにつながりません：${e.message}`;
    return;
  }
  $("bank-note").textContent = `問題バンク：${meta.bank.total} 問（${meta.bank.pages} ページ分）`;
  if (STATIC && STATIC.notice) {
    // Cloudflare 版：回答は AI の提供元に送られる
    $("hell-notice").textContent = STATIC.notice;
    $("hell-notice").hidden = false;
  }
  renderLevels();
  renderSettings();
  await resumeHell();
}

boot();
</script>
