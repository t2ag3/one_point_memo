品は96.5%がトラック輸送とされています。58.4%は2024年度の青果物流通のパレット化率、44%はトラック積載効率の目標値、25%は2030年度の最大の輸送力不足の程度です。","evidence":["農水産物・食品は96.5%がトラック輸送。"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-03-b2","memo_id":"06-03","genre_id":"06","level":"beginner","question":"総合物流施策大綱の期間について、2030年度に最大どの程度の輸送力不足が生じる可能性があるとされているか。","choices":["最大25％程度","最大15％程度","最大7％程度","最大26％程度"],"answer":0,"explanation":"2030年度に最大25％程度の輸送力不足が生じる可能性があるとされています。26は確保する輸送力（最大26ポイント程度）の数字で、15や7は施策なしの不足の中位・下位の値です。","evidence":["最大25％程度の輸送力不足が生じる可能性がある"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-03-i1","memo_id":"06-03","genre_id":"06","level":"intermediate","question":"2030年度の輸送力の表で、輸送力不足が最大（▲25）となる場合の総計（①＋②）はどれか。","choices":["+0.7","+10.7","+18.7","+25.7"],"answer":0,"explanation":"総計は「+18.7～+10.7～+0.7」と示され、不足が▲7～▲15～▲25の順に対応するため、▲25の場合は+0.7です。+25.7は施策による効果（②）の値で、総計ではありません。","evidence":["+18.7 ～ +10.7 ～ +0.7","▲7～▲15～▲25"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-03-i2","memo_id":"06-03","genre_id":"06","level":"intermediate","question":"物流事業者に対するアンケートで、2024年度の青果物流通におけるパレット化率はどれか。","choices":["58.4%","48.4%","68.4%","85.4%"],"answer":0,"explanation":"青果物流通におけるパレット化率は58.4%（2024年度）と示されています。他の数値はメモに記載がなく誤りです。","evidence":["58.4%(2024年度)"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-03-a1","memo_id":"06-03","genre_id":"06","level":"advanced","question":"食料・農業・農村基本計画のKPIで、生鮮食料品等の中継共同物流拠点数を2025年度の実績から2030年度の目標まで増やすには、あと何か所必要か。","choices":["15か所","13か所","9か所","6か所"],"answer":0,"explanation":"2025年度15か所から目標30か所なので、差は15か所です。9か所は民（13→22）、6か所は官（2→8）だけの増加分で、13か所は2025年度の民の数です。","evidence":["15か所(官２、民13)(2025年度)","→30か所(官８、民22)"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-03-a2","memo_id":"06-03","genre_id":"06","level":"advanced","question":"2030年度の輸送力への効果の表について、誤っているものはどれか。","choices":["必要な輸送力は2024年度の貨物輸送量を100として示す","施策なしの輸送力不足は中位で3.8億トンである","宅配便の確実な受け取りの目標値は多様な受取方法50％","新モーダルシフトの目標値は年間625時間である"],"answer":3,"explanation":"陸・海・空の「新モーダルシフト」の目標値は677.5億トンキロで、年間625時間は荷待ち・荷役等時間の短縮の目標値です。他の3つは表の記載どおりです。","evidence":["陸・海・空の「新モーダルシフト」","677.5億トンキロ"],"source":{"memo_id":"06-03","page":3,"print_page":103,"title":"総合物流施策大綱と農水産物・食品の物流"}},{"id":"06-04-b1","memo_id":"06-04","genre_id":"06","level":"beginner","question":"物流効率化法により、一定規模以上の荷主（特定荷主）に義務化されたことはどれですか。","choices":["物流統括管理者の選任","特定運送委託の規制対象化","適正原価を下回る運賃の禁止","取引条件の協議・商慣習の見直し"],"answer":0,"explanation":"物流効率化法は特定荷主に物流統括管理者の選任や中長期計画の策定等を義務化しました。特定運送委託の規制対象化は取適法、運賃の禁止はトラック法改正、取引条件の協議・商慣習の見直しは食料システム法による内容です。","evidence":["一定規模以上の荷主（特定荷主）に対しては、物流統括管理者の選任や中長期計画の策定等を義務化。"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-04-b2","memo_id":"06-04","genre_id":"06","level":"beginner","question":"取適法で規制対象となった「特定運送委託」とは、だれとだれの運送契約ですか。","choices":["発荷主とトラック事業者","着荷主とトラック事業者","発荷主と卸売市場","トラック事業者と下請事業者"],"answer":0,"explanation":"メモでは特定運送委託を「発荷主とトラック事業者の運送契約」と説明しています。着荷主や卸売市場、下請事業者との契約とは書かれていません。","evidence":["取適法による特定運送委託（発荷主とトラック事業者の運送契約）の規制対象化。"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-04-i1","memo_id":"06-04","genre_id":"06","level":"intermediate","question":"取適法による特定運送委託の規制対象化は、いつ施行されましたか。","choices":["R7.6.11","R8.1.1","R8.4.1","R9.4.1"],"answer":1,"explanation":"取適法による特定運送委託の規制対象化はR8.1.1施行です。R8.4.1は物流効率化法の全面施行日、R7.6.11はトラック法改正の公布日です。","evidence":["取適法による特定運送委託（発荷主とトラック事業者の運送契約）の規制対象化。 （R8.1.1施行）"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-04-i2","memo_id":"06-04","genre_id":"06","level":"intermediate","question":"2025年度～2030年度の重点取組事項のうち、「物理的阻害要因への対応」と位置づけられている2つの組み合わせはどれですか。","choices":["パレット標準化とモーダルシフト・中継輸送","デジタル化と商慣習の見直し","パレット標準化とデジタル化","商慣習の見直しとモーダルシフト・中継輸送"],"answer":0,"explanation":"図では①パレット標準化と④モーダルシフト・中継輸送の下に「物理的阻害要因への対応」と書かれています。②デジタル化は「最適化・省力化に必要な情報の整備」、③商慣習の見直しは「発着連携の深化」に対応しています。","evidence":["①パレット標準化","④モーダルシフト・\n中継輸送","物理的阻害要因への対応"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-04-a1","memo_id":"06-04","genre_id":"06","level":"advanced","question":"物流に関する制度整備の説明として、誤っているものはどれですか。","choices":["物流効率化法で全ての荷主に物流効率化が努力義務化","物流効率化法はR8.4.1に全面施行","トラック法改正はR7.6.11公布から3年以内に施行","取適法で適正原価を継続的に下回る運賃を禁止"],"answer":3,"explanation":"適正原価を継続的に下回る運賃の禁止はトラック法改正によるもので、取適法は特定運送委託を規制対象化した法律です。ほかの3つはメモの記載どおりです。","evidence":["トラック法改正による適正原価を継続的に下回る運賃の禁止（R7.6.11公布から３年以内施行）。"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-04-a2","memo_id":"06-04","genre_id":"06","level":"advanced","question":"「目指す方向」の図で、卸売市場から先の「消費地での配送」の側に書かれている取組はどれですか。","choices":["3分の1ルールやリードタイムの見直し","予冷・防振の上でのモーダルシフト","パレット標準化による荷役等軽減","異業種間での復荷確保"],"answer":0,"explanation":"消費地での配送の側には「３分の１ルールやリードタイムの見直し、食品と日雑等の共同配送」が書かれています。パレット標準化は産地での集荷側、モーダルシフトは幹線輸送、復荷確保は中継共同物流拠点の付近に示されています。","evidence":["３分の１ルー\nルやリードタ\nイムの見直し、\n食品と日雑等\nの共同配送"],"source":{"memo_id":"06-04","page":4,"print_page":104,"title":"物流効率化と取引適正化に向けた制度と重点取組"}},{"id":"06-05-b1","memo_id":"06-05","genre_id":"06","level":"beginner","question":"令和8年7月、フードテック分野の官民投資ロードマップを策定した会議はどれか。","choices":["日本成長戦略本部","食品産業振興会議","農林水産技術会議","フードテック官民協議会"],"answer":0,"explanation":"メモでは、令和8年7月の日本成長戦略本部（本部長：内閣総理大臣）でロードマップを策定したとされています。ほかの3つの会議名はメモに出てきません。","evidence":["令和８年７月の日本成長戦略本部（本部長：内閣総理大臣）において"],"source":{"memo_id":"06-05","page":5,"print_page":105,"title":"フードテックの官民投資ロードマップ策定"}},{"id":"06-05-b2","memo_id":"06-05","genre_id":"06","level":"beginner","question":"メモが示す今後の見通しで、世界の食料需要と、気候変動の影響などによる食料の供給力は、それぞれどう変わるとされているか。","choices":["需要は増大し、供給力は低下","需要は減少し、供給力は低下","需要は増大し、供給力も増大","需要は減少し、供給力は増大"],"answer":0,"explanation":"メモには、人口増加などで食料需要が増える一方、気候変動の影響などで供給力が落ちるとあります。需要と供給力が逆の向きに動くため、食料の確保が難しくなるおそれがあるという整理です。","evidence":["世界的な人口増加等により食料需要が増大する一方、気候変動の影響等による供給力の低"],"source":{"memo_id":"06-05","page":5,"print_page":105,"title":"フードテックの官民投資ロードマップ策定"}},{"id":"06-05-i1","memo_id":"06-05","genre_id":"06","level":"intermediate","question":"陸上養殖分野の大規模閉鎖循環式サーモン養殖の写真に示された、水の補給量の削減の程度はどれか。","choices":["1/3に減","1/10に減","1/30に減","1/50に減"],"answer":2,"explanation":"大規模閉鎖循環式サーモン養殖の写真には「水の補給量を1/30に減」と書かれています。1/3・1/10・1/50はメモにない数値です。","evidence":["水の補給量を1/30に減","大規模閉鎖循環式サーモン養殖"],"source":{"memo_id":"06-05","page":5,"print_page":105,"title":"フードテックの官民投資ロードマップ策定"}},{"id":"06-05-a1","memo_id":"06-05","genre_id":"06","level":"advanced","question":"官民投資ロードマップを策定したフードテック4分野の説明として、誤っているものはどれか。","choices":["植物工場：世界初のモジュール型人工光型植物工場を開発","陸上養殖：海洋と切り離した養殖で気候の影響を受けにくい","食品機械：鮮度保持技術の社会実装で食品の輸出拡大に貢献","新規食品：水処理・浄化技術が日本の強みとして挙げられる"],"answer":3,"explanation":"水処理・浄化技術は、陸上養殖分野の強みとして挙げられています。新規食品分野の日本の強みとされているのは、発酵技術や調味技術などです。","evidence":["豊かな食文化を背景とした発酵技術や調味技術などが日本の","世界をリードする水処理・浄化技術や、最先端のゲノム関連技"],"source":{"memo_id":"06-05","page":5,"print_page":105,"title":"フードテックの官民投資ロードマップ策定"}},{"id":"06-05-a2","memo_id":"06-05","genre_id":"06","level":"advanced","question":"陸上養殖分野で、最先端のゲノム関連技術による新品種のうち、可食部が1.2倍になったとされる品種について、飼料の削減の程度はどれか。","choices":["1割減","2割減","3割減","4割減"],"answer":1,"explanation":"可食部1.2倍の品種には「飼料２割減」が並んで示されています。「４割減」は、成長性1.9倍とされた別の品種の数値なので取り違えに注意が必要です。","evidence":["可食部\n1.2倍\n飼料\n２割減","成長性\n1.9倍\n飼料\n４割減"],"source":{"memo_id":"06-05","page":5,"print_page":105,"title":"フードテックの官民投資ロードマップ策定"}},{"id":"06-06-b1","memo_id":"06-06","genre_id":"06","level":"beginner","question":"「食料システム法」が成立した時期はいつですか。","choices":["令和6年6月","令和7年6月","令和7年4月","令和8年4月"],"answer":1,"explanation":"食料システム法は令和7年6月に成立しました。令和7年4月・令和8年4月は米のコスト指標の時点であり、法の成立時期ではありません。","evidence":["（食料システム法）が、令和７年６月に成立。"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"06-06-b2","memo_id":"06-06","genre_id":"06","level":"beginner","question":"食料システム法の「第1の柱」として示されているものはどれですか。","choices":["合理的な費用を考慮した価格形成","食品産業の持続的な発展","食品の輸出の拡大","農地の集積・集約"],"answer":0,"explanation":"第1の柱は「合理的な費用を考慮した価格形成」です。「食品産業の持続的な発展」は第2の柱であり、輸出の拡大や農地の集積・集約は柱として示されていません。","evidence":["食料システム法の第１の柱","～合理的な費用を考慮した価格形成～"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"06-06-i1","memo_id":"06-06","genre_id":"06","level":"intermediate","question":"米のコスト指標で、生産～小売の4段階の合計は令和8年4月時点でいくらですか（税込、円/玄米1kg）。","choices":["342.3円","492.4円","506.9円","2,816円"],"answer":2,"explanation":"4段階の合計は506.9円/玄米1kg（令和8年4月時点）です。342.3円は生産段階のみの値、2,816円は精米5kgに換算した値です。","evidence":["506.9円/玄米1kg（税込。令和８年４月時点）"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"06-06-i2","memo_id":"06-06","genre_id":"06","level":"intermediate","question":"米のコスト指標の令和8年4月時点で、対前年比の増加率が最も大きい段階はどれですか。","choices":["生産","集荷","卸売","小売"],"answer":0,"explanation":"生産が対前年比＋3.4%で最も大きく、集荷＋2.9%、小売＋1.8%、卸売＋1.3%と続きます。集荷も伸びていますが生産には及びません。","evidence":["生産 3４２.３\n対前年比＋3.4%","集荷 ４２.３\n対前年比＋2.9%"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"06-06-a1","memo_id":"06-06","genre_id":"06","level":"advanced","question":"米のコスト指標（円/玄米1kg、税込）について、誤っているものはどれですか。","choices":["令和8年4月時点の小売は83.2円で対前年比＋1.8%","令和8年4月時点の集荷は42.3円で対前年比＋2.9%","令和7年4月時点の卸売は38.6円","令和8年4月時点の生産は331.0円で対前年比＋3.4%"],"answer":3,"explanation":"331.0円は令和7年4月時点の生産の値で、令和8年4月時点の生産は342.3円です。そのほかの選択肢はグラフの値と一致します。","evidence":["生産 331.0","生産 3４２.３\n対前年比＋3.4%"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"06-06-a2","memo_id":"06-06","genre_id":"06","level":"advanced","question":"食料システム法の計画の認定制度について、計画の作成者・認定者・メリットの組み合わせとして正しいものはどれですか。","choices":["食品等事業者が作成し、農水大臣の認定で長期低利融資","地方公共団体が作成し、公取委の認定で長期低利融資","食品等事業者が作成し、公取委の認定で研究設備の供用","米穀機構が作成し、農水大臣の認定で補助金の交付"],"answer":0,"explanation":"計画は食品等事業者が作成し、農水大臣が認定すると日本政策金融公庫の長期低利融資などの支援措置が受けられます。公取委は不公正な取引方法の通知先であり、認定者ではありません。","evidence":["(１) 食品等事業者が、次に関する計画を作成","(３）農水大臣が認定した場合、支援措置を実施","① 日本政策金融公庫による長期低利融資"],"source":{"memo_id":"06-06","page":6,"print_page":106,"title":"食料システム法の概要と米のコスト指標"}},{"id":"07-01-b1","memo_id":"07-01","genre_id":"07","level":"beginner","question":"「みどりの食料システム戦略」が新たな政策方針として策定されたのはいつですか。","choices":["令和3年5月12日","令和2年5月12日","令和4年5月12日","令和3年12月5日"],"answer":0,"explanation":"メモには、みどりの食料システム戦略は令和3年5月12日に策定されたと書かれています。年が1年ずれたものや、月と日を入れ替えた日付は誤りです。","evidence":["実現させるための新たな政策方針として令和３年５月12日に策定。"],"source":{"memo_id":"07-01","page":1,"print_page":107,"title":"みどりの食料システム戦略の策定"}},{"id":"07-01-b2","memo_id":"07-01","genre_id":"07","level":"beginner","question":"「みどりの食料システム戦略」は、食料・農林水産業の何と何の両立をイノベーションで実現させるための政策方針ですか。","choices":["生産力向上と持続性","輸出拡大と価格安定","規模拡大と所得向上","自給率向上と省力化"],"answer":0,"explanation":"メモでは、食料・農林水産業の生産力向上と持続性の両立をイノベーションで実現させる政策方針とされています。輸出拡大や自給率向上などの組み合わせは、メモに書かれた両立の対象ではありません。","evidence":["食料・農林水産業の生産力向上と持続性の両立をイノベーションで"],"source":{"memo_id":"07-01","page":1,"print_page":107,"title":"みどりの食料システム戦略の策定"}},{"id":"07-02-b1","memo_id":"07-02","genre_id":"07","level":"beginner","question":"「みどりの食料システム戦略」の実現に向けて設定されたKPI（2030年・2050年目標）はいくつか。","choices":["10のKPI","12のKPI","14のKPI","16のKPI"],"answer":2,"explanation":"メモの要点に、戦略の実現に向けて14のKPIを設定したと書かれています。表でも①から⑭までの14項目が並んでおり、10・12・16は誤りです。","evidence":["「みどりの食料システム戦略」の実現に向けて、14のKPI（2030年・2050年目標）を設定。"],"source":{"memo_id":"07-02","page":2,"print_page":108,"title":"みどりの食料システム戦略のKPIと目標"}},{"id":"07-02-i1","memo_id":"07-02","genre_id":"07","level":"intermediate","question":"「みどりの食料システム戦略」のKPIで、耕地面積に占める有機農業の2050年目標はどれか。","choices":["25万ha（6.3％）","50万ha（12.5％）","100万ha（25％）","200万ha（50％）"],"answer":2,"explanation":"表の⑦「耕地面積に占める有機農業の割合」の2050年目標は100万ha（25％）です。ほかの面積と割合の組み合わせは表にありません。","evidence":["耕地面積に占める有機農業の割合","100万ha（25％）"],"source":{"memo_id":"07-02","page":2,"print_page":108,"title":"みどりの食料システム戦略のKPIと目標"}},{"id":"07-02-i2","memo_id":"07-02","genre_id":"07","level":"intermediate","question":"「みどりの食料システム戦略」のKPIで、事業系食品ロスの2030年目標はどれか。","choices":["63万トン（30％削減）","72万トン（20％削減）","273万トン（50％削減）","444万トン（同程度）"],"answer":2,"explanation":"⑧「事業系食品ロスを2000年度比で半減」の2030年目標は273万トン（50％削減）です。63万トンと72万トンは化学肥料使用量の目標、444万トンは漁獲量の目標です。","evidence":["事業系食品ロスを2000年度比で半減","273万トン（50％削減）"],"source":{"memo_id":"07-02","page":2,"print_page":108,"title":"みどりの食料システム戦略のKPIと目標"}},{"id":"07-02-a1","memo_id":"07-02","genre_id":"07","level":"advanced","question":"「みどりの食料システム戦略」のKPIで、化学肥料使用量の2050年目標はどれか。","choices":["63万トン（30％低減）","72万トン（20％低減）","63万トン（20％低減）","72万トン（30％低減）"],"answer":0,"explanation":"化学肥料使用量の2050年目標は63万トン（30％低減）です。72万トン（20％低減）は2030年目標です。数値と低減率を入れ替えた組み合わせは表にありません。","evidence":["63万トン（30％低減）","72万トン(20％低減)"],"source":{"memo_id":"07-02","page":2,"print_page":108,"title":"みどりの食料システム戦略のKPIと目標"}},{"id":"07-02-a2","memo_id":"07-02","genre_id":"07","level":"advanced","question":"「みどりの食料システム戦略」のKPIの2030年目標として、誤っているものはどれか。","choices":["化学農薬使用量をリスク換算で10％低減","加温面積に占めるハイブリッド型園芸施設等の割合100％","食品製造業の労働生産性6,694千円/人（30％向上）","林業用苗木のエリートツリー等の活用割合30％"],"answer":1,"explanation":"ハイブリッド型園芸施設等の割合の2030年目標は50％で、100％ではありません。2050年目標は化石燃料を使わない施設への完全移行です。ほかの3つは表の2030年目標と一致します。","evidence":["加温面積に占めるハイブリッド型園芸施設等の割合：50％"],"source":{"memo_id":"07-02","page":2,"print_page":108,"title":"みどりの食料システム戦略のKPIと目標"}},{"id":"07-03-b1","memo_id":"07-03","genre_id":"07","level":"beginner","question":"令和8年6月に、みどりの食料システム戦略の取組を加速化するため取りまとめられた施策の名称はどれか。","choices":["みどり加速化GXプラン","食料安全保障GX推進計画","みどり投資促進ロードマップ","環境負荷低減GX基本方針"],"answer":0,"explanation":"令和8年6月に取りまとめられたのは「みどり加速化GXプラン」です。ほかの選択肢はメモに出てこない名称です。","evidence":["基本計画に基づき2030年までを目途に集中的に取り組むべき施策を「みどり加速化GXプラン」として取りまとめる。"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-03-b2","memo_id":"07-03","genre_id":"07","level":"beginner","question":"「みどり加速化GXプラン」は、何年までを目途に集中的に取り組むべき施策をまとめたものか。","choices":["2026年","2030年","2040年","2050年"],"answer":1,"explanation":"プランは2030年までを目途に集中的に取り組むべき施策をまとめたものです。2026年はプランの取りまとめ時期、2040年は技術開発、2050年は戦略の実現の目途です。","evidence":["基本計画に基づき2030年までを目途に集中的に取り組むべき施策を「みどり加速化GXプラン」として取りまとめる。"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-03-i1","memo_id":"07-03","genre_id":"07","level":"intermediate","question":"令和8年3月末時点で、みどり認定は何経営体を突破したか。","choices":["3,500経営体","15,400経営体","35,000経営体","154,000経営体"],"answer":2,"explanation":"みどり認定は令和8年3月末に35,000経営体を突破しました。154はオーガニックビレッジの市区町村数で、単位も対象も異なります。","evidence":["みどり認定は35,000経営体を突破（R8.3末）"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-03-i2","memo_id":"07-03","genre_id":"07","level":"intermediate","question":"令和7年12月末時点で、オーガニックビレッジは何市区町村まで拡大したか。","choices":["35市区町村","105市区町村","154市区町村","350市区町村"],"answer":2,"explanation":"オーガニックビレッジは令和7年12月末で154市区町村まで拡大しました。35はみどり認定の35,000経営体と混同しやすい数字です。","evidence":["オーガニックビレッジは154市区町村まで拡大"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-03-a1","memo_id":"07-03","genre_id":"07","level":"advanced","question":"「みどり加速化GXプラン」の位置付けに関する記述のうち、誤っているものはどれか。","choices":["食・農分野の環境負荷低減への企業等の関心が増加している","課題解決には食料システム全体の連携強化が不可欠とされた","食料生産を支える肥料原料は定常的に国内で自給している","GX投資拡大に向け投資の予見可能性の向上が挙げられた"],"answer":2,"explanation":"メモでは、肥料原料は我が国が定常的に輸入に依存しているとされており、国内自給は誤りです。企業等の関心の増加、連携強化の必要性、投資の予見可能性の向上はいずれもメモに書かれています。","evidence":["食料生産を支える肥料原料を","我が国は定常的に輸入に依存"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-03-a2","memo_id":"07-03","genre_id":"07","level":"advanced","question":"みどりの食料システム戦略の実現に向けて、革新的な技術・生産体系は何年までに開発するとされているか。","choices":["2026年","2030年","2040年","2050年"],"answer":2,"explanation":"革新的な技術・生産体系は2040年までに開発し、2050年までに社会実装するとされています。2050年は社会実装の年、2030年はプランの集中取組の目途です。","evidence":["革新的な技術・生産体系を","2040年までに開発","2050年までに社会実装"],"source":{"memo_id":"07-03","page":3,"print_page":109,"title":"「みどり加速化GXプラン」の位置付け"}},{"id":"07-04-b1","memo_id":"07-04","genre_id":"07","level":"beginner","question":"「みどり加速化GXプラン」が供給強化を目指す、環境価値が付加された食品等は何と呼ばれているか。","choices":["サステナブルフード","リジェネラティブフード","グリーンマテリアル","エコロジカルフード"],"answer":0,"explanation":"メモでは、環境価値が付加された食品等を「サステナブルフード」と呼び、その供給強化を目指すとしています。リジェネラティブは農業（環境再生型農業）を指す語として使われており、食品の呼び名ではありません。","evidence":["付加された食品等「サステナブルフード」の供給強化を目指す。"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-04-b2","memo_id":"07-04","genre_id":"07","level":"beginner","question":"「みどり加速化GXプラン」を構成する2つの軸の1つとして、メモに示されているものはどれか。","choices":["食料・農林水産分野のGX投資拡大に向けた横断的取組","食料・農林水産物の輸出拡大に向けた横断的取組","農林水産業の担い手確保に向けた横断的取組","農地の集積・集約化に向けた横断的取組"],"answer":0,"explanation":"2つの軸は、GX投資拡大に向けた横断的取組と、みどり戦略の個別施策を加速化する取組です。輸出拡大・担い手確保・農地集積を軸とする記載はありません。","evidence":["食料・農林水産分野のGX投資拡大に向けた横断的取組、みどり戦略","の個別施策を加速化する取組の２つの軸で構成され"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-04-i1","memo_id":"07-04","genre_id":"07","level":"intermediate","question":"「みどり戦略に基づく施策の新たな展開（第２フェーズ）」で、みえるらべるの仕組みを対応させるとされているものはどれか。","choices":["Scope1","Scope2","Scope3","有機JAS認証"],"answer":2,"explanation":"メモには「みえるらべるの仕組みのScope3への対応」と書かれています。有機JAS認証は、別の施策である有機農業の面的拡大で活用するものです。","evidence":["（CSV）促進、みえるらべるの仕組みのScope3への対応等、"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-04-i2","memo_id":"07-04","genre_id":"07","level":"intermediate","question":"各施策の進捗を反映させるとされている、みどり法の5年後見直しの時期はいつからか。","choices":["R7～","R8～","R9～","R10～"],"answer":2,"explanation":"メモには「みどり法５年後見直し（Ｒ9～）」と書かれています。ほかの年度は記載がありません。","evidence":["各施策の進捗を踏まえつつ、みどり法５年後見直し（Ｒ9～）の検討にも反映"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-04-a1","memo_id":"07-04","genre_id":"07","level":"advanced","question":"「みどり加速化GXプラン」のうち、食料・農林水産分野へのGX投資拡大の取組について、誤っているものはどれか。","choices":["重要技術の開発・実装の見通しや市場規模予測を可視化する","ブレンデッドファイナンス（官民投融資）等を有効活用する","国内で投資が進むリジェネラティブ農業の海外の考え方を明確化する","金融機関等と連携し、GX技術の海外ビジネス展開を推進する"],"answer":2,"explanation":"メモでは、リジェネラティブ農業は「海外で大きな投資が進む」ものとされ、明確化するのは「我が国における考え方」です。このため、国内と海外を入れ替えたこの選択肢が誤りです。ほかの3つは、予見可能性の向上・多様な投資手法・海外展開の内容とそれぞれ一致しています。","evidence":["海外で大きな投資が進むリジェネラティブ農業について、","我が国における考え方を明確化"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-04-a2","memo_id":"07-04","genre_id":"07","level":"advanced","question":"「みどり加速化GXプラン」で、改質リグニンや高機能タンパク質の新用途への利用を促す施策は、どの軸のどの柱に位置付けられているか。","choices":["GX投資拡大の「多様な投資手法の活用」","みどり戦略施策強化の「国際情勢に左右されない食料生産の確保」","みどり戦略施策強化の「気候変動への適応策強化」","GX投資拡大の「農山漁村におけるGX投資の受け皿の整備」"],"answer":1,"explanation":"改質リグニン等は「３ 国産バイオマス・再エネの新たな活用促進」に含まれ、この施策は各施策加速化（みどり戦略）の軸の「国際情勢に左右されない食料生産の確保」に位置付けられています。気候変動への適応策強化に含まれるのは、気候変動への適応（適応品種・技術の開発等）です。","evidence":["３ 国産バイオマス・再エネの新たな活用促進","改質リグニンや高機能タンパク質といった、農林水産物由来の国産","国際情勢に左右されない食料生産の確保"],"source":{"memo_id":"07-04","page":4,"print_page":110,"title":"「みどり加速化GXプラン」の全体像"}},{"id":"07-05-b1","memo_id":"07-05","genre_id":"07","level":"beginner","question":"「みどりの食料システム法」が施行された日はいつですか。","choices":["令和4年7月1日","令和3年7月1日","令和4年4月1日","令和5年7月1日"],"answer":0,"explanation":"メモでは、みどりの食料システム法は令和4年7月1日に施行されたとされています。法律番号も令和4年法律第37号であり、令和3年や令和5年ではありません。","evidence":["令和４年７月１日に施行された「みどりの食料システム法※」に基づき"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-05-b2","memo_id":"07-05","genre_id":"07","level":"beginner","question":"みどりの食料システム法に基づき、農林漁業者や事業者の環境負荷低減の取組はどのような方法で支援されていますか。","choices":["税制・金融の特例や補助金の優先採択等","農産物の価格保証と作付面積の割当","化学肥料の購入への課税と罰則の強化","輸入農産物への関税引上げと数量制限"],"answer":0,"explanation":"メモの要点には、環境負荷低減の取組を税制・金融の特例や補助金の優先採択等により支援すると書かれています。価格保証や課税・罰則、関税措置による支援はメモに記載がありません。","evidence":["環境負荷低減の取組を、税制・金融の特例や補助金の優先採択等により支援。"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-05-i1","memo_id":"07-05","genre_id":"07","level":"intermediate","question":"令和8年6月末時点で、みどりの食料システム法の基盤確立事業として認定された事業者は計何事業者ですか。","choices":["109事業者","94事業者","37事業者","190事業者"],"answer":0,"explanation":"基盤確立事業は国が認定し、令和8年6月末時点で計109事業者が認定されています。94は特定区域の区域数、37は生産者認定数（37,000名経営体以上）に関わる数字で、別の項目です。","evidence":["計109事業者を認定（令和８年６月末時点）"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-05-i2","memo_id":"07-05","genre_id":"07","level":"intermediate","question":"みどり投資促進税制で、化学農薬・肥料の使用低減に資する機械・施設等を導入する場合の特別償却率はどれですか。","choices":["機械32％、建物16％","機械16％、建物32％","機械30％、建物15％","機械32％、建物20％"],"answer":0,"explanation":"メモでは特別償却を機械32％、建物16％で措置するとされています。機械と建物の率を入れ替えたものや、数値を変えたものは誤りです。","evidence":["導入する場合の特別償却を措置（機械32％、建物16％）"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-05-a1","memo_id":"07-05","genre_id":"07","level":"advanced","question":"みどりの食料システム法に基づく計画認定制度と支援策について、誤っているものはどれですか。","choices":["令和4年度末までに全都道府県で基本計画が作成された","基盤確立事業の取組は都道府県が認定している","令和8年5月末時点で34道県94区域に特定区域が設定された","みどり投資促進税制の適用期限は令和10年3月31日までである"],"answer":1,"explanation":"基盤確立事業は、機械・資材メーカー等の取組を国が認定するものであり、都道府県が認定するのは生産者による環境負荷低減の取組です。ほかの3つはメモの記載どおりです。","evidence":["機械・資材メーカー、支援サービス事業体、食品事業","者等による技術開発や市場拡大等の取組を国が認定"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-05-a2","memo_id":"07-05","genre_id":"07","level":"advanced","question":"令和7年度補正予算・令和8年度予算のうち、環境保全型農業直接支払交付金の額はどれですか。","choices":["28億円","17億円","30億円","40億円"],"answer":0,"explanation":"環境保全型農業直接支払交付金は28億円です。17億円は戦略的農林水産研究推進事業、30億円は革新的新品種開発の補正、40億円はみどりの食料システム戦略推進総合対策の補正の額です。","evidence":["環境保全型農業直接支払交付金（28億円）"],"source":{"memo_id":"07-05","page":5,"print_page":111,"title":"みどりの食料システム法に基づく支援"}},{"id":"07-06-b1","memo_id":"07-06","genre_id":"07","level":"beginner","question":"農林水産省の全補助事業に対し、最低限の環境配慮の取組をチェック・要件化する仕組みの愛称はどれか。","choices":["みどりチェック","みどりサイクル","エコチェック","グリーン認証"],"answer":0,"explanation":"メモでは、全補助事業に最低限の環境配慮の取組をチェック・要件化する仕組みの愛称を「みどりチェック」としています。ほかの名称はメモに出てきません。","evidence":["最低限の環境配慮の取組をチェック・要件化（愛称：みどりチェック）"],"source":{"memo_id":"07-06","page":6,"print_page":112,"title":"みどりチェック（環境配慮の要件化）"}},{"id":"07-06-b2","memo_id":"07-06","genre_id":"07","level":"beginner","question":"みどりチェックで、補助金等の交付を受けるために事業申請時に求められることはどれか。","choices":["取り組む内容をチェックシートで提出する","環境負荷の数値目標を計画書で提出する","第三者機関の環境認証の写しを提出する","過去の取組実績を報告書で提出する"],"answer":0,"explanation":"申請時には、取り組む内容をチェックシートで提出することが義務化されています。実際に取り組んだ内容は事業実施後に報告するもので、数値目標や第三者認証の提出はメモにありません。","evidence":["① 取り組む内容を事業申請","時にチェックシートで提出すること"],"source":{"memo_id":"07-06","page":6,"print_page":112,"title":"みどりチェック（環境配慮の要件化）"}},{"id":"07-06-i1","memo_id":"07-06","genre_id":"07","level":"intermediate","question":"みどりチェックの試行実施の開始年度と、本格実施の目標年度の組み合わせとして正しいものはどれか。","choices":["試行は令和6年度から、本格は令和9年度","試行は令和5年度から、本格は令和9年度","試行は令和6年度から、本格は令和8年度","試行は令和7年度から、本格は令和10年度"],"answer":0,"explanation":"メモでは、令和9年度の本格実施を目標に令和6年度から試行実施するとしています。試行の開始年度と本格実施の目標年度を取り違えた組み合わせは誤りです。","evidence":["令和9年度の本格実施を目標に、令和6年度から試行実施。"],"source":{"memo_id":"07-06","page":6,"print_page":112,"title":"みどりチェック（環境配慮の要件化）"}},{"id":"07-06-i2","memo_id":"07-06","genre_id":"07","level":"intermediate","question":"チェックシートの例（抜粋）で、「適正な施肥」の項目として示されているものはどれか。","choices":["肥料を適正に保管","化学肥料の使用を半減","肥料の購入量を国へ報告","有機JAS認証を取得"],"answer":0,"explanation":"チェックシートの例の「適正な施肥」には、肥料を適正に保管すること、使用状況の記録・保存、施肥設計の検討、有機物による土づくりの検討が並んでいます。使用の半減、購入量の報告、有機JAS認証の取得は示されていません。","evidence":["肥料を適正に保管","肥料の使用状況等の記録・保存に努める"],"source":{"memo_id":"07-06","page":6,"print_page":112,"title":"みどりチェック（環境配慮の要件化）"}},{"id":"07-06-a1","memo_id":"07-06","genre_id":"07","level":"advanced","question":"みどりチェックの内容と手続きの説明として、誤っているものはどれか。","choices":["申請時と完了報告時にチェックシートを提出する","国の担当者が現地で目視・聞き取り等で確認する","確認の対象者はチェックシート提出者の全員とする","基本的な取組の項目にエネルギーの節減がある"],"answer":2,"explanation":"確認の対象者は、チェックシート提出者の全員ではなく、中から一部を抽出して決めます。申請時と完了報告時の提出、現地での目視・聞き取り等による確認、エネルギーの節減の項目は、いずれもメモに書かれています。","evidence":["確認の対象者はチェックシート提出者の中から一部を抽出して決定。"],"source":{"memo_id":"07-06","page":6,"print_page":112,"title":"みどりチェック（環境配慮の要件化）"}},{"id":"07-07-b1","memo_id":"07-07","genre_id":"07","level":"beginner","question":"2022年12月の生物多様性条約第15回締約国会議（CBD COP15）で採択された、2030年に向けた世界目標の名称はどれですか。","choices":["昆明・モントリオール生物多様性枠組","愛知・名古屋生物多様性枠組","パリ・ジュネーブ生物多様性枠組","京都・カンクン生物多様性枠組"],"answer":0,"explanation":"メモでは、2022年12月のCBD COP15で「昆明・モントリオール生物多様性枠組」が採択されたとしています。ほかの名称はメモに記載がありません。","evidence":["世界目標「昆明・モントリオール生物多様性枠組」が採択。"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-07-b2","memo_id":"07-07","genre_id":"07","level":"beginner","question":"2025年4月に施行された「地域生物多様性増進法」に基づいて認定されているものはどれですか。","choices":["自然共生サイト","世界農業遺産","保護林指定区域","鳥獣保護区"],"answer":0,"explanation":"メモでは、地域生物多様性増進法が2025年4月に施行され「自然共生サイト」が認定されたとしています。ほかの選択肢はこの法律による認定としてメモに出てきません。","evidence":["2025年4月に「地域生物多様性増進法※ 」が施行され、「自然共生サイト」が認定。"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-07-i1","memo_id":"07-07","genre_id":"07","level":"intermediate","question":"2026年3月末時点で、全国の自然共生サイトのうち農林水産業・農山漁村に関係するサイトは何箇所ですか。","choices":["277箇所","367箇所","75箇所","90箇所"],"answer":0,"explanation":"円グラフでは、全367箇所のうち農林水産業・農山漁村に関係するサイトは277箇所（75％）です。367箇所は全体の数、75は割合（％）であり箇所数ではありません。","evidence":["全367箇所","277箇所（75％）"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-07-i2","memo_id":"07-07","genre_id":"07","level":"intermediate","question":"「昆明・モントリオール生物多様性枠組」に盛り込まれた30by30では、陸地と海洋のそれぞれ少なくとも何％を保全するとしていますか。","choices":["30％","20％","50％","75％"],"answer":0,"explanation":"30by30は「陸地と海洋のそれぞれ少なくとも30％」を保護地域とOECMで保全する目標です。75％は自然共生サイトのうち農林水産業関係の割合で、別の数値です。","evidence":["それぞれ少なくとも30％を保護地域及びその他の効果的な手段"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-07-a1","memo_id":"07-07","genre_id":"07","level":"advanced","question":"メモに書かれた自然共生サイトの説明として、誤っているものはどれですか。","choices":["環境省のみが単独で所管して認定している","OECMに位置付けて30by30目標の達成に貢献する","民間の取組等で生物多様性の保全が図られる区域","2026年3月末時点で合計367箇所が認定されている"],"answer":0,"explanation":"自然共生サイトは環境省、農林水産省、国土交通省の共管とされており、環境省のみの所管ではありません。OECMへの位置付け、民間の取組等による区域、367箇所の認定はいずれもメモに記載があります。","evidence":["サイトとして認定（環境省、農林水産省、国\n土交通省が共管）。"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-07-a2","memo_id":"07-07","genre_id":"07","level":"advanced","question":"メモで紹介された自然共生サイトのうち「有機農業」の事例について、実施区域と区域の状況の組合せとして正しいものはどれですか。","choices":["石川県金沢市で水稲・大豆・小麦を生産","鳥取県伯耆町で水稲・大豆・小麦を生産","石川県金沢市でヒノキ・アカマツを植林","鳥取県伯耆町でヒノキ・アカマツを植林"],"answer":0,"explanation":"有機農業の事例はオーガニックファーム金沢大地で、実施区域は石川県金沢市、有機農業で水稲・大豆・小麦を生産しています。鳥取県伯耆町やヒノキ・アカマツ植林は森林保全の事例「水源の森ほうき」の内容です。","evidence":["実施区域：石川県金沢市","・有機農業により水稲、大豆、\n小麦を生産。"],"source":{"memo_id":"07-07","page":7,"print_page":113,"title":"昆明・モントリオール枠組と自然共生サイト"}},{"id":"07-08-b1","memo_id":"07-08","genre_id":"07","level":"beginner","question":"令和6年度末の日本の有機農業の取組面積はどれか。","choices":["3.01万ha","3.45万ha","3.98万ha","4.50万ha"],"answer":2,"explanation":"令和6年度末の有機農業の取組面積は3.98万ha（耕地面積の0.9%）です。3.45万haは令和5年度、3.01万haは令和4年度の値です。","evidence":["日本の有機農業の取組面積は令和６年度末で3.98万ha（耕地面積の0.9%）となり"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-08-b2","memo_id":"07-08","genre_id":"07","level":"beginner","question":"オーガニックビレッジについて、2030年までに創出することを目標としている市町村数はどれか。","choices":["154市町村","168市町村","200市町村","300市町村"],"answer":2,"explanation":"2030年までに200市町村を創出することが目標です。168は令和8年8月末時点の現状、154は令和7年度の数です。","evidence":["2030年までに200市町村創出することを目標"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-08-i1","memo_id":"07-08","genre_id":"07","level":"intermediate","question":"グラフによると、令和2年度（R2）の日本の有機農業の取組面積はどれか。","choices":["2.16万ha","2.52万ha","2.66万ha","3.01万ha"],"answer":1,"explanation":"R2の取組面積は2.52万ha（耕地面積の0.6%）です。2.66万haはR3、2.16万haはH26、3.01万haはR4の値です。","evidence":["2.52万ha (0.6%)*"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-08-i2","memo_id":"07-08","genre_id":"07","level":"intermediate","question":"グラフによると、令和元年度から令和3年度（R1～R3）の有機農業の取組面積の増加ペースはどれか。","choices":["＋550 ha/年","＋1,400 ha/年","＋3,500 ha/年","＋4,400 ha/年"],"answer":1,"explanation":"R1～R3の増加ペースは年＋1,400haです。＋550haはH26～H30、＋3,500haはR4、＋4,400haはR5の増加ペースです。","evidence":["＋1,400 ha/年"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-08-a1","memo_id":"07-08","genre_id":"07","level":"advanced","question":"オーガニックビレッジの2030年の目標数と、令和8年8月末時点の数との差はいくつか。","choices":["14","32","46","53"],"answer":1,"explanation":"目標200市町村に対し令和8年8月末時点は168市区町村なので、差は32です。46は令和7年度の154との差、14は154と168の差です。","evidence":["2030年までに200市町村創出することを目標","168市区町村まで拡大(令和８年８月末時点)"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-08-a2","memo_id":"07-08","genre_id":"07","level":"advanced","question":"有機農業の取組面積とオーガニックビレッジに関する記述として、誤っているものはどれか。","choices":["みどり戦略は令和3年5月に策定された","令和7年度のオーガニックビレッジは154市町村","H26～H30の取組面積の増加は年＋550ha","R4の取組面積の増加ペースは年＋4,400ha"],"answer":3,"explanation":"R4の増加ペースは年＋3,500haで、年＋4,400haはR5の値なので誤りです。ほかの3つはグラフと図の記載どおりです。","evidence":["＋3,500 ha/年","＋4,400 ha/年"],"source":{"memo_id":"07-08","page":8,"print_page":114,"title":"有機農業の取組面積とオーガニックビレッジ"}},{"id":"07-09-b1","memo_id":"07-09","genre_id":"07","level":"beginner","question":"農林水産省の農業由来廃プラスチック対策の新たな基本方針で推進する取組の組み合わせとして正しいものはどれか。","choices":["排出抑制・適正処理・輸入規制・持続可能な資源の利用","排出抑制・埋立処分・流出防止・持続可能な資源の利用","排出抑制・適正処理・流出防止・持続可能な資源の利用","使用禁止・適正処理・流出防止・持続可能な資源の利用"],"answer":2,"explanation":"要点では、排出抑制、資源の有効利用を基本とした適正処理、流出防止及び持続可能な資源の利用を推進するとされています。輸入規制・埋立処分・使用禁止はメモに挙げられた取組ではありません。","evidence":["排出抑制、資源の有効利用を基本とした適正処理、流出防止及び持続可能な資源の利用を推進し"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-09-b2","memo_id":"07-09","genre_id":"07","level":"beginner","question":"農業由来廃プラスチック対策の基本方針により、農林水産省はどのような体制への転換を図るとしているか。","choices":["持続可能な農業生産体制","大規模集約型の農業生産体制","輸出主導型の農業生産体制","資材自給型の農業生産体制"],"answer":0,"explanation":"要点の結びで「持続可能な農業生産体制へ転換を図る」と明記されています。大規模集約型・輸出主導型・資材自給型への転換はこのページには書かれていません。","evidence":["持続可能な農業生産体制へ転換を図る。"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-09-i1","memo_id":"07-09","genre_id":"07","level":"intermediate","question":"グラフ「農業由来廃プラスチックの有効利用の割合」で、令和6年の全国の有効利用の割合はどれか。","choices":["48.9%","68.9%","78.9%","90.0%"],"answer":1,"explanation":"グラフの最新年である令和6年の値は68.9%と示されています。90%は2030年までの目標値であり、現状の値ではありません。","evidence":["68.9%"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-09-i2","memo_id":"07-09","genre_id":"07","level":"intermediate","question":"農業由来廃プラスチック対策のうち「資源の有効利用を基本とした適正処理」の内容として正しいものはどれか。","choices":["熱回収を基本とし、困難な場合はリサイクル処理","埋立処分を基本とし、困難な場合は熱回収","焼却処分を基本とし、困難な場合は埋立処分","リサイクル処理を基本とし、困難な場合は熱回収"],"answer":3,"explanation":"適正処理はリサイクル処理を基本とし、困難な場合に熱回収とされています。熱回収を基本とする選択肢は順序が逆で、埋立処分や焼却処分を基本とする記載はありません。","evidence":["リサイクル処理を基本とし、困難な場合には、熱回収"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-09-a1","memo_id":"07-09","genre_id":"07","level":"advanced","question":"令和6年の農業由来廃プラスチックの有効利用の割合と、2030年までの目標値との差は何ポイントか。","choices":["9.0ポイント","11.1ポイント","21.1ポイント","31.1ポイント"],"answer":2,"explanation":"2030年までの目標は90％で、令和6年の実績は68.9%なので、差は90−68.9＝21.1ポイントです。31.1ポイントは2035年目標の100％との差でもなく、計算の誤りです。","evidence":["68.9%","「農業由来廃プラスチックを2030 年までに90％、2035 年までに100％有効利用」"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-09-a2","memo_id":"07-09","genre_id":"07","level":"advanced","question":"農業由来廃プラスチックの対策と目標についての記述のうち、誤っているものはどれか。","choices":["排出抑制として、排出抑制に資する資材の使用と使用の合理化を推進する","持続可能な資源の利用として、化石由来の新品資材の使用を推進する","流出防止として、ほ場からのプラスチック被覆肥料の被膜殻の流出抑制対策等を推進する","2035年までに農業由来廃プラスチックの100％有効利用を目指す"],"answer":1,"explanation":"持続可能な資源の利用で推進するのは、バイオマス及び再生材を利用した資材の使用です。化石由来の新品資材の使用を推進する記載はなく、ほかの3つはメモの記載どおりです。","evidence":["バイオマス及び再生材を利用した資材の使用を推進"],"source":{"memo_id":"07-09","page":9,"print_page":115,"title":"農業由来廃プラスチックの対策"}},{"id":"07-10-b1","memo_id":"07-10","genre_id":"07","level":"beginner","question":"このメモの要点で、バイオマスの活用はどの法律・計画の下で関連施策を推進するとされているか。","choices":["バイオマス活用推進基本法及び同法に基づく基本計画","農山漁村再生可能エネルギー法及び同法に基づく基本計画","下水道法及び同法に基づく下水汚泥の利用計画","農地法及び同法に基づく農地の一時転用許可制度"],"answer":0,"explanation":"要点に、バイオマスの活用はバイオマス活用推進基本法及び同法に基づくバイオマス活用推進基本計画の下で推進すると書かれています。農山漁村再生可能エネルギー法は再生可能エネルギーの導入促進に使う法律として挙げられており、バイオマス活用の根拠ではありません。","evidence":["バイオマスの活用については、バイオマス活用推進基本法及び同法に基づくバイオマス活用推進","基本計画の下、関連施策を総合的かつ計画的に推進。"],"source":{"memo_id":"07-10","page":10,"print_page":116,"title":"バイオマス・再生可能エネルギーの活用"}},{"id":"07-10-b2","memo_id":"07-10","genre_id":"07","level":"beginner","question":"このメモの要点で、農山漁村に豊富に存在するとされている資源はどれか。","choices":["バイオマス、水、土地","石油、天然ガス、石炭","鉄鉱石、銅、レアメタル","風力、地熱、潮力"],"answer":0,"explanation":"要点の最初の文に、農山漁村にはバイオマス、水、土地等の資源が豊富に存在すると書かれています。ほかの組み合わせは要点に挙げられていません。","evidence":["農山漁村にはバイオマス、水、土地等の資源が豊富に存在。"],"source":{"memo_id":"07-10","page":10,"print_page":116,"title":"バイオマス・再生可能エネルギーの活用"}},{"id":"07-10-i1","memo_id":"07-10","genre_id":"07","level":"intermediate","question":"バイオマス活用推進基本計画（令和4年9月改定）の政策目標で、バイオマスの利用率の2030年度の目標値はどれか。","choices":["約77％","約80％","約85％","約90％"],"answer":1,"explanation":"表で、バイオマスの利用率の2030年度目標値は約80％です。約77％は2025年度の取りまとめ値であり、目標値ではありません。","evidence":["●バイオマス活用推進基本計画(令和４年９月改定)に基づく政策目標","約80％"],"source":{"memo_id":"07-10","page":10,"print_page":116,"title":"バイオマス・再生可能エネルギーの活用"}},{"id":"07-10-a1","memo_id":"07-10","genre_id":"07","level":"advanced","question":"このメモの内容として誤っているものはどれか。","choices":["営農型太陽光発電設備のための農地の一時転用許可件数は6,137件","バイオマス産業都市は令和8年3月末までに107市町村が選定済","農山漁村再生可能エネルギー法は平成26年5月に施行された","バイオマス活用推進計画を策定した市町村は112市町村である"],"answer":3,"explanation":"バイオマス活用推進計画を策定した市町村は1,048市町村であり、112市町村は農山漁村再生可能エネルギー法の基本計画を作成した市町村の数です。ほかの3つはメモの記載どおりです。","evidence":["1,048市町村","（令和７年３月末までに基本計画を112市町村が作成済）"],"source":{"memo_id":"07-10","page":10,"print_page":116,"title":"バイオマス・再生可能エネルギーの活用"}},{"id":"07-10-a2","memo_id":"07-10","genre_id":"07","level":"advanced","question":"バイオマス活用推進基本計画の政策目標で、バイオマス産業の規模（製品やエネルギー市場を対象）の取りまとめ値（令和4年度時点）と2030年度目標値の組み合わせはどれか。","choices":["約1％（5,952億円）から約2％（約1兆円）へ","約77％（5,952億円）から約80％（約1兆円）へ","約2％（5,952億円）から約4％（約2兆円）へ","約1％（約1兆円）から約2％（5,952億円）へ"],"answer":0,"explanation":"表で、バイオマス産業の規模は取りまとめ値が約1％（5,952億円）、2030年度目標値が約2％（約1兆円）です。約77％・約80％は利用率の値で、金額と割合を入れ替えた組み合わせも誤りです。","evidence":["約１％\n（5,952億円）","約２％\n（約1兆円）","※１：利用率は令和７年度取りまとめ時点、産業規模は令和４年度時点、推進計画は令和６年度末時点。"],"source":{"memo_id":"07-10","page":10,"print_page":116,"title":"バイオマス・再生可能エネルギーの活用"}},{"id":"07-11-b1","memo_id":"07-11","genre_id":"07","level":"beginner","question":"2000年度比で2030年度までに事業系食品ロスを半減（273万トン）させる目標は、何年度に達成されたか。","choices":["2020年度","2021年度","2022年度","2024年度"],"answer":2,"explanation":"メモでは、半減（273万トン）の目標を2022年度に達成したと書かれています。2024年度は食品ロスの発生状況の推計年度であり、達成年度ではありません。","evidence":["2000年度比で2030年度までに事業系食品ロスを半減（273万トン）させる目標を設定していたところ、","2022年度に目標を達成。"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-11-b2","memo_id":"07-11","genre_id":"07","level":"beginner","question":"2025年3月に策定した食品リサイクル法の基本方針で設定された、事業系食品ロスの新たな目標はどれか。","choices":["2000年度比で2030年度までに半減","2000年度比で2030年度までに6割減","2000年度比で2030年度までに7割減","2000年度比で2035年度までに6割減"],"answer":1,"explanation":"新たな目標は2000年度比で2030年度までに6割減（219万トン）です。半減（273万トン）は2022年度に達成済みの従来の目標です。","evidence":["2025年３月に策定した食品リサイクル法の基本方針において2000年度比で2030年度までに６割減","（219万トン）とする新たな目標を設定。"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-11-i1","memo_id":"07-11","genre_id":"07","level":"intermediate","question":"2024年度推計の事業系食品ロスの業種別内訳で、発生量が最も多い業種はどれか。","choices":["食品製造業","外食産業","食品小売業","食品卸売業"],"answer":0,"explanation":"食品製造業が110万トン（46%）で最も多く、外食産業70万トン（30%）、食品小売業48万トン（20%）、食品卸売業9万トン（4%）と続きます。外食産業は2番目です。","evidence":["食品製造業\n110万トン\n（46%）","外食産業\n70万トン\n（30%）"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-11-i2","memo_id":"07-11","genre_id":"07","level":"intermediate","question":"2024年度推計で、国民1人当たりの年間の食品ロス量はどれくらいか。","choices":["約27kg","約37kg","約47kg","約102kg"],"answer":1,"explanation":"国民1人当たり食品ロス量は年間約37kgです。約102は1日当たりの量（約102g）で、年間の値ではありません。","evidence":["（参考）国民1人当たり食品ロス量","年間 約37kg"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-11-a1","memo_id":"07-11","genre_id":"07","level":"advanced","question":"食品ロス削減推進法の基本方針で国が行う基本的施策として、誤っているものはどれか。","choices":["賞味期限の年月表示化等の商慣習見直しの推進","納品期限の厳格化による品質管理の徹底","需要予測の高度化や受発注リードタイムの調整","未利用食品を提供する活動（食品寄附）の支援"],"answer":1,"explanation":"メモでは商慣習見直しとして「納品期限の緩和」が挙げられており、厳格化ではありません。賞味期限の年月表示化、需要予測の高度化、食品寄附の支援はいずれも施策として書かれています。","evidence":["（納品期限の緩和、賞味期限の年月表示化等）"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-11-a2","memo_id":"07-11","genre_id":"07","level":"advanced","question":"2024年度推計の事業系食品ロス量と、2030年度の新たな削減目標（6割減）の量との差は何万トンか。","choices":["13万トン","18万トン","36万トン","54万トン"],"answer":1,"explanation":"事業系食品ロスは237万トン、新目標は219万トンなので、差は18万トンです。36万トンは旧目標273万トンとの差、13万トンは家庭系224万トンとの差で誤りです。","evidence":["うち食品産業から発生する事業系食品ロスは237万トン","（219万トン）とする新たな目標を設定。"],"source":{"memo_id":"07-11","page":11,"print_page":117,"title":"食品ロスの発生状況と削減目標"}},{"id":"07-12-b1","memo_id":"07-12","genre_id":"07","level":"beginner","question":"国内のプラスチック製品のうち、食品容器包装が占める割合について、一口メモではどう書かれているか。","choices":["1/4以上を占めている","1/10未満にとどまる","1/8程度にとどまる","1/5未満にとどまる"],"answer":0,"explanation":"一口メモの要点に、食品容器包装が国内のプラスチック製品の1/4以上を占めると書かれています。ほかの選択肢はいずれも1/4より小さい割合で、記載と合いません。","evidence":["国内のプラスチック製品のうち食品容器包装が1/4以上を占めている。"],"source":{"memo_id":"07-12","page":12,"print_page":118,"title":"プラスチック資源循環をめぐる状況と政策"}},{"id":"07-12-b2","memo_id":"07-12","genre_id":"07","level":"beginner","question":"循環型社会の形成と循環経済への移行を目的に、事業者等に各種措置を求めている法律として一口メモの要点に挙げられているものはどれか。","choices":["容器包装リサイクル法、改正資源有効利用促進法等","食品衛生法、食品表示法等","農地法、土地改良法等","肥料法、農薬取締法等"],"answer":0,"explanation":"要点では、容器包装リサイクル法と改正資源有効利用促進法等で事業者等に各種措置を求めているとしています。ほかの法律の組み合わせは、このページには出てきません。","evidence":["循環型社会の形成、循環経済への移行を目的として、容器包装リサイクル法、改正資源有効利用促","進法等において、事業者等に対して各種措置を求めている。"],"source":{"memo_id":"07-12","page":12,"print_page":118,"title":"プラスチック資源循環をめぐる状況と政策"}},{"id":"07-12-i1","memo_id":"07-12","genre_id":"07","level":"intermediate","question":"2023年の国内プラスチック製品の製品消費量はどれか。","choices":["843万t","387万t","382万t","353万t"],"answer":0,"explanation":"2023年の国内プラスチック製品の製品消費量は843万tです。387万tは一般廃棄物、382万tは産業廃棄物、353万tは製品消費量のうち包装・容器等／コンテナ類の量です。","evidence":["製品消費量 843万t","一般廃棄物 387万t","産業廃棄物 382万t"],"source":{"memo_id":"07-12","page":12,"print_page":118,"title":"プラスチック資源循環をめぐる状況と政策"}},{"id":"07-12-i2","memo_id":"07-12","genre_id":"07","level":"intermediate","question":"プラスチック資源循環戦略のマイルストーンでは、2030年までに容器包装のどれだけをリサイクル・リユースするとしているか。","choices":["6割","4割","8割","10割"],"answer":0,"explanation":"マイルストーン③は、2030年までに容器包装の6割をリサイクル・リユースするとしています。100％（10割）はマイルストーン④の使用済プラスチックの有効利用の目標で、目標年も2035年なので取り違えに注意が必要です。","evidence":["③ 2030年までに容器包装の６割をリサイクル・リユース","④ 2035年までに使用済プラスチックを100％有効利用"],"source":{"memo_id":"07-12","page":12,"print_page":118,"title":"プラスチック資源循環をめぐる状況と政策"}},{"id":"07-12-a2","memo_id":"07-12","genre_id":"07","level":"advanced","question":"G7広島サミット（2023年）で合意された、追加的なプラスチック汚染をゼロにする野心の目標年はどれか。","choices":["2040年","2050年","2030年","2035年"],"answer":0,"explanation":"G7広島サミットでは、2040年までに追加的なプラスチック汚染をゼロにする野心を持つことに合意しました。2050年は、G20大阪サミット（2019年）の「大阪ブルー・オーシャン・ビジョン」の目標年で、海洋プラスチックごみが対象です。","evidence":["2040年までに追加的なプラスチック汚染をゼ","世界共通のビジョンとして、2050年までに海洋プ"],"source":{"memo_id":"07-12","page":12,"print_page":118,"title":"プラスチック資源循環をめぐる状況と政策"}},{"id":"07-13-b1","memo_id":"07-13","genre_id":"07","level":"beginner","question":"内閣府調査（令和5年）で、環境に配慮して生産された農産物を購入したいと答えた人の割合はどれか。","choices":["約3割","約5割","約6割","約8割"],"answer":3,"explanation":"メモでは購入したいと答えた人は8割とされています。6割以上は「どれが環境に配慮した農産物かわからない」と答えた人の割合で、別の数値です。","evidence":["環境に配慮して生産された農産物を購入したいと答えた人は８割"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-13-b2","memo_id":"07-13","genre_id":"07","level":"beginner","question":"農産物の生産段階における環境負荷低減の取組を、消費者に分かりやすく伝える「見える化」では、何で取組を伝えるか。","choices":["星の数","色の濃さ","文字の大きさ","価格の差"],"answer":0,"explanation":"メモでは環境負荷低減の取組を星の数で伝える「見える化」を推進するとされています。色や文字の大きさ、価格の差で伝えるという記述はありません。","evidence":["星の数で消費者に分かりやすく伝える「見える化」の"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-13-i1","memo_id":"07-13","genre_id":"07","level":"intermediate","question":"みえるらべるの温室効果ガス削減への貢献で、★★★（星3つ）となる削減貢献率の基準はどれか。","choices":["5%以上","10%以上","20%以上","30%以上"],"answer":2,"explanation":"★★★は削減貢献率20%以上です。5%以上は★1つ、10%以上は★2つの基準です。","evidence":["削減貢献率５％以上","10%以上","20%以上"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-13-i2","memo_id":"07-13","genre_id":"07","level":"intermediate","question":"みえるらべるの生物多様性保全への配慮で、「化学農薬・化学肥料の不使用」の取組に与えられる点数はどれか。","choices":["1点","2点","3点","4点"],"answer":1,"explanation":"取組一覧では化学農薬・化学肥料の不使用は2点です。化学農薬・化学肥料の低減（5割以上10割未満）や冬期湛水などは1点です。","evidence":["の不使用","２点"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-13-a1","memo_id":"07-13","genre_id":"07","level":"advanced","question":"米の生産で「化学農薬・化学肥料の不使用」と「冬期湛水」の2つの取組を行った場合、生物多様性保全への配慮の星の数はどれになるか。","choices":["星なし","★1つ","★★★（星3つ）","★★（星2つ）"],"answer":2,"explanation":"化学農薬・化学肥料の不使用が2点、冬期湛水が1点で合計3点となり、3点以上は★★★です。2点なら★★、1点なら★1つになります。","evidence":["２点","冬期湛水","３点以上"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-13-a2","memo_id":"07-13","genre_id":"07","level":"advanced","question":"みえるらべるについて、メモの内容として誤っているものはどれか。","choices":["対象品目は24品目である","英語版ラベルの愛称はChoiSTARである","生物多様性保全の評価は野菜も対象","通年購入可能な店舗等は25都道府県"],"answer":2,"explanation":"生物多様性保全への配慮の評価は「米に限る」とされており、野菜は対象ではありません。対象品目24品目、愛称ChoiSTAR、25都道府県（令和8年5月末時点）はメモのとおりです。","evidence":["※米に限る"],"source":{"memo_id":"07-13","page":13,"print_page":119,"title":"農産物の環境負荷低減の見える化（みえるらべる）"}},{"id":"07-14-b1","memo_id":"07-14","genre_id":"07","level":"beginner","question":"一口メモで説明されている「J－クレジット制度」の内容として正しいものはどれか。","choices":["GHGの排出削減・吸収量を国が認証し、取引可能とする制度","GHGの排出量に応じて農業者から国が税を徴収する制度","GHGの排出削減に取り組む農業者へ国が交付金を支払う制度","GHGの排出量の上限を国が農業者ごとに割り当てる制度"],"answer":0,"explanation":"メモではJ－クレジット制度を、GHGの排出削減・吸収量を国が認証し、取引可能とする制度と説明している。課税・交付金・排出枠の割当といった仕組みはメモに書かれていない。","evidence":["温室効果ガス（GHG）の排出削減・吸収量を国が認証し、取引可能とする制度"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-14-b2","memo_id":"07-14","genre_id":"07","level":"beginner","question":"「水稲栽培における中干し期間の延長」の取組は、何都道府県の水田で行われたか。","choices":["40都道府県","47都道府県","30都道府県","20都道府県"],"answer":0,"explanation":"中干し期間の延長は40都道府県の水田（約83,100ha）で取組が行われたとされている。全都道府県の47ではない。","evidence":["40都道府県の水田（約83,100ha）において取組が行われた"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-14-i1","memo_id":"07-14","genre_id":"07","level":"intermediate","question":"令和8年3月時点のJ－クレジット制度で、農業分野の58件のうち、農業分野の方法論に基づく取組は何件か。","choices":["48件","10件","38件","20件"],"answer":0,"explanation":"58件のうち48件が農業分野の方法論に基づく取組である。10件は省エネ・再エネ方法論による取組の件数なので誤り。","evidence":["うち、10件が省エネ・再エネ方法論による取組、48件が農業分野の方法論に基づく取組"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-14-i2","memo_id":"07-14","genre_id":"07","level":"intermediate","question":"令和8年3月時点の農業者が取り組むプロジェクトのクレジット認証量（累計）で、2番目に多い方法論はどれか。","choices":["省エネ・再エネ","家畜排せつ物管理方法の変更","バイオ炭の農地施用","アミノ酸バランス改善飼料の給餌"],"answer":0,"explanation":"認証量は中干し期間の延長（544,712t-CO2）が最多で、次が省エネ・再エネの65,747t-CO2である。家畜排せつ物管理方法の変更は6,898t-CO2、バイオ炭の農地施用は2,233t-CO2にとどまる。","evidence":["65,747t-CO2","6,898t-CO2","2,233t-CO2"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-14-a1","memo_id":"07-14","genre_id":"07","level":"advanced","question":"令和8年3月時点の農業者が取り組むプロジェクトのクレジット認証量（累計）の合計のうち、「水稲栽培における中干し期間の延長」が占める割合に最も近いものはどれか。","choices":["約9割","約7割","約5割","約3割"],"answer":0,"explanation":"中干し期間の延長は544,712t-CO2で、合計619,890t-CO2に対して約88%、つまり約9割を占める。約7割以下では中干し分を大きく過小に見積もることになる。","evidence":["544,712t-CO2","619,890t-CO2"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-14-a2","memo_id":"07-14","genre_id":"07","level":"advanced","question":"令和8年3月時点の農業者が取り組むプロジェクトのクレジット認証量（累計）について、誤っているものはどれか。","choices":["家畜排せつ物管理方法の変更は68,980t-CO2","バイオ炭の農地施用は2,233t-CO2","アミノ酸バランス改善飼料の給餌は291t-CO2","認証量の合計は619,890t-CO2"],"answer":0,"explanation":"家畜排せつ物管理方法の変更の認証量は6,898t-CO2であり、68,980t-CO2は桁を変えたひっかけである。バイオ炭2,233t-CO2、アミノ酸飼料291t-CO2、合計619,890t-CO2は表のとおり正しい。","evidence":["6,898t-CO2"],"source":{"memo_id":"07-14","page":14,"print_page":120,"title":"J－クレジット制度と中干し期間の延長"}},{"id":"07-15-b1","memo_id":"07-15","genre_id":"07","level":"beginner","question":"二国間クレジット制度（JCM）の農業分野で、方法論が承認済みとされているものはどれか。","choices":["フィリピンにおける間断かんがい技術","フィリピンにおけるバイオ炭の施用","ベトナムにおける間断かんがい技術","ベトナムにおける飼料の改善技術"],"answer":0,"explanation":"メモには、農業分野ではフィリピンにおける間断かんがい技術（AWD）の方法論が承認済みと書かれています。バイオ炭や飼料の改善は展開可能な技術として挙げられているだけで、方法論の承認は書かれていません。","evidence":["農業分野では、フィリピンにおける間断かんがい技術（AWD）の方法論が承認済み。"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-15-b2","memo_id":"07-15","genre_id":"07","level":"beginner","question":"「ミドリ・インフィニティ」のもとで、我が国企業と国内外のパートナーとのマッチング等を進める場の名称はどれか。","choices":["みどり脱炭素海外展開コンソーシアム","みどり食料システム海外推進協議会","農林水産脱炭素国際連携フォーラム","二国間クレジット農業推進委員会"],"answer":0,"explanation":"マッチング等を推進する場は「みどり脱炭素海外展開コンソーシアム」です。ほかの名称はメモに出てこない組織名です。","evidence":["「みどり脱炭素海外展開コンソーシアム」の場で、我が国企業と国内外のパートナーとのマッチング等を推進。"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-15-i1","memo_id":"07-15","genre_id":"07","level":"intermediate","question":"令和8年5月25日現在、みどり脱炭素海外展開コンソーシアムに参画している構成員の数はどれか。","choices":["30","100","130","631"],"answer":2,"explanation":"研究機関、スタートアップ、金融機関等、130の構成員が参画しています（令和8年5月25日現在）。631はグラフの気候変動資金の数値（631.7、10億ドル）に近い数で、構成員数ではありません。","evidence":["研究機関、スタートアップ、金融機関等、130の構成員が"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-15-i2","memo_id":"07-15","genre_id":"07","level":"intermediate","question":"海外に展開可能なGHG排出削減に資する主な技術・取組の図で、「GHG排出削減を支える基盤」に分類されているものはどれか。","choices":["バイオ炭","測定・報告・検証（MRV）","アミノ酸バランス改善飼料等","生物的硝化抑制（BNI）技術"],"answer":1,"explanation":"図では、測定・報告・検証（MRV）がスマート農業技術の活用などとともに「GHG排出削減を支える基盤」に入っています。バイオ炭、アミノ酸バランス改善飼料等、BNI技術は「GHG排出削減技術・取組」の側に分類されています。","evidence":["GHG排出削減を支える基盤","測定・報告・検証(MRV)"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-15-a1","memo_id":"07-15","genre_id":"07","level":"advanced","question":"農林水産分野のGHG削減技術の海外展開とJCMの時期について、誤っているものはどれか。","choices":["MIDORI∞INFINITYは令和7年5月に公表された","コンソーシアムは令和7年6月に設立された","AWDのJCM方法論は令和7年2月に承認された","AWDのクレジットは令和8年6月までに発行済み"],"answer":3,"explanation":"クレジットは、令和8年6月現在、発行に向けてフィリピン側と調整中とされており、発行済みではありません。公表・設立・承認の時期はいずれもメモの記載どおりです。","evidence":["・クレジット発行に向けてフィリピン側と調整中"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-15-a2","memo_id":"07-15","genre_id":"07","level":"advanced","question":"世界のGHG排出量に占める農林業分野の割合と、気候変動資金のうち農業分野に向けられる割合の組合せとして正しいものはどれか。","choices":["排出量19%・資金4.3%","排出量4.3%・資金19%","排出量11%・資金4.3%","排出量19%・資金8%"],"answer":0,"explanation":"農林業分野は世界のGHG排出量の19%を占める一方、気候変動資金のうち農業分野に向けられるのは4.3%に留まります。11%（農業）と8%（土地利用、土地利用変化及び林業）は、19%の内訳です。","evidence":["19% を占める主要な排出源。","農業分野に向けられるのは4.3% に留まり、"],"source":{"memo_id":"07-15","page":15,"print_page":121,"title":"農林水産分野GHG削減技術の海外展開とJCM"}},{"id":"07-16-b1","memo_id":"07-16","genre_id":"07","level":"beginner","question":"日本学術会議による農業、森林、水産業・漁村の多面的機能の貨幣評価は、どのような機能を中心に行われたか。","choices":["定量化が可能な物理的な機能","地域の文化や伝統に関する機能","景観や快適環境に関する機能","生物多様性の保全に関する機能"],"answer":0,"explanation":"要点に「定量化が可能な物理的な機能を中心に貨幣評価を実施」とあります。文化・景観・生物多様性に関する機能は図中に名称はあるものの評価額が示されておらず、評価の中心ではありません。","evidence":["定量化が可能な物理的な機能を中心に貨幣評価を実施。"],"source":{"memo_id":"07-16","page":16,"print_page":122,"title":"農業・森林・水産業の多面的機能の貨幣評価"}},{"id":"07-16-i1","memo_id":"07-16","genre_id":"07","level":"intermediate","question":"図中で評価額（億円／年）が示された機能のうち、最も評価額が大きいものはどれか。","choices":["水源涵養機能","土砂災害防止機能／土壌保全機能","海域環境の保全機能","洪水防止機能"],"answer":1,"explanation":"土砂災害防止機能／土壌保全機能は36兆6,986億円で最大です。水源涵養機能は29兆8,454億円で2番目、海域環境の保全機能は6兆3,347億円、洪水防止機能は3兆4,988億円です。","evidence":["土砂災害防止機能／土壌保全機能\n36兆6,986億円","水源涵養機能\n29兆8,454億円"],"source":{"memo_id":"07-16","page":16,"print_page":122,"title":"農業・森林・水産業の多面的機能の貨幣評価"}},{"id":"07-16-i2","memo_id":"07-16","genre_id":"07","level":"intermediate","question":"図中の洪水防止機能の評価額（年あたり）はいくらか。","choices":["3兆4,988億円","3兆4,898億円","4兆3,988億円","1兆4,988億円"],"answer":0,"explanation":"図では洪水防止機能は3兆4,988億円と示されています。ほかの選択肢は数字の並びや兆の位を変えたもので、図の値とは一致しません。","evidence":["洪水防止機能\n3兆4,988億円"],"source":{"memo_id":"07-16","page":16,"print_page":122,"title":"農業・森林・水産業の多面的機能の貨幣評価"}},{"id":"07-16-a1","memo_id":"07-16","genre_id":"07","level":"advanced","question":"図中の多面的機能の評価額（億円／年）について、誤っているものはどれか。","choices":["水源涵養機能は29兆8,454億円","海域環境の保全機能は6兆3,347億円","気候緩和機能は537億円","地球環境保全機能は1兆4,652億円"],"answer":2,"explanation":"気候緩和機能は87億円で、537億円は地下水涵養機能の評価額です。ほかの3つは図の値どおりです。","evidence":["気候緩和機能\n87億円","地下水涵養機能\n537億円"],"source":{"memo_id":"07-16","page":16,"print_page":122,"title":"農業・森林・水産業の多面的機能の貨幣評価"}},{"id":"07-16-a2","memo_id":"07-16","genre_id":"07","level":"advanced","question":"図中の保健・レクリエーション機能の評価額（年あたり）について、農業の値は森林の値より何億円大きいか。","choices":["1,212億円","1,112億円","2,212億円","1,312億円"],"answer":0,"explanation":"農業2兆3,758億円から森林2兆2,546億円を引くと1,212億円です。1,112億円や1,312億円は百の位、2,212億円は千の位の計算を誤った値です。","evidence":["保健・レクリエーション機能\n農業2兆3,758億円\n森林2兆2,546億円"],"source":{"memo_id":"07-16","page":16,"print_page":122,"title":"農業・森林・水産業の多面的機能の貨幣評価"}},{"id":"07-17-b1","memo_id":"07-17","genre_id":"07","level":"beginner","question":"一口メモによると、集落の総戸数が何戸を下回ると、農地の保全等を含む集落活動の実施率が急激に低下するか。","choices":["5戸","10戸","20戸","50戸"],"answer":1,"explanation":"メモでは、集落の総戸数が10戸を下回ると集落活動の実施率が急激に低下するとしています。5戸・20戸・50戸という境目は書かれていません。","evidence":["集落の総戸数が10戸を下回ると、農地の保全等を含む集落活動の実施率は急激に低下する。"],"source":{"memo_id":"07-17","page":17,"print_page":123,"title":"農業集落の戸数減少と集落活動・混住化"}},{"id":"07-17-b2","memo_id":"07-17","genre_id":"07","level":"beginner","question":"一口メモによると、農業集落に占める農家の割合が低下するなかで、大きく進展しているとされるものはどれか。","choices":["混住化","法人化","集約化","大規模化"],"answer":0,"explanation":"メモでは、農家の割合の低下とともに混住化が大きく進展しているとしています。法人化・集約化・大規模化は、このページでは触れていません。","evidence":["農業集落に占める農家の割合は低下してきており、混住化が大きく進展。"],"source":{"memo_id":"07-17","page":17,"print_page":123,"title":"農業集落の戸数減少と集落活動・混住化"}},{"id":"07-17-a1","memo_id":"07-17","genre_id":"07","level":"advanced","question":"総戸数が9戸以下の農業集落の割合について、2000年から2020年にかけての増加幅（ポイント）が最も大きい地域類型はどれか。","choices":["都市的地域","平地農業地域","中間農業地域","山間農業地域"],"answer":3,"explanation":"山間農業地域は8.8％から19.9％へ11.1ポイント増え、増加幅が最も大きくなっています。中間農業地域は3.5ポイント、平地農業地域は0.5ポイント、都市的地域は0.6ポイントの増加にとどまります。","evidence":["総戸数が９戸以下の農業集落の割合","いずれの地域類型においても9戸以下の農業集落"],"source":{"memo_id":"07-17","page":17,"print_page":123,"title":"農業集落の戸数減少と集落活動・混住化"}},{"id":"07-17-a2","memo_id":"07-17","genre_id":"07","level":"advanced","question":"一口メモの農業集落と集落活動についての記述として、誤っているものはどれか。","choices":["9戸以下の農業集落の割合には、無人化集落も含まれている","9戸以下集落の割合は、今後は都市的地域を中心に増加が予測","集落活動の実施率は、今後の人口動態を踏まえると更に低下する","集落活動の低下で、多面的機能の発揮に支障が生じるおそれがある"],"answer":1,"explanation":"メモでは、9戸以下の農業集落の割合は中山間地域を中心に今後も増加すると予測されており、都市的地域が中心ではありません。ほかの3つは、無人化集落を含むこと、実施率がさらに低下すること、多面的機能に支障が出るおそれについての記述と一致します。","evidence":["特に中山間地域"],"source":{"memo_id":"07-17","page":17,"print_page":123,"title":"農業集落の戸数減少と集落活動・混住化"}},{"id":"07-18-b1","memo_id":"07-18","genre_id":"07","level":"beginner","question":"日本型直接支払は、「農業の有する多面的機能の発揮の促進に関する法律」に基づき、いつから実施されていますか。","choices":["平成27年度から","平成22年度から","平成30年度から","令和2年度から"],"answer":0,"explanation":"メモの要点に「平成27年度から」同法に基づき実施と書かれています。ほかの年度はメモに記載がなく、誤りです。","evidence":["的機能（国土保全、水源涵養、景観形成等）の発揮に支障が生じつつあることから、平成27年度から「農業の有する多"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"07-18-b2","memo_id":"07-18","genre_id":"07","level":"beginner","question":"メモの要点で、多面的機能の発揮に支障が生じつつある原因として挙げられているものはどれですか。","choices":["農村地域の高齢化、人口減少等","農産物の輸入の急な増加","肥料や燃油の価格の高騰","大規模な自然災害の多発"],"answer":0,"explanation":"要点には「近年の農村地域の高齢化、人口減少等により」と書かれています。輸入増加・資材高騰・災害は原因として挙げられていません。","evidence":["○ 近年の農村地域の高齢化、人口減少等により、地域の共同活動等によって支えられ国民全体が享受している多面"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"07-18-i1","memo_id":"07-18","genre_id":"07","level":"intermediate","question":"中山間地域等直接支払で、田の急傾斜（1/20～）の交付単価（円/10a）はいくらですか。","choices":["21,000円","8,000円","11,500円","10,500円"],"answer":0,"explanation":"表で田の急傾斜（1/20～）は21,000円/10aです。8,000円は田の緩傾斜、11,500円は畑の急傾斜、10,500円は草地の急傾斜の単価です。","evidence":["急傾斜（1/20～）","中山間地域等直接支払"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"07-18-i2","memo_id":"07-18","genre_id":"07","level":"intermediate","question":"環境保全型農業直接支払の取組拡大加算の交付単価は、有機農業の新規取組面積あたりいくらですか（円/10a）。","choices":["4,000円","2,000円","3,000円","5,000円"],"answer":0,"explanation":"取組拡大加算は有機農業の新規取組面積あたり4,000円/10aです。2,000円は炭素貯留効果の高い有機農業の加算、5,000円は緑肥の施用や炭の投入の単価です。","evidence":["有機農業の新規取組面積あたり"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"07-18-a1","memo_id":"07-18","genre_id":"07","level":"advanced","question":"環境保全型農業直接支払で、そば等雑穀、飼料作物以外の作物について、炭素貯留効果の高い有機農業を実施する場合の交付単価（加算込み、円/10a）はいくらですか。","choices":["16,000円","14,000円","17,000円","12,000円"],"answer":0,"explanation":"有機農業（そば等雑穀、飼料作物以外）は14,000円で、炭素貯留効果の高い有機農業の場合に限り2,000円が加算されるため16,000円です。14,000円は加算前、17,000円や12,000円は誤った計算です。","evidence":["そば等雑穀、飼料作物以外 14,000","このうち、炭素貯留効果の高い有機農業を","実施する場合に限り、2,000円を加算"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"07-18-a2","memo_id":"07-18","genre_id":"07","level":"advanced","question":"日本型直接支払の各制度の説明として、メモの内容と誤っているものはどれですか。","choices":["環境保全型は環境保全に資する生産方式の追加的コストを支援","中山間地域等直接支払は農業生産条件の不利を補正して支援","資源向上支払は地域資源の質的向上を図る共同活動を支援","地域特認取組の交付単価は全国一律に定められている"],"answer":3,"explanation":"地域特認取組は「取組内容や交付単価は、都道府県により異なる」とされており、全国一律ではありません。ほかの3つはメモの各制度の説明と一致します。","evidence":["取組内容や交付単価は、","都道府県により異なる。"],"source":{"memo_id":"07-18","page":18,"print_page":124,"title":"日本型直接支払の仕組みと交付単価"}},{"id":"08-01-b1","memo_id":"08-01","genre_id":"08","level":"beginner","question":"このメモで、地銀等の中間支援組織を介して行うとされている取組はどれか。","choices":["案件形成拠点の創設と課題解決モデルの選定","官民共創の関係者が集まる場の創設","学生の参画動機に関する座談会の開催","国による証明書の発行と伴走支援"],"answer":0,"explanation":"要点に「地銀等の中間支援組織を介した案件形成拠点の創設と課題解決モデルの選定」とある。場の創設、学生の参画促進、証明書制度は別の柱として挙げられており、中間支援組織を介した取組ではない。","evidence":["地銀\n等の中間支援組織を介した案件形成拠点の創設と課題解決モデルの選定"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-01-b2","memo_id":"08-01","genre_id":"08","level":"beginner","question":"このメモで、人口急減地域である農山漁村に企業等の活力を取り込みつつ行う必要があるとされている取組はどれか。","choices":["地域の実情に応じたオーダーメイドの取組","全国一律の基準による画一的な取組","国が主体となる直轄型の取組","自治体単独で完結する取組"],"answer":0,"explanation":"要点に「地域の実情に応じたオーダーメイドの取組を行っていく必要」とある。全国一律・国直轄・自治体単独といった記述はメモにない。","evidence":["地域の実情に応じたオーダーメイドの取組"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-01-i1","memo_id":"08-01","genre_id":"08","level":"intermediate","question":"令和8年3月末時点で、「農山漁村」経済・生活環境創生プラットフォームに参加している企業の数はどれか。","choices":["約575企業","約650企業","約50企業","約300企業"],"answer":0,"explanation":"令和8年3月末時点で約575企業である。約650は自治体を含めた団体数で、企業の数ではない。","evidence":["令和８年３月末時点：約575企業、自治体含め約650団"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-01-i2","memo_id":"08-01","genre_id":"08","level":"intermediate","question":"R7年度に国が発行した取組証明書の取得企業等数はどれか。","choices":["50","10","575","650"],"answer":0,"explanation":"R7年度の取組証明書の取得企業等数は50である。10はR7年度に地域金融機関による支援を実施した地域数、575・650はプラットフォームの参加数である。","evidence":["＜R7年度取得企業等＞（取得企業等数：50）"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-01-a1","memo_id":"08-01","genre_id":"08","level":"advanced","question":"令和7年から令和8年に開かれた「農山漁村」経済・生活環境創生プラットフォームのシンポジウムについて、誤っているものはどれか。","choices":["第1回のオンライン参加は900名超","第2回の会場参加は250名超","第3回は令和8年3月13日に開催","第3回のオンライン参加は800名超"],"answer":3,"explanation":"第3回のオンライン参加は700名超であり、800名超は第2回のオンライン参加の数値である。ほかの3つはメモの記載どおり正しい。","evidence":["第３回（令和８年３月13日） 会場参加300名超、オンライン参加700名超"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-01-a2","memo_id":"08-01","genre_id":"08","level":"advanced","question":"地域金融機関による中間支援組織の支援について、R7年度の実施地域数とR8年度の実施予定地域数の組み合わせとして正しいものはどれか。","choices":["R7年度10地域、R8年度40~50地域","R7年度40~50地域、R8年度10地域","R7年度10地域、R8年度20~30地域","R7年度50地域、R8年度40~50地域"],"answer":0,"explanation":"R7年度は全国10地域で実施、R8年度は全国40~50地域で実施予定とある。50はR7年度の取組証明書の取得企業等数であり、地域数ではない。","evidence":["R7年度 : 全国10地域にて実施","R8年度 : 全国40~50地域で実施予定"],"source":{"memo_id":"08-01","page":1,"print_page":125,"title":"農山漁村への企業等の活力の取り込み"}},{"id":"08-02-b1","memo_id":"08-02","genre_id":"08","level":"beginner","question":"「食料・農業・農村基本計画（令和7年4月11日閣議決定）」で設定された、令和11年度までの農泊地域での年間延べ宿泊者数のKPIはどれか。","choices":["794万人泊","868万人泊","1,200万人泊","2,200万人泊"],"answer":2,"explanation":"KPIは、令和11年度までに農泊地域での年間延べ宿泊者数を1,200万人泊とすることです。794万人泊と868万人泊は、R5年度とR6年度の実績です。2,200は売上額のKPI（億円）の数字です。","evidence":["令和11年度までに「農泊地域での年間延べ宿泊者数を1,200万人泊」"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-02-b2","memo_id":"08-02","genre_id":"08","level":"beginner","question":"「観光立国推進基本計画（令和8年3月27日閣議決定）」で、農泊地域について推進すると位置づけられた取組はどれか。","choices":["子どもの探求的な学びの提供や企業研修の受入等","大規模な観光ホテルの新設による宿泊客の大量受入","海外の農場への日本人旅行者の派遣と交流の推進","外国人材の受入による農業生産の拡大と効率化"],"answer":0,"explanation":"この計画では、子どもの農山漁村体験における探求的な学びの提供や企業研修の受入等を推進するとしています。その目的は、地方への人の流れや、多様な人材が農山漁村に関わる機会をつくることです。ほかの3つの選択肢は、メモに記載がありません。","evidence":["○「観光立国推進基本計画（令和８年３月27日閣議決定）」においては、農泊地域における子どもの農山漁村体験","における探求的な学びの提供や企業研修の受入等の推進を通じ、地方への人の流れや多様な人材が農山漁"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-02-i1","memo_id":"08-02","genre_id":"08","level":"intermediate","question":"農山漁村振興交付金の支援に採択された農泊地域の、R6年度の延べ宿泊者数はどれか。","choices":["794万人泊","868万人泊","1,200万人泊","1,598万人泊"],"answer":1,"explanation":"R6年度の延べ宿泊者数は868万人泊で、R5年度の794万人泊から増えました。1,200万人泊は令和11年度までのKPIです。1,598はR6年度の売上額（億円）の数字です。","evidence":["（R５年度） から868万人泊 （R６年度）に増加。"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-02-i2","memo_id":"08-02","genre_id":"08","level":"intermediate","question":"SAKU酒蔵アグリツーリズム推進協議会（長野県佐久市）が、英語で案内するツアーを設定して達成した、R5年度のインバウンド率はどれか。","choices":["14％","25％","40％","90％"],"answer":2,"explanation":"英語で案内するツアーを設定し、R5年度に40％のインバウンド率を達成しました。14はツアー料金（2泊3日14万円/人）の数字です。9はもう一つのプランの料金（9万円/人）の数字なので、90％も誤りです。","evidence":["を設定し、R５年度は40％のインバウンド率を達成"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-02-a1","memo_id":"08-02","genre_id":"08","level":"advanced","question":"農泊地域の宿泊等の売上額について、R6年度の実績と、令和11年度までのKPIとの差はどれか。","choices":["375億円","602億円","977億円","1,000億円"],"answer":1,"explanation":"KPIは2,200億円、R6年度の実績は1,598億円なので、差は602億円です。375億円は、R5年度からR6年度への増加額（1,598－1,223）です。977億円は、R5年度の実績とKPIの差です。","evidence":["上額を2,200億円」とするKPIが設定された。","額は、1,223億円（R５年度）から1,598億円（R６年度）に増加。"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-02-a2","memo_id":"08-02","genre_id":"08","level":"advanced","question":"農泊の推進とSAKU酒蔵アグリツーリズム推進協議会の取組について、誤っているものはどれか。","choices":["企業・大学と農泊地域との連携事例集の作成を支援している","食料・農業・農村基本計画は令和7年4月11日に閣議決定された","SAKUの英語で案内するツアーは2泊3日9万円/人である","SAKUは泊食分離とし、地域の飲食店にも裨益している"],"answer":2,"explanation":"英語で案内するツアーは、2泊3日14万円/人です。9万円/人は、2.5畳の部屋で2泊3日を過ごす蔵人体験の料金です。ほかの3つは、メモの記載どおりです。","evidence":["英語で案内するツアー （２泊３日14万円/人）","（2.5畳の部屋で２泊３日９万円/人を実現）"],"source":{"memo_id":"08-02","page":2,"print_page":126,"title":"農泊の推進と農泊地域の現状"}},{"id":"08-03-b1","memo_id":"08-03","genre_id":"08","level":"beginner","question":"農福連携等推進ビジョン（2024改訂版）に基づき連携して施策を推進している省庁に含まれないものはどれか。","choices":["法務省","文部科学省","厚生労働省","国土交通省"],"answer":3,"explanation":"連携しているのは法務省、文部科学省、厚生労働省、農林水産省の4省庁です。国土交通省はこの中に含まれていません。","evidence":["法務省、文部科学省、厚生労働省、農林水産省が連携した施策を推進。"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-03-b2","memo_id":"08-03","genre_id":"08","level":"beginner","question":"農福連携等推進ビジョン（2024改訂版）が目指しているものはどれか。","choices":["農福連携等を通じた地域共生社会の実現","担い手確保による食料自給率の向上","障害者雇用率の法定水準の全国達成","農村における観光交流人口の拡大"],"answer":0,"explanation":"ビジョンは「農福連携等を通じた地域共生社会の実現」を目指しています。自給率向上や観光交流人口の拡大などはこのページの目標として書かれていません。","evidence":["「農福連携等を通じた地域共生社会の実現」を目指して"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-03-i1","memo_id":"08-03","genre_id":"08","level":"intermediate","question":"グラフ「農福連携等の取組主体数の推移」で、始点とされる2019年度の取組主体数はどれか。","choices":["4,117件","4,571件","5,509件","3,000件"],"answer":0,"explanation":"2019年度の取組主体数は4,117件で、グラフでは（始点）と示されています。4,571件は2020年度、5,509件は2021年度の値です。","evidence":["農福連携等の取組主体数の推移"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-03-i2","memo_id":"08-03","genre_id":"08","level":"intermediate","question":"元年度ビジョンで掲げられた、農福連携に取り組む主体数の目標はどれか。","choices":["5年間で＋3,000件","5年間で＋5,000件","2030年度末で12,000件","2024年度末で8,277件"],"answer":0,"explanation":"元年度ビジョンの目標は、主体数を5年間で＋3,000件とするものでした。12,000件（2030年度末）は2024改訂版ビジョンの目標です。","evidence":["元年度ビジョンの目標","＋3000件（５年間）"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-03-a1","memo_id":"08-03","genre_id":"08","level":"advanced","question":"2030年度末の目標（12,000件）に対し、グラフに示された2025年度の取組主体数との差はおよそ何件か。","choices":["3,051件","3,723件","2,949件","4,821件"],"answer":0,"explanation":"2025年度の取組主体数は8,949件で、12,000件との差は3,051件です。3,723件は2024年度の8,277件との差、4,821件は2023年度の7,179件との差です。","evidence":["12,000件（2030年度末）","農福連携等の取組主体数の推移"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-03-a2","memo_id":"08-03","genre_id":"08","level":"advanced","question":"農福連携等推進ビジョン（2024改訂版）の概要に示された取組として、誤っているものはどれか。","choices":["ユニバーサル農園の拡大","林福・水福連携の推進","6月5日のノウフクの日等による国民的運動","特別支援学校の実習要望への農業者の協力"],"answer":2,"explanation":"ノウフクの日は11月29日で、6月5日はビジョンが決定された日です。ユニバーサル農園の拡大、林福・水福連携の推進、特別支援学校への協力・支援はいずれも概要に記載されています。","evidence":["ノウフクの日（11月29日）等による企業・消費者も","（令和６年６月５日農福連携等推進会議決定）"],"source":{"memo_id":"08-03","page":3,"print_page":127,"title":"農福連携の推進とビジョン2024改訂版"}},{"id":"08-04-b1","memo_id":"08-04","genre_id":"08","level":"beginner","question":"中山間地域は、我が国の農家数や耕地面積、農業産出額のおよそどれだけを占めるとされているか。","choices":["約1割","約2割","約4割","約6割"],"answer":2,"explanation":"要点に、中山間地域は農家数や耕地面積、農業産出額の約4割を占めると書かれています。約1割は人口の割合（10.6%）に近い数字で、農家数などの割合ではありません。","evidence":["中山間地域は、我が国の農家数や耕地面積、農業産出額の約４割を占める"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-04-b2","memo_id":"08-04","genre_id":"08","level":"beginner","question":"中山間地域等の振興に向けて一体的に実施する施策のうち、農村に「関わる」人を増やす施策では、何を拡大するとされているか。","choices":["関係人口","定住人口","就業人口","生産年齢人口"],"answer":0,"explanation":"要点では、農村に「関わる」関係人口を拡大するための施策と書かれています。定住人口や就業人口の拡大とは書かれていません。","evidence":["農村に「関わる」関係人口を\n拡大するための施策"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-04-i1","memo_id":"08-04","genre_id":"08","level":"intermediate","question":"令和2年の中山間地域の林野面積は、全国の林野面積の何%を占めるか。","choices":["38.1%","54.1%","63.8%","74.5%"],"answer":3,"explanation":"表では林野面積の割合（B/A）は74.5%です。63.8%は総土地面積、54.1%は農業集落数、38.1%は耕地面積の割合です。","evidence":["2,477万ha\n\n1,845万ha\n\n74.5%"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-04-i2","memo_id":"08-04","genre_id":"08","level":"intermediate","question":"令和2年の中山間地域の主要指標のうち、全国に占める割合（B/A）が最も低い項目はどれか。","choices":["人口","第1次産業就業者数","耕地面積","農業産出額"],"answer":0,"explanation":"人口の割合は10.6%で、表の項目の中で最も低い値です。第1次産業就業者数は37.8%、耕地面積は38.1%、農業産出額は40.0%で、いずれも人口より高くなっています。","evidence":["1億2,615万人\n\n1,336万人\n\n10.6%","196万人\n\n74万人\n\n37.8%","8兆9,557億円\n\n3兆5,856億円\n\n40.0%"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-04-a1","memo_id":"08-04","genre_id":"08","level":"advanced","question":"中山間地域支援施策の取組と、それが位置付けられている施策の区分の組合せとして、誤っているものはどれか。","choices":["直接支払制度による共同活動支援は「支える」施策","農村RMOの形成の推進は「稼ぐ」施策","高収益作物の導入や有機農業の支援は「稼ぐ」施策","棚田や農業遺産の地域活動参加促進は「関わる」施策"],"answer":1,"explanation":"農村RMO（農村型地域運営組織）の形成推進は、「稼ぐ」ではなく農業を「支える」施策の（2）に位置付けられています。ほかの3つは、それぞれ「支える」「稼ぐ」「関わる」の区分に正しく対応しています。","evidence":["（２）農地保全や農業に関する経済活動と併せて生活支援を行う農村","ＲＭＯ（農村型地域運営組織）の形成を推進"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-04-a2","memo_id":"08-04","genre_id":"08","level":"advanced","question":"令和2年の中山間地域の販売農家数は、全国の販売農家数の何%を占めるか。","choices":["40.0%","42.6%","44.7%","54.1%"],"answer":1,"explanation":"販売農家数は全国103万戸のうち中山間地域が44万戸で、割合は42.6%です。44.7%は総農家数、40.0%は農業産出額、54.1%は農業集落数の割合であり、販売農家数の値ではありません。","evidence":["103万戸\n\n44万戸\n\n42.6%"],"source":{"memo_id":"08-04","page":4,"print_page":128,"title":"中山間地域の主要指標と支援施策"}},{"id":"08-05-b1","memo_id":"08-05","genre_id":"08","level":"beginner","question":"鳥獣被害対策の3本柱のうち、「よせつけない」に当たる対策はどれですか。","choices":["個体群管理","侵入防止対策","生息環境管理","捕獲頭数管理"],"answer":2,"explanation":"メモでは、「よせつけない」は生息環境管理とされています。個体群管理は「とる」、侵入防止対策は「まもる」に当たります。捕獲頭数管理は3本柱に含まれていません。","evidence":["鳥獣被害対策は、個体群管理（とる）、侵入防止対策（まもる）、生息環境管理（よせつけな"],"source":{"memo_id":"08-05","page":5,"print_page":129,"title":"野生鳥獣による農作物被害と対策"}},{"id":"08-05-b2","memo_id":"08-05","genre_id":"08","level":"beginner","question":"令和6年度の、全国の野生鳥獣による農作物被害額はいくらですか。","choices":["164億円","188億円","239億円","158億円"],"answer":1,"explanation":"令和6年度の被害額は188億円です。164億円は令和5年度、239億円は平成22年度の額です。158億円は平成30年度と令和元年度の額です。","evidence":["野生鳥獣による農作物被害額は、188億円（令和６年度）"],"source":{"memo_id":"08-05","page":5,"print_page":129,"title":"野生鳥獣による農作物被害と対策"}},{"id":"08-05-i1","memo_id":"08-05","genre_id":"08","level":"intermediate","question":"平成27年度から令和6年度までのうち、イノシシの捕獲頭数が最も多かった年度はどれですか。","choices":["平成28年度","令和元年度","令和2年度","令和6年度"],"answer":2,"explanation":"イノシシの捕獲頭数は、令和2年度の68万頭が期間中で最も多い値です。平成28年度は62万頭、令和元年度と令和6年度はいずれも64万頭で、令和2年度より少なくなっています。","evidence":["○ シカ・イノシシの捕獲頭数の推移","イノシシ 55 62 55 60 64 68 53 59 52 64"],"source":{"memo_id":"08-05","page":5,"print_page":129,"title":"野生鳥獣による農作物被害と対策"}},{"id":"08-05-i2","memo_id":"08-05","genre_id":"08","level":"intermediate","question":"令和6年度の農作物被害額のうち、シカによる被害額はいくらですか。","choices":["45億円","79億円","20億円","18億円"],"answer":1,"explanation":"令和6年度の獣種別の内訳で、シカは79億円と最も大きくなっています。45億円はイノシシ、20億円はその他獣類、18億円はその他鳥類による被害額です。","evidence":["○ 野生鳥獣による農作物被害額の推移","野生鳥獣による農作物被害額は、188億円（令和６年度）"],"source":{"memo_id":"08-05","page":5,"print_page":129,"title":"野生鳥獣による農作物被害と対策"}},{"id":"08-05-a2","memo_id":"08-05","genre_id":"08","level":"advanced","question":"全国の野生鳥獣による農作物被害額は、平成22年度（239億円）から令和6年度までにいくら減りましたか。","choices":["24億円","42億円","51億円","65億円"],"answer":2,"explanation":"令和6年度の被害額は188億円なので、239億円から188億円を引いて51億円の減少です。24億円は令和5年度（164億円）から令和6年度への増加額です。42億円は平成24年度（230億円）との差です。","evidence":["○ 野生鳥獣による農作物被害額の推移","野生鳥獣による農作物被害額は、188億円（令和６年度）"],"source":{"memo_id":"08-05","page":5,"print_page":129,"title":"野生鳥獣による農作物被害と対策"}},{"id":"08-06-b1","memo_id":"08-06","genre_id":"08","level":"beginner","question":"令和7年4月に閣議決定された「食料・農業・農村基本計画」で、令和11年度のKPIとして掲げられた全国のジビエ利用量はどれか。","choices":["2,000トン","2,678トン","4,000トン","5,000トン"],"answer":2,"explanation":"基本計画では令和11年度のKPIとしてジビエ利用量4,000トンを掲げています。2,678トンは令和6年度の実績であり、目標値ではありません。","evidence":["令和11年度のKPIとして、ジ","ビエ利用量4,000トンを掲げている。"],"source":{"memo_id":"08-06","page":6,"print_page":130,"title":"ジビエ利用の実態と利用量の推移"}},{"id":"08-06-b2","memo_id":"08-06","genre_id":"08","level":"beginner","question":"令和11年度のジビエ利用量の目標達成に向けて、国はどの範囲で対策を重点的に講じているとされているか。","choices":["捕獲段階に限った対策","捕獲から消費までの各段階","消費段階に限った対策","加工から輸出までの段階"],"answer":1,"explanation":"要点では、ジビエ利用の取組を全国に広げるため捕獲から消費までの各段階での対策を重点的に講じているとしています。特定の段階だけに限った対策や輸出の段階とは書かれていません。","evidence":["くため、捕獲から消費までの各段階での対策を重点的に講じている。"],"source":{"memo_id":"08-06","page":6,"print_page":130,"title":"ジビエ利用の実態と利用量の推移"}},{"id":"08-06-i1","memo_id":"08-06","genre_id":"08","level":"intermediate","question":"令和6年度に全国の処理加工施設でジビエとして利用するために解体された野生鳥獣の数はどれか。","choices":["19,071頭・羽","109,716頭・羽","190,716頭・羽","1,907,160頭・羽"],"answer":2,"explanation":"令和6年度に解体された野生鳥獣は190,716頭・羽です。ほかの選択肢は桁や数字の並びが異なります。","evidence":["は190,716頭･羽であり、ジビエ利用量は2,678トン。"],"source":{"memo_id":"08-06","page":6,"print_page":130,"title":"ジビエ利用の実態と利用量の推移"}},{"id":"08-06-a1","memo_id":"08-06","genre_id":"08","level":"advanced","question":"令和11年度のKPIであるジビエ利用量と、令和6年度の全国のジビエ利用量の実績との差はどれか。","choices":["1,271トン","1,322トン","2,276トン","2,717トン"],"answer":1,"explanation":"目標4,000トンから令和6年度実績2,678トンを引くと1,322トンです。1,271トンは令和5年度の2,729トンとの差、2,276トンは令和6年度の食用1,724トンとの差で、いずれも問いに合いません。","evidence":["ビエ利用量4,000トンを掲げている。","は190,716頭･羽であり、ジビエ利用量は2,678トン。"],"source":{"memo_id":"08-06","page":6,"print_page":130,"title":"ジビエ利用の実態と利用量の推移"}},{"id":"08-06-a2","memo_id":"08-06","genre_id":"08","level":"advanced","question":"国産ジビエ認証制度と取組事例「奥三河高原ジビエの森」についての説明のうち、誤っているものはどれか。","choices":["認証の仕組みは平成30年5月に決定・公表された","令和8年5月末時点の認証施設数は33件である","奥三河高原ジビエの森は令和7年4月に創業した","奥三河高原ジビエの森は農林水産大臣賞を受賞した"],"answer":2,"explanation":"奥三河高原ジビエの森の創業は平成27年4月であり、令和7年4月ではありません。令和7年度は鳥獣被害対策優良活動表彰で農林水産大臣賞を受賞した年度です。","evidence":["原ジビエの森」を平成27年４月に創業。"],"source":{"memo_id":"08-06","page":6,"print_page":130,"title":"ジビエ利用の実態と利用量の推移"}},{"id":"08-07-b1","memo_id":"08-07","genre_id":"08","level":"beginner","question":"一口メモで、都市農業が果たしている多様な役割の一つとして挙げられているものはどれか。","choices":["防災空間の確保","農産物輸出の拡大","大規模な農地の集積","飼料の自給率の向上"],"answer":0,"explanation":"要点には、新鮮な農産物の供給、防災空間の確保、良好な景観の形成、国土・環境の保全、農業体験の場の提供等が役割として挙げられています。輸出の拡大、農地の集積、飼料の自給率の向上は、このページの役割には挙げられていません。","evidence":["都市農業は、新鮮な農産物の供給、防災空間の確保、良好な景観の形成、国土・環境の保全、農"],"source":{"memo_id":"08-07","page":7,"print_page":131,"title":"都市農業の役割と都市農地の貸借円滑化法"}},{"id":"08-07-b2","memo_id":"08-07","genre_id":"08","level":"beginner","question":"意欲ある都市農業者等が都市農地を借りやすくするために平成30年に制定された法律はどれか。","choices":["都市農地の貸借の円滑化に関する法律","都市農地の保全の推進に関する法律","都市農業の生産性の向上に関する法律","生産緑地の転用の円滑化に関する法律"],"answer":0,"explanation":"要点に、意欲ある都市農業者等が都市農地を借りやすくする「都市農地の貸借の円滑化に関する法律」（平成30年法律第68号）を制定したとあります。ほかの選択肢は、似た言葉を使っていますがメモに出てこない法律名です。","evidence":["意欲ある都市農業者等が都市農地を借りやすくする「都市農地の貸借の円滑化に関する法律」","（平成30年法律第68号）を制定し、都市農地の有効な活用に取り組んでいる。"],"source":{"memo_id":"08-07","page":7,"print_page":131,"title":"都市農業の役割と都市農地の貸借円滑化法"}},{"id":"08-07-i1","memo_id":"08-07","genre_id":"08","level":"intermediate","question":"「都市農業に関連する指標」の表で、都市農業の農地面積のうち生産緑地の面積と対全国比はどれか。","choices":["1.1万ha（0.3％）","5.4万ha（1.3％）","1.1万ha（1.3％）","0.3万ha（1.1％）"],"answer":0,"explanation":"表では、生産緑地は1.1万ha、対全国比0.3％です。5.4万ha（1.3％）は生産緑地を含む都市農業全体の農地面積なので、生産緑地の値ではありません。","evidence":["1.1万ha（0.3％）"],"source":{"memo_id":"08-07","page":7,"print_page":131,"title":"都市農業の役割と都市農地の貸借円滑化法"}},{"id":"08-07-i2","memo_id":"08-07","genre_id":"08","level":"intermediate","question":"「都市農業に関連する指標」の表で、都市農業の農地面積（生産緑地を含む全体）はどれか。","choices":["5.4万ha","1.1万ha","1.8万ha","427.2万ha"],"answer":0,"explanation":"表では、都市農業の農地面積は5.4万ha（対全国比1.3％）です。1.1万haはそのうちの生産緑地、427.2万haは全国の農地面積です。","evidence":["５．４万ｈa（1.3％）"],"source":{"memo_id":"08-07","page":7,"print_page":131,"title":"都市農業の役割と都市農地の貸借円滑化法"}},{"id":"08-07-a1","memo_id":"08-07","genre_id":"08","level":"advanced","question":"一口メモに示された都市農地の貸借の円滑化に関する法律の説明として、誤っているものはどれか。","choices":["事業計画に基づく活用終了後には、都市農地が所有者に返還される","事業計画に基づく貸借には、法定更新（農地法第17条）が適用される","都市農業の機能の発揮を通じて、都市住民の生活の向上に資することが目的である","農業従事者の減少・高齢化が進む中、貸借が円滑に行われる仕組みが必要とされた"],"answer":1,"explanation":"農地法の特例として、法定更新（農地法第17条）は「適用されない」とされているので、2番目の選択肢が誤りです。活用終了後の返還、法律の目的、課題の記述は、いずれもメモの内容と合っています。","evidence":["法定更新（農地法第17条）が適用されない"],"source":{"memo_id":"08-07","page":7,"print_page":131,"title":"都市農業の役割と都市農地の貸借円滑化法"}},{"id":"09-01-b1","memo_id":"09-01","genre_id":"09","level":"beginner","question":"一口メモによると、食育基本法は制定から約何年が経過して改正されましたか。","choices":["約10年","約20年","約30年","約40年"],"answer":1,"explanation":"要点に「食育基本法の制定から約20年が経過し」とあり、状況の変化等を踏まえて改正されました。約10年・約30年・約40年はいずれもメモの記述と異なります。","evidence":["食育基本法の制定から約20年が経過し、食や農林漁業を取り巻く状況の変化や食料・農業・農村基本法の改正等"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"09-01-b2","memo_id":"09-01","genre_id":"09","level":"beginner","question":"第5次食育推進基本計画の重点事項（２）は、健全な食生活の実現に向けた「何の食育」の推進ですか。","choices":["子どもの食育","高齢者の食育","大人の食育","地域の食育"],"answer":2,"explanation":"重点事項（２）は「健全な食生活の実現に向けた『大人の食育』の推進」です。学校等での学びは重点事項（１）で扱われており、「子どもの食育」などの名称は使われていません。","evidence":["（２）健全な食生活の実現に向けた「大人の食育」の推進"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"09-01-i1","memo_id":"09-01","genre_id":"09","level":"intermediate","question":"令和8年6月に決定された第5次食育推進基本計画の計画期間はどれですか。","choices":["令和6～10年度","令和7～11年度","令和8～12年度","令和8～17年度"],"answer":2,"explanation":"計画の題に「第５次食育推進基本計画（令和８～12年度）」とあります。決定は令和8年6月で、開始年度が同じでも終期が令和17年度の選択肢は誤りです。","evidence":["第５次食育推進基本計画（令和８～12年度）"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"09-01-i2","memo_id":"09-01","genre_id":"09","level":"intermediate","question":"第5次食育推進基本計画の「第２ 食育の推進の目標に関する事項」で、目標はどのように分類されていますか。","choices":["国の目標と地方の目標","個人目標と地域目標","短期目標と長期目標","数値目標と定性目標"],"answer":1,"explanation":"目標は、国民一人一人が自ら実践する「個人目標」と、地域等が主体となって取り組む「地域目標」に分類されています。ほかの分類はメモに記載がありません。","evidence":["①国民一人一人が自ら実践する目標（個人目標）と②地域等が主体となって取り組む目標（地域目標）に分類"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"09-01-a1","memo_id":"09-01","genre_id":"09","level":"advanced","question":"改正された食育基本法の「改正のポイント」の数と、第5次食育推進基本計画の「重点事項」の数の組合せとして正しいものはどれですか。","choices":["改正ポイント3つ・重点事項3つ","改正ポイント3つ・重点事項4つ","改正ポイント4つ・重点事項3つ","改正ポイント4つ・重点事項4つ"],"answer":2,"explanation":"改正のポイントは（１）～（４）の4つ、第5次計画の重点事項は「以下３つの重点事項を規定」とあるとおり3つです。数を入れ替えた組合せや同数の組合せは誤りです。","evidence":["（１）食料安全保障の確保、（２）学校等における食育の強化、（３）大人の食育運動の推進、（４）食育推進基本計画","令和８年６月に第５次食育推進基本計画が決定。以下３つの重点事項を規定。"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"09-01-a2","memo_id":"09-01","genre_id":"09","level":"advanced","question":"第5次食育推進基本計画の「第３ 具体的な施策」の位置付けについて、誤っているものはどれですか。","choices":["栄養教諭の配置促進は「学校、保育所等」の施策","和食に接する機会の拡大は「食文化の継承」の施策","「食育実践優良法人顕彰」は「学校、保育所等」の施策","官民連携食育プラットフォームは「地域」の施策"],"answer":2,"explanation":"「食育実践優良法人顕彰」の実施は「３．地域における食育の推進」に位置付けられており、「学校、保育所等」ではありません。栄養教諭の配置促進は学校・保育所等、和食に接する機会の拡大は食文化の継承、官民連携食育プラットフォームは地域の施策として正しく記載されています。","evidence":["３．地域における食育の推進：","・「食育実践優良法人顕彰」の実施"],"source":{"memo_id":"09-01","page":1,"print_page":132,"title":"食育基本法改正と第5次食育推進基本計画"}},{"id":"10-01-b1","memo_id":"10-01","genre_id":"10","level":"beginner","question":"このメモによると、近年の農林水産分野の地方公共団体職員の数はどうなっているか。","choices":["大幅に減少している","大幅に増加している","ほぼ横ばいで推移している","増加から減少に転じた"],"answer":0,"explanation":"メモの要点には、農業者が減少する中で、農林水産分野の地方公共団体職員も大幅に減少していると書かれています。増加や横ばいとは書かれていません。","evidence":["農業者が減少する中、近年、農林水産分野の地方公共団体職員も大幅に減少している。"],"source":{"memo_id":"10-01","page":1,"print_page":133,"title":"eMAFF申請とeMAFF地図による行政DX"}},{"id":"10-01-b2","memo_id":"10-01","genre_id":"10","level":"beginner","question":"「eMAFF申請」の正式な名称はどれか。","choices":["農林水産省共通申請サービス","農林水産省地理情報共通管理システム","農林水産省電子補助金管理システム","農林水産省統合行政窓口サービス"],"answer":0,"explanation":"eMAFF申請の正式名称は「農林水産省共通申請サービス」です。「農林水産省地理情報共通管理システム」はeMAFF地図の名称です。","evidence":["農林水産省共通申請サービス（eMAFF申請）","農林水産省地理情報共通管理システム（eMAFF地図）"],"source":{"memo_id":"10-01","page":1,"print_page":133,"title":"eMAFF申請とeMAFF地図による行政DX"}},{"id":"10-01-i1","memo_id":"10-01","genre_id":"10","level":"intermediate","question":"次期オンライン申請システム（eMAFF申請2.0）への移行は、いつ頃から始まる予定か。","choices":["令和7年4月頃","令和8年4月頃","令和8年10月頃","令和9年10月頃"],"answer":2,"explanation":"メモには、eMAFF申請2.0を構築し、令和8年10月頃から移行を始める予定と書かれています。令和8年4月頃は月が違い、令和9年は年が違います。","evidence":["※次期オンライン申請システム（eMAFF申請2.0）を構築し、令和","８年10月頃より移行開始予定。"],"source":{"memo_id":"10-01","page":1,"print_page":133,"title":"eMAFF申請とeMAFF地図による行政DX"}},{"id":"10-01-i2","memo_id":"10-01","genre_id":"10","level":"intermediate","question":"メモで紙申請の例として示されている、1件の申請に必要な紙の厚さはどれか。","choices":["5cm","15cm","50cm","150cm"],"answer":2,"explanation":"メモには「1件の申請で50cmの紙申請」と書かれています。5cmや150cmなど、桁の違う数値とまちがえないよう注意が必要です。","evidence":["１件の申請で50cmの紙申請"],"source":{"memo_id":"10-01","page":1,"print_page":133,"title":"eMAFF申請とeMAFF地図による行政DX"}},{"id":"10-01-a1","memo_id":"10-01","genre_id":"10","level":"advanced","question":"eMAFF地図とその機能についての説明として、誤っているものはどれか。","choices":["eMAFF農地ナビは、農地情報をデジタル地図で公表する","現地確認アプリは、タブレット1台で現地確認を可能とする","現地確認アプリを使うと、圃場の特定が容易になる","eMAFF地図は、補助金などの手続をオンラインで行う電子申請システムである"],"answer":3,"explanation":"法令や補助金などの行政手続をオンラインで行う電子申請システムは、eMAFF地図ではなくeMAFF申請です。ほかの3つは、メモに書かれたeMAFF農地ナビと現地確認アプリの説明と合っています。","evidence":["eMAFF申請は、農林水産省所管の法令や補助金などの行政手","①農地情報をデジタル地図で公表するeMAFF農地ナビ。"],"source":{"memo_id":"10-01","page":1,"print_page":133,"title":"eMAFF申請とeMAFF地図による行政DX"}},{"id":"11-01-b1","memo_id":"11-01","genre_id":"11","level":"beginner","question":"一口メモによると、総合農協が組合員に提供する金融サービスに当たる事業の組み合わせはどれか。","choices":["信用事業と共済事業","経済事業と信用事業","経済事業と共済事業","意見代表と総合調整"],"answer":0,"explanation":"金融サービスは信用事業と共済事業とされています。経済事業は農産物の販売等であり、意見代表・総合調整は中央会の事業内容です。","evidence":["金融サービス（信用","事業、共済事業）を提供。"],"source":{"memo_id":"11-01","page":1,"print_page":134,"title":"農協の組織と総合農協数・組合員数の推移"}},{"id":"11-01-b2","memo_id":"11-01","genre_id":"11","level":"beginner","question":"一口メモによると、農協の組合員数について、准組合員と正組合員の関係はどうなっているか。","choices":["准組合員が正組合員を上回る","正組合員が准組合員を上回る","准組合員と正組合員が同数である","准組合員の制度が廃止された"],"answer":0,"explanation":"要点に准組合員が正組合員を上回っている状況と書かれています。正組合員が上回るのは逆の関係で誤りです。","evidence":["農協の組合員数は、准組合員が正組合員を上回っている状況。"],"source":{"memo_id":"11-01","page":1,"print_page":134,"title":"農協の組織と総合農協数・組合員数の推移"}},{"id":"11-01-i1","memo_id":"11-01","genre_id":"11","level":"intermediate","question":"令和7年度末現在の全国の総合農協数はいくつか。","choices":["510組合","598組合","691組合","745組合"],"answer":0,"explanation":"組織図とグラフで令和7年度末の総合農協数は510です。598は令和2年度末、691は平成27年度末、745は平成22年度末の数値です。","evidence":["総合農協 【510】"],"source":{"memo_id":"11-01","page":1,"print_page":134,"title":"農協の組織と総合農協数・組合員数の推移"}},{"id":"11-01-a1","memo_id":"11-01","genre_id":"11","level":"advanced","question":"令和7年度末現在の農協の組織について、誤っているものはどれか。","choices":["都道府県農業協同組合中央会は46ある","経済農業協同組合連合会は6ある","信用農業協同組合連合会は31ある","1県1JAとなっている県は10県ある"],"answer":3,"explanation":"1県1JAは7県（奈良県、和歌山県、島根県、山口県、香川県、宮崎県、沖縄県）であり、10県は誤りです。県中46、経済連6、信連31はいずれも組織図の数値と一致します。","evidence":["１県１JA 【７】"],"source":{"memo_id":"11-01","page":1,"print_page":134,"title":"農協の組織と総合農協数・組合員数の推移"}},{"id":"11-02-b1","memo_id":"11-02","genre_id":"11","level":"beginner","question":"今後の農協の自己改革実践サイクルで、KPI等の設定によって判断するとされているものはどれか。","choices":["農業者の所得向上につながる実績","農協職員の人員削減の実績","准組合員数の増加の実績","農協の店舗統合の実績"],"answer":0,"explanation":"メモでは、組合員との対話を通じて農業者の所得向上につながる実績を判断するためのKPI等を設定するとしています。人員削減、准組合員数、店舗統合をKPIで判断するとは書かれていません。","evidence":["今後、農協において組合員との対話を通じて、農業者の所得向上につながる実績を判断するた"],"source":{"memo_id":"11-02","page":2,"print_page":135,"title":"農協の自己改革実践サイクルと取組状況"}},{"id":"11-02-i1","memo_id":"11-02","genre_id":"11","level":"intermediate","question":"JAグループ全体の令和6年の輸出実績額はいくらか。","choices":["123億円","260億円","383億円","506億円"],"answer":2,"explanation":"令和6年の輸出実績額は383億円です。123億円は平成27年（改革前）の実績額で、260億円はその間の増加額です。","evidence":["ＪＡグループ全体の令和６年の輸出実績額は平成27年実績（改革前）に比べ","260億円増加（123億円→383億円）"],"source":{"memo_id":"11-02","page":2,"print_page":135,"title":"農協の自己改革実践サイクルと取組状況"}},{"id":"11-02-i2","memo_id":"11-02","genre_id":"11","level":"intermediate","question":"JA全農による肥料の価格引下げで、集約したあとの銘柄数はいくつか。","choices":["5","24","240","550"],"answer":1,"explanation":"肥料は銘柄を550から24に集約しました。550は集約前の銘柄数です。5は段ボールの品目数で、肥料の銘柄数ではありません。","evidence":["大幅に銘柄を集約（550→24）し、標準品と比較して約１～３割の価"],"source":{"memo_id":"11-02","page":2,"print_page":135,"title":"農協の自己改革実践サイクルと取組状況"}},{"id":"11-02-a1","memo_id":"11-02","genre_id":"11","level":"advanced","question":"JA全農による生産資材の価格引下げについて、誤っているものはどれか。","choices":["農薬は大型規格化とメーカー直送で約3割の価格引下げ","コンバインはおおむね15～18％の価格引下げを実現","段ボールは5品目で規格を集約し規格数を5割削減","大型・中型トラクターはおおむね2～3割の価格引下げ"],"answer":2,"explanation":"段ボールは5品目で規格を集約し、規格数を3割削減したとされているため、5割削減は誤りです。農薬の約3割、コンバインの15～18％、トラクターの2～3割は、いずれもメモの記載どおりです。","evidence":["５品目においてパレット流通に適合した規格に集約し規格数を３割削減す"],"source":{"memo_id":"11-02","page":2,"print_page":135,"title":"農協の自己改革実践サイクルと取組状況"}},{"id":"11-03-b1","memo_id":"11-03","genre_id":"11","level":"beginner","question":"一口メモによると、各市町村に設置されている行政委員会である農業委員会は、どの法律に基づいて設置されているか。","choices":["農地法","農業委員会等に関する法律","農業協同組合法","食料・農業・農村基本法"],"answer":1,"explanation":"農業委員会は農業委員会等に関する法律（昭和26年法律第88号）に基づき各市町村に設置される行政委員会です。農地法は農業委員が許可に関して意思決定を行う対象の法律として登場しますが、設置の根拠法ではありません。","evidence":["農業委員会は、農業委員会等に関する法律（昭和26年法律第88号）に基づき各市町村に設置され"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},{"id":"11-03-b2","memo_id":"11-03","genre_id":"11","level":"beginner","question":"一口メモによると、農業委員会の委員（農業委員・推進委員）の任期は何年か。","choices":["2年","3年","4年","5年"],"answer":1,"explanation":"要点に「委員の任期は３年」と明記されています。2年・4年・5年はいずれもメモの記載と一致しません。","evidence":["相互に連携して業務を実施（委員の任期は３年）"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},
