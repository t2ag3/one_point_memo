{"id":"11-03-i1","memo_id":"11-03","genre_id":"11","level":"intermediate","question":"令和7年10月1日現在の全国の農地利用最適化推進委員の人数はどれか。","choices":["7,886人","17,474人","22,933人","1,696人"],"answer":1,"explanation":"農地利用最適化推進委員は17,474人です。22,933人は農業委員、7,886人は事務局職員の数で、1,696は令和8年4月1日現在の農業委員会数です。","evidence":["農地利用最適化推進委員（17,474人）","事務局職員数は令和７年10月１日現在"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},{"id":"11-03-i2","memo_id":"11-03","genre_id":"11","level":"intermediate","question":"一口メモの参考表で、農業委員会を設置していない市町村の数（合計）はいくつか。","choices":["13","35","48","177"],"answer":2,"explanation":"設置していない理由は「農地がない」13と「農地面積が著しく小」35で、合計48市町村です。13と35は理由別の内訳、177は必置規制の対象ではないが設置している市町村数です。","evidence":["（参考） 農業委員会を設置していない市町村","農地面積が著しく小（都府県200ha以下、北海道800ha以下）"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},{"id":"11-03-a1","memo_id":"11-03","genre_id":"11","level":"advanced","question":"一口メモに記載された農業委員と農地利用最適化推進委員の説明として、誤っているものはどれか。","choices":["農業委員は市町村議会の同意を要件として市町村長が任命する","推進委員は農業委員会の委嘱によって選出される","農地の権利移動の許可は推進委員が行う法令事務である","農業委員と推進委員はどちらも非常勤の特別職地方公務員である"],"answer":2,"explanation":"農地の権利移動の許可は、農業委員が実施する法令事務です。推進委員は担い手への農地の利用集積、遊休農地の解消、新規参入の促進といった農地利用最適化業務を担います。","evidence":["○ 農地の権利移動の許可","〇 担い手への農地の利用集積"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},{"id":"11-03-a2","memo_id":"11-03","genre_id":"11","level":"advanced","question":"一口メモで、必置規制の対象ではないが農業委員会を設置している市町村の要件「農地面積が著しく小」について、北海道の基準はどれか。","choices":["200ha以下","800ha以下","7,000ha超","24,000ha超"],"answer":1,"explanation":"農地面積が著しく小の基準は都府県200ha以下、北海道800ha以下です。200ha以下は都府県の基準、7,000ha超と24,000ha超は複数の委員会を設置できる例外の要件です。","evidence":["北海道800ha以下","都府県200ha以下","②農地面積が著しく大（7,000ha超）"],"source":{"memo_id":"11-03","page":3,"print_page":136,"title":"農業委員会の概要と委員の構成"}},{"id":"12-01-b1","memo_id":"12-01","genre_id":"12","level":"beginner","question":"2026年6月5日に閣議決定された森林・林業基本計画の副題として正しいものはどれか。","choices":["百年つづく「森の国・木の街」へ","百年つづく「緑の国・森の里」へ","未来へつなぐ「森の国・木の街」へ","未来へつなぐ「緑の国・森の里」へ"],"answer":0,"explanation":"計画名は『森林・林業基本計画～百年つづく「森の国・木の街」へ～』です。「未来へつなぐ」や「緑の国・森の里」という語句はメモにありません。","evidence":["2026年６月５日に『森林・林業基本計画～百年つづく「森の国・木の街」へ～』を閣議決定。"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-01-b2","memo_id":"12-01","genre_id":"12","level":"beginner","question":"2026年6月5日に閣議決定された森林・林業基本計画では、次の百年の礎を築くためにどのように施策を進めるとしているか。","choices":["民間活力を積極的に活用し施策を集中して機動的に実施","国の直轄事業に限定し施策を分散させて段階的に実施","民間活力の活用を控え施策を集中して慎重に実施","国の直轄事業を中心とし施策を分散させて機動的に実施"],"answer":0,"explanation":"メモには「民間活力の積極的な活用を図りつつ、施策を集中し、機動的な実施を図る」とあります。民間活力を控える、施策を分散させるといった内容は書かれていません。","evidence":["民間活力の積極的な活用を図りつつ、施策を","集中し、機動的な実施を図ることにより、森林・林業・木材産業の次の百年の礎を築く。"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-01-i1","memo_id":"12-01","genre_id":"12","level":"intermediate","question":"2026年6月閣議決定の森林・林業基本計画の概要図で、「国民の安全・安心の確保」の中に位置付けられている取組はどれか。","choices":["花粉の少ない森林への転換","木育の推進","関係人口の創出・拡大","原木流通コーディネート機能の強化"],"answer":0,"explanation":"「花粉の少ない森林への転換」は、下段の「国民の安全・安心の確保」の中にあります。木育は「国産材の利用拡大」、関係人口は「森業等による山村地域」、原木流通コーディネートは「強靱なサプライチェーン」の取組で、いずれも「林業・木材産業の成長の実現」側に入っています。","evidence":["花粉の少ない森林への転換","○ 国民の安全・安心を根底から支える多様で健全な森林づくり"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-01-i2","memo_id":"12-01","genre_id":"12","level":"intermediate","question":"2026年6月閣議決定の森林・林業基本計画の概要図で、「ゾーニングと集積・集約化の加速」の中に挙げられている取組はどれか。","choices":["リモートセンシングとＡＩの活用","ＣＬＴ等の製品輸出の戦略的拡大","ＪＡＳ製材設備等の戦略的整備","遠隔操作や自動運転機械等の実装"],"answer":0,"explanation":"境界明確化や情報透明化等に向けたリモートセンシングとAIの活用は、「ゾーニングと集積・集約化の加速」の取組です。CLT輸出は「国産材の利用拡大」、JAS製材設備は「供給力強化」、遠隔操作機械は「スマート林業」の取組です。","evidence":["境界明確化や情報透明化等に向けたリモート","○ ゾーニングと集積・集約化の加速"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-01-a1","memo_id":"12-01","genre_id":"12","level":"advanced","question":"2026年6月閣議決定の森林・林業基本計画で、「国産材の利用拡大と幅広い需要の創出」の取組として誤っているものはどれか。","choices":["ＳＨＫ制度等による国産材利用効果の見える化","非住宅・中高層建築物等の都市の木造化の推進","木質系新素材の開発・実装","外縁確定型の普及"],"answer":3,"explanation":"「外縁確定型の普及」は「ゾーニングと集積・集約化の加速」の取組なので、これが誤りです。見える化、都市の木造化、木質系新素材は、いずれも「国産材の利用拡大と幅広い需要の創出」に挙げられています。","evidence":["外縁確定型の普及、森林経営管理法の最大限の活用"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-01-a2","memo_id":"12-01","genre_id":"12","level":"advanced","question":"2026年6月閣議決定の森林・林業基本計画で、「強靱なサプライチェーンの構築」に挙げられた取組の組合せとして正しいものはどれか。","choices":["合理的な価格形成とＩＣＴ等による原木流通調整","合理的な価格形成と大径材対応設備等の整備","工場間連携とＩＣＴ等による原木流通調整","工場間連携と大径材対応設備等の整備"],"answer":0,"explanation":"「強靱なサプライチェーンの構築」には、再造林コスト等の情報共有による合理的な価格形成と、ICT等による原木流通コーディネート機能の強化が挙げられています。工場間連携や大径材対応設備は「需要に応じた国産材の供給力強化」の取組です。","evidence":["情報の共有・相互理解、合理的な価格形成","• ＩＣＴ等による原木流通コーディネート機能の"],"source":{"memo_id":"12-01","page":1,"print_page":137,"title":"新たな森林・林業基本計画の概要"}},{"id":"12-02-b1","memo_id":"12-02","genre_id":"12","level":"beginner","question":"一口メモによると、我が国の森林は国土面積のおよそどれくらいを占めているか。","choices":["約3分の2","約2分の1","約3分の1","約4分の3"],"answer":0,"explanation":"要点に、森林は国土面積の約3分の2を占めると書かれています。国土面積の内訳でも森林は66%で、約2分の1や約4分の3とは異なります。","evidence":["我が国の森林は、国土面積の約３分の２を占めており、そのうち４割は人工林。"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-02-b2","memo_id":"12-02","genre_id":"12","level":"beginner","question":"一口メモによると、我が国の人工林の6割超は何年生以上で、利用期を迎えているとされているか。","choices":["31年生以上","41年生以上","51年生以上","61年生以上"],"answer":2,"explanation":"要点に、人工林の6割超が51年生以上で利用期を迎えていると書かれています。61年生以上は1981年の集計区分の注記に出てくる数字で、要点の基準ではありません。","evidence":["人工林の６割超が51年生以上で、利用期を迎えている状況。"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-02-i1","memo_id":"12-02","genre_id":"12","level":"intermediate","question":"令和4年3月31日現在の森林面積の所有形態別内訳で、最も面積が大きいものはどれか。","choices":["国有林","公有林","私有林","天然林等"],"answer":2,"explanation":"森林面積2,502万haのうち私有林が1,436万ha（57%）で最も大きくなっています。国有林は766万ha（31%）、公有林は301万ha（12%）で、天然林等は所有形態ではなく林の種類の区分です。","evidence":["私有林\n1,436\n(57%)","国有林\n766\n(31%)"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-02-i2","memo_id":"12-02","genre_id":"12","level":"intermediate","question":"令和4年3月31日現在の人工林の樹種別面積で、最も面積が大きい樹種はどれか。","choices":["スギ","ヒノキ","カラマツ","マツ類"],"answer":0,"explanation":"人工林の樹種別面積ではスギが441万ha（44%）で最大です。ヒノキは257万ha（25%）、カラマツは96万ha（10%）で、マツ類という区分はメモにありません。","evidence":["スギ\n441万ha\n(44%)","ヒノキ\n257万ha\n(25%)"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-02-a1","memo_id":"12-02","genre_id":"12","level":"advanced","question":"令和4年3月31日現在の森林面積と人工林樹種別面積について、誤っているものはどれか。","choices":["国有林は766万haで森林面積の31%","公有林は301万haで森林面積の12%","ヒノキの人工林は257万haで人工林の25%","カラマツの人工林は215万haで人工林の21%"],"answer":3,"explanation":"カラマツの人工林は96万ha（10%）で、215万ha（21%）は「その他」の数値です。国有林・公有林・ヒノキの数値はグラフのとおりで正しい記述です。","evidence":["カラマツ\n96万ha\n(10%)","その他\n215万ha\n(21%)"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-02-a2","memo_id":"12-02","genre_id":"12","level":"advanced","question":"令和2年の国土面積3,780万haの内訳のうち、農地の面積はどれか。","choices":["197万ha","437万ha","643万ha","766万ha"],"answer":1,"explanation":"国土面積の内訳で農地は437万ha（12%）です。197万haは宅地、643万haはその他、766万haは国有林の面積で、いずれも別の項目の数値です。","evidence":["農地\n437\n（12%）","宅地\n197（５％）"],"source":{"memo_id":"12-02","page":2,"print_page":138,"title":"我が国の森林の現状と人工林の林齢・樹種"}},{"id":"12-03-b1","memo_id":"12-03","genre_id":"12","level":"beginner","question":"SHK制度で、自らの森林経営活動や木材製品利用による炭素蓄積変化量を排出量の調整に使えるのは、いつからですか。","choices":["令和6年度から","令和7年度から","令和8年度から","令和9年度から"],"answer":2,"explanation":"メモでは、令和8年度から炭素蓄積変化量を排出量の調整に使えるよう制度を見直したとしています。令和6年は木質バイオマス燃料の利用量の年で、制度見直しの開始年ではありません。","evidence":["令和８年度から、自らの森林経営活動や木材製品利用による炭素蓄積変化量を排"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-03-b2","memo_id":"12-03","genre_id":"12","level":"beginner","question":"温室効果ガスを一定量以上排出する事業者に、排出量の算定と国への報告を義務付ける「SHK制度」の正式名称はどれですか。","choices":["温室効果ガス排出量算定・報告・公表制度","温室効果ガス排出削減・取引・認証制度","森林吸収量算定・登録・公表制度","二酸化炭素排出量測定・届出・開示制度"],"answer":0,"explanation":"SHK制度は「温室効果ガス排出量算定・報告・公表制度」です。算定・報告を義務付け、国が公表する仕組みのため、取引・認証や届出・開示といった名称は誤りです。","evidence":["「温室効果ガス排出量算定・報告・公表制度」（SHK制度）にお"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-03-i1","memo_id":"12-03","genre_id":"12","level":"intermediate","question":"令和6年の木質バイオマス燃料（間伐材、製材端材、建築廃材等）の利用量はどれですか。","choices":["1.0千万㎥","1.3千万㎥","2.0千万㎥","4.4千万㎥"],"answer":2,"explanation":"メモでは、令和6年の利用量を2.0千万㎥としています。1.3や4.4は、A重油約130万klやCO2約440万tの数字に似せた誤りです。","evidence":["令和６年利用量＝2.0千万㎥"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-03-i2","memo_id":"12-03","genre_id":"12","level":"intermediate","question":"建築段階の床面積当たりのCO2排出量について、木造は非木造（鉄筋コンクリート造等）の約何倍ですか。","choices":["約1/5","約2/5","約3/5","約4/5"],"answer":2,"explanation":"図では、木造の建築段階の床面積当たりのCO2排出量を、非木造の約3/5としています。ほかの割合はメモに書かれていません。","evidence":["建築段階の床面積当たりのCO２排出量が約３／５","非木造(鉄筋コンクリート造等)"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-03-a1","memo_id":"12-03","genre_id":"12","level":"advanced","question":"令和6年の木質バイオマス燃料の利用は、A重油とCO2についてそれぞれどれだけを代替することに相当しますか。","choices":["A重油約130万kl・CO2約440万t","A重油約440万kl・CO2約130万t","A重油約130万kl・CO2約200万t","A重油約200万kl・CO2約440万t"],"answer":0,"explanation":"図では、木質バイオマス燃料の利用がA重油約130万kl、CO2約440万tの代替に相当するとしています。2つの数値を入れ替えたものや、利用量2.0千万㎥の「2」を混ぜたものは誤りです。","evidence":["CO2約440万t","Ａ重油約130万kl","令和６年利用量＝2.0千万㎥"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-03-a2","memo_id":"12-03","genre_id":"12","level":"advanced","question":"森林・木材・木質バイオマスの役割について、このメモの内容として誤っているものはどれですか。","choices":["樹木は空気中のCO2を吸収して成長する","木材製品として使えば長期間炭素を貯蔵する","木材は鉄等より製造時のエネルギー消費が少ない","エネルギー利用によりプラスチック等を代替する"],"answer":3,"explanation":"メモでは、プラスチック等を代替するのはマテリアル利用で、エネルギー利用（発電、熱利用）は化石燃料を代替するとしています。ほかの3つはメモにそのまま書かれています。","evidence":["マテリアル利用により化石資源","により化石燃料を代替"],"source":{"memo_id":"12-03","page":3,"print_page":139,"title":"森林・木材による脱炭素とSHK制度見直し"}},{"id":"12-04-b1","memo_id":"12-04","genre_id":"12","level":"beginner","question":"2026年3月末までのJ－クレジット累計認証量（1,405万t-CO2）のうち、森林由来J－クレジットが占める割合はおよそ何％か。","choices":["約15％","約17％","約42％","約74％"],"answer":1,"explanation":"森林由来J－クレジットは約240万t-CO2で、累計認証量の17％です。15％は木質バイオマス由来、約42％は太陽光発電、約74％は森林分野での2024・2025年度の2箇年分の占める割合です。","evidence":["2026年３月末までの累計認証量1,405万t-CO2のうち、森林由来Ｊークレジットは約240万t-CO2","（17％）"],"source":{"memo_id":"12-04","page":4,"print_page":140,"title":"森林由来J－クレジットの認証と売買動向"}},{"id":"12-04-b2","memo_id":"12-04","genre_id":"12","level":"beginner","question":"森林分野のJ－クレジットについて、認証量の伸びが顕著とされ、2箇年で累計認証量の約74％を占める年度の組み合わせはどれか。","choices":["2021年度と2022年度","2022年度と2023年度","2023年度と2024年度","2024年度と2025年度"],"answer":3,"explanation":"メモでは2024年度と2025年度の伸びが顕著で、この2箇年で累計認証量の約74％を占めるとしています。2023年度も増えていますが、要点で示された2箇年には含まれません。","evidence":["森林分野は2024年度と2025年度の認証量の伸びが顕著であり、２箇年の認証量で累計認証量","の約74％を占める。"],"source":{"memo_id":"12-04","page":4,"print_page":140,"title":"森林由来J－クレジットの認証と売買動向"}},{"id":"12-04-i2","memo_id":"12-04","genre_id":"12","level":"intermediate","question":"東京証券取引所カーボン・クレジット市場におけるJ－クレジットの売買動向（2026年3月31日累計）で、平均単価（円/t-CO2）が最も高い分類はどれか。","choices":["省エネルギー","再生可能エネルギー","森林","農業（中干し期間の延長）"],"answer":2,"explanation":"森林の平均単価は5,551円/t-CO2で、表の分類の中で最も高くなっています。再生可能エネルギーは4,590円、農業（中干し期間の延長）は4,352円、省エネルギーは2,928円です。","evidence":["森林 5,551 20,715","再生可能エネルギー 4,590 719,746"],"source":{"memo_id":"12-04","page":4,"print_page":140,"title":"森林由来J－クレジットの認証と売買動向"}},{"id":"12-04-a1","memo_id":"12-04","genre_id":"12","level":"advanced","question":"東京証券取引所カーボン・クレジット市場（2026年3月31日累計）で、森林の平均単価は、合計（全分類）の平均単価を何円/t-CO2上回っているか。","choices":["961円/t-CO2","1,199円/t-CO2","1,485円/t-CO2","2,623円/t-CO2"],"answer":2,"explanation":"森林の平均単価5,551円から合計の平均単価4,066円を引くと1,485円です。961円は再生可能エネルギー（4,590円）、1,199円は農業（中干し期間の延長、4,352円）、2,623円は省エネルギー（2,928円）との差です。","evidence":["森林 5,551 20,715","合計 4,066 1,099,028"],"source":{"memo_id":"12-04","page":4,"print_page":140,"title":"森林由来J－クレジットの認証と売買動向"}},{"id":"12-04-a2","memo_id":"12-04","genre_id":"12","level":"advanced","question":"2026年3月末時点のJ－クレジットの認証量と東京証券取引所での売買動向について、誤っているものはどれか。","choices":["J－クレジットの累計認証量は1,405万t-CO2である","木質バイオマス由来の認証量は約211万t-CO2である","太陽光発電の累計認証量は585.6万トンである","東証市場で取引量が最も多い分類は省エネルギーである"],"answer":3,"explanation":"東証市場で取引量が最も多いのは再生可能エネルギー（719,746t-CO2）で、省エネルギー（357,311t-CO2）ではありません。累計認証量1,405万t-CO2、木質バイオマス約211万t-CO2、太陽光発電585.6万トンはいずれもメモの記載どおりです。","evidence":["再生可能エネルギー 4,590 719,746","省エネルギー 2,928 357,311"],"source":{"memo_id":"12-04","page":4,"print_page":140,"title":"森林由来J－クレジットの認証と売買動向"}},{"id":"12-05-b1","memo_id":"12-05","genre_id":"12","level":"beginner","question":"メモによると、近年、木材生産額が増加傾向で推移している要因は何か。","choices":["建築用木材や燃料材に係る国産材の利用拡大","輸入材の価格低下による木材需要の拡大","特用林産物である栽培きのこ類の生産拡大","輸出用丸太の海外向け需要の急速な拡大"],"answer":0,"explanation":"メモには、合板等の建築用木材や燃料材に係る国産材の利用拡大により木材生産額が増加傾向と書かれています。輸入材や輸出用丸太、特用林産物は増加要因として挙げられていません。","evidence":["合板等の建築用木材や燃料材に係る","国産材の利用拡大により、近年、増加傾向で推移し"],"source":{"memo_id":"12-05","page":5,"print_page":141,"title":"林業産出額と木材価格の推移"}},{"id":"12-05-b2","memo_id":"12-05","genre_id":"12","level":"beginner","question":"メモによると、2021年に木材価格が急騰した契機は何か。","choices":["ウッドショックによる国産材需要の高まり","燃料用チップ素材の産出額の大幅な減少","2018年の調査対象の見直しによる影響","合板の輸入量の増加による需要の拡大"],"answer":0,"explanation":"メモでは、「ウッドショック」による国産材需要の高まりを契機として2021年に価格が急騰したとしています。調査対象の見直しは注記の内容で、急騰の契機ではありません。","evidence":["「ウッドショック」による国産材需","要の高まりを契機として2021年に価格が急騰"],"source":{"memo_id":"12-05","page":5,"print_page":141,"title":"林業産出額と木材価格の推移"}},{"id":"12-05-i1","memo_id":"12-05","genre_id":"12","level":"intermediate","question":"2024年の木材生産額はいくらか（単位：億円）。","choices":["3,276億円","5,713億円","2,437億円","4,500億円"],"answer":0,"explanation":"2024年の木材生産額は3,276億円です。5,713億円は木材生産額を含む林業産出額全体の額なので誤りです。","evidence":["2024年の木材生産額は3,276億円"],"source":{"memo_id":"12-05","page":5,"print_page":141,"title":"林業産出額と木材価格の推移"}},{"id":"12-05-a1","memo_id":"12-05","genre_id":"12","level":"advanced","question":"林業産出額と木材価格に関する次の記述のうち、メモの内容として誤っているものはどれか。","choices":["林業産出額は5,713億円である","木材価格は2010年からほぼ横ばいで推移していた","木材価格は2021年以降、下落傾向にある","木材価格は2020年の価格を下回る水準になった"],"answer":3,"explanation":"メモでは、2021年以降は下落傾向にあるものの、価格上昇前の2020年の価格よりは高値の状況とされています。したがって2020年を下回ったとする記述が誤りで、ほかの3つはメモのとおりです。","evidence":["以降は、下落傾向にあるものの、価格上昇前の2020","年の価格よりは高値の状況。"],"source":{"memo_id":"12-05","page":5,"print_page":141,"title":"林業産出額と木材価格の推移"}},{"id":"12-06-b1","memo_id":"12-06","genre_id":"12","level":"beginner","question":"このメモによると、近年、木材需要量が回復傾向にある主な要因はどれか。","choices":["木質バイオマス発電施設の増加に伴う燃料材需要の増加","住宅着工戸数の大幅な増加に伴う製材用材需要の増加","しいたけ栽培の拡大に伴うしいたけ原木需要の増加","紙の消費拡大に伴う輸入パルプ・チップ用材の増加"],"answer":0,"explanation":"メモは、木質バイオマス発電施設の増加に伴う燃料材需要の増加等により近年は回復傾向としています。住宅着工戸数はむしろ減少しており、それが以前の需要減少の背景とされています。","evidence":["バイオマス発電施設の増加に伴う燃料材需要の増加等により、近年は回復傾向。","木材需要量は、住宅着工戸数の減少等を背景として減少傾向で推移していたが"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-06-b2","memo_id":"12-06","genre_id":"12","level":"beginner","question":"このメモによると、全国の木材自給率が底（最も低い値）となったのは何年か。","choices":["2000年","2002年","2009年","2024年"],"answer":1,"explanation":"木材自給率は2002年の18.8％を底に上昇傾向で推移しています。2009年は木材需要量が6,480万㎥に落ち込んだ年で、自給率の底の年ではありません。","evidence":["木材自給率は、合板等の建築用木材や燃料材に係る国産材の利用拡大により、2002","年の18.8％を底に上昇傾向で推移し"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-06-i1","memo_id":"12-06","genre_id":"12","level":"intermediate","question":"2024年の全国の木材需要量の内訳のうち、最も量が多い用途はどれか。","choices":["製材用材","合板用材","燃料材","パルプ・チップ用材"],"answer":3,"explanation":"2024年はパルプ・チップ用材が2,685万㎥で最も多く、燃料材2,259万㎥、製材用材2,232万㎥、合板用材773万㎥と続きます。燃料材と製材用材は近い値ですが、いずれもパルプ・チップ用材より少ないです。","evidence":["2,685万㎥","2,259万㎥","2,232万㎥"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-06-i2","memo_id":"12-06","genre_id":"12","level":"intermediate","question":"2024年の全国の木材自給率（建築用材等）は何％か。","choices":["42.5％","52.9％","18.8％","62.9％"],"answer":1,"explanation":"建築用材等に限った2024年の木材自給率は52.9％です。42.5％は2024年の木材自給率全体の値、18.8％は2002年の木材自給率です。","evidence":["52.9%","（建築用材等）"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-06-a1","memo_id":"12-06","genre_id":"12","level":"advanced","question":"全国の木材自給率は、底となった2002年から2024年までに何ポイント上昇したか。","choices":["10.4ポイント","18.8ポイント","23.7ポイント","34.1ポイント"],"answer":2,"explanation":"2002年の18.8％から2024年の42.5％へ上昇したので、差は23.7ポイントです。34.1ポイントは建築用材等の52.9％と比べた場合、10.4ポイントは52.9％と42.5％の差で、いずれも対象を取り違えた値です。","evidence":["年の18.8％を底に上昇傾向で推移し、2024年は42.5％"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-06-a2","memo_id":"12-06","genre_id":"12","level":"advanced","question":"全国の木材需要量について、このメモの内容として誤っているものはどれか。","choices":["2024年の木材需要量は8,187万㎥である","2009年の木材需要量は6,480万㎥である","2024年の燃料材の需要量は2,259万㎥である","2024年は製材用材の需要量が燃料材を上回る"],"answer":3,"explanation":"2024年の製材用材は2,232万㎥で、燃料材の2,259万㎥をわずかに下回るため誤りです。総需要量8,187万㎥、2009年の6,480万㎥、燃料材2,259万㎥はいずれもメモのとおりです。","evidence":["2,232万㎥","2,259万㎥"],"source":{"memo_id":"12-06","page":6,"print_page":142,"title":"木材自給率と木材需要量の推移"}},{"id":"12-07-b1","memo_id":"12-07","genre_id":"12","level":"beginner","question":"一口メモで、木造率が低く、今後の国産材の利用拡大が重要とされている分野はどれか。","choices":["非住宅・中高層分野","低層の戸建住宅分野","住宅のリフォーム分野","木製家具・木工品分野"],"answer":0,"explanation":"メモは、木造率が低い非住宅・中高層分野での国産材の利用拡大が重要としています。低層住宅は木造率が約8割と高く、木造率が低い分野には当たりません。","evidence":["木造率が低い非住宅・中高層分野での国産材の利用拡大が重要"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-07-b2","memo_id":"12-07","genre_id":"12","level":"beginner","question":"一口メモで、輸入材への依存が大きいとして、国産材の活用を促す技術の開発・普及を進めるとされている部材はどれか。","choices":["横架材","柱材","土台等","面材"],"answer":0,"explanation":"メモは、輸入材への依存が大きい横架材等について、国産材の活用を促す技術の開発・普及を推進するとしています。柱材・土台等・面材は、この対象として名前が挙がっていません。","evidence":["輸入材への依存が大きい横架材等について国産材の活用を促す技術の開発・普及を推進"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-07-i1","memo_id":"12-07","genre_id":"12","level":"intermediate","question":"建築着工統計調査2024年をもとにした図で、低層住宅の木造率はおよそどのくらいとされているか。","choices":["約8割","約5割","約3割","約1割"],"answer":0,"explanation":"図の中で、低層住宅の木造率は約8割と示されています。約5割は木造住宅の国産材使用率であり、木造率とは別の数値です。","evidence":["（低層住宅の木造率は約８割）"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-07-i2","memo_id":"12-07","genre_id":"12","level":"intermediate","question":"木造住宅の部材別木材使用率の図で、木造住宅一戸当たりの平均木材使用量はどれか。","choices":["21.7㎥","5.6㎥","12.7㎥","52.7㎥"],"answer":0,"explanation":"一戸当たりの平均木材使用量は21.7㎥と示されています。5.6㎥は横架材だけの使用量で、52.7は国産材使用率（%）の数値です。","evidence":["一戸当たりの平均木材使用量： 21.7㎥"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-07-a1","memo_id":"12-07","genre_id":"12","level":"advanced","question":"一口メモの内容について、誤っているものはどれか。","choices":["木造住宅の国産材使用率は52.7%である","低層非住宅建築物は鉄骨造が圧倒的多数である","スギ大径材を活用した横架材の製造技術の開発を進める","新設住宅着工戸数は中長期的に増加する見込みである"],"answer":3,"explanation":"メモでは、人口の減少・高齢化に伴い、新設住宅着工戸数は中長期的に減少する見込みとされています。したがって「増加する見込み」が誤りです。ほかの3つは、メモの記述や図の注記と一致します。","evidence":["中長期的には人口の減少・高齢化に伴い、新設住宅着工戸数が減少する見込み"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-07-a2","memo_id":"12-07","genre_id":"12","level":"advanced","question":"ツーバイフォー住宅の枠組材の国産材率は、R3からR6にかけて何ポイント上昇したか。","choices":["11ポイント","10ポイント","7ポイント","3ポイント"],"answer":0,"explanation":"枠組材の国産材率はR3が9%、R6が20%なので、上昇幅は11ポイントです。7ポイントはR4（10%）からR5（17%）への上昇幅で、期間を取り違えたひっかけです。","evidence":["ツーバイフォー工法の枠組材について、","国産樹種の規格整備等により"],"source":{"memo_id":"12-07","page":7,"print_page":143,"title":"住宅・非住宅分野での国産材の利用拡大"}},{"id":"12-08-b1","memo_id":"12-08","genre_id":"12","level":"beginner","question":"一口メモで、建築用材以外にも木材利用を拡大するため技術開発を推進するとされている木質系新素材はどれか。","choices":["改質リグニンとセルロースナノファイバー","スギCLTと木質耐火部材","大径材と広葉樹材","せっこうボードと不燃木材"],"answer":0,"explanation":"要点に、木質系新素材である改質リグニンやセルロースナノファイバーの技術開発を推進すると書かれています。スギCLTや木質耐火部材は非住宅・中高層建築物の木造化に向けた技術、大径材・広葉樹材は内装材等の原料として挙げられたものです。","evidence":["建築用材以外にも木材利用を拡大するため、木質系新素材である改質リグニンやセルロースナノファ"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-08-b2","memo_id":"12-08","genre_id":"12","level":"beginner","question":"非住宅・中高層建築物での木材利用拡大に向け、国産材利用による効果について推進するとされている取組はどれか。","choices":["効果の「見える化」","効果の「義務化」","効果の「規制化」","効果の「無償化」"],"answer":0,"explanation":"要点に、国産材利用による効果の「見える化」を推進すると書かれています。義務化・規制化・無償化はメモに書かれていません。","evidence":["国産材利用による効果の「見える化」、コスト等の"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-08-i1","memo_id":"12-08","genre_id":"12","level":"intermediate","question":"一口メモで、セルロースナノファイバー（CNF）はセルロースをどの程度の大きさまで解きほぐした繊維状物質とされているか。","choices":["100万分の1mm","1万分の1mm","1000分の1mm","10億分の1mm"],"answer":0,"explanation":"CNFはセルロースを化学的・機械的に処理してナノサイズ（100万分の1mm）まで解きほぐした繊維状物質と説明されています。ほかの選択肢の大きさはメモに書かれていません。","evidence":["セルロースを化学的・機械的に処理してナノサイズ（100万分の１mm）"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-08-i2","memo_id":"12-08","genre_id":"12","level":"intermediate","question":"一口メモで紹介されている木造の中高層建築物（研修所）は、地上何階建てか。","choices":["地上11階建て","地上8階建て","地上15階建て","地上20階建て"],"answer":0,"explanation":"中高層建築物の例として「木造の地上11階建て研修所」が紹介されています。8階・15階・20階はメモにありません。","evidence":["（木造の地上11階建て研修所）"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-08-a1","memo_id":"12-08","genre_id":"12","level":"advanced","question":"一口メモの木質系新素材の技術開発に関する説明として、誤っているものはどれか。","choices":["CNFは軽量ながら高強度という性質を持つ","改質リグニンは耐熱性と加工性が高い素材である","改質リグニンは輸入広葉樹のチップを原料とする","木材成分の利用は化石資源由来プラスチックの代替になる"],"answer":2,"explanation":"改質リグニンは日本固有樹種であるスギのチップを原料としており、輸入広葉樹のチップではありません。CNFの軽量・高強度、改質リグニンの耐熱性・加工性、プラスチック代替はいずれもメモに書かれています。","evidence":["日本固有樹種であるスギのチップに、ポリエチレングリコールを混ぜて"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-08-a2","memo_id":"12-08","genre_id":"12","level":"advanced","question":"建築物への木材利用に係る評価ガイダンスで、評価項目「サーキュラーエコノミーへの貢献」と同じ評価分野に属する評価項目はどれか。","choices":["持続可能な木材の調達","建築物への炭素の貯蔵","建築物のエンボディドカーボンの削減","内装木質化による心身面等の効果"],"answer":0,"explanation":"「サーキュラーエコノミーへの貢献」は「2.持続可能な資源の利用」に属し、同じ分野には「持続可能な木材の調達」があります。炭素の貯蔵とエンボディドカーボンの削減は「カーボンニュートラルへの貢献」、内装木質化の効果は「快適空間の実現」の項目です。","evidence":["2.持続可能な資源の利用","①持続可能な木材の調達","③サーキュラーエコノミーへの貢献"],"source":{"memo_id":"12-08","page":8,"print_page":144,"title":"建築物等での木材利用と木質系新素材の技術開発"}},{"id":"12-09-b1","memo_id":"12-09","genre_id":"12","level":"beginner","question":"2021年の公共建築物等木材利用促進法の改正で、法の対象はどのように変わったか。","choices":["公共建築物から建築物一般へ拡大された","建築物一般から公共建築物へ限定された","住宅分野から非住宅分野へ移された","公共建築物から公共土木施設へ移された"],"answer":0,"explanation":"メモには、2021年の改正で法の対象を公共建築物から建築物一般へ拡大したと書かれています。対象を限定したり、土木施設へ移したりしたのではありません。","evidence":["2021年の同法改正により、法の対象を公共建築物から建築物一般へ拡大"],"source":{"memo_id":"12-09","page":9,"print_page":145,"title":"建築物等における木材利用の促進"}},{"id":"12-09-b2","memo_id":"12-09","genre_id":"12","level":"beginner","question":"一般消費者を対象に、木材利用の意義を普及啓発するために展開している取組の名称はどれか。","choices":["木づかい運動","木育サミット","木材利用促進協定","木造化推進計画"],"answer":0,"explanation":"一般消費者を対象に木材利用の意義を普及啓発するのは「木づかい運動」です。建築物木材利用促進協定は国・地方公共団体と事業者等が結ぶ協定で、消費者向けの普及啓発の名称ではありません。","evidence":["一般消費者を対象に木材利用の意義を普及啓発する「木づかい運動」を展開。"],"source":{"memo_id":"12-09","page":9,"print_page":145,"title":"建築物等における木材利用の促進"}},{"id":"12-09-i1","memo_id":"12-09","genre_id":"12","level":"intermediate","question":"2026年5月末時点で、国と事業者等との間で結ばれた建築物木材利用促進協定は何件か。","choices":["33件","228件","21件","145件"],"answer":0,"explanation":"国と事業者等との協定は2026年5月末時点で33件です。228件は地方公共団体と事業者等との協定の件数なので、取り違えに注意が必要です。","evidence":["国と事業者等との協定：33件（2026年５月末時点）"],"source":{"memo_id":"12-09","page":9,"print_page":145,"title":"建築物等における木材利用の促進"}},{"id":"12-09-a2","memo_id":"12-09","genre_id":"12","level":"advanced","question":"建築物での木材利用の促進に関する記述として、メモの内容と誤っているものはどれか。","choices":["公共建築物等木材利用促進法は2010年に制定された","改正後の法の通称は「都市（まち）の木造化推進法」である","協定では国又は地方公共団体が事業者等に必要な支援を行う","2021年の法改正で建築物木材利用促進協定制度が廃止された"],"answer":3,"explanation":"2021年の法改正では建築物木材利用促進協定制度が「創設」されたので、廃止とする記述が誤りです。ほかの3つは、制定年、通称、協定での国・地方公共団体の支援についてメモの記載どおりです。","evidence":["化推進法」）し、建築物木材利用促進協定制度を創設。"],"source":{"memo_id":"12-09","page":9,"print_page":145,"title":"建築物等における木材利用の促進"}},{"id":"12-10-b1","memo_id":"12-10","genre_id":"12","level":"beginner","question":"食料・農業・農村基本計画で、2030年までの農林水産物・食品の輸出額目標のうち、林産物の目標額はいくらか。","choices":["1,660億円","5,000億円","596億円","1,000億円"],"answer":0,"explanation":"基本計画では輸出額を2030年までに5兆円とし、うち林産物は1,660億円とする目標を設定しています。596億円は2025年の木材輸出額であり目標額ではありません。","evidence":["を2030年までに５兆円（うち林産物は1,660億円）とする目標を設定"],"source":{"memo_id":"12-10","page":10,"print_page":146,"title":"木材輸出の拡大に向けた取組と輸出額の推移"}},{"id":"12-10-b2","memo_id":"12-10","genre_id":"12","level":"beginner","question":"2025年5月に改訂された「農林水産物・食品の輸出拡大実行戦略」で、木材の重点品目とされているものはどれか。","choices":["製材と合板","丸太と木炭","丸太と製材","合板と木炭"],"answer":0,"explanation":"2025年5月の改訂で重点品目は製材と合板とされています。丸太は、転換を図る対象である「丸太中心の輸出」に当たり、重点品目ではありません。","evidence":["（2025年５月改訂。重点品目：製材、合板）"],"source":{"memo_id":"12-10","page":10,"print_page":146,"title":"木材輸出の拡大に向けた取組と輸出額の推移"}},{"id":"12-10-i2","memo_id":"12-10","genre_id":"12","level":"intermediate","question":"グラフ「品目別木材輸出額の推移」で、2025年の木材輸出額に占める丸太の割合はどれか。","choices":["50%","53%","18%","17%"],"answer":0,"explanation":"2025年の丸太は298億円で全体の50%を占めます。53%は国・地域別で中国が占める割合、18%はその他、17%は製材の割合です。","evidence":["298 (50%)"],"source":{"memo_id":"12-10","page":10,"print_page":146,"title":"木材輸出の拡大に向けた取組と輸出額の推移"}},{"id":"12-10-a2","memo_id":"12-10","genre_id":"12","level":"advanced","question":"グラフ「品目別木材輸出額の推移」で、2025年の製材の輸出額はいくらか。","choices":["102億円","98億円","92億円","74億円"],"answer":0,"explanation":"2025年の製材は102億円（17%）です。98億円は2021年、92億円は2022年、74億円は2024年の製材の値で、別の年の数値です。","evidence":["102 (17%)"],"source":{"memo_id":"12-10","page":10,"print_page":146,"title":"木材輸出の拡大に向けた取組と輸出額の推移"}},{"id":"12-11-b1","memo_id":"12-11","genre_id":"12","level":"beginner","question":"国内の林家（56万戸）のうち、保有山林が10ha未満の林家はおよそどれくらいの割合か。","choices":["約9割","約7割","約5割","約3割"],"answer":0,"explanation":"要点に、林家（56万戸）の約9割が10ha未満と小規模であると書かれています。約7割や約5割などは記載と合わず誤りです。","evidence":["○ 国内の森林の所有構造を見ると、林家（56万戸）の約９割が10ha未満と小規模。所有者不明森林も増加。"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-11-b2","memo_id":"12-11","genre_id":"12","level":"beginner","question":"2025年の法改正で措置された、地域の関係者の協議を通じて森林の集積・集約化を迅速に進める新たな仕組みの名称はどれか。","choices":["集約化構想","地域計画","森林経営計画","経営管理権集積計画"],"answer":0,"explanation":"要点に、2025年の法改正により新たな仕組みである「集約化構想」を措置したと書かれています。ほかの名称はこのページで新たな仕組みとして示されていません。","evidence":["○ 2025年の法改正により、林業経営体を含む地域の関係者の協議を通じて集積・集約化を迅速に進める新たな仕組","みである「集約化構想」を措置（2026年４月施行）。"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-11-i1","memo_id":"12-11","genre_id":"12","level":"intermediate","question":"国土交通省の令和5年度の調査で、所有者不明土地の割合が最も高い地目はどれか。","choices":["林地","宅地","農用地","合計"],"answer":0,"explanation":"表では林地が33.4%で最も高く、宅地20.8%、農用地24.5%、合計25.6%を上回っています。農用地も比較的高いですが林地には及びません。","evidence":["33.4%","資料：国土交通省「令和５年度地籍調査における土地所有者等に関する調査」"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-11-i2","memo_id":"12-11","genre_id":"12","level":"intermediate","question":"森林経営管理制度の実績で、2024年度末時点の累計の意向調査実施面積はどれか。","choices":["約118万ha","約11.8万ha","約2.9万ha","約0.4万ha"],"answer":0,"explanation":"表では意向調査実施面積は約118万haです。約2.9万haは市町村への委託、約0.4万haは林業経営体への再委託の面積で、約11.8万haは桁が違います。","evidence":["■ 森林経営管理制度の実績（2024年度末時点累計）","約118万ha"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-11-a1","memo_id":"12-11","genre_id":"12","level":"advanced","question":"森林経営管理法とその改正について、このページの内容として誤っているものはどれか。","choices":["森林経営管理法は2019年に施行された","林業経営に適した森林は市町村が自ら管理する","所有者不明森林も特例の対象とされている","集約化構想は2026年4月に施行される"],"answer":1,"explanation":"林業経営に適した森林は林業経営体に集約化し、市町村が自ら管理するのは林業経営に適さない森林です。2019年施行、所有者不明森林の特例、2026年4月施行はいずれも記載どおりです。","evidence":["林業経営に適した森林は林業経営体に集約化するとともに、林業経営に適","さない森林は市町村が管理する仕組みを構築。所有者不明森林も特例対象に。"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-11-a2","memo_id":"12-11","genre_id":"12","level":"advanced","question":"2024年度末時点の累計で、市町村への委託面積から林業経営体への再委託面積を差し引くと、およそ何haになるか。","choices":["約2.5万ha","約3.3万ha","約115.1万ha","約117.6万ha"],"answer":0,"explanation":"市町村への委託は約2.9万ha、林業経営体への再委託は約0.4万haなので、差は約2.5万haです。約3.3万haは両者を足した値、約115.1万haは意向調査実施面積から委託面積を引いた値で誤りです。","evidence":["■ 森林経営管理制度の実績（2024年度末時点累計）","約2.9万ha","約0.4万ha"],"source":{"memo_id":"12-11","page":11,"print_page":147,"title":"森林の所有構造と森林経営管理制度"}},{"id":"12-12-b1","memo_id":"12-12","genre_id":"12","level":"beginner","question":"会社・森林組合等の林業従事者は、直近20年でどの程度減少したとされていますか。","choices":["約5分の1減少","約4分の1減少","約3分の1減少","約2分の1減少"],"answer":2,"explanation":"要点に「直近20年で3分の1減少」と書かれています。2000年の6.8万人から2020年の4.4万人へ2.4万人減っており、半分や4分の1ではありません。","evidence":["会社・森林組合等の林業従事者は、直近20年で３分の１減少。"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-12-b2","memo_id":"12-12","genre_id":"12","level":"beginner","question":"林業従事者を確保するための研修を行う林業大学校等は、全国でいくつの道府県・何校ありますか。","choices":["28道府県29校","29道府県28校","28道府県32校","32道府県29校"],"answer":0,"explanation":"要点に「全国28道府県29校の林業大学校等」と書かれています。道府県数と校数を入れ替えた選択肢や、数を変えた選択肢は誤りです。","evidence":["林業従事者を確保するため、全国28道府県29校の林業大学校等での研修や「緑の雇用」"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-12-i1","memo_id":"12-12","genre_id":"12","level":"intermediate","question":"「林業従事者数」のグラフで、2020年の林業従事者数は何万人ですか。","choices":["6.8万人","5.1万人","4.5万人","4.4万人"],"answer":3,"explanation":"グラフでは2020年の林業従事者数は4.4万人です。4.5万人は2015年、5.1万人は2010年、6.8万人は2000年の値です。","evidence":["▲2.4万人","会社・森林組合等の林業従事者は、直近20年で３分の１減少。"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-12-i2","memo_id":"12-12","genre_id":"12","level":"intermediate","question":"「新規就業者数の推移」のグラフで示されている、林業の新規就業者数の平均はおよそ何人ですか。","choices":["約2,300人","約3,200人","約4,400人","約2,400人"],"answer":1,"explanation":"グラフに「平均：約3,200人」と示されています。約2.3万人は「緑の雇用」による新規就業者の累計、2.4万人は林業従事者の減少数で、混同しないよう注意が必要です。","evidence":["平均：約3,200人"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-12-a1","memo_id":"12-12","genre_id":"12","level":"advanced","question":"「緑の雇用」による新規就業者数と、2003年以降の新規就業者全体に占めるその割合の組み合わせとして正しいものはどれですか。","choices":["約2.3万人・約3割","約2.4万人・約3割","約3,200人・約3割","約2.3万人・約5割"],"answer":0,"explanation":"「緑の雇用」による新規就業者は約2.3万人で、2003年以降全体の約3割です。約2.4万人は林業従事者の20年間の減少数、約3,200人は新規就業者数の平均です。","evidence":["「緑の雇用」による新規就業者約2.3万人","（2003年以降全体の約３割）"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-12-a2","memo_id":"12-12","genre_id":"12","level":"advanced","question":"「緑の雇用」事業等の支援内容の説明として、誤っているものはどれですか。","choices":["林業大学校等の学生へ最大155万円/年・人を最長2年給付","トライアル雇用研修は9万円/月・人を最大3ヶ月支援","林業作業士は10年目以降を対象に9万円/年・人を支援","現場管理責任者は5年目以降を対象に9万円/年・人を支援"],"answer":2,"explanation":"林業作業士（フォレストワーカー）は1～3年目が対象で、3年間の体系的な研修を約137万円/年・人で支援します。10年目以降が対象なのは統括現場管理責任者（フォレストマネージャー）です。","evidence":["安全で効率的な作業に必要な知識・技術等を習得するため","研修を支援（約137万円/年・人）"],"source":{"memo_id":"12-12","page":12,"print_page":148,"title":"林業従事者の確保と「緑の雇用」事業"}},{"id":"12-13-b1","memo_id":"12-13","genre_id":"12","level":"beginner","question":"このメモで、スマート林業技術の幅広い導入によって実現するとしている「スマート林業」の姿はどれか。","choices":["安全で、楽しく、効率的な林業","安価で、大規模で、集約的な林業","伝統的で、静かで、手作業中心の林業","輸出向けで、高単価で、少量生産の林業"],"answer":0,"explanation":"メモの要点は、AIやICT、自動運転等の導入により「安全で、楽しく、効率的な」スマート林業を実現するとしています。ほかの選択肢の表現はメモにありません。","evidence":["安全で、楽しく、効率的な「スマート林業」を実現。"],"source":{"memo_id":"12-13","page":13,"print_page":149,"title":"スマート林業の全体像"}},{"id":"12-13-b2","memo_id":"12-13","genre_id":"12","level":"beginner","question":"このメモで、「林業DX」はスマート林業技術の活用とともに何を根本的に見直すものとされているか。","choices":["従来の業務手順や商慣習","森林の所有権と登記制度","木材の輸入関税と貿易制度","林業従事者の資格と試験制度"],"answer":0,"explanation":"林業DXは、AI・ICT等の活用とともに従来の業務手順や商慣習を根本的に見直し、効率化と付加価値向上を実現するものとされています。登記・関税・資格制度の見直しはメモに書かれていません。","evidence":["従来の業務手順や商慣習を根本的に見直す”林業DX” により、効率化と付加価値向上を実現"],"source":{"memo_id":"12-13","page":13,"print_page":149,"title":"スマート林業の全体像"}},{"id":"12-13-i1","memo_id":"12-13","genre_id":"12","level":"intermediate","question":"スマート林業の全体像の図で、林業DXの「＜付加価値の向上＞」に示されている技術はどれか。","choices":["QRコードによる品質証明の電子共有","デジタルツインによる境界明確化","AI解析による施業計画の作成自動化","植栽配置計画の自動作成"],"answer":0,"explanation":"図の＜付加価値の向上＞の下には「QRコードによる品質証明の電子共有」が示されています。デジタルツインは＜境界の明確化・森林の集約化＞、AI解析は＜森林資源量の把握・施業提案＞、植栽配置計画は造林の＜造林計画＞の技術です。","evidence":["QRコードによる品質","証明の電子共有"],"source":{"memo_id":"12-13","page":13,"print_page":149,"title":"スマート林業の全体像"}},{"id":"12-13-a1","memo_id":"12-13","genre_id":"12","level":"advanced","question":"スマート林業の全体像の図で、区分と技術の組み合わせとして誤っているものはどれか。","choices":["＜境界の明確化・森林の集約化＞－デジタルツインによる境界明確化","＜森林資源量の把握・施業提案＞－レーザによる単木資源情報の把握","＜集材＞－AIにより木材を検知する自動運転集材機械","＜植栽＞－下刈り要否の自動判定"],"answer":3,"explanation":"「下刈り要否の自動判定」は＜植栽＞ではなく＜下刈り＞の技術で、＜植栽＞には遠隔操作植栽機械が示されています。ほかの3つは図の区分と技術が正しく対応しています。","evidence":["遠隔操作植栽機械 下刈り要否の自動判定"],"source":{"memo_id":"12-13","page":13,"print_page":149,"title":"スマート林業の全体像"}},{"id":"12-13-a2","memo_id":"12-13","genre_id":"12","level":"advanced","question":"このメモで、「伐採・搬出」と「造林」でのスマート林業技術の実装がそれぞれ実現するとしている内容の組み合わせとして正しいものはどれか。","choices":["伐採・搬出：労働安全の確保と労働生産性の大幅な向上／造林：労働負荷の高い作業ゼロと省力化","伐採・搬出：労働負荷の高い作業ゼロと省力化／造林：労働安全の確保と労働生産性の大幅な向上","伐採・搬出：効率化と付加価値向上／造林：労働安全の確保と労働生産性の大幅な向上","伐採・搬出：労働安全の確保と労働生産性の大幅な向上／造林：効率化と付加価値向上"],"answer":0,"explanation":"伐採・搬出はチェーンソーによる伐倒を極力なくし労働安全と労働生産性の大幅な向上を、造林は労働負荷の高い作業ゼロと省力化を実現するとしています。「効率化と付加価値向上」は林業DXが実現する内容なので、これを含む選択肢は誤りです。","evidence":["労働安全の確保と労働生産性の大幅な向上を実現","施業方法の転換により、労働負荷の高い"],"source":{"memo_id":"12-13","page":13,"print_page":149,"title":"スマート林業の全体像"}},{"id":"12-14-b1","memo_id":"12-14","genre_id":"12","level":"beginner","question":"2024年度の税制改正で、森林環境譲与税の私有林人工林面積の譲与割合はどう見直されたか。","choices":["5/10から55/100に","5/10から45/100に","5/10から60/100に","2/10から20/100に"],"answer":0,"explanation":"要点に、私有林人工林面積の譲与割合を5/10から55/100に見直したと書かれています。45/100や60/100は記載と異なり、2/10から20/100は林業就業者数の見直しです。","evidence":["私有林人工林面積の","譲与割合を5/10から55/100に"],"source":{"memo_id":"12-14","page":14,"print_page":150,"title":"森林環境税・森林環境譲与税の概要"}},{"id":"12-14-b2","memo_id":"12-14","genre_id":"12","level":"beginner","question":"市町村の森林整備等の財源を安定的に確保するため、森林環境税・森林環境譲与税が創設されたのは何年か。","choices":["2019年","2020年","2021年","2024年"],"answer":0,"explanation":"要点に、2019年に創設したと書かれています。2024年は譲与基準を見直した税制改正の年度で、創設の年ではありません。","evidence":["市町村が実施する森林整備等に必要な財源を安定的に確保する観点から、2019年に森林"],"source":{"memo_id":"12-14","page":14,"print_page":150,"title":"森林環境税・森林環境譲与税の概要"}},{"id":"12-14-i1","memo_id":"12-14","genre_id":"12","level":"intermediate","question":"森林環境税の概要の図で、納税義務者に課される森林環境税の額は1年あたりいくらか。","choices":["500円/年","1,000円/年","1,500円/年","2,000円/年"],"answer":1,"explanation":"概要の図に「森林環境税 1,000円/年」と書かれています。500円・1,500円・2,000円はいずれも記載と異なります。","evidence":["森林環境税 1,000円/年"],"source":{"memo_id":"12-14","page":14,"print_page":150,"title":"森林環境税・森林環境譲与税の概要"}},{"id":"12-14-a1","memo_id":"12-14","genre_id":"12","level":"advanced","question":"森林環境税・森林環境譲与税について、このメモの内容として誤っているものはどれか。","choices":["森林環境税は2024年度から施行された","森林環境譲与税は2019年度から施行された","見直し後、人口の譲与割合は30/100となった","都道府県は譲与税を市町村の支援に充てる"],"answer":2,"explanation":"2024年度の見直しで、人口の譲与割合は3/10から25/100になりました。30/100は見直し前の3/10と同じ割合で、誤りです。","evidence":["人口の譲与割合を3/10から25/100に見直し。"],"source":{"memo_id":"12-14","page":14,"print_page":150,"title":"森林環境税・森林環境譲与税の概要"}},{"id":"12-15-b1","memo_id":"12-15","genre_id":"12","level":"beginner","question":"このメモで、林野火災の出火原因について述べている内容はどれか。","choices":["ほとんどが人為的な要因による","ほとんどが落雷などの自然現象による","人為的要因と自然要因がほぼ半々","大半は原因不明とされている"],"answer":0,"explanation":"メモの要点に、林野火災の出火原因はほとんどが人為的な要因によるものと書かれています。落雷などの自然要因が主という記述や、半々・原因不明という記述はありません。","evidence":["林野火災の出火原因はほとんどが人為的な要因によるもの"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-15-b2","memo_id":"12-15","genre_id":"12","level":"beginner","question":"このメモで、全国の林野火災の発生件数は長期的にどのような傾向とされているか。","choices":["長期的には減少傾向にある","長期的には増加傾向にある","長期的にはほぼ横ばいである","長期的には増減を繰り返し急増中"],"answer":0,"explanation":"要点に、発生件数は長期的には減少傾向にあると書かれています。ただし近年は各地で大規模な林野火災が発生しているため、増加と取り違えないよう注意が必要です。","evidence":["発生件数は長期的には減少傾向にあるが、近年は 各地で大規模な林野火災が発生"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-15-i1","memo_id":"12-15","genre_id":"12","level":"intermediate","question":"2021年〜2025年平均の全国の林野火災の出火件数はどれか。","choices":["1,128件","1,043件","1,745件","5,412件"],"answer":0,"explanation":"2021年〜2025年平均の出火件数は1,128件です。1,745は同じ期間の平均焼損面積（ha）の数値で、1,043件と5,412はグラフ上に示された別の値です。","evidence":["出火件数：1,128件","焼損面積：1,745ha"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-15-i2","memo_id":"12-15","genre_id":"12","level":"intermediate","question":"令和2年〜令和6年平均の林野火災の発生原因のうち、「放火（疑い含む）」の割合はどれか。","choices":["7.7％","4.1％","2.7％","18.9％"],"answer":0,"explanation":"円グラフでは、放火（疑い含む）は7.7％です。4.1％はたばこ、2.7％はマッチ・ライター、18.9％は火入れの割合です。","evidence":["（令和２(2020)年～令和６(2024)年の平均）","7.7％ 消防庁資料により作成"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-15-a1","memo_id":"12-15","genre_id":"12","level":"advanced","question":"令和2年〜令和6年平均の林野火災の発生原因のうち、「たき火」と「火入れ」を合わせた割合はどれか。","choices":["51.4％","65.6％","40.2％","36.6％"],"answer":0,"explanation":"たき火32.5％と火入れ18.9％を合わせると51.4％となり、原因の半分を超えます。65.6％はたき火とその他、40.2％はたき火と放火、36.6％はたき火とたばこを合わせた値です。","evidence":["たき火 32.5％","18.9％"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-15-a2","memo_id":"12-15","genre_id":"12","level":"advanced","question":"このメモの内容について、誤っているものはどれか。","choices":["2021〜2025年平均の焼損面積は5,412ha","保安林には17種類がある","令和8年1月22日に初の3庁合同記者会見","令和8年統一標語は「山火事を起こすも防ぐも私たち」"],"answer":0,"explanation":"2021〜2025年平均の焼損面積は1,745haであり、5,412haはグラフ上の別の値なので誤りです。保安林が17種類あること、令和8年1月22日に初めて3庁合同の記者会見が行われたこと、統一標語の内容は、いずれもメモの記述どおりです。","evidence":["焼損面積：1,745ha"],"source":{"memo_id":"12-15","page":15,"print_page":151,"title":"保安林・治山事業と林野火災対策"}},{"id":"12-16-b1","memo_id":"12-16","genre_id":"12","level":"beginner","question":"このページの要点で、特定苗木（エリートツリー等の苗木）等の活用によって削減を図るとされているものはどれか。","choices":["下刈り回数","間伐回数","林道の延長","苗木の運搬距離"],"answer":0,"explanation":"要点では、特定苗木等の活用による「下刈り回数の削減」で造林の省力化・低コスト化を図るとしています。間伐回数や林道の延長、運搬距離の削減は、特定苗木の効果として書かれていません。","evidence":["特定苗木（エリートツリー等の苗木）等の活用による下刈り回数の削減等の造林の省力"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-16-b2","memo_id":"12-16","genre_id":"12","level":"beginner","question":"このページの要点で、路網整備の推進が必要とされる理由はどれか。","choices":["間伐や再造林、木材輸送等を効率的に行うため","森林を宅地や農地に転用しやすくするため","観光客が森林へ入りやすくするため","山火事の延焼を防ぐ防火帯にするため"],"answer":0,"explanation":"要点には「間伐や主伐後の再造林、木材の輸送等を効率的に実施するため」に路網整備が必要と書かれています。転用・観光・防火帯のための路網整備は、このページに書かれていません。","evidence":["間伐や主伐後の再造林、木材の輸送等を効率的に実施するために、路網整備の推進が必要。"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-16-i1","memo_id":"12-16","genre_id":"12","level":"intermediate","question":"このページの再造林コストの説明で、育林経費のうち造林初期費用が占める割合はどれか。","choices":["約3割","約5割","約7割","約9割"],"answer":2,"explanation":"ページには「育林経費の約7割が造林初期費用」とあります。3割・5割・9割という記述はありません。","evidence":["育林経費の約7割が造林初期"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-16-i2","memo_id":"12-16","genre_id":"12","level":"intermediate","question":"山形県西川町の事例で、伐採と造林の一貫作業（機械のグラップル＋仕上げは人力）による1ha当たりのコストはどれか。","choices":["約22万円/ha","約31万円/ha","約15万円/ha","約27万円/ha"],"answer":0,"explanation":"一貫作業のコストは約22万円/haで、従来の約31万円/haから3割減です。約31万円/haは従来方式の値なので誤りです。","evidence":["約22万円/ha","約31万円/ha"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-16-a1","memo_id":"12-16","genre_id":"12","level":"advanced","question":"このページの再造林の推進と路網の整備について、誤っているものはどれか。","choices":["一貫作業では伐採・搬出時の林業機械を活用し地拵え等を機械化する","林業専用道は10t積トラック等の走行を想定した道である","特定苗木には下刈り回数の低減など造林コストの低減が期待される","一貫作業により1ha当たりの人工数は従来から3割減となる"],"answer":3,"explanation":"人工数は従来の20.0人日/haから8.3人日/haとなり「6割減」です。「3割減」はコストの減少率なので、人工数の説明としては誤りです。","evidence":["伐採・搬出時に使用した林業機械を活用し、","めに10t積トラック等の","下刈り回数の低減など造林コ"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-16-a2","memo_id":"12-16","genre_id":"12","level":"advanced","question":"1ha当たりの育林費用（獣害対策含む）の試算で前提とされた、スギの植栽本数と下刈り回数の組み合わせはどれか。","choices":["スギ3,000本/ha・下刈り5回","スギ3,000本/ha・下刈り3回","スギ2,000本/ha・下刈り5回","スギ2,000本/ha・下刈り3回"],"answer":0,"explanation":"注に、令和7(2025)年度の標準単価を用い、スギ3,000本/ha植栽、下刈り5回、獣害防護柵400mとして試算したとあります。2,000本や3回という条件は書かれていません。","evidence":["スギ3,000本/ha","植栽、下刈り５回、獣害"],"source":{"memo_id":"12-16","page":16,"print_page":152,"title":"森林整備・再造林の推進と路網の整備"}},{"id":"12-17-b1","memo_id":"12-17","genre_id":"12","level":"beginner","question":"令和5年5月の「花粉症に関する関係閣僚会議」で取りまとめられた「花粉症対策の全体像」の3本柱として正しいものはどれか。","choices":["「発生源対策」「飛散対策」「発症・暴露対策」","「発生源対策」「需要対策」「医療・治療対策」","「伐採対策」「飛散対策」「予防・啓発対策」","「植替え対策」「流通対策」「発症・暴露対策」"],"answer":0,"explanation":"メモでは「発生源対策」「飛散対策」「発症・暴露対策」の3本柱とされています。スギ材需要の拡大や伐採・植替えは初期集中対応パッケージの取組であり、3本柱の名称ではありません。","evidence":["「発生源対策」「飛散対策」「発症・暴露対策」を３本柱とした「花粉症対策の全体像」"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-17-b2","memo_id":"12-17","genre_id":"12","level":"beginner","question":"初期の段階から集中的に実施すべき対応として、令和5年10月に策定されたものはどれか。","choices":["「花粉症対策の全体像」","「花粉症対策 初期集中対応パッケージ」","「スギ花粉 中長期削減プログラム」","「花粉症対策 緊急支援パッケージ」"],"answer":1,"explanation":"令和5年10月に策定されたのは「花粉症対策 初期集中対応パッケージ」です。「花粉症対策の全体像」は同年5月の関係閣僚会議で取りまとめられたもので、時期が異なります。","evidence":["として令和５年10月に「花粉症対策 初期集中対応パッケージ」が策定され"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-17-i1","memo_id":"12-17","genre_id":"12","level":"intermediate","question":"「花粉症対策の全体像」では、花粉発生源となるスギ人工林を令和15年度（10年後）にどの程度減少させることを目指しているか。","choices":["約1割減少","約2割減少","約3割減少","約5割減少（半減）"],"answer":1,"explanation":"10年後（令和15年度）の目標は約2割減少です。半減は約30年後の目標であり、令和15年度の目標ではありません。","evidence":["花粉発生源となるスギ人工林を10年後（令和15年度）に約２割減","少、約30年後に半減させることなどを目指すこととされ"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-17-i2","memo_id":"12-17","genre_id":"12","level":"intermediate","question":"花粉の少ない苗木の生産拡大で、「原種苗木」を増産する施設の整備はいつまでに完了させるとされているか。","choices":["令和5年度","令和6年度","令和7年度","令和15年度"],"answer":1,"explanation":"原種苗木を増産する施設の整備は令和6年度に完了させるとされています。令和15年度はスギ人工林約2割減少の目標年度で、別の事項です。","evidence":["する施設の整備を令和６年度に完了させる等、増産を"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-17-a1","memo_id":"12-17","genre_id":"12","level":"advanced","question":"花粉症対策初期集中対応パッケージに関連してメモに示された支援内容として、誤っているものはどれか。","choices":["スギ材需要の拡大として、製材工場・集成材工場等の整備を支援","苗木生産事業者による採種園・採穂園の整備を支援","飛散対策として、空中散布試験・環境影響調査を支援","伐採・植替えの加速化に向け、林業機械の導入を支援"],"answer":1,"explanation":"採種園・採穂園の整備の支援対象は都道府県等で、苗木生産事業者にはコンテナ苗生産施設等の整備を支援するとされています。その他の3つはメモの記載どおりです。","evidence":["苗木生産に必要な種子や穂木を生産する採種園・","・コンテナ苗生産施設等の整備を支援。"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-17-a2","memo_id":"12-17","genre_id":"12","level":"advanced","question":"メモの「花粉の少ない苗木の生産拡大」に示された生産の流れとして、正しい順序はどれか。","choices":["原種苗木 → 種穂の増産 → 苗木の増産","種穂の増産 → 原種苗木 → 苗木の増産","苗木の増産 → 種穂の増産 → 原種苗木","原種苗木 → 苗木の増産 → 種穂の増産"],"answer":0,"explanation":"原種苗木が配布されて採種園・採穂園で種子や穂木（種穂）が生産され、それが供給されて苗木が増産される流れです。原種苗木は採種園・採穂園の造成に必要なものなので、種穂より前に位置します。","evidence":["採種園・採穂園の造成に必要な 「原種苗木」を増産","苗木生産に必要な種子や穂木を生産する採種園・"],"source":{"memo_id":"12-17","page":17,"print_page":153,"title":"花粉症対策（スギ人工林の発生源対策等）"}},{"id":"12-18-b1","memo_id":"12-18","genre_id":"12","level":"beginner","question":"人口が全人口の2.5％にとどまる山村地域には、我が国の森林のおよそどれだけが存在するとされていますか。","choices":["約3割","約4割","約6割","約8割"],"answer":2,"explanation":"メモの要点では、山村地域は全人口のわずか2.5％を占める一方で、我が国の森林の約6割が存在するとしています。約3割・約4割・約8割はいずれもメモの記述と合いません。","evidence":["全人口のわずか2.5％を占める一方","が国の森林の約６割が存在"],"source":{"memo_id":"12-18","page":18,"print_page":154,"title":"森業を通じた山村地域の活性化"}},{"id":"12-18-b2","memo_id":"12-18","genre_id":"12","level":"beginner","question":"山村の振興に向け、森林の総合的な活用を進め、山村地域の所得の向上や豊かな森林づくりにつなげるとして推進される取組の名称はどれですか。","choices":["森業（もりぎょう）","調整サービス","関係人口","振興山村"],"answer":0,"explanation":"要点で、山村地域の所得の向上や豊かな森林づくりにつなげる取組を「森業（もりぎょう）」として推進するとしています。調整サービスは生態系サービスの区分、関係人口は活性化の成果の一つ、振興山村は山村振興法に基づき指定された区域を指します。","evidence":["域の所得の向上や豊かな森林づくりにつなげる森業（もりぎょう）を推進。"],"source":{"memo_id":"12-18","page":18,"print_page":154,"title":"森業を通じた山村地域の活性化"}},{"id":"12-18-a1","memo_id":"12-18","genre_id":"12","level":"advanced","question":"「山村地域の面積と人口」の表で、山村地域の総面積の対全国比は何％ですか。","choices":["2.5％","40.6％","47.3％","61.1％"],"answer":2,"explanation":"表で山村地域の総面積の対全国比は47.3％です。61.1％は林野面積、2.5％は人口の対全国比で、40.6％は山村地域の高齢化率です。","evidence":["47.3%\n61.1%\n2.5%"],"source":{"memo_id":"12-18","page":18,"print_page":154,"title":"森業を通じた山村地域の活性化"}},{"id":"12-18-a2","memo_id":"12-18","genre_id":"12","level":"advanced","question":"森業の位置付けに関する国の取組の説明として、誤っているものはどれですか。","choices":["令和6年12月に農林水産省に地方みらい共創研究会が設置された","地方みらい共創戦略は令和7年5月に策定・公表された","森林・林業基本計画では森林由来Ｊ－クレジットの活用等も掲げた","森業は令和8年6月の森林・林業基本計画で初めて位置付けられた"],"answer":3,"explanation":"森業は、令和8年6月の森林・林業基本計画より前の令和7年5月に策定・公表された地方みらい共創戦略ですでに位置付けられているため、「初めて」は誤りです。研究会の設置時期、戦略の策定時期、基本計画でのＪ－クレジット活用はいずれもメモの記述どおりです。","evidence":["令和６年12月に農林水産省に「地方みらい","定・公表。戦略において、「森業」を位置付け。"],"source":{"memo_id":"12-18","page":18,"print_page":154,"title":"森業を通じた山村地域の活性化"}},{"id":"13-01-b1","memo_id":"13-01","genre_id":"13","level":"beginner","question":"令和6（2024）年の我が国の漁業・養殖業生産量（全国の合計）はどれか。","choices":["約164万トン","約264万トン","約364万トン","約464万トン"],"answer":2,"explanation":"メモの要点に、令和6年の漁業・養殖業生産量は364万トンと書かれています。ほかの数値はメモにある生産量の合計と一致しません。","evidence":["令和６（2024）年の我が国の漁業・養殖業生産量は、364万トン。"],"source":{"memo_id":"13-01","page":1,"print_page":155,"title":"漁業・養殖業の生産量と生産額の推移"}},{"id":"13-01-b2","memo_id":"13-01","genre_id":"13","level":"beginner","question":"全国の漁業・養殖業の生産額の動きとして、メモの要点に合うものはどれか。","choices":["コロナ禍等で減少後、令和6年に回復","コロナ禍等で増加後、令和6年に減少","一貫して増え続け、令和6年に最高","一貫して減り続け、令和6年に最低"],"answer":0,"explanation":"生産額は近年1兆6,000億円程度で推移していましたが、コロナ禍等により減少し、令和6年には1兆6,297億円に回復しました。増え続けた・減り続けたという動きではありません。","evidence":["近年１兆6,000億円程度で推移していた漁業・養殖業の生産額は、コロナ禍等によ","り減少したが、令和６年には１兆6,297億円に回復。"],"source":{"memo_id":"13-01","page":1,"print_page":155,"title":"漁業・養殖業の生産量と生産額の推移"}},{"id":"13-01-i1","memo_id":"13-01","genre_id":"13","level":"intermediate","question":"令和6（2024）年の海面漁業の生産量で、遠洋・沖合・沿岸のうち最も多いものと量の組合せはどれか。","choices":["遠洋漁業・1,735千t","沖合漁業・1,735千t","沿岸漁業・1,735千t","沖合漁業・762千t"],"answer":1,"explanation":"表では沖合漁業が1,735千tで最も多く、沿岸漁業は762千t、遠洋漁業は289千tです。762千tは沿岸漁業の値なので沖合漁業の値ではありません。","evidence":["遠洋漁業\n289\n沖合漁業 1,735\n産\n沿岸漁業\n762"],"source":{"memo_id":"13-01","page":1,"print_page":155,"title":"漁業・養殖業の生産量と生産額の推移"}},{"id":"13-01-i2","memo_id":"13-01","genre_id":"13","level":"intermediate","question":"令和6（2024）年の海面養殖業の生産額（億円）はどれか。","choices":["8,915億円","6,077億円","1,305億円","1,163億円"],"answer":1,"explanation":"生産額の表では、海面養殖業は6,077億円です。8,915億円は海面漁業、1,305億円は内水面の合計、1,163億円は内水面養殖業の値です。","evidence":["8,915\n6,077\n1,305\n142\n1,163"],"source":{"memo_id":"13-01","page":1,"print_page":155,"title":"漁業・養殖業の生産量と生産額の推移"}},{"id":"13-01-a1","memo_id":"13-01","genre_id":"13","level":"advanced","question":"令和6（2024）年の漁業・養殖業の生産量・生産額について、誤っているものはどれか。","choices":["海面養殖業の生産量は海面漁業を上回る","遠洋漁業の生産量は沿岸漁業を下回る","内水面の生産量は養殖業が漁業を上回る","内水面の生産額は養殖業が漁業を上回る"],"answer":0,"explanation":"海面養殖業の生産量は803千tで、海面漁業の2,786千tを下回るため誤りです。遠洋289千t＜沿岸762千t、内水面の養殖業29千t＞漁業18千t、内水面生産額の養殖業1,163億円＞漁業142億円は正しい内容です。","evidence":["海\n面\n3,589\n生\n漁\n業 2,786","養 殖 業\n803"],"source":{"memo_id":"13-01","page":1,"print_page":155,"title":"漁業・養殖業の生産量と生産額の推移"}},{"id":"13-02-b1","memo_id":"13-02","genre_id":"13","level":"beginner","question":"このメモによると、世界の水産物の需要が年々増加している要因として挙げられているものはどれか。","choices":["人口増加や経済成長","人口減少や高齢化","養殖技術の普及や輸送費の低下","漁獲量の増加や魚価の下落"],"answer":0,"explanation":"メモでは、世界の水産物の需要は人口増加や経済成長に伴い年々増加しているとされています。人口減少や養殖技術、魚価の下落などは要因として書かれていません。","evidence":["世界の水産物の需要は、人口増加や経済成長に伴い年々増加"],"source":{"memo_id":"13-02","page":2,"print_page":156,"title":"世界と日本の食用魚介類消費量の推移"}},{"id":"13-02-b2","memo_id":"13-02","genre_id":"13","level":"beginner","question":"このメモによると、日本の1人1年当たり食用魚介類の消費量は、近年どのような傾向にあるか。","choices":["近年減少傾向","近年増加傾向","近年は横ばいで推移","世界と同じく年々増加"],"answer":0,"explanation":"メモでは、世界の消費量が増加する一方で、日本では近年減少傾向とされています。増加や横ばい、世界と同じ動きとする選択肢は誤りです。","evidence":["一方で、日本では近年減少傾"],"source":{"memo_id":"13-02","page":2,"print_page":156,"title":"世界と日本の食用魚介類消費量の推移"}},{"id":"13-02-i1","memo_id":"13-02","genre_id":"13","level":"intermediate","question":"このメモによると、世界の1人1年当たり食用魚介類の消費量は、過去約60年でどの程度増加したか。","choices":["約1.5倍に増加","約2倍に増加","約3倍に増加","約4倍に増加"],"answer":1,"explanation":"メモでは、世界の1人1年当たり食用魚介類の消費量は過去約60年で約2倍に増加したとされています。約1.5倍・約3倍・約4倍はいずれも記載と異なります。","evidence":["の食用魚介類の消費量は、過去約60年で約２倍に増加"],"source":{"memo_id":"13-02","page":2,"print_page":156,"title":"世界と日本の食用魚介類消費量の推移"}},{"id":"13-03-b1","memo_id":"13-03","genre_id":"13","level":"beginner","question":"海面養殖業を営む個人経営体の漁労所得の動向として、メモに書かれているものはどれか。","choices":["生産規模拡大も相まって増加傾向","生産規模縮小により減少傾向","近年はほぼ横ばいで推移","震災の影響で大きく減少"],"answer":0,"explanation":"メモでは、海面養殖業を営む個人経営体の漁労所得は1経営体の生産規模拡大も相まって増加傾向とされています。「ほぼ横ばい」は沿岸漁船漁業を営む個人経営体についての記述で、取り違えに注意が必要です。","evidence":["海面養殖業を営む個人経営体の漁労所得は、1経営体の生産規模拡大も相まって増加傾向。"],"source":{"memo_id":"13-03","page":3,"print_page":157,"title":"漁業就業者数と漁家の経営状況"}},{"id":"13-03-b2","memo_id":"13-03","genre_id":"13","level":"beginner","question":"令和6年の全国の漁業就業者数とその傾向として正しいものはどれか。","choices":["11.5万人で増加傾向","11.5万人で減少傾向","1.15万人で減少傾向","115万人で横ばい傾向"],"answer":1,"explanation":"メモでは令和6年の漁業就業者数は11.5万人で減少傾向とされています。人数が同じでも「増加傾向」は向きが誤りで、1.15万人や115万人は桁が違います。","evidence":["令和６年の漁業就業者数は11.5万人で減少傾向。"],"source":{"memo_id":"13-03","page":3,"print_page":157,"title":"漁業就業者数と漁家の経営状況"}},{"id":"13-03-i1","memo_id":"13-03","genre_id":"13","level":"intermediate","question":"令和6年の新規漁業就業者数は何人か。","choices":["1,754人","1,175人","11,500人","17,540人"],"answer":0,"explanation":"新規漁業就業者数は近年1700人程度で推移しており、令和6年は1,754人です。11,500人などは漁業就業者数11.5万人や桁を取り違えた誤りです。","evidence":["新規漁業就業者数は、近年1700人程度で推移しており、令和６年は1,754人。"],"source":{"memo_id":"13-03","page":3,"print_page":157,"title":"漁業就業者数と漁家の経営状況"}},{"id":"13-03-i2","memo_id":"13-03","genre_id":"13","level":"intermediate","question":"このメモの「漁業就業者」の定義で、過去1年間に漁業の海上作業に従事した日数の基準はどれか。","choices":["15日以上","30日以上","60日以上","100日以上"],"answer":1,"explanation":"注で「漁業就業者」は満15歳以上で過去1年間に漁業の海上作業に30日以上従事した者と定義されています。15は年齢の基準（満15歳以上）であり、日数ではありません。","evidence":["「漁業就業者」とは、満15歳以上で過去1年間に漁業の海上作業に30日以上従事した者。"],"source":{"memo_id":"13-03","page":3,"print_page":157,"title":"漁業就業者数と漁家の経営状況"}},{"id":"13-04-b1","memo_id":"13-04","genre_id":"13","level":"beginner","question":"一口メモによると、沖合・遠洋漁業の漁業・養殖業生産量はいくらで、全体に対してどの程度を占めているか。","choices":["202万トンで全体の半分以上","173万トンで全体の半分以上","202万トンで全体の半分未満","359万トンで全体の半分以上"],"answer":0,"explanation":"要点に、沖合・遠洋漁業の生産量は202万トンで全体の半分以上を占めると書かれています。173万トンは沖合漁業だけの量で、359万トンは海面全体の生産量です。","evidence":["沖合・遠洋漁業の漁業・養殖業生産量は202万トンであり、全体の半分以上を占めている。"],"source":{"memo_id":"13-04","page":4,"print_page":158,"title":"沖合・遠洋漁業の生産量と漁船大型化の事例"}},{"id":"13-04-b2","memo_id":"13-04","genre_id":"13","level":"beginner","question":"一口メモによると、現行の漁業許可制度の下で、操業の効率化や安全性の向上、居住環境の改善を図るために行われている取組はどれか。","choices":["漁船の大型化","漁船の小型化","漁獲能力の向上","漁業許可制度の廃止"],"answer":0,"explanation":"要点に、現行の漁業許可制度の下での漁船の大型化による操業の効率化や安全性の向上等を図る取組と書かれています。事例では「漁獲能力を向上させない前提」とされており、漁獲能力の向上や制度の廃止は誤りです。","evidence":["現行の漁業許可制度の下での漁船の大","型化による操業の効率化や安全性の向上、居住環境の改善等を図る取組が行われている。"],"source":{"memo_id":"13-04","page":4,"print_page":158,"title":"沖合・遠洋漁業の生産量と漁船大型化の事例"}},{"id":"13-04-i1","memo_id":"13-04","genre_id":"13","level":"intermediate","question":"静岡県の遠洋かつお一本釣り漁船の事例では、漁船総トン数を何トンから何トンに増やしたか。","choices":["499トンから599トン","75トンから105トン","399トンから499トン","599トンから699トン"],"answer":0,"explanation":"静岡県の事例では、もうかる漁業創設支援事業を活用して漁船総トン数を499トンから599トンに増やしました。75トンから105トンは宮城県の沖合底びき網漁船の数値です。","evidence":["総トン数を499トンから599トンに増加"],"source":{"memo_id":"13-04","page":4,"print_page":158,"title":"沖合・遠洋漁業の生産量と漁船大型化の事例"}},{"id":"13-04-i2","memo_id":"13-04","genre_id":"13","level":"intermediate","question":"宮城県の沖合底びき網漁船の事例は、いつ、何を契機として取組を始めたか。","choices":["平成29年、東日本大震災を契機に開始","平成27年、東日本大震災を契機に開始","平成29年、かつおの不漁を契機に開始","平成27年、燃油価格の高止まりを契機に開始"],"answer":0,"explanation":"宮城県の事例は、東日本大震災を契機として平成29年から取組を始めました。平成27年や燃油価格の高止まり、かつおの不漁は、静岡県の遠洋かつお一本釣り漁船の事例の内容です。","evidence":["東日本大震災を契機として、平成29"],"source":{"memo_id":"13-04","page":4,"print_page":158,"title":"沖合・遠洋漁業の生産量と漁船大型化の事例"}},{"id":"13-04-a1","memo_id":"13-04","genre_id":"13","level":"advanced","question":"一口メモにある漁船大型化の2つの事例について、誤っているものはどれか。","choices":["静岡県の事例は省エネ設備の導入等で長期航海が可能になった","宮城県の事例は冷海水装置等の設置で鮮度保持機能が向上した","宮城県の事例は波除板の設置で甲板作業時の安全性を確保した","宮城県の事例はもうかる漁業創設支援事業を活用して行われた"],"answer":3,"explanation":"宮城県の事例が活用したのは、がんばる漁業復興支援事業です。もうかる漁業創設支援事業を活用したのは静岡県の遠洋かつお一本釣り漁船の事例なので、この選択肢が誤りです。","evidence":["がんばる漁業復興支援事業を活用","もうかる漁業創設支援事業を活用し、"],"source":{"memo_id":"13-04","page":4,"print_page":158,"title":"沖合・遠洋漁業の生産量と漁船大型化の事例"}},{"id":"13-05-b1","memo_id":"13-05","genre_id":"13","level":"beginner","question":"我が国の漁業・養殖業生産量のうち、養殖業と沿岸漁業を合わせた割合はどれか。","choices":["約21％","約44％","約68％","約90％"],"answer":1,"explanation":"要点に、養殖業と沿岸漁業は生産量の44％を占めると書かれています。約9割は生産量ではなく経営体数の割合で、21％は沿岸漁業のみの生産量の割合です。","evidence":["養殖業、沿岸漁業は、我が国の漁業・養殖業生産量のうち44％を占める"],"source":{"memo_id":"13-05","page":5,"print_page":159,"title":"養殖業・沿岸漁業の位置付けと漁業権"}},{"id":"13-05-b2","memo_id":"13-05","genre_id":"13","level":"beginner","question":"一口メモで、水域を有効かつ効率的に活用するために必要とされていることはどれか。","choices":["計画的に漁業権を設定すること","漁業権を一律に廃止すること","漁場の重複利用を禁止すること","漁業権を通年だけに統一すること"],"answer":0,"explanation":"要点に、水域を有効かつ効率的に活用するには計画的に漁業権を設定していくことが必要とあります。漁場はむしろ重複的に利用されており、季節で漁業権の状況も異なるとされています。","evidence":["水域を有効かつ効率的に活用するためには、計画的に漁業権を設定していくことが必要"],"source":{"memo_id":"13-05","page":5,"print_page":159,"title":"養殖業・沿岸漁業の位置付けと漁業権"}},{"id":"13-05-i1","memo_id":"13-05","genre_id":"13","level":"intermediate","question":"2024年の漁業・養殖業生産量（359万t）で、最も大きな割合を占める区分はどれか。","choices":["養殖業","沿岸漁業","沖合漁業","遠洋漁業"],"answer":2,"explanation":"生産量の円グラフでは沖合漁業が173で48％と最大です。養殖業は23％、沿岸漁業は21％、遠洋漁業は8％にとどまります。","evidence":["沖合漁業\n173\n48%","359万t\n（2024年）"],"source":{"memo_id":"13-05","page":5,"print_page":159,"title":"養殖業・沿岸漁業の位置付けと漁業権"}},{"id":"13-05-i2","memo_id":"13-05","genre_id":"13","level":"intermediate","question":"2023年の漁業経営体数（65千経営体）のうち、沿岸漁業の占める割合はどれか。","choices":["13％","19％","48％","68％"],"answer":3,"explanation":"経営体数の円グラフでは沿岸漁業が44千経営体で68％です。19％は養殖業、13％は沖合漁業の経営体数の割合、48％は生産量での沖合漁業の割合です。","evidence":["沿岸漁業\n44\n68%","65千経営体\n（2023年）"],"source":{"memo_id":"13-05","page":5,"print_page":159,"title":"養殖業・沿岸漁業の位置付けと漁業権"}},{"id":"13-05-a2","memo_id":"13-05","genre_id":"13","level":"advanced","question":"操業（6月）イメージに示された漁業権とその期間の組み合わせとして、誤っているものはどれか。","choices":["定置漁業権は3～11月","共同漁業権（採貝・採藻）は周年","区画漁業権（ぶり）は通年","共同漁業権（たこつぼ）は周年"],"answer":1,"explanation":"共同漁業権（採貝・採藻）の期間は3～6月で、周年ではありません。定置漁業権は3～11月、区画漁業権（ぶり）は通年、共同漁業権（たこつぼ）は周年と示されています。","evidence":["共同漁業権\n（採貝・採藻）\n（3～6月）"],"source":{"memo_id":"13-05","page":5,"print_page":159,"title":"養殖業・沿岸漁業の位置付けと漁業権"}},{"id":"13-06-b1","memo_id":"13-06","genre_id":"13","level":"beginner","question":"全国の漁協で、准組合員数が正組合員数を上回るようになったのはいつからですか。","choices":["平成元年度から","平成20年度から","平成25年度から","令和5年度から"],"answer":2,"explanation":"要点に、平成25年度から正組合員数より准組合員数が上回ると書かれています。平成20年度は表で正組合員208,023人、准組合員162,230人と、まだ正組合員のほうが多い時点です。","evidence":["平成25年度から正組合員数より准組合員数が上回る。"],"source":{"memo_id":"13-06","page":6,"print_page":160,"title":"漁協の事業と組合員数・漁協系統の仕組み"}},{"id":"13-06-b2","memo_id":"13-06","genre_id":"13","level":"beginner","question":"令和6年度末時点の全国の漁協の正組合員数はおよそ何人ですか。","choices":["約10.1万人","約13.3万人","約16.2万人","約23.4万人"],"answer":0,"explanation":"要点に、令和6年度末時点で正組合員が約10.1万人と書かれています。約13.3万人は准組合員の数で、約23.4万人は組合員数の合計です。","evidence":["令和６年度末時点で正組合員が約10.1万人、准組"],"source":{"memo_id":"13-06","page":6,"print_page":160,"title":"漁協の事業と組合員数・漁協系統の仕組み"}},{"id":"13-06-i1","memo_id":"13-06","genre_id":"13","level":"intermediate","question":"沿海地区漁協の1組合当たりの部門別事業損益で、令和6年度に最も大きな黒字となった部門はどれですか。","choices":["販売","指導","信用","漁業自営"],"answer":3,"explanation":"令和6年度の1組合当たりの損益は、漁業自営が22.4百万円で最も大きい黒字です。販売は15.9百万円、指導は2.3百万円です。信用は▲19.8百万円の赤字です。","evidence":["漁協の主な部門別事業損益の推移","[沿海地区漁協、１組合当たり]"],"source":{"memo_id":"13-06","page":6,"print_page":160,"title":"漁協の事業と組合員数・漁協系統の仕組み"}},{"id":"13-06-i2","memo_id":"13-06","genre_id":"13","level":"intermediate","question":"令和6年度末時点の漁協系統で、都道府県段階の都道府県漁業協同組合連合会はいくつありますか。","choices":["10連合会","12連合会","20連合会","30連合会"],"answer":3,"explanation":"漁協系統の仕組みの図で、都道府県漁業協同組合連合会は30連合会です。10連合会は都道府県信用漁業協同組合連合会の数です。12は沿海地区漁協のうち県一漁協の数です。","evidence":["都道府県漁業協同組合連合会","○漁協系統の仕組み（令和６年度末時点）"],"source":{"memo_id":"13-06","page":6,"print_page":160,"title":"漁協の事業と組合員数・漁協系統の仕組み"}},{"id":"13-07-b1","memo_id":"13-07","genre_id":"13","level":"beginner","question":"H30漁業法改正後の漁業権の免許で、優先して免許を受けるのはどの者ですか。","choices":["漁場を適切かつ有効に活用している既存の漁業者","法律で一律に定めた優先順位で上位にある者","新たに漁業へ参入しようとする新規の漁業者","漁獲量が最も多い地域外から来た漁業者"],"answer":0,"explanation":"改正により、法律で一律に優先順位を定める仕組みが改められ、漁場を適切かつ有効に活用している既存の漁業者に優先して免許する制度になりました。新規漁業者が参入できるのは、新たに利用可能な漁場の場合です。","evidence":["○ 漁業権については、法律で一律に優先順位を定める仕組みを改め、漁場を適切かつ","有効に活用している既存の漁業者に優先して免許する制度とした。"],"source":{"memo_id":"13-07","page":7,"print_page":161,"title":"漁業権制度の見直し（H30漁業法改正）"}},{"id":"13-07-b2","memo_id":"13-07","genre_id":"13","level":"beginner","question":"令和2年6月30日付けで作成し、都道府県に通知したガイドラインの名称はどれですか。","choices":["海面利用制度等に関するガイドライン","漁業権免許の優先順位に関するガイドライン","水産資源の管理推進に関するガイドライン","漁場の有効活用の推進に関するガイドライン"],"answer":0,"explanation":"制度を適切に運用するため、令和2年6月30日付けで「海面利用制度等に関するガイドライン」を作成し、都道府県に通知しました。ほかの選択肢の名称はメモにありません。","evidence":["〇 制度の適切な運用が行われるよう、令和２年６月30日付けで、「海面利用制度等に関","するガイドライン」を作成し、都道府県に通知。"],"source":{"memo_id":"13-07","page":7,"print_page":161,"title":"漁業権制度の見直し（H30漁業法改正）"}},{"id":"13-07-i1","memo_id":"13-07","genre_id":"13","level":"intermediate","question":"H30漁業法改正前の特定区画漁業権では、優先順位を何位まで法律で定めていましたか。","choices":["6位まで","14位まで","36位まで","39位まで"],"answer":3,"explanation":"改正前の特定区画漁業権は、地元漁協などを上位として39位まで法定されていました。14位は定置漁業権、6位は真珠養殖業の区画漁業権、36位は真珠養殖業以外の区画漁業権の数値です。","evidence":["①地元漁協（自ら営まず組合員間の内部調整を行う場合に限る。）","以下39位まで法定。"],"source":{"memo_id":"13-07","page":7,"print_page":161,"title":"漁業権制度の見直し（H30漁業法改正）"}},{"id":"13-07-i2","memo_id":"13-07","genre_id":"13","level":"intermediate","question":"H30漁業法改正前の定置漁業権で、優先順位1位とされた法人は、地元漁民世帯の何割以上を含む法人ですか。","choices":["3割以上","5割以上","7割以上","9割以上"],"answer":2,"explanation":"改正前の定置漁業権では、1位が「地元漁民世帯の7割以上を含む法人」でした。2位は地元漁民7人以上で構成される法人で、3割・5割・9割という数値はメモにありません。","evidence":["①地元漁民世帯の７割以上を含む法人"],"source":{"memo_id":"13-07","page":7,"print_page":161,"title":"漁業権制度の見直し（H30漁業法改正）"}},{"id":"13-07-a1","memo_id":"13-07","genre_id":"13","level":"advanced","question":"H30漁業法改正前後の漁業権の免許について、誤っているものはどれですか。","choices":["共同漁業権は改正後も引き続き漁協等に免許する","改正前の定置漁業権は14位まで優先順位を法定していた","改正前の真珠養殖業以外の区画漁業権は6位まで法定していた","改正前の真珠養殖業の区画漁業権は経験ある漁業者等が1位だった"],"answer":2,"explanation":"改正前の真珠養殖業以外の区画漁業権は36位まで法定されていました。6位まで法定されていたのは真珠養殖業の区画漁業権なので、この選択肢が誤りです。","evidence":["①当該海区で同種漁業の経験がある地元漁民","以下36位まで法定。"],"source":{"memo_id":"13-07","page":7,"print_page":161,"title":"漁業権制度の見直し（H30漁業法改正）"}},{"id":"13-08-b1","memo_id":"13-08","genre_id":"13","level":"beginner","question":"新たな水産基本計画が閣議決定されたのはいつですか。","choices":["2020年3月","2021年3月","2022年3月","2023年3月"],"answer":2,"explanation":"メモには、新たな水産基本計画は2022年3月に閣議決定されたと書かれています。ほかの年月はメモに書かれていません。","evidence":["2022年３月に閣議決定された新たな水産基本計画に基づき"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-08-b2","memo_id":"13-08","genre_id":"13","level":"beginner","question":"新たな水産基本計画に基づく施策の「三本の柱」に含まれるものはどれですか。","choices":["地域を支える漁村の活性化の推進","遠洋漁業の漁獲量の倍増の実現","水産物の輸入拡大による安定供給","漁業者への個別所得補償の創設"],"answer":0,"explanation":"三本の柱は、水産資源管理の着実な実施、水産業の成長産業化の実現、地域を支える漁村の活性化の推進です。ほかの3つは柱として挙げられていません。","evidence":["支える漁村の活性化の推進の三本の柱を中心に施策を展開。"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-08-i1","memo_id":"13-08","genre_id":"13","level":"intermediate","question":"令和14年度の食用魚介類の自給率目標は何％ですか。","choices":["57％","72％","76％","94％"],"answer":3,"explanation":"食用魚介類の自給率目標は94％です。76％は魚介類全体、72％は海藻類の目標値で、57％は食用魚介類の令和2年度の概算値です。","evidence":["自給率の目標を、食用魚介類で94％、魚介類全体で"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-08-i2","memo_id":"13-08","genre_id":"13","level":"intermediate","question":"海藻類の自給率は、令和元年度から令和2年度（概算値）にかけてどう変わりましたか。","choices":["2ポイント上昇","5ポイント上昇","5ポイント低下","変化なし"],"answer":1,"explanation":"表では、海藻類は令和元年度65％、令和2年度（概算値）70％なので、5ポイント上昇です。2ポイント上昇は、食用魚介類と魚介類全体の変化幅です。","evidence":["海藻類\n\n65\n\n70\n\n72"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-08-a1","memo_id":"13-08","genre_id":"13","level":"advanced","question":"魚介類全体の自給率について、令和2年度（概算値）と令和14年度の目標値の差は何ポイントですか。","choices":["2ポイント","21ポイント","23ポイント","37ポイント"],"answer":1,"explanation":"魚介類全体は令和2年度55％、目標76％なので、差は21ポイントです。37ポイントは食用魚介類（57％→94％）、2ポイントは海藻類（70％→72％）の差です。","evidence":["魚介類全体\n\n53\n\n55\n\n76"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-08-a2","memo_id":"13-08","genre_id":"13","level":"advanced","question":"水産物の自給率目標についての説明として、誤っているものはどれですか。","choices":["資源管理ロードマップは444万トン","輸出目標の1.2兆円を踏まえている","海藻類の自給率目標は76％","養殖業成長産業化総合戦略を踏まえる"],"answer":2,"explanation":"海藻類の自給率目標は72％なので、この選択肢が誤りです。76％は魚介類全体の目標値です。","evidence":["76％、海藻類で72％と設定"],"source":{"memo_id":"13-08","page":8,"print_page":162,"title":"新たな水産基本計画の三本柱と自給率目標"}},{"id":"13-09-b1","memo_id":"13-09","genre_id":"13","level":"beginner","question":"新たなロードマップで、令和12年度に漁獲量をどこまで回復させることを目指しているか。","choices":["344万トン","400万トン","444万トン","544万トン"],"answer":2,"explanation":"新たなロードマップは令和12年度に漁獲量を444万トンまで回復させることを目指しています。344万トンや544万トンは数字の一部を変えたもので、メモにはありません。","evidence":["令和12年度に漁獲量を444万トンまで回復させることを目指すための新たなロードマップを策定・公表した。"],"source":{"memo_id":"13-09","page":9,"print_page":163,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-09-b2","memo_id":"13-09","genre_id":"13","level":"beginner","question":"令和２年９月に策定されたロードマップの下で、水産庁が推進してきた資源管理は何を基本とする改正漁業法に基づくものか。","choices":["数量管理","漁船数の管理","漁期の管理","漁具の管理"],"answer":0,"explanation":"メモでは、数量管理を基本とする改正漁業法に基づく資源管理を推進してきたとされています。漁船数・漁期・漁具の管理を基本とするという記載はありません。","evidence":["数量管理を基本とする改正漁業法に基づく資源管理を推進してきた。"],"source":{"memo_id":"13-09","page":9,"print_page":163,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-09-i1","memo_id":"13-09","genre_id":"13","level":"intermediate","question":"令和５年度末までの成果として、漁獲量ベースで何％をＴＡＣ管理としたか。","choices":["45％","55％","65％","75％"],"answer":2,"explanation":"令和５年度末までの成果として、漁獲量ベースで65％をＴＡＣ管理としたと示されています。45％・55％・75％はメモにない数値です。","evidence":["③ 漁獲量ベースで65％をＴＡＣ管理"],"source":{"memo_id":"13-09","page":9,"print_page":163,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-09-i2","memo_id":"13-09","genre_id":"13","level":"intermediate","question":"新たなロードマップで、MSYベースの資源評価対象資源は令和５年度から令和12年度にかけてどう増やす計画か。","choices":["11資源から38資源程度へ","38資源から45資源程度へ","45資源から192資源程度へ","38資源から192資源程度へ"],"answer":1,"explanation":"図では、MSYベースの資源評価対象資源をR5の38資源からR12に45資源程度へ増やすと示されています。192は資源評価対象種の数、11はIQ管理を導入した漁法・資源の数で、別の項目です。","evidence":["MSYベースの資源評価対象資源 R5：38資源","R12：45資源程度"],"source":{"memo_id":"13-09","page":9,"print_page":163,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-10-b1","memo_id":"13-10","genre_id":"13","level":"beginner","question":"資源管理のロードマップのDX推進で、漁獲情報について目指す「ワンスオンリー」の意味はどれか。","choices":["同じ情報を二度提出させない","漁獲情報を年に一度だけ集める","報告を一つの漁協だけで受け付ける","一つの魚種だけを電子報告にする"],"answer":0,"explanation":"メモの注記で、ワンスオンリーは「同じ情報を二度提出させない」ことと説明されています。報告の回数や窓口、対象魚種を限定する意味ではありません。","evidence":["※同じ情報を二度提出させない","漁獲情報のワンスオンリー※に向けたデータ利活用や"],"source":{"memo_id":"13-10","page":10,"print_page":164,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-10-b2","memo_id":"13-10","genre_id":"13","level":"beginner","question":"資源管理のロードマップで、資源管理の推進によって回復させる漁獲量の目標はどれか。","choices":["444万トン","344万トン","544万トン","404万トン"],"answer":0,"explanation":"ロードマップの右側に「444万トンを目標に漁獲量を回復させる」と書かれています。ほかの数値はメモに出てきません。","evidence":["資源管理の推進によって、４４４万トンを目標に漁獲量を回復させる。"],"source":{"memo_id":"13-10","page":10,"print_page":164,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-10-i1","memo_id":"13-10","genre_id":"13","level":"intermediate","question":"資源管理のロードマップで、令和7年度までに漁獲量ベースで何割をTAC管理開始とするとしているか。","choices":["8割","6割","7割","9割"],"answer":0,"explanation":"令和7年度までに漁獲量ベースで8割をTAC管理開始とされています。6割はMSY水準以上にする資源の割合、7割は効果ありと判断された協定の割合で、別の項目の数値です。","evidence":["令和７年度までに漁獲量ベース","(＊)で８割をＴＡＣ管理開始"],"source":{"memo_id":"13-10","page":10,"print_page":164,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-10-i2","memo_id":"13-10","genre_id":"13","level":"intermediate","question":"資源管理のロードマップで、資源管理協定のうち検証の結果「効果あり」と判断された協定の割合は、どう推移させるとしているか。","choices":["7割から8割へ","6割から8割へ","8割から9割へ","5割から7割へ"],"answer":0,"explanation":"図では、効果ありと判断された協定の割合7割から矢印で8割へ進む形で示されています。6割や9割はこの項目の数値ではありません。","evidence":["検証の結果、効果ありと判断された協定の割合 ７割","資源管理協定の取組を実践（履行・検証・改良のPDCAサイクルの実施）"],"source":{"memo_id":"13-10","page":10,"print_page":164,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-10-a1","memo_id":"13-10","genre_id":"13","level":"advanced","question":"資源管理のロードマップ（令和6〜12年度）の内容として、誤っているものはどれか。","choices":["大臣許可漁業でのIQ管理は縮小していく","TAC導入はステップアップ方式で進める","クロマグロ遊漁は令和3年度からの措置を強化","MSY評価資源の6割以上をMSY水準以上にする"],"answer":0,"explanation":"メモでは大臣許可漁業におけるIQ管理を「拡大する」とされており、縮小ではありません。TACのステップアップ方式、クロマグロ遊漁の現行措置の強化、MSY水準の6割以上の目標は、いずれもメモに書かれています。","evidence":["大臣許可漁業におけるＩＱ管理を拡大するとともに"],"source":{"memo_id":"13-10","page":10,"print_page":164,"title":"資源管理の推進のための新たなロードマップ"}},{"id":"13-11-b1","memo_id":"13-11","genre_id":"13","level":"beginner","question":"一口メモによると、日本近海の海水温は100年間で何℃上昇しているか。","choices":["0.36℃","1.36℃","2.36℃","3.16℃"],"answer":1,"explanation":"日本近海の海水温は100年間で1.36℃上昇していると記されています。0.36℃や2.36℃は桁や数字を一部変えた誤りの値です。","evidence":["日本近海の海水温は、100年間で1.36℃上昇しており"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-11-b2","memo_id":"13-11","genre_id":"13","level":"beginner","question":"一口メモで、海洋環境の変化により分布が北方にシフトする魚種として挙げられているものはどれか。","choices":["ブリ","サンマ","サケ","スルメイカ"],"answer":0,"explanation":"分布が北方にシフトする魚種の例として挙げられているのはブリです。サンマ、サケ、スルメイカは不漁が深刻化している魚種として挙げられています。","evidence":["ブリのように分布が北方にシフトする魚種"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-11-i1","memo_id":"13-11","genre_id":"13","level":"intermediate","question":"グラフによると、2024年の我が国の全漁獲量はいくらか。","choices":["278.6万トン","287.6万トン","268.6万トン","371.3万トン"],"answer":0,"explanation":"2024年の全漁獲量は278.6万トンと示されています。371.3万トンは2014年の全漁獲量で、287.6万トンや268.6万トンは数字を入れ替えた誤りです。","evidence":["全漁獲量 278.6万トン （2024）","全漁獲量 371.3万トン （2014）"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-11-i2","memo_id":"13-11","genre_id":"13","level":"intermediate","question":"検討会取りまとめ（対応の方向性）で、「サケに依拠する定置の操業転換」が含まれている項目はどれか。","choices":["資源調査・評価の充実・高度化","漁法や漁獲対象魚種の複合化・転換","魚種の変更・拡大に対応し得る加工・流通","経営体の確保・育成とそれを支える人材・漁協"],"answer":1,"explanation":"「サケに依拠する定置の操業転換」は「２．漁法や漁獲対象魚種の複合化・転換」の①に記載されています。ほかの項目は調査手段、加工原材料の転換、サポート体制などを扱っており、この記載はありません。","evidence":["２．漁法や漁獲対象魚種の複合化・転換","漁法・魚種の追加・転換、サケに依拠する定置の操業転換、養殖業との兼業化・転換などの推進"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-11-a1","memo_id":"13-11","genre_id":"13","level":"advanced","question":"検討会取りまとめ（対応の方向性）の内容として、誤っているものはどれか。","choices":["資源評価等に関する米国等関係国との情報交換を促進する","飼料対策として魚粉の国産化や低魚粉飼料の開発等を進める","水産エコラベル等の取組の推進や輸出対策の強化を図る","複合化等をサポートする漁協の体制を縮小・統合する"],"answer":3,"explanation":"取りまとめでは、複合化等をサポートする漁協の体制は「強化・充実」するとされており、「縮小・統合」は誤りです。ほかの3つは、それぞれ資源調査、養殖業との兼業化、加工・流通の項目に記載されています。","evidence":["複合化等をサポートする漁協の体制の強化・充実"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-11-a2","memo_id":"13-11","genre_id":"13","level":"advanced","question":"グラフによると、3魚種（サンマ・スルメイカ・サケ類）計の漁獲量は2014年から2024年にかけて何万トン減少したか。","choices":["10.6万トン","34.2万トン","44.2万トン","92.7万トン"],"answer":2,"explanation":"3魚種計は2014年の54.8万トンから2024年の10.6万トンに減っており、差は44.2万トンです。92.7万トンは全漁獲量の減少量（371.3−278.6）で、10.6万トンは2024年の3魚種計そのものです。","evidence":["３魚種計 54.8万ト ン （2014）","３魚種計 10.6万トン （2024）"],"source":{"memo_id":"13-11","page":11,"print_page":165,"title":"海洋環境の変化と漁業の在り方"}},{"id":"13-12-b1","memo_id":"13-12","genre_id":"13","level":"beginner","question":"養殖業成長産業化総合戦略が策定された時期はどれか。","choices":["平成30（2018）年7月","令和2（2020）年7月","令和2（2020）年12月","令和4（2022）年7月"],"answer":1,"explanation":"メモの要点に、令和2（2020）年7月に総合戦略を策定したと書かれています。同じ7月でも年が違う選択肢や、同じ年でも月が違う選択肢は誤りです。","evidence":["令和２（2020）年７月に"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-12-b2","memo_id":"13-12","genre_id":"13","level":"beginner","question":"養殖業成長産業化総合戦略で、戦略的養殖品目に指定された養殖品目の条件として正しいものはどれか。","choices":["国内外の需要拡大が見込まれ強みを生かせる品目","国内の生産量が多く価格が安定している品目","輸入量が多く国産への置き換えが急がれる品目","天然漁獲が減り資源回復が急がれる品目"],"answer":0,"explanation":"要点に、国内外の需要の拡大が見込まれ、かつ我が国養殖業の強みを生かせる品目を戦略的養殖品目に指定したとあります。生産量・輸入量・資源回復を条件とする記述はメモにありません。","evidence":["国内外の需要の拡大が見込まれ、かつ我が国養殖業の強みを生かせる養殖品目","を戦略的養殖品目に指定。"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-12-i1","memo_id":"13-12","genre_id":"13","level":"intermediate","question":"戦略的養殖品目のうち、2030年の輸出目標額が最も大きい品目はどれか。","choices":["ブリ類","マダイ","真珠","ホタテガイ"],"answer":3,"explanation":"2030年の輸出目標はホタテガイが1,385億円で最大です。ブリ類は736億円、真珠は472億円、マダイは204億円で、いずれもホタテガイより小さくなっています。","evidence":["1,385億円","736億円"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-12-i2","memo_id":"13-12","genre_id":"13","level":"intermediate","question":"養殖業成長産業化総合戦略で示された、現場で行われている取組実例はいくつの類型に整理されているか。","choices":["3類型","4類型","5類型","7類型"],"answer":2,"explanation":"取組実例は生産者協業から流通型企業までの5類型に整理されています。4類型や7類型とする記述はなく、戦略的養殖品目の数（7品目）とも混同しないよう注意が必要です。","evidence":["現場で行われている取組実例（５類型：①生産者協業、②産地事業者","協業、③生産者型企業、④１社統合企業、⑤流通型企業）を踏まえ、"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-12-a1","memo_id":"13-12","genre_id":"13","level":"advanced","question":"戦略的養殖品目の成果目標について、誤っているものはどれか。","choices":["ブリ類の2030年輸出目標は736億円","マダイの2030年輸出目標は204億円","ホタテガイの2030年生産目標は24万トン","サケ・マス類の2030年生産目標は3～4万トン"],"answer":2,"explanation":"ホタテガイの2030年生産目標は21万トンで、24万トンはブリ類の生産目標です。ブリ類736億円、マダイ204億円、サケ・マス類3～4万トンはいずれも表のとおりです。","evidence":["21万トン","24万トン"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-12-a2","memo_id":"13-12","genre_id":"13","level":"advanced","question":"戦略的養殖品目のうち真珠について、生産目標として示されているものはどれか。","choices":["2027年の生産額200億円","2030年の生産額200億円","2027年の生産額472億円","2030年の生産額472億円"],"answer":0,"explanation":"真珠の生産目標は、基本方針に基づく2027年の生産額200億円です。472億円は真珠の2030年輸出目標であり、生産目標ではありません。","evidence":["養殖業の生産額の目標が200億円と定められているため、当該生産額を目標とする。","472億円"],"source":{"memo_id":"13-12","page":12,"print_page":166,"title":"養殖業成長産業化総合戦略と戦略的養殖品目"}},{"id":"13-13-b1","memo_id":"13-13","genre_id":"13","level":"beginner","question":"漁業収入安定対策の対象となる漁業種類は、どのように定められているか。","choices":["漁業共済の対象となっている漁業種類","遠洋漁業を除いた漁業種類","養殖業を除いた漁業種類","沿岸漁業に限った漁業種類"],"answer":0,"explanation":"漁業収入安定対策は、漁業共済の対象となっている漁業種類（沿岸・沖合・遠洋漁業・養殖業）を対象としています。遠洋漁業や養殖業も含まれるため、それらを除く選択肢や沿岸漁業に限る選択肢は誤りです。","evidence":["漁業収入安定対策は、漁業共済の対象となっている漁業種類（沿岸・沖合・遠洋漁業・養"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-13-b2","memo_id":"13-13","genre_id":"13","level":"beginner","question":"漁業共済・漁業収入安定対策に加えて実施されている高騰対策は、何の価格の高騰を対象としているか。","choices":["漁網・漁具","燃油・配合飼料","電気・ガス","漁船・機関"],"answer":1,"explanation":"メモでは、漁業共済・漁業収入安定対策に加え、燃油・配合飼料の高騰対策を実施するとしています。漁網・漁具や電気・ガスなどの価格は、このページの高騰対策の対象としては書かれていません。","evidence":["定対策に加え、燃油・配合飼料の高騰対策を実施。"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-13-i1","memo_id":"13-13","genre_id":"13","level":"intermediate","question":"漁業収入安定対策の積立ぷらす（積立方式）で、払戻金の負担割合のイメージ（国：漁業者）はどれか。","choices":["国１：漁業者１","国１：漁業者３","国３：漁業者１","国２：漁業者１"],"answer":2,"explanation":"補塡のイメージ図では、積立ぷらすの払戻金の負担割合は国３、漁業者１とされています。国１：漁業者３は国と漁業者の割合を逆にしたもので誤りです。","evidence":["払戻金の負担割合のイメージは以下のとおり。","漁業者が拠出した積立金と国費により補塡"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-13-i2","memo_id":"13-13","genre_id":"13","level":"intermediate","question":"漁業収入安定対策の補塡のイメージで使われる「基準収入」とは、漁業者ごとのどの収入か。","choices":["直近５年収入の単純平均","直近５年収入のうち最大の値","直近５年の最大・最小を除く３か年平均","直近３年収入の単純平均"],"answer":2,"explanation":"基準収入は、漁業者ごとの直近５年収入のうち、最大と最小を除く３か年の平均です。５年の単純平均や直近３年の平均ではなく、最大・最小を除く点が特徴です。","evidence":["漁業者ごとの直近５年収入のうち、最","大と最小を除く３か年平均"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-13-a1","memo_id":"13-13","genre_id":"13","level":"advanced","question":"このページの漁業経営の安定対策について述べたもののうち、誤っているものはどれか。","choices":["積立ぷらすは予算措置、漁業共済は法制度による仕組み","コスト対策では、漁業者と国が資金を積み立てる","燃油価格等が「７中５平均値」を超えた分を補塡する","燃油価格が急騰しても、別途の補塡は行わない"],"answer":3,"explanation":"コスト対策では、燃油価格が急騰した場合に別途補塡すると書かれているため、「別途の補塡は行わない」は誤りです。積立ぷらすが予算措置で漁業共済が法制度であること、漁業者と国の積立、「７中５平均値」を超えた分の補塡は、いずれもメモのとおりです。","evidence":[" 燃油価格が急騰した場合に別途補塡"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-13-a2","memo_id":"13-13","genre_id":"13","level":"advanced","question":"漁業共済（保険方式）の掛金負担のイメージで、掛金法定補助と掛金予算補助を合わせると平均で掛金の何%になるか。","choices":["30%","40%","60%","70%"],"answer":3,"explanation":"掛金法定補助は平均40%、掛金予算補助は平均30%なので、合わせると平均70%になります。40%や30%はそれぞれ一方の補助だけの割合です。","evidence":["掛金負担割合のイメージは以下のとおり。","（平均40%）","（平均30%）"],"source":{"memo_id":"13-13","page":13,"print_page":167,"title":"漁業の経営安定対策（収入安定・コスト対策）"}},{"id":"13-14-b1","memo_id":"13-14","genre_id":"13","level":"beginner","question":"このメモで、漁村の人口減少や高齢化の進み方は全国平均と比べてどう書かれているか。","choices":["全国平均を上回る早さで進んでいる","全国平均を下回る早さで進んでいる","全国平均とほぼ同じ早さで進んでいる","人口は増加し、高齢化は止まっている"],"answer":0,"explanation":"要点に、漁村では全国平均を上回る早さで人口減少や高齢化が進み、活力が低下していると書かれています。全国平均より遅い、同じ程度、人口が増加しているという選択肢は記述と逆です。","evidence":["漁村では、全国平均を上回る早さでの人口減少や高齢化の進行等によって活力が低下"],"source":{"memo_id":"13-14","page":14,"print_page":168,"title":"漁村の活性化と海業の推進"}},{"id":"13-14-b2","memo_id":"13-14","genre_id":"13","level":"beginner","question":"このメモで説明されている「海業」とは、どのような取組か。","choices":["地域資源の価値や魅力を活用し所得機会の増大等を図る取組","沖合の漁場を拡大して漁獲量の増大のみを図る取組","漁港を廃止して住宅地へ転用し人口の増加を図る取組","輸入水産物を加工して海外への再輸出を図る取組"],"answer":0,"explanation":"海業は、漁村の人々が海や漁村に関する地域資源の価値や魅力を活用し、所得機会の増大等を図る取組と説明されています。漁獲量の拡大のみ、漁港の廃止、輸入水産物の再輸出は、このメモの説明にはありません。","evidence":["漁村の人々が、海や漁村","に関する地域資源の価値や","魅力を活用して所得機会の"],"source":{"memo_id":"13-14","page":14,"print_page":168,"title":"漁村の活性化と海業の推進"}},{"id":"13-14-i1","memo_id":"13-14","genre_id":"13","level":"intermediate","question":"このメモで示されている、漁村の交流人口はおよそどれくらいか。","choices":["約２百万人","約２千万人","約２億人","約２十万人"],"answer":1,"explanation":"主な論点に、漁村の交流人口は約２千万人とあり、海業は大きなポテンシャルを有すると書かれています。ほかの選択肢は桁が違います。","evidence":["漁村の交流人口は約２千万人と「海業」は大きなポテンシャ"],"source":{"memo_id":"13-14","page":14,"print_page":168,"title":"漁村の活性化と海業の推進"}},{"id":"13-14-a1","memo_id":"13-14","genre_id":"13","level":"advanced","question":"グラフで、令和5年（2023年）の漁港背後集落の高齢化率は、同じ年の我が国の高齢化率を約何ポイント上回っているか。","choices":["約２ポイント","約８ポイント","約11ポイント","約21ポイント"],"answer":2,"explanation":"令和5年の漁港背後集落の高齢化率は40.5％、我が国の高齢化率は29.1％で、差は約11ポイントです。約8ポイントは平成15年（27.6％と19.0％）の差、約21ポイントは令和5年の漁港背後集落と平成15年の全国を比べた誤りです。","evidence":["40.0 40.1 40.6 40.5","28.9 29.0 29.1"],"source":{"memo_id":"13-14","page":14,"print_page":168,"title":"漁村の活性化と海業の推進"}},{"id":"13-14-a2","memo_id":"13-14","genre_id":"13","level":"advanced","question":"このメモの「主な対応の方向性」の内容として、誤っているものはどれか。","choices":["漁港を地域活性化の拠点として最大限活用し、海業等を推進する","「浜プラン」の取組に、海業の取組も合わせて地域一体で実施する","渚泊やワーケーション等の交流人口創出の取組は抑制していく","地域おこし協力隊等の外部人材の活用とデジタル化を推進する"],"answer":2,"explanation":"方向性では、ポストコロナを見据えた渚泊やワーケーション等の交流人口や関係人口創出の取組を推進するとされており、抑制ではありません。ほかの3つは方向性にそのまま書かれています。","evidence":["ポストコロナを見据えた渚泊やワーケーション等の交流人口","や関係人口創出の取組を推進"],"source":{"memo_id":"13-14","page":14,"print_page":168,"title":"漁村の活性化と海業の推進"}},{"id":"13-15-b1","memo_id":"13-15","genre_id":"13","level":"beginner","question":"漁港の価値や魅力を活かして水産業・漁村を活性化するため、創設された制度の名称はどれか。","choices":["漁港施設等活用事業制度","漁港機能強化交付金制度","漁村地域振興特区制度","水産物消費拡大支援制度"],"answer":0,"explanation":"要点に、水産業・漁村を活性化する「漁港施設等活用事業制度を創設」と書かれています。ほかの3つはこのページに出てこない名称です。","evidence":["活性化する漁港施設等活用事業制度を創設。"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-15-b2","memo_id":"13-15","genre_id":"13","level":"beginner","question":"漁港施設等活用事業制度で、漁港施設・水域・公共空地を有効活用して計画的に実施する事業の目的はどれか。","choices":["水産物の消費増進や交流促進","漁獲量の増加と資源の回復","漁船の大型化と省エネ化","漁港の防災機能の強化"],"answer":0,"explanation":"要点に、漁港施設・水域・公共空地を活用して「水産物の消費増進や交流促進に資する事業」を行うとあります。資源回復や防災強化は、このページでは目的として書かれていません。","evidence":["水産物の消費増進や交流促進に資する事業を計画的に実施。"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-15-i1","memo_id":"13-15","genre_id":"13","level":"intermediate","question":"漁港施設等活用事業の特別措置のうち、漁港水面施設運営権（みなし物権）の取得期間はどれか。","choices":["最大10年、更新可","最大30年、更新可","最大10年、更新不可","最大30年、更新不可"],"answer":0,"explanation":"特別措置③の漁港水面施設運営権は「最大10年、更新可」です。最大30年は、①漁港施設の貸付けと②水域・公共空地の長期占用の期間です。","evidence":["③ 漁港水面施設運営権（みなし物権）（※２）の取得 （最大10年、更新可）"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-15-i2","memo_id":"13-15","genre_id":"13","level":"intermediate","question":"事業イメージの図で、「交流促進」に資する事業として示されているものはどれか。","choices":["遊漁や漁業体験活動の機会の提供","販売施設や飲食店の設置・運営","荷さばき所や配送施設の整備","陸上養殖や養殖筏による生産"],"answer":0,"explanation":"図の「交流促進」の写真には、遊漁、漁業体験活動などの機会の提供とあります。販売施設や飲食店は「消費増進」、荷さばき所や養殖は「漁業生産」の側に示されています。","evidence":["遊漁、漁業体験活動又は海洋環境","販売施設又は飲食店の設置及び運営その他水産物の消費増進に資する事業"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-15-a1","memo_id":"13-15","genre_id":"13","level":"advanced","question":"漁港施設等活用事業の実施スキームについて、誤っているものはどれか。","choices":["基本方針は農林水産大臣が定める","活用推進計画は漁港管理者が定める","実施計画は事業者が創意工夫で策定する","実施計画は農林水産大臣の認定を受ける"],"answer":3,"explanation":"事業者の実施計画は、漁港管理者に申請して認定を受けるしくみです。農林水産大臣が定めるのは基本方針で、実施計画を認定するのではありません。","evidence":["・漁港管理者の認定を受けた計画に基づき、長期安定的に事業を実施"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-15-a2","memo_id":"13-15","genre_id":"13","level":"advanced","question":"長期安定的な事業環境の確保のための特別措置で、①漁港施設の貸付けと②水域・公共空地の長期占用の最大期間の組合せはどれか。","choices":["①最大30年・②最大30年","①最大30年・②最大10年","①最大10年・②最大30年","①最大10年・②最大10年"],"answer":0,"explanation":"①漁港施設（行政財産）の貸付けと②水域・公共空地の長期占用は、どちらも最大30年です。最大10年は③漁港水面施設運営権の期間なので、10年を含む組合せは誤りです。","evidence":["① 漁港施設（行政財産）の貸付け","② 漁港区域内の水域・公共空地の長期占用"],"source":{"memo_id":"13-15","page":15,"print_page":169,"title":"漁港施設等活用事業制度の創設"}},{"id":"13-16-b1","memo_id":"13-16","genre_id":"13","level":"beginner","question":"水産物の一般的な流通で、水揚港に隣接し、集荷・仕分けを行う場はどれか。","choices":["産地市場","消費地市場","直売所","水産加工業者"],"answer":0,"explanation":"水産物は水揚港に隣接する産地市場で集荷・仕分けされ、その後消費地に送られます。消費地市場は消費地に送られた後に販売を担う場で、集荷・仕分けの場ではありません。","evidence":["水産物は、水揚港に隣接する産地市場で集荷・仕分けされ、消費地に送られた後、消"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-16-b2","memo_id":"13-16","genre_id":"13","level":"beginner","question":"近年みられる水産物の流通形態のうち、インターネットを通じて消費者へ販売するものとして示されている形態はどれか。","choices":["生産者直売","産地直送","直接取引","集荷・仕分け"],"answer":0,"explanation":"インターネットを通じた消費者への販売は「生産者直売」と示されています。産地直送は産地出荷業者から小売・外食業者等へ、直接取引は漁業者から小売・外食業者等への形態です。","evidence":["漁業者から小売・外食業者等への直接取引やインターネットを通じた消費者への生産者"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-16-i1","memo_id":"13-16","genre_id":"13","level":"intermediate","question":"図に示された水産物の産地市場経由率（養殖（真珠除く）を含む推計）はどれか。","choices":["73%","43%","60%","85%"],"answer":0,"explanation":"図では産地市場経由率は73%と示されています。43%は消費地市場経由率の数値で、取り違えに注意が必要です。","evidence":["産地市場経由率 73%※2","※2 養殖（真珠除く）を 含む推計"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-16-i2","memo_id":"13-16","genre_id":"13","level":"intermediate","question":"図に示された2023年の水産加工業者の金額はどれか。","choices":["3兆7,840億円","4兆9,556億円","1兆6,563億円","2兆160億円"],"answer":0,"explanation":"図で水産加工業者に示された2023年の金額は3兆7,840億円です。4兆9,556億円は家計内消費、1兆6,563億円は国内生産、2兆160億円は輸入の金額です。","evidence":["3兆7,840 億円"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-16-a1","memo_id":"13-16","genre_id":"13","level":"advanced","question":"図に示された2023年の消費地市場（仲卸業者・売買参加者へ）の取扱金額はどれか。","choices":["2兆186億円","2兆160億円","2兆1,860億円","6,880億円"],"answer":0,"explanation":"消費地市場の金額は2兆186億円です。2兆160億円は輸入の金額、6,880億円は産地市場のうち地方卸売市場の取扱金額で、2兆1,860億円は図にない数値です。","evidence":["水産加工業者 2兆186億円"],"source":{"memo_id":"13-16","page":16,"print_page":170,"title":"水産物の流通経路（2023年）"}},{"id":"13-16-a2","memo_id":"13-16","genre_id":"13","level":"advanced","question":"水産物の流通について、このページの内容として誤っているものはどれか。","choices":["2023年の国内生産の金額は輸入の金額を上回る","産地市場6,880億円は地方卸売市場の取扱金額","水産物は消費地市場を通じ販売されるのが一般的","近年は漁業者から小売等への直接取引もある"],"answer":0,"explanation":"2023年の国内生産は1兆6,563億円、輸入は2兆160億円で、輸入の方が大きいため誤りです。ほかの3つは注記と上部の要点に書かれた内容と一致します。","evidence"
